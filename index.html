<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HBX Battle - Site Knowledge Trainer</title>
<meta name="description" content="Weekly site knowledge quiz battles for site staff — built from NHBC Standards, Building Regs, manufacturer guidance and standard details.">
<meta name="theme-color" content="#2E86C1">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<link rel="icon" type="image/x-icon" href="favicon.ico">
<link rel="icon" type="image/png" sizes="16x16" href="favicon-16.png">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="icon" type="image/png" sizes="48x48" href="favicon-48.png">
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
<link rel="manifest" href="site.webmanifest">
</head>
<body>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@600;700&family=Barlow:wght@400;500;600&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
:root{
  --bg:#EEF4F8; --surface:#FFFFFF; --surface2:#E1EBF2; --ink:#1C2B36; --muted:#5D7285;
  --line:#D5E2EB; --accent:#2E86C1; --accent-ink:#1B5E8A; --accent-soft:#D9EAF6;
  --good:#2E9E5B; --good-soft:#E0F2E7; --bad:#D64545; --bad-soft:#FAE3E1;
  --shadow:0 1px 2px rgba(28,43,54,.06),0 4px 14px rgba(28,43,54,.05);
}
/* Deliberately light-only: the app keeps its light site-progress palette in any viewer theme */
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{
  background:var(--bg); color:var(--ink);
  font-family:'Barlow',system-ui,-apple-system,"Segoe UI",sans-serif;
  font-size:16.5px; line-height:1.5; min-height:100vh;
}
.wrap{max-width:680px;margin:0 auto;padding:20px 16px 72px}
h1,h2,h3{font-family:'Barlow Semi Condensed','Barlow',sans-serif;line-height:1.15;text-wrap:balance}
.mono{font-family:'IBM Plex Mono',ui-monospace,monospace;font-variant-numeric:tabular-nums}
button{font:inherit;color:inherit;cursor:pointer;border:none;background:none;-webkit-tap-highlight-color:transparent}
button:focus-visible,a:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:6px}

/* masthead */
.mast{display:flex;align-items:center;gap:12px;padding:6px 0 18px}
.mast .mark{width:44px;height:44px;flex:none;border-radius:10px;overflow:hidden;box-shadow:var(--shadow)}
.mast .mark img{width:100%;height:100%;object-fit:cover;display:block}
.mast h1{font-size:21px;font-weight:700;letter-spacing:.2px}
.mast .sub{font-size:13px;color:var(--muted);letter-spacing:.4px;text-transform:uppercase}

.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow)}

/* home */
.mode{display:flex;gap:14px;width:100%;text-align:left;padding:18px;align-items:center;margin-bottom:12px;
  transition:transform .08s ease}
.mode:active{transform:scale(.99)}
.mode .glyph{width:52px;height:52px;flex:none;border-radius:10px;display:grid;place-items:center;background:var(--accent-soft)}
.mode .glyph svg{width:26px;height:26px;stroke:var(--accent-ink);fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.mode h2{font-size:19px;margin-bottom:2px}
.mode p{font-size:14.5px;color:var(--muted)}
.mode .chev{margin-left:auto;color:var(--muted);flex:none}
.statline{display:flex;gap:8px;flex-wrap:wrap;margin:4px 0 18px}
.chip{font-size:12.5px;padding:4px 10px;border-radius:999px;background:var(--surface2);color:var(--muted);
  letter-spacing:.4px;text-transform:uppercase;font-weight:600}
.hist{margin-top:26px}
.hist h3{font-size:13px;letter-spacing:.9px;text-transform:uppercase;color:var(--muted);margin-bottom:10px}
.hist-row{display:flex;align-items:center;gap:10px;padding:10px 14px;border-bottom:1px solid var(--line);font-size:14.5px}
.hist-row:last-child{border-bottom:none}
.hist-row .when{color:var(--muted);margin-left:auto;font-size:13px}
.scorepill{font-family:'IBM Plex Mono',monospace;font-weight:600;font-size:13px;padding:2px 8px;border-radius:6px}
.pass{background:var(--good-soft);color:var(--good)} .fail{background:var(--bad-soft);color:var(--bad)}

/* setup */
.backlink{display:inline-flex;align-items:center;gap:6px;color:var(--muted);font-size:14px;font-weight:500;margin-bottom:14px}
.topic{display:flex;width:100%;text-align:left;gap:12px;align-items:center;padding:13px 16px;border-bottom:1px solid var(--line)}
.topic:last-child{border-bottom:none}
.topic .box{width:22px;height:22px;flex:none;border:2px solid var(--muted);border-radius:6px;display:grid;place-items:center}
.topic.on .box{background:var(--accent);border-color:var(--accent)}
.topic.on .box svg{display:block;width:14px;height:14px;stroke:#FFFFFF;stroke-width:3;fill:none;stroke-linecap:round;stroke-linejoin:round}
.topic .box svg{display:none}
.topic .n{margin-left:auto;color:var(--muted);font-size:13px}
.setup-actions{position:sticky;bottom:0;padding:14px 0;background:linear-gradient(transparent,var(--bg) 30%)}

/* buttons */
.btn{display:flex;justify-content:center;align-items:center;gap:8px;width:100%;padding:15px;border-radius:10px;
  font-family:'Barlow Semi Condensed';font-weight:700;font-size:17.5px;letter-spacing:.4px}
.btn-primary{background:var(--ink);color:var(--bg)}
.btn-primary:disabled{opacity:.4;cursor:default}
.btn-ghost{border:1.5px solid var(--line);color:var(--ink)}

/* quiz */
.rail{position:sticky;top:0;z-index:5;background:var(--bg);padding:10px 0 12px}
.rail-top{display:flex;align-items:baseline;gap:10px;margin-bottom:8px}
.rail-top .count{font-family:'IBM Plex Mono',monospace;font-size:14px;font-weight:600}
.rail-top .mode-tag{font-size:12px;letter-spacing:.8px;text-transform:uppercase;color:var(--muted);font-weight:600}
.rail-top .quit{margin-left:auto;color:var(--muted);font-size:13.5px;font-weight:500}
.track{height:6px;border-radius:3px;background:var(--surface2);overflow:hidden}
.fill{height:100%;border-radius:3px;background:var(--accent);transition:width .25s ease}
.qmeta{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:16px 0 10px}
.qmeta .part{font-size:12px;letter-spacing:.7px;text-transform:uppercase;font-weight:600;color:var(--muted)}
.qmeta .clause{font-family:'IBM Plex Mono',monospace;font-size:12px;font-weight:600;padding:3px 8px;
  border-radius:6px;background:var(--accent-soft);color:var(--accent-ink)}
.qtext{font-family:'Barlow Semi Condensed';font-weight:600;font-size:22px;line-height:1.3;margin-bottom:18px;text-wrap:balance}
.opt{display:flex;gap:12px;width:100%;text-align:left;align-items:flex-start;padding:14px 15px;margin-bottom:10px;
  border:1.5px solid var(--line);border-radius:10px;background:var(--surface);font-size:16.5px;line-height:1.4;
  transition:border-color .12s ease, background .12s ease}
.opt .key{flex:none;width:26px;height:26px;border-radius:7px;display:grid;place-items:center;margin-top:1px;
  background:var(--surface2);color:var(--muted);font-family:'Barlow Semi Condensed';font-weight:700;font-size:14px}
.opt.sel{border-color:var(--ink);background:var(--surface2)}
.opt.sel .key{background:var(--ink);color:var(--bg)}
.opt.right{border-color:var(--good);background:var(--good-soft)}
.opt.right .key{background:var(--good);color:#fff}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.opt.wrong .key{background:var(--bad);color:#fff}
.opt:disabled{cursor:default}
.expl{border-left:4px solid var(--accent);background:var(--surface);border-radius:0 10px 10px 0;
  padding:13px 15px;margin:6px 0 14px;font-size:15px;box-shadow:var(--shadow)}
.expl .verdict{font-family:'Barlow Semi Condensed';font-weight:700;font-size:15px;letter-spacing:.4px;text-transform:uppercase;margin-bottom:4px}
.expl .verdict.ok{color:var(--good)} .expl .verdict.no{color:var(--bad)}
.expl .cl{font-family:'IBM Plex Mono',monospace;font-size:12.5px;color:var(--muted);margin-top:6px;display:block}
.whybox{margin-top:10px;padding-top:10px;border-top:1px solid var(--line);font-size:14px;color:var(--ink);line-height:1.45}
.whybox .lbl{color:var(--accent-ink);font-weight:700;text-transform:uppercase;font-size:11px;letter-spacing:.6px;display:block;margin-bottom:3px;font-family:'Barlow Semi Condensed'}
.quiznav{display:flex;gap:10px;margin-top:16px}

/* reference tables in feedback */
.reft{margin-top:10px;border-top:1px dashed var(--line);padding-top:8px}
.reft summary{cursor:pointer;font-weight:600;font-size:14px;color:var(--accent-ink);list-style:none}
.reft summary::before{content:"▸ "}
.reft[open] summary::before{content:"▾ "}
.reft .tname{font-size:13px;color:var(--muted);margin:8px 0 6px}
.reft .tblwrap{overflow-x:auto}
.reft table{border-collapse:collapse;font-size:13px;min-width:430px;font-variant-numeric:tabular-nums}
.reft th,.reft td{border:1px solid var(--line);padding:5px 8px;text-align:left;vertical-align:top}
.reft th{background:var(--surface2);font-weight:600}
.reft .tnote{font-size:12px;color:var(--muted);margin-top:6px}

/* results */
.scorehead{text-align:center;padding:30px 20px 24px}
.scorehead .big{font-family:'IBM Plex Mono',monospace;font-weight:600;font-size:52px;line-height:1}
.scorehead .band{font-family:'Barlow Semi Condensed';font-weight:700;font-size:19px;margin-top:8px}
.scorehead .band.ok{color:var(--good)} .scorehead .band.no{color:var(--bad)}
.scorehead .detail{color:var(--muted);font-size:14.5px;margin-top:6px}
.break{padding:6px 16px 14px}
.break h3{font-size:13px;letter-spacing:.9px;text-transform:uppercase;color:var(--muted);margin:10px 0}
.brow{display:grid;grid-template-columns:1fr auto;gap:4px 10px;padding:7px 0;font-size:14.5px;border-top:1px solid var(--line)}
.brow .bar{grid-column:1/-1;height:5px;border-radius:3px;background:var(--surface2);overflow:hidden}
.brow .bar i{display:block;height:100%;background:var(--accent)}
.brow .n{font-family:'IBM Plex Mono',monospace;font-size:13px;color:var(--muted)}
.review-toggle{margin:18px 0 10px}
.rev{padding:16px;margin-bottom:12px}
.rev .qtext{font-size:17.5px;margin-bottom:10px}
.rev .ans{display:flex;gap:8px;align-items:flex-start;font-size:15px;padding:8px 10px;border-radius:8px;margin-bottom:6px}
.rev .ans .tag{flex:none;font-family:'Barlow Semi Condensed';font-weight:700;font-size:12px;letter-spacing:.5px;
  text-transform:uppercase;padding:2px 7px;border-radius:5px;margin-top:2px}
.rev .ans.you .tag{background:var(--bad-soft);color:var(--bad)}
.rev .ans.cor .tag{background:var(--good-soft);color:var(--good)}
.rev .exline{font-size:14.5px;color:var(--muted);margin-top:8px}
.rev .exline .cl{font-family:'IBM Plex Mono',monospace;font-size:12.5px;display:block;margin-top:5px}
.filterrow{display:flex;gap:8px;margin:14px 0}
.fbtn{padding:7px 14px;border-radius:999px;border:1.5px solid var(--line);font-size:14px;font-weight:500}
.fbtn.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}

/* game layer */
.namechip{display:inline-flex;align-items:center;gap:6px;font-size:13.5px;font-weight:600;color:var(--accent-ink);
  background:var(--accent-soft);border-radius:999px;padding:5px 12px;margin-bottom:14px}
.mode.battle{border-color:var(--accent);border-width:2px}
.mode.battle .glyph{background:var(--accent)}
.mode.battle .glyph svg{stroke:#fff}
.ptspop{position:fixed;left:50%;top:38%;transform:translateX(-50%);font-family:'Barlow Semi Condensed';
  font-weight:700;font-size:34px;color:var(--good);pointer-events:none;z-index:20;
  animation:pop .9s ease-out forwards}
@keyframes pop{0%{opacity:0;transform:translateX(-50%) translateY(10px) scale(.8)}
  20%{opacity:1;transform:translateX(-50%) translateY(0) scale(1.05)}
  100%{opacity:0;transform:translateX(-50%) translateY(-34px) scale(1)}}
.streak{font-size:13px;font-weight:700;color:var(--accent-ink);background:var(--accent-soft);
  border-radius:999px;padding:3px 10px}
.ptsline{font-family:'IBM Plex Mono',monospace;font-size:13px;font-weight:600;color:var(--muted)}
.namescreen input{width:100%;padding:14px;font:inherit;font-size:17px;border:1.5px solid var(--line);
  border-radius:10px;background:var(--surface);color:var(--ink);margin:10px 0 14px}
.namescreen input:focus{outline:3px solid var(--accent);border-color:var(--accent)}
.lb-row{display:flex;align-items:center;gap:10px;padding:11px 14px;border-bottom:1px solid var(--line);font-size:15px}
.lb-row:last-child{border-bottom:none}
.lb-row .rank{flex:none;width:32px;font-family:'Barlow Semi Condensed';font-weight:700;font-size:16px;color:var(--muted)}
.lb-row .who{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lb-row .sub{font-size:12.5px;color:var(--muted);font-weight:400}
.lb-row .pts{margin-left:auto;font-family:'IBM Plex Mono',monospace;font-weight:600;font-size:15px}
.lb-row.me{background:var(--accent-soft);border-radius:8px}
.lb-empty{padding:22px 16px;text-align:center;color:var(--muted);font-size:14.5px}
.savenote{font-size:13.5px;padding:10px 14px;border-radius:8px;margin-top:10px;text-align:center}
.savenote.ok{background:var(--good-soft);color:var(--good)}
.savenote.warn{background:var(--surface2);color:var(--muted)}
.invite{display:flex;justify-content:center;align-items:center;gap:8px;width:100%;padding:13px;margin-top:14px;
  border:1.5px dashed var(--accent);border-radius:10px;color:var(--accent-ink);
  font-family:'Barlow Semi Condensed';font-weight:700;font-size:16px;letter-spacing:.3px;background:var(--surface)}
.invite svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.rankline{font-family:'Barlow Semi Condensed';font-weight:700;font-size:20px;text-align:center;margin-top:4px}
#confetti{position:fixed;inset:0;pointer-events:none;z-index:30}

.footer{margin-top:40px;font-size:12.5px;color:var(--muted);line-height:1.55;text-align:center}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
@media (max-width:420px){.qtext{font-size:20px}.scorehead .big{font-size:44px}}
</style>

<div class="wrap" id="app"></div>

<script>
const QUESTIONS = [{"id":"2.1-01","chapter":"2.1","chapterTitle":"The Standards and Technical Requirements","part":"Introduction","question":"The NHBC Standards 2026 come into effect for which NHBC registered homes?","options":["Homes whose foundations are begun on or after 1 January 2026","Homes completed on or after 1 January 2026","Homes reserved or sold on or after 1 January 2026","Homes whose foundations are begun on or after 1 April 2026"],"correct":0,"explanation":"The Application of the Standards section in Chapter 2.1 states the Standards come into effect for every NHBC registered home whose foundations are begun on or after 1 January 2026, and apply throughout the UK unless otherwise stated.","ref":"2.1","why":"A fixed start date stops arguments later about which rulebook a plot should be judged against, so everyone on site and any warranty claim knows exactly which standard applies to that build.","source":"NHBC Standards 2026","sourceShort":"NHBC","refLabel":"Clause"},{"id":"2.1-02","chapter":"2.1","chapterTitle":"The Standards and Technical Requirements","part":"Introduction","question":"In the NHBC Standards chapters, how are the Technical Requirements — which must be met by the builder — shown?","options":["In bold black text backed with a shaded box","In blue text","In black italic text","In underlined black text"],"correct":1,"explanation":"Chapter 2.1 states the Technical Requirements are shown in blue text and must be met by the builder; performance standards are the items shown in bold black text backed with a shaded box.","ref":"2.1","why":"Colour-coding lets site staff tell at a glance what's a hard requirement they must meet versus supporting guidance, so nobody wastes time disputing what's actually compulsory when work is inspected.","source":"NHBC Standards 2026","sourceShort":"NHBC","refLabel":"Clause"},{"id":"2.1-03","chapter":"2.1","chapterTitle":"The Standards and Technical Requirements","part":"Introduction","question":"Under Technical Requirement R3, unless agreed otherwise in writing with NHBC, the structure of the home must have a life of at least how many years?","options":["25 years","40 years","50 years","60 years"],"correct":3,"explanation":"Technical Requirement R3 states that the structure of the home shall, unless specifically agreed otherwise in writing with NHBC, have a life of at least 60 years; non-integral components may have a lesser durability with planned maintenance.","ref":"R3","why":"A 60-year minimum life means the frame should outlast several owners and mortgage terms without needing structural repair, matching what buyers, lenders and the NHBC warranty are relying on.","source":"NHBC Standards 2026","sourceShort":"NHBC","refLabel":"Clause"},{"id":"2.1-04","chapter":"2.1","chapterTitle":"The Standards and Technical Requirements","part":"Introduction","question":"Under Technical Requirement R5, the foundations and superstructure of every building over how many storeys must be designed by a Chartered Civil or Structural Engineer accepted by NHBC?","options":["Two storeys","Three storeys","Four storeys","Five storeys"],"correct":1,"explanation":"Technical Requirement R5 requires the foundations and superstructure of every building over three storeys in height to be designed by Chartered Civil or Structural Engineers whose status, including professional indemnity insurance, is accepted by NHBC.","ref":"R5","why":"Taller buildings carry much greater loads, so a mis-sized foundation or frame risks serious instability or collapse; requiring a chartered, insured engineer ensures competent design and someone accountable if it fails.","source":"NHBC Standards 2026","sourceShort":"NHBC","refLabel":"Clause"},{"id":"2.1-05","chapter":"2.1","chapterTitle":"The Standards and Technical Requirements","part":"Introduction","question":"You are running a site in Scotland where the foundations have been engineer-designed. Under Technical Requirement R5, who may undertake the structural design?","options":["The builder's own in-house engineer","The specialist subcontractor's design engineer","An engineer independent of the builder and specialist subcontractor","Any engineer employed directly by the builder"],"correct":2,"explanation":"Technical Requirement R5 states that in Scotland the engineer shall be independent of the builder and specialist subcontractor, whereas in England, Wales, Northern Ireland and the Isle of Man the builder's own engineer may design.","ref":"R5","why":"An engineer employed by the builder could feel pressure to cut corners on design to save cost or time; requiring independence in Scotland removes that conflict of interest and protects the homeowner.","source":"NHBC Standards 2026","sourceShort":"NHBC","refLabel":"Clause"},{"id":"2.1-06","chapter":"2.1","chapterTitle":"The Standards and Technical Requirements","part":"Introduction","question":"Where the NHBC Standards refer to British Standards, which editions of those documents apply, unless NHBC agrees otherwise in writing?","options":["The editions current when the contract was signed","The editions current when work starts on site","The editions current at the time of Building Regulation approval","The editions current when the home is completed"],"correct":2,"explanation":"The Standards and codes of practice section of Chapter 2.1 states that referenced documents shall be the editions current at the time of Building Regulation approval, unless other recommendations are agreed by NHBC in writing.","ref":"2.1","why":"Standards get revised over time, so fixing the applicable edition at the point of Building Regulation approval stops the technical goalposts moving mid-build and avoids disputes over which version applies.","source":"NHBC Standards 2026","sourceShort":"NHBC","refLabel":"Clause"},{"id":"3.1-01","chapter":"3.1","chapterTitle":"Concrete and its reinforcement","part":"General","question":"A small quantity of concrete is being mixed by hand on site. How should the cement quantity be adjusted compared with the standard mix proportions?","options":["Add an extra 5% of cement","Add an extra 10% of cement","Add an extra 15% of cement","Add an extra 20% of cement"],"correct":1,"explanation":"Clause 3.1.4 states that where hand mixing, an extra 10% of cement should be added to the quantities shown in Tables 2 and 3; except for very small quantities, a mechanical mixer should be used.","ref":"3.1.4","why":"Hand mixing is less thorough and consistent than a mechanical mixer, so extra cement compensates for uneven distribution and ensures the batch still reaches its designed strength and durability.","source":"NHBC Standards 2026","sourceShort":"NHBC","refLabel":"Clause"},{"id":"3.1-02","chapter":"3.1","chapterTitle":"Concrete and its reinforcement","part":"General","question":"Ready-mixed concrete is acceptable to NHBC from suppliers operating under which quality control scheme?","options":["The Quality Scheme for Ready Mixed Concrete (QSRMC) or the BSI Kitemark scheme","The CARES certification scheme","The Considerate Constructors Scheme","The WRAP Quality Protocol scheme"],"correct":0,"explanation":"Clause 3.1.5 states ready-mixed concrete is acceptable from suppliers operating under a full quality control scheme such as QSRMC or the BSI Kitemark scheme; other suppliers may be suitable if they operate to an equivalent standard acceptable to NHBC.","ref":"3.1.5","why":"These schemes independently audit batching accuracy and traceability, giving assurance that what arrives on the wagon is genuinely the mix ordered, since strength defects in poured concrete can't be seen or fixed later.","source":"NHBC Standards 2026","sourceShort":"NHBC","refLabel":"Clause"},{"id":"3.1-03","chapter":"3.1","chapterTitle":"Concrete and its reinforcement","part":"General","question":"What consistence class should be used for trench fill foundation concrete?","options":["S1","S2","S3","S4"],"correct":3,"explanation":"Note 1 to Table 4 in Clause 3.1.6.1 states consistence class S3 should be used for strip foundation concrete and consistence class S4 should be used for trench fill foundation concrete.","ref":"3.1.6.1","why":"Trench fill can't be compacted by hand once poured deep and narrow, so a wetter, more flowable mix is needed to fully surround reinforcement and services without leaving voids.","source":"NHBC Standards 2026","sourceShort":"NHBC","refLabel":"Clause"},{"id":"3.1-04","chapter":"3.1","chapterTitle":"Concrete and its reinforcement","part":"General","question":"For concrete not designed by an engineer, what is the minimum cover to reinforcement where the concrete is in contact with the ground?","options":["40mm","50mm","75mm","100mm"],"correct":2,"explanation":"Table 8 in Clause 3.1.9.3 gives a minimum cover of 75mm for concrete in contact with the ground; external conditions require 50mm and casting against adequate blinding concrete requires 40mm.","ref":"3.1.9.3","why":"Ground contact exposes steel to moisture, chlorides and sulfates that corrode it; deeper cover slows those attacking agents reaching the bar, preventing rust expansion that cracks and spalls the concrete.","source":"NHBC Standards 2026","sourceShort":"NHBC","refLabel":"Clause"},{"id":"3.1-05","chapter":"3.1","chapterTitle":"Concrete and its reinforcement","part":"General","question":"What is the maximum spacing for supports (spacers) under reinforcement?","options":["500mm apart","600mm apart","750mm apart","One metre apart"],"correct":3,"explanation":"Clause 3.1.10.3 states supports should be placed no more than one metre apart, or closer where necessary, and spacers for parallel bars should be staggered to avoid creating a plane of weakness.","ref":"3.1.10.3","why":"Without close support, rebar can sag or float during the pour, losing its designed position and cover exactly where strength is needed, weakening the finished element.","source":"NHBC Standards 2026","sourceShort":"NHBC","refLabel":"Clause"},{"id":"3.1-06","chapter":"3.1","chapterTitle":"Concrete and its reinforcement","part":"General","question":"Within what time should site-mixed concrete be placed after mixing?","options":["15 minutes","30 minutes","45 minutes","60 minutes"],"correct":1,"explanation":"Clause 3.1.14 states site-mixed concrete should be placed within 30 minutes, while ready-mixed concrete should be placed within the time recommended by the supplier or required by the specification.","ref":"3.1.14","why":"Concrete starts stiffening as soon as it's mixed, so a delay risks placing and compacting it too late, leaving voids and poor consolidation that reduce strength.","source":"NHBC Standards 2026","sourceShort":"NHBC","refLabel":"Clause"},{"id":"3.1-07","chapter":"3.1","chapterTitle":"Concrete and its reinforcement","part":"General","question":"What is the maximum area of reinforced concrete that should be cast in one operation without construction joints?","options":["16m²","40m²","60m²","100m²"],"correct":2,"explanation":"Clause 3.1.14 states concrete cast in one operation should be as square in shape as possible and not greater than 60m² for reinforced concrete or 16m² for unreinforced concrete.","ref":"3.1.14","why":"Large uninterrupted pours build up more shrinkage and thermal stress as they cure, causing uncontrolled cracking; limiting the area and keeping it square controls where shrinkage cracks form.","source":"NHBC Standards 2026","sourceShort":"NHBC","refLabel":"Clause"},{"id":"3.1-08","chapter":"3.1","chapterTitle":"Concrete and its reinforcement","part":"General","question":"A reinforced concrete slab has just been poured. For how long should the structure normally remain unloaded while it cures?","options":["Two days","Four days","Five days","Seven days"],"correct":3,"explanation":"Clause 3.1.15 states reinforced concrete, or concrete containing cement replacements such as PFA, requires a longer curing period, normally seven days, during which the structure should not be loaded.","ref":"3.1.15","why":"Reinforced concrete needs time to gain enough strength before carrying load or it can crack or permanently deflect; mixes with cement replacements like PFA gain strength even more slowly.","source":"NHBC Standards 2026","sourceShort":"NHBC","refLabel":"Clause"},{"id":"3.1-09","chapter":"3.1","chapterTitle":"Concrete and its reinforcement","part":"General","question":"During a cold spell, a subcontractor suggests adding an air-entraining agent to act as an anti-freeze for a fresh concrete pour. What does the standard say?","options":["It is acceptable provided the agent is dosed correctly","Air-entraining agents should not be used as an anti-freeze for fresh concrete, though they can increase frost resistance of cured concrete","It is acceptable only in unreinforced concrete mixes","It is acceptable provided NHBC is notified before the pour"],"correct":1,"explanation":"Clause 3.1.7 states air-entraining agents should not be used as an anti-freeze for fresh concrete, although they can increase the frost resistance of cured concrete and are recommended for paths, drives and pavements exposed to freezing.","ref":"3.1.7","why":"Air-entrainers only create tiny voids to relieve freeze-thaw pressure in hardened concrete; they don't stop fresh mix water freezing, which disrupts hydration and causes permanent internal damage and strength loss.","source":"NHBC Standards 2026","sourceShort":"NHBC","refLabel":"Clause"},{"id":"3.1-10","chapter":"3.1","chapterTitle":"Concrete and its reinforcement","part":"General","question":"To limit the risk of alkali-silica reaction, the alkali content of a concrete mix should not exceed what value?","options":["3kg/m³","4.5kg/m³","6kg/m³","7.5kg/m³"],"correct":0,"explanation":"Clause 3.1.6.6 states that alkali content, calculated in accordance with BRE Digest 330 or Concrete Society Technical Report 30, should not exceed 3kg/m³.","ref":"3.1.6.6","why":"Excess alkalis reacting with reactive aggregate and moisture trigger alkali-silica reaction, an expansive gel that slowly cracks concrete from within over years; capping alkali content prevents this irreversible damage.","source":"NHBC Standards 2026","sourceShort":"NHBC","refLabel":"Clause"},{"id":"3.2-01","chapter":"3.2","chapterTitle":"Cold weather working","part":"General","question":"What is the minimum temperature of ready-mixed concrete when delivered to site in cold weather?","options":["2°C","3°C","5°C","7°C"],"correct":2,"explanation":"Clause 3.2.4 states the minimum temperature of ready-mixed concrete when delivered should be 5°C, in accordance with BS EN 206.","ref":"3.2.4","why":"Concrete delivered too cold can freeze before it gains enough strength, permanently disrupting the internal structure and reducing the ultimate strength of the element.","source":"NHBC Standards 2026","sourceShort":"NHBC","refLabel":"Clause"},{"id":"3.2-02","chapter":"3.2","chapterTitle":"Cold weather working","part":"General","question":"The air temperature has dropped to 2°C and site-mixed concrete work is to continue with heated mixing water. What is the maximum temperature the mixing water should be heated to?","options":["30°C","40°C","50°C","60°C"],"correct":3,"explanation":"Clause 3.2.4 states that if the air temperature drops to 2°C, work should not proceed unless precautions are taken, including heating the mixing water but not above 60°C; cement should not be heated.","ref":"3.2.4","why":"Water hotter than 60°C hitting the cement can flash-set the mix, causing rapid uncontrolled stiffening that ruins workability and weakens the final concrete.","source":"NHBC Standards 2026","sourceShort":"NHBC","refLabel":"Clause"},{"id":"3.2-03","chapter":"3.2","chapterTitle":"Cold weather working","part":"General","question":"Below what air temperature condition should brickwork and blockwork not be built?","options":["3°C and falling","2°C and falling","1°C and falling","5°C and falling"],"correct":0,"explanation":"Clause 3.2.5 states brickwork and blockwork should not be built when the air temperature is below 3°C and falling; work can resume when the temperature is 1°C and rising with the expectation it will exceed 3°C.","ref":"3.2.5","why":"Fresh mortar still holds water that will freeze below this threshold before it hardens, disrupting the bond between mortar and masonry and leaving a permanently weakened wall.","source":"NHBC Standards 2026","sourceShort":"NHBC","refLabel":"Clause"},{"id":"3.2-04","chapter":"3.2","chapterTitle":"Cold weather working","part":"General","question":"Depending on the severity of the conditions, new masonry may need protection against frost for up to how long?","options":["Four days","Six days","Eight days","Ten days"],"correct":1,"explanation":"Clause 3.2.5 states protection against frost may be required for up to six days, depending on the severity of the conditions.","ref":"3.2.5","why":"New mortar needs time to gain strength before it can resist frost; severe cold slows curing, so protection has to be extended or the mortar loses strength and bond once it thaws.","source":"NHBC Standards 2026","sourceShort":"NHBC","refLabel":"Clause"},{"id":"3.2-05","chapter":"3.2","chapterTitle":"Cold weather working","part":"General","question":"Warm air heaters have been used so plastering can go ahead in cold weather. For how long, as a minimum, should heating continue after the work is completed?","options":["12 hours","24 hours","48 hours","72 hours"],"correct":2,"explanation":"Clause 3.2.6 states heating should continue for at least 48 hours after completion of the work, but not be excessive, to avoid damage to screeds, plaster finishes and woodwork.","ref":"3.2.6","why":"Stopping heat too soon lets the structure cool before plaster or screed has properly cured, risking cracking or poor bond, but overdoing it dries finishes and timber too fast and cracks them instead.","source":"NHBC Standards 2026","sourceShort":"NHBC","refLabel":"Clause"},{"id":"3.2-06","chapter":"3.2","chapterTitle":"Cold weather working","part":"General","question":"Paint should not be applied where the air temperature is below, or likely to fall below, what temperature?","options":["2°C","3°C","5°C","7°C"],"correct":0,"explanation":"Clause 3.2.8 states paint should not be applied where the air temperature is below, or likely to fall below, 2°C, or on surfaces affected by damp, frost or condensation.","ref":"3.2.8","why":"Below this temperature paint can't cure properly and moisture can form on the surface, causing poor adhesion, blooming or a soft finish that fails early.","source":"NHBC Standards 2026","sourceShort":"NHBC","refLabel":"Clause"},{"id":"3.3-01","chapter":"3.3","chapterTitle":"Timber preservation (natural solid timber)","part":"General","question":"Which situation does Use Class 4 describe for wood or wood-based products?","options":["Inside a construction, not exposed to weather or wetting","Under cover, with only occasional wetting from condensation","Above ground and exposed to the weather","In direct contact with the ground and/or fresh water"],"correct":3,"explanation":"The definitions in Chapter 3.3 (based on BS EN 335) state Use Class 4 is a situation in which the wood or wood-based product is in direct contact with ground and/or fresh water.","ref":"3.3","why":"Constant contact with ground or fresh water is the most aggressive exposure for fungal decay, so flagging it separately ensures the highest level of preservative treatment or natural durability is specified.","source":"NHBC Standards 2026","sourceShort":"NHBC","refLabel":"Clause"},{"id":"3.3-02","chapter":"3.3","chapterTitle":"Timber preservation (natural solid timber)","part":"General","question":"For timber preservation purposes, which Use Class do ground floor joists fall into?","options":["Use Class 1","Use Class 2","Use Class 3.1","Use Class 4"],"correct":1,"explanation":"Table 1 in Clause 3.3.2 places ground floor joists in Use Class 2 with a 60-year Desired Service Life, requiring preservative treatment or a minimum natural Durability Class of 2 in lieu of treatment.","ref":"3.3.2","table":"ch33-t1","why":"Ground floor joists sit in a sub-floor void where occasional damp and condensation can occur, so treatment protects them from decay in a location that's very hard to inspect or replace later.","source":"NHBC Standards 2026","sourceShort":"NHBC","refLabel":"Clause"},{"id":"3.3-03","chapter":"3.3","chapterTitle":"Timber preservation (natural solid timber)","part":"General","question":"The base of a timber support post to an open porch should be at least how far above the adjacent ground level?","options":["75mm","100mm","150mm","225mm"],"correct":2,"explanation":"Note 6 to Table 1 in Clause 3.3.2 states the base of support posts should be at least 150mm above adjacent ground level, supported on a free draining post base.","ref":"3.3.2","table":"ch33-t1","why":"Keeping the post base clear of splash-back and standing water stops moisture wicking into the end grain, which is where rot typically starts and is hardest to spot once fixed.","source":"NHBC Standards 2026","sourceShort":"NHBC","refLabel":"Clause"},{"id":"3.3-04","chapter":"3.3","chapterTitle":"Timber preservation (natural solid timber)","part":"General","question":"A joiner has cross cut lengths of preservative-treated timber on site. What does the standard require for the cut ends?","options":["Re-treat them with a suitable brush-applied preservative, normally colour tinted","No action, as pressure treatment penetrates the full timber section","Seal them with a coat of external-grade paint or stain","Return the timber to the treatment plant for re-processing"],"correct":0,"explanation":"Clause 3.3.5 states cut ends should be re-treated with a suitable brush-applied preservative in accordance with the manufacturer's recommendations, using a colour tinted preservative to confirm re-treatment unless tinting would affect the appearance of fixed timber.","ref":"3.3.5","why":"Cutting through treated timber exposes untreated core wood the preservative never reached, giving fungal decay or insects an entry point unless the fresh cut face is treated too.","source":"NHBC Standards 2026","sourceShort":"NHBC","refLabel":"Clause"},{"id":"3.3-05","chapter":"3.3","chapterTitle":"Timber preservation (natural solid timber)","part":"General","question":"Where likely wetting is expected, what fittings should be used in contact with timber treated with copper-containing preservatives?","options":["Galvanized fittings","Bright mild steel fittings","Aluminium fittings","Austenitic stainless steel fittings"],"correct":3,"explanation":"Clause 3.3.6 states that with copper-containing preservative treatments, galvanized fittings should be used for occasional dampness and austenitic stainless steel fittings where likely wetting is expected.","ref":"3.3.6","why":"Copper in the preservative reacts galvanically with mild steel or aluminium fixings when wet, corroding the metal; stainless steel resists this reaction where fittings will be regularly wetted.","source":"NHBC Standards 2026","sourceShort":"NHBC","refLabel":"Clause"},{"id":"3.3-06","chapter":"3.3","chapterTitle":"Timber preservation (natural solid timber)","part":"General","question":"Before preservative treated timber comes into contact with metal fittings, it should be re-dried to what maximum moisture content?","options":["16%","18%","20%","22%"],"correct":3,"explanation":"Clause 3.3.6 states preservative treated timber should be re-dried to a moisture content of 22% or less before being in contact with metal fittings.","ref":"3.3.6","why":"Wetter timber against metal speeds up corrosion of the fitting and keeps the timber in the moisture range where decay fungi can become active, so drying it down first reduces both risks.","source":"NHBC Standards 2026","sourceShort":"NHBC","refLabel":"Clause"},{"id":"3.3-07","chapter":"3.3","chapterTitle":"Timber preservation (natural solid timber)","part":"General","question":"What is the Desired Service Life for standard deck posts, deck joists and beams?","options":["15 years","30 years","45 years","60 years"],"correct":0,"explanation":"Table 1 in Clause 3.3.2 gives deck posts, deck joists and beams and external stairs a Use Class of 4 and a Desired Service Life of 15 years, with preservative treatment required or minimum natural Durability Class 2.","ref":"3.3.2","table":"ch33-t1","why":"Deck posts and joists sit in ground contact and full weather exposure, the harshest use class for timber, so a shorter design life reflects realistic wear and prompts timely inspection before structural failure.","source":"NHBC Standards 2026","sourceShort":"NHBC","refLabel":"Clause"},{"id":"4.1-01","chapter":"4.1","chapterTitle":"Land quality – managing ground conditions","part":"Foundations","question":"A site is classed as hazardous. How far in advance of work starting must NHBC be notified in writing?","options":["A minimum of 2 weeks","A minimum of 4 weeks","A minimum of 8 weeks","A minimum of 12 weeks"],"correct":2,"explanation":"Clause 4.1.1.4 states that where a site is classed as hazardous, NHBC must be notified in writing a minimum of eight weeks before work starts, otherwise registration, construction and the issuing of the warranty may be delayed.","ref":"4.1.1.4","why":"This gives NHBC time to review the risk before ground is broken, so any foundation redesign or remediation can be sorted out early - starting work on hazardous ground without warning risks uncovering serious contamination or ground problems mid-build, causing costly delays and disputes over warranty cover.","source":"NHBC Standards 2026","sourceShort":"NHBC","refLabel":"Clause"},{"id":"4.1-02","chapter":"4.1","chapterTitle":"Land quality – managing ground conditions","part":"Foundations","question":"In a Basic Investigation, what is the general minimum depth for trial pits?","options":["1.5m","2m","2.5m","3m"],"correct":3,"explanation":"Clause 4.1.5 states trial pits should be located outside the proposed foundation area and generally be a minimum of 3m deep, with the distance from the edge of the foundation not less than the depth of the pit.","ref":"4.1.5","why":"Pits need to be deep enough to expose the full depth of ground affected by the new foundations and any variable strata below, while sitting far enough outside the footprint that the disturbed, backfilled pit itself isn't later built on and doesn't settle unevenly under the house.","source":"NHBC Standards 2026","sourceShort":"NHBC","refLabel":"Clause"},{"id":"4.1-03","chapter":"4.1","chapterTitle":"Land quality – managing ground conditions","part":"Foundations","question":"Where contamination is suspected or found, which framework should be used to assess the site?","options":["Source-Pathway-Receptor","Hazard-Exposure-Outcome","Cause-Effect-Control","Risk-Route-Remedy"],"correct":0,"explanation":"Clause 4.1.1.2 states that where contamination is suspected or found, the site should be assessed using the Source-Pathway-Receptor framework (known as the pollutant linkage), with a Conceptual Model showing the possible relationships between each.","ref":"4.1.1.2","why":"Contamination is only a real problem if a source, a pathway and a receptor (people, water, buildings) actually connect, so this framework stops sites being needlessly remediated for contamination that can never reach anyone while flagging genuine risks to health or structures.","source":"NHBC Standards 2026","sourceShort":"NHBC","refLabel":"Clause"},{"id":"4.1-04","chapter":"4.1","chapterTitle":"Land quality – managing ground conditions","part":"Foundations","question":"What does NHBC require as the Initial Assessment on every site?","options":["A desk study only","A walkover survey only","A desk study and a walkover survey","A Basic Investigation with trial pits"],"correct":2,"explanation":"Clause 4.1.1.3 states NHBC requires all sites to be assessed by a desk study and a walkover survey, the results of which determine whether hazards are known or suspected.","ref":"4.1.1.3","why":"A cheap early desk study and site walk catches obvious red flags - old mine workings, tipping, waterlogged ground - before any earth is moved, so serious hazards aren't discovered for the first time halfway through construction.","source":"NHBC Standards 2026","sourceShort":"NHBC","refLabel":"Clause"},{"id":"4.1-05","chapter":"4.1","chapterTitle":"Land quality – managing ground conditions","part":"Foundations","question":"The Basic Investigation on your site reveals a suspected contamination hazard. What does the standard require next?","options":["Extra trial pits dug and logged by the site team","A Detailed Investigation supervised by a consultant or specialist acceptable to NHBC","Immediate remediation followed by re-testing of the soil","Notification to the local authority before continuing the groundworks"],"correct":1,"explanation":"Clause 4.1.6 requires that where hazards are identified or suspected, including from the Basic Investigation, a Detailed Investigation is conducted under the supervision of a consultant or specialist acceptable to NHBC.","ref":"4.1.6","why":"Suspected contamination or complex ground needs proper specialist sampling and testing to define how bad and how widespread it actually is, because guessing wrong could leave harmful substances under future gardens or homes, or leave foundations under-designed for poor ground.","source":"NHBC Standards 2026","sourceShort":"NHBC","refLabel":"Clause"},{"id":"4.1-06","chapter":"4.1","chapterTitle":"Land quality – managing ground conditions","part":"Foundations","question":"During foundation excavation you uncover unexpected made ground with a strong odour that was not identified in the site investigation. What should happen?","options":["Backfill the area and record it in the site diary","Remove the suspect material off site and carry on","Ask the NHBC inspector to sign the excavation off","Obtain specialist advice so the hazard is properly investigated, managed and verified"],"correct":3,"explanation":"Clause 4.1.8 states that where additional or unforeseen hazards arise during construction, specialist advice is required so that the hazard is properly investigated, managed and verified, to the satisfaction of NHBC.","ref":"4.1.8","why":"A strong odour in unexpected made ground can signal hidden contamination or gas-generating waste that wasn't picked up by the original survey, so ignoring it risks building homes over ground gas or chemical hazards that only surface once people are living there.","source":"NHBC Standards 2026","sourceShort":"NHBC","refLabel":"Clause"},{"id":"4.1-07","chapter":"4.1","chapterTitle":"Land quality – managing ground conditions","part":"Foundations","question":"Capping material of unknown origin is being used for a clean cover system on a site of 25 plots. What chemical testing frequency does the standard suggest?","options":["1 test per 3 plots, with a minimum of 7 tests per material","1 test per 2 plots, with a minimum of 5 tests per material","1 test per 4 plots, with a minimum of 10 tests per material","1 test per plot, with a minimum of 3 tests per material"],"correct":0,"explanation":"Table 4 in Clause 4.1.9.1 gives a nominal sampling frequency of 1 test per 3 plots for sites of 21 to 30 plots, with a suggested minimum of 7 tests per site of each material used within the capping layer.","ref":"4.1.9.1","why":"Clean cover only works if the cover material itself is genuinely clean, so enough samples must be taken to be statistically confident the capping isn't accidentally bringing contaminated soil to the surface where residents and gardeners would be directly exposed.","source":"NHBC Standards 2026","sourceShort":"NHBC","refLabel":"Clause"},{"id":"4.1-08","chapter":"4.1","chapterTitle":"Land quality – managing ground conditions","part":"Foundations","question":"Which statement about radon barriers and gas membranes is correct?","options":["Barriers made from recycled products are acceptable if independently assessed","Barriers and membranes manufactured from recycled products should not be used","A radon barrier can be assumed effective against methane and carbon dioxide","Recycled-product barriers may be used below DPC level only"],"correct":1,"explanation":"Clause 4.1.7.1 states that some radon barriers and gas membranes are manufactured from recycled products but these should not be used, and that a radon barrier should not be assumed effective against other hazardous gases without further specialist advice.","ref":"4.1.7.1","why":"Recycled-content barriers can have inconsistent composition that undermines their gas resistance, so using them risks radon or other hazardous gases like methane leaking into occupied homes undetected, creating a long-term health or explosion hazard.","source":"NHBC Standards 2026","sourceShort":"NHBC","refLabel":"Clause"},{"id":"4.2-01","chapter":"4.2","chapterTitle":"Building near trees","part":"Foundations","question":"How does the standard classify a shrinkable soil?","options":["Over 35% fine particles and a Modified Plasticity Index of 10% or greater","Over 20% fine particles and a Modified Plasticity Index of 20% or greater","Over 50% fine particles and a Modified Plasticity Index of 10% or greater","Over 35% fine particles and a Modified Plasticity Index of 20% or greater"],"correct":0,"explanation":"Clause 4.2.4.1 defines shrinkable soils as those with over 35% fine particles and a Modified Plasticity Index of 10% or greater.","ref":"4.2.4.1","why":"Soil only shrinks and swells enough to threaten foundations once it passes these fines and plasticity thresholds, so correctly identifying shrinkable soil is what triggers the deeper foundations and heave precautions needed to stop cracking from seasonal or tree-driven ground movement.","source":"NHBC Standards 2026","sourceShort":"NHBC","refLabel":"Clause"},{"id":"4.2-02","chapter":"4.2","chapterTitle":"Building near trees","part":"Foundations","question":"Different foundation types should not be used to support the same structure unless what applies?","options":["The foundation and superstructure design are undertaken by an engineer","The two foundation types are approved separately by NHBC","The foundations are separated by a continuous movement joint","The structure is a single-storey garage, porch or conservatory"],"correct":0,"explanation":"Clause 4.2.5 states different foundation types should not be used to support the same structure unless the foundation and superstructure design are undertaken by an engineer.","ref":"4.2.5","why":"Different foundation types settle and move at different rates, so mixing them under one structure without an engineer's design risks differential movement between parts of the same building, tearing walls and floors apart at the junction.","source":"NHBC Standards 2026","sourceShort":"NHBC","refLabel":"Clause"},{"id":"4.2-03","chapter":"4.2","chapterTitle":"Building near trees","part":"Foundations","question":"At what Modified Plasticity Index is a soil classed as having HIGH volume change potential?","options":["20% and greater","30% and greater","35% and greater","40% and greater"],"correct":3,"explanation":"Table 1 in Clause 4.2.4.1 classes a Modified Plasticity Index of 40% and greater as high volume change potential; 20% to less than 40% is medium and 10% to less than 20% is low.","ref":"4.2.4.1","why":"Higher-plasticity clay absorbs and releases far more water as trees and seasons change, so it shrinks and swells more dramatically - misjudging this as anything less than high risk means foundations could be left too shallow, in the zone where the ground is actively moving.","source":"NHBC Standards 2026","sourceShort":"NHBC","refLabel":"Clause"},{"id":"4.2-04","chapter":"4.2","chapterTitle":"Building near trees","part":"Foundations","question":"If the volume change potential of the soil is unknown, what should be assumed?","options":["Low volume change potential","Medium volume change potential","High volume change potential","The average of results from adjacent sites"],"correct":2,"explanation":"Clause 4.2.4.1 states that high volume change potential should be assumed if the volume change potential is unknown.","ref":"4.2.4.1","why":"This is a precautionary default: underestimating how much a soil can shrink or swell risks a foundation that's too shallow, so when the true (worse) behaviour shows up during a dry spell or after tree planting, the building suffers subsidence cracking.","source":"NHBC Standards 2026","sourceShort":"NHBC","refLabel":"Clause"},{"id":"4.2-05","chapter":"4.2","chapterTitle":"Building near trees","part":"Foundations","question":"A tree close to a plot cannot be identified by species. What water demand should be assumed for the foundation design?","options":["Moderate water demand","High water demand","Low water demand","None, until the species is confirmed by an arboriculturalist"],"correct":1,"explanation":"Clause 4.2.4.2 states that where the species of a tree has not been identified, high water demand should be assumed.","ref":"4.2.4.2","why":"Thirsty species like oak or willow dry out clay much further and deeper than low-demand trees, so assuming anything less than high demand for an unidentified tree risks underestimating its drying effect and building too close or too shallow, leading to subsidence.","source":"NHBC Standards 2026","sourceShort":"NHBC","refLabel":"Clause"},{"id":"4.2-06","chapter":"4.2","chapterTitle":"Building near trees","part":"Foundations","question":"A broad-leafed tree has been identified but its species is not listed in the water demand tables. Which species groups should then be assumed to have HIGH water demand?","options":["All elms, eucalyptus, hawthorn, oaks, poplars and willows","All ash, beech, lime and sycamore","All coniferous species over 15m mature height","All fruit-bearing and orchard species"],"correct":0,"explanation":"Table 2 in Clause 4.2.4.2 states that for identified but unlisted broad-leafed trees, all elms, eucalyptus, hawthorn, oaks, poplars and willows are high water demand, and all others are moderate water demand.","ref":"4.2.4.2","why":"These species groups are known to have deep, spreading roots and high transpiration that dry out clay significantly, so treating unlisted relatives the same way avoids under-designing foundations near a tree that turns out to be just as thirsty.","source":"NHBC Standards 2026","sourceShort":"NHBC","refLabel":"Clause"},{"id":"4.2-07","chapter":"4.2","chapterTitle":"Building near trees","part":"Foundations","question":"What is the lateral zone of influence of a HIGH water demand tree?","options":["0.5 times its mature height","0.75 times its mature height","1.0 times its mature height","1.25 times its mature height"],"correct":3,"explanation":"Table 3b in Clause 4.2.4.2 gives the zone of influence as 1.25 x mature height for high water demand, 0.75 x for moderate and 0.5 x for low water demand trees.","ref":"4.2.4.2","why":"This distance reflects how far a thirsty tree's roots and drying effect genuinely reach outward - any foundation inside it sits in ground that can dry, shrink and move, so it marks where deeper foundations or heave precautions are actually needed.","source":"NHBC Standards 2026","sourceShort":"NHBC","refLabel":"Clause"},{"id":"4.2-08","chapter":"4.2","chapterTitle":"Building near trees","part":"Foundations","question":"What reduction in foundation depth can be made to allow for climate on sites away from London?","options":["25mm for every 50 miles north and west of London","50mm for every 50 miles north and west of London","50mm for every 100 miles north and west of London","100mm for every 50 miles north and west of London"],"correct":1,"explanation":"Clause 4.2.4.3 permits a 50mm decrease to the derived foundation depth for every 50 miles distance north and west of London; where it is unclear which zone applies, the lower reduction value should be used.","ref":"4.2.4.3","why":"The hottest, driest conditions that cause the worst clay shrinkage are concentrated in the southeast, so cooler, wetter areas further north and west genuinely see less desiccation risk, allowing a shallower, more economical foundation without compromising safety.","source":"NHBC Standards 2026","sourceShort":"NHBC","refLabel":"Clause"},{"id":"4.2-09","chapter":"4.2","chapterTitle":"Building near trees","part":"Foundations","question":"The assessed foundation depth within the influence of trees comes out at more than 2.5m. What does the standard require?","options":["Proceed with trench fill provided heave precautions are doubled","Proceed if a registered arboriculturalist approves the depth","The foundation should be designed by an engineer in accordance with Technical Requirement R5","Reduce the depth to 2.5m and add compressible material to both faces"],"correct":2,"explanation":"Clause 4.2.7.3 states that foundations deeper than 2.5m should be designed by an engineer in accordance with Technical Requirement R5.","ref":"4.2.7.3","why":"Beyond 2.5m, trench sides become unstable to dig safely and the prescriptive tables are no longer reliable for the complex interaction of soil, tree and structure, so an engineer needs to directly assess the ground to avoid excavation collapse or an inadequate foundation.","source":"NHBC Standards 2026","sourceShort":"NHBC","refLabel":"Clause"},{"id":"4.2-10","chapter":"4.2","chapterTitle":"Building near trees","part":"Foundations","question":"Within what depth of the surface are the majority of tree roots found?","options":["300mm","450mm","600mm","900mm"],"correct":2,"explanation":"Clause 4.2.3.2 states that roots often extend to distances in excess of the height of the tree, the majority are within 600mm of the surface, and they project radially.","ref":"4.2.3.2","why":"Knowing most roots stay shallow tells site teams where the real risk of root damage and moisture loss lies, so protection measures - fencing, careful stripping, trench positioning - can be focused on the top 600mm rather than assuming deep excavation is the main threat.","source":"NHBC Standards 2026","sourceShort":"NHBC","refLabel":"Clause"},{"id":"4.2-11","chapter":"4.2","chapterTitle":"Building near trees","part":"Foundations","question":"A single tree is to be protected during construction. What size of protective fence or barrier does the standard describe around the trunk?","options":["A circle of radius 6 times the trunk diameter, measured at ground level","A circle of radius 10 times the trunk diameter, measured 1.0m above ground level","A circle of radius equal to the mature height of the tree","A circle of radius 12 times the trunk diameter, measured 1.5m above ground level"],"correct":3,"explanation":"Clause 4.2.3.2 states the fence or barrier should extend around a single trunk equivalent to a circle of radius 12 times the trunk diameter, measured 1.5m above ground level.","ref":"4.2.3.2","why":"This generous exclusion zone keeps machinery, compaction and excavation away from the main root plate that anchors and feeds the tree, because damaging those roots can destabilise or kill it, creating a falling-tree hazard and planning breaches.","source":"NHBC Standards 2026","sourceShort":"NHBC","refLabel":"Clause"},{"id":"4.2-12","chapter":"4.2","chapterTitle":"Building near trees","part":"Foundations","question":"A sapling less than 50% of its mature height is removed from within 2m of the face of the proposed foundation. What distance D should be used to derive the foundation depth?","options":["The actual measured distance from trunk to foundation face","D = 2m","D = 0m, as the tree was on the foundation line","D = half the mature height of the tree"],"correct":1,"explanation":"Clause 4.2.7.2 states D = 2m where trees removed from within 2m of the face of the proposed foundation are less than 50% of the mature height, avoiding an unnecessarily deep foundation from a D/H value of zero.","ref":"4.2.7.2","why":"A young sapling has far less root spread and water demand than a mature tree, so treating its felled location as if it were right at the foundation face (D=0) would force needlessly deep, expensive foundations out of proportion to the actual residual drying risk.","source":"NHBC Standards 2026","sourceShort":"NHBC","refLabel":"Clause"},{"id":"4.2-13","chapter":"4.2","chapterTitle":"Building near trees","part":"Foundations","question":"What is the standard's position on root barriers in shrinkable soils?","options":["They are acceptable if independently assessed","They are acceptable with prior NHBC approval","They are acceptable for low water demand trees only","They are not an acceptable alternative to the guidance given"],"correct":3,"explanation":"Clause 4.2.7.1 states plainly that root barriers are not an acceptable alternative to the guidance given.","ref":"4.2.7.1","why":"Roots can grow around or beneath a barrier and it does nothing to stop the underlying moisture loss drying the clay, so relying on one instead of proper foundation depth leaves the building exposed to shrinkage movement the barrier was supposed to prevent.","source":"NHBC Standards 2026","sourceShort":"NHBC","refLabel":"Clause"},{"id":"4.2-14","chapter":"4.2","chapterTitle":"Building near trees","part":"Foundations","question":"In a HIGH volume change potential soil, where all planting is outside the zone of influence of trees, what is the minimum foundation depth?","options":["0.75m","0.9m","1.0m","1.5m"],"correct":2,"explanation":"Table 4b in Clause 4.2.7.4 gives a minimum foundation depth of 1.0m in high volume change potential soil where planting is outside the zone of influence of trees (column B); column A, allowing restricted new planting, requires 1.5m.","ref":"4.2.7.4","why":"Even with no tree nearby, high-plasticity clay still shrinks and swells with ordinary seasonal wetting and drying, so this minimum depth keeps the foundation below the zone where everyday moisture cycling would otherwise crack it.","source":"NHBC Standards 2026","sourceShort":"NHBC","refLabel":"Clause"},{"id":"4.2-15","chapter":"4.2","chapterTitle":"Building near trees","part":"Foundations","question":"Pyracantha with a mature height exceeding 1.8m is to be planted near new foundations. What does the standard require?","options":["The deeper foundation depth and planting at least 1.0 x mature height from the foundation, or the standard depth and planting at least 0.5 x mature height away","The deeper foundation depth with no restriction on planting distance","The standard foundation depth and planting at least 1.5 x mature height from the foundation","The deeper foundation depth and planting at least 0.25 x mature height from the foundation"],"correct":0,"explanation":"Table 6 in Clause 4.2.7.5 (where column A is the standard foundation depth and column B the deeper one) requires pyracantha and cotoneaster over 1.8m mature height to use the column B depth and be planted at least 1.0 x mature height from the foundation, or use the column A depth planted at least 0.5 x mature height away.","ref":"4.2.7.5","why":"Vigorous shrubs like pyracantha draw moisture from clay just as trees do, so balancing extra foundation depth against planting distance stops a shrub planted too close from drying the ground enough to crack a shallow foundation.","source":"NHBC Standards 2026","sourceShort":"NHBC","refLabel":"Clause"},{"id":"4.2-16","chapter":"4.2","chapterTitle":"Building near trees","part":"Foundations","question":"Foundations are proposed on non-shrinkable sand overlying shrinkable clay. One condition is that the thickness of non-shrinkable soil below the foundation must be at least what?","options":["Half the width of the foundation","Equal to or more than the width of the foundation","150mm below the underside of the foundation","Equal to the full depth of the foundation"],"correct":1,"explanation":"Clause 4.2.9.1 requires the thickness T of non-shrinkable soil below the foundation to be equal to, or more than, the width of the foundation B, alongside conditions including the non-shrinkable depth exceeding three-quarters of depth X and prior NHBC approval.","ref":"4.2.9.1","why":"A non-shrinkable layer at least as wide as the foundation ensures the load spreads and dissipates before reaching the shrinkable clay beneath, so that clay never sees enough stress or moisture change from the building to move the foundation.","source":"NHBC Standards 2026","sourceShort":"NHBC","refLabel":"Clause"},{"id":"4.2-17","chapter":"4.2","chapterTitle":"Building near trees","part":"Foundations","question":"A tree has been removed from a plot on shrinkable soil. How is the required foundation depth selected?","options":["Use the shallower of the tree-based depth and the minimum foundation depth","Always use the depth based on the mature height of the removed tree","Use the deepest of the depth based on the appropriate tree height and the standard minimum foundation depth","Use the minimum foundation depth only, as the tree no longer takes water"],"correct":2,"explanation":"Figure 6 of Clause 4.2.9.2 requires the deepest of (a) the foundation depth based on the appropriate tree height (see Table 3a) and (b) the minimum foundation depth from Table 4b column B, where trees or hedgerows are removed.","ref":"4.2.9.2","why":"Felling a tree removes the moisture sink that was drying the clay, so the ground can swell back upward (heave) for years afterwards - the foundation must be deep enough to cope with whichever is worse, the past shrinkage risk or the future heave.","source":"NHBC Standards 2026","sourceShort":"NHBC","refLabel":"Clause"},{"id":"4.2-18","chapter":"4.2","chapterTitle":"Building near trees","part":"Foundations","question":"Where granular infill is used beneath a raft foundation on shrinkable soil, what depth rules apply to the infill?","options":["At least 25% of the trench fill foundation depth and not more than 1.0m deep","At least 50% of the trench fill foundation depth and not more than 1.25m deep","At least 75% of the trench fill foundation depth and not more than 2.5m deep","Any depth, provided it is fully compacted in layers"],"correct":1,"explanation":"Clause 4.2.9.3 requires the infill to be at least 50% of the foundation depth determined for a trench fill foundation and not more than 1.25m deep, and to extend beyond the foundation edge by its natural angle of repose plus 0.5m.","ref":"4.2.9.3","why":"The infill needs enough depth to buffer the raft from active shrink-swell movement in the clay below, but capping it keeps the fill practical to place and fully compact rather than becoming an unmanageably deep, poorly compacted layer.","source":"NHBC Standards 2026","sourceShort":"NHBC","refLabel":"Clause"},{"id":"4.2-19","chapter":"4.2","chapterTitle":"Building near trees","part":"Foundations","question":"Where foundations are stepped to take account of the influence of trees, what is the maximum height of each step?","options":["0.3m","0.45m","0.5m","1.0m"],"correct":2,"explanation":"Clause 4.2.9.4 states that where foundations are stepped to take account of the influence of trees, hedgerows and shrubs, they should be stepped gradually with no step exceeding 0.5m.","ref":"4.2.9.4","why":"Small, gradual steps keep load transferring smoothly along the foundation; a taller step creates a weak, thinly-supported corner that's more likely to crack or shear once tree-related ground movement puts it under uneven stress.","source":"NHBC Standards 2026","sourceShort":"NHBC","refLabel":"Clause"},{"id":"4.2-20","chapter":"4.2","chapterTitle":"Building near trees","part":"Foundations","question":"In a HIGH volume change potential soil, what void dimension is required against the side of a foundation or ground beam?","options":["25mm","35mm","50mm","150mm"],"correct":1,"explanation":"Table 7 in Clause 4.2.10.2 requires a 35mm void dimension against the side of foundations and ground beams in high volume change potential soil (25mm for medium, 0mm for low).","ref":"4.2.10.2","why":"This gap gives swelling (heaving) clay somewhere to expand into instead of pushing directly on the foundation, so the concrete and structure above aren't cracked or lifted by the pressure of the ground trying to regain its lost moisture.","source":"NHBC Standards 2026","sourceShort":"NHBC","refLabel":"Clause"},{"id":"4.2-21","chapter":"4.2","chapterTitle":"Building near trees","part":"Foundations","question":"Significant quantities of roots are unexpectedly encountered in the base of a foundation trench in clay. What should be done?","options":["Cut out the roots and place the concrete the same day","Deepen the trench by a standard 300mm and proceed","Line the trench bottom with polythene before concreting","Consult an engineer to determine if the excavation should be deepened"],"correct":3,"explanation":"Clause 4.2.6 states that if significant quantities of roots are unexpectedly encountered in the base of the trench, an engineer should be consulted to determine if the excavation should be deepened.","ref":"4.2.6","why":"Finding roots deeper than expected shows the tree's influence and drying effect reaches further than the design assumed, so an engineer needs to check whether the trench must be deepened to get below the zone of continuing desiccation.","source":"NHBC Standards 2026","sourceShort":"NHBC","refLabel":"Clause"},{"id":"4.2-22","chapter":"4.2","chapterTitle":"Building near trees","part":"Foundations","question":"Unless NHBC is satisfied the soil is not desiccated, compressible material is required to the inside faces of external trench fill foundations deeper than what?","options":["0.75m","1.0m","1.25m","1.5m"],"correct":3,"explanation":"Table 8 in Clause 4.2.10.4 requires compressible material to the inside faces of external trench fill wall foundations deeper than 1.5m, based on the appropriate tree height, unless NHBC is satisfied the soil is not desiccated.","ref":"4.2.10.4","why":"A deep trench fill wall has a large area of concrete in direct contact with clay that can swell, so without a compressible buffer against that face the heave force pushes sideways on the wall and cracks the masonry it supports.","source":"NHBC Standards 2026","sourceShort":"NHBC","refLabel":"Clause"},{"id":"4.2-23","chapter":"4.2","chapterTitle":"Building near trees","part":"Foundations","question":"When designing new drainage in a HIGH volume change potential soil, what minimum allowance for potential ground movement should be made?","options":["100mm","150mm","200mm","250mm"],"correct":1,"explanation":"Table 9 in Clause 4.2.11 gives a minimum allowance for potential ground movement of 150mm for high, 100mm for medium and 50mm for low volume change potential soils.","ref":"4.2.11","why":"Rigid drainpipes running through ground that can shrink and swell by up to 150mm risk fractured joints and lost gradient, so allowing for that movement stops future leaks and blockages that would otherwise worsen the ground conditions further.","source":"NHBC Standards 2026","sourceShort":"NHBC","refLabel":"Clause"},{"id":"4.2-24","chapter":"4.2","chapterTitle":"Building near trees","part":"Foundations","question":"For a raft foundation to be acceptable in shrinkable soil, its plan shape should generally be rectangular with a side ratio of not more than what?","options":["2:1","3:1","4:1","5:1"],"correct":0,"explanation":"Clause 4.2.8 states raft foundations in shrinkable soils are only acceptable where, among other conditions, the raft is generally rectangular in plan with a side ratio of not more than 2:1, is engineer designed, and its depth is less than 2.5m.","ref":"4.2.8","why":"Keeping the raft roughly square rather than a long thin strip limits how much one end can move differently from the other as the clay beneath shrinks or swells unevenly, reducing the risk of the slab bending or cracking.","source":"NHBC Standards 2026","sourceShort":"NHBC","refLabel":"Clause"},{"id":"4.3-01","chapter":"4.3","chapterTitle":"Strip and trench fill foundations","part":"Foundations","question":"In frost susceptible soils such as chalk, what is the minimum depth to the underside of the foundation below finished ground level?","options":["300mm","350mm","400mm","450mm"],"correct":3,"explanation":"Clause 4.3.3.3 requires the depth to the underside of the foundation to be at least 450mm below finished ground level in frost susceptible soils, to avoid damage from frost action.","ref":"4.3.3.3","why":"Frost can heave and expand susceptible soils like chalk as they freeze, so a foundation shallower than this depth can be lifted or cracked by ground freezing in a cold winter.","source":"NHBC Standards 2026","sourceShort":"NHBC","refLabel":"Clause"},{"id":"4.3-02","chapter":"4.3","chapterTitle":"Strip and trench fill foundations","part":"Foundations","question":"Which of the following situations requires the strip or trench fill foundation to be designed by an engineer in accordance with Technical Requirement R5?","options":["The building exceeds three storeys in height","The trench fill foundation is deeper than 1.5m","The building is two storeys with an attached garage","The soil has medium volume change potential"],"correct":0,"explanation":"Clause 4.3.1 requires engineer design in accordance with Technical Requirement R5 where buildings exceed three storeys, supporting/retaining walls form habitable rooms below ground, trench fill foundations are deeper than 2.5m, or foundations are deeper than those of an adjoining construction.","ref":"4.3.1","why":"Taller buildings apply heavier, more concentrated loads than the simple prescriptive tables are proven for, so an engineer needs to confirm the ground can carry that extra load without excessive or uneven settlement.","source":"NHBC Standards 2026","sourceShort":"NHBC","refLabel":"Clause"},{"id":"4.3-03","chapter":"4.3","chapterTitle":"Strip and trench fill foundations","part":"Foundations","question":"As a minimum, the width of a foundation should not be less than the wall thickness plus how much each side?","options":["25mm","50mm","75mm","100mm"],"correct":1,"explanation":"Clause 4.3.7.2 states the foundation width should not be less than the wall thickness plus at least 50mm each side, and must also suit the loads and the load-bearing capacity of the subsoil.","ref":"4.3.7.2","why":"This margin allows for minor inaccuracies in setting out and stops the wall's load being concentrated right at the foundation's edge, which could locally overstress and crumble the concrete.","source":"NHBC Standards 2026","sourceShort":"NHBC","refLabel":"Clause"},{"id":"4.3-04","chapter":"4.3","chapterTitle":"Strip and trench fill foundations","part":"Foundations","question":"What is the minimum thickness for a trench fill foundation?","options":["300mm","450mm","500mm","600mm"],"correct":2,"explanation":"Clause 4.3.7.2 requires trench fill foundations to be a minimum of 500mm thick, while strip foundations should be 150mm to 500mm thick and equal to the projection or 150mm, whichever is greater.","ref":"4.3.7.2","why":"Trench fill is unreinforced mass concrete, so it needs enough thickness to spread the wall load without the base cracking or punching through, unlike a wider strip footing that can be shallower.","source":"NHBC Standards 2026","sourceShort":"NHBC","refLabel":"Clause"},{"id":"4.3-05","chapter":"4.3","chapterTitle":"Strip and trench fill foundations","part":"Foundations","question":"For a stepped trench fill foundation, what is the minimum overlap at each step?","options":["Twice the step height or one metre, whichever is largest","Twice the step height or 500mm, whichever is largest","The step height or 300mm, whichever is largest","The foundation thickness or 300mm, whichever is largest"],"correct":0,"explanation":"Table 3 in Clause 4.3.8 requires the overlap for trench fill foundations to be not less than 2 x S or one metre, whichever is largest; for strip foundations it is 2 x S, T (maximum 500mm) or 300mm, whichever is largest.","ref":"4.3.8","why":"A generous overlap at each step ensures the load is properly carried through solid concrete between the two levels, rather than resting on a thin, unsupported corner that could crack or shear off.","source":"NHBC Standards 2026","sourceShort":"NHBC","refLabel":"Clause"},{"id":"4.3-06","chapter":"4.3","chapterTitle":"Strip and trench fill foundations","part":"Foundations","question":"A drain needs to cross the line of a strip foundation. How should this be dealt with?","options":["Cast the pipe rigidly into the foundation concrete","Pass the service through the masonry above the foundation, with adequate lintels provided","Core-drill an opening through the strip foundation once the concrete has cured","Sleeve the pipe directly through the strip foundation concrete"],"correct":1,"explanation":"Clause 4.3.6.2 states services should not pass through strip foundations but through the masonry above, with adequate lintels provided; sleeving or strengthened openings are the approach for trench fill foundations.","ref":"4.3.6.2","why":"Cutting through the foundation itself would weaken the very element carrying the wall's load, so routing the service through the masonry above - protected by a lintel - avoids compromising the foundation's strength or causing uneven settlement.","source":"NHBC Standards 2026","sourceShort":"NHBC","refLabel":"Clause"},{"id":"4.4-01","chapter":"4.4","chapterTitle":"Raft, pile, pier and beam foundations","part":"Foundations","question":"In frost susceptible ground, what is the minimum depth to the underside of a foundation below finished ground level?","options":["300mm","400mm","450mm","600mm"],"correct":2,"explanation":"Clause 4.4.3.4 states that to avoid damage from frost action, the depth to the underside of the foundation in frost susceptible ground should be at least 450mm below finished ground level.","ref":"4.4.3.4","why":"Water in the ground freezes and expands, heaving and cracking shallow foundations. Founding below 450mm keeps the base under the frost zone so seasonal freeze-thaw can't lift or damage the foundation.","source":"NHBC Standards 2026","sourceShort":"NHBC","refLabel":"Clause"},{"id":"4.4-02","chapter":"4.4","chapterTitle":"Raft, pile, pier and beam foundations","part":"Foundations","question":"When designing a semi-raft foundation on engineered fill, what is the maximum area permitted between downstand beams?","options":["30m²","35m²","40m²","50m²"],"correct":1,"explanation":"Clause 4.4.6 states that for semi-raft foundations on engineered fill, the area between downstand beams should not be greater than 35m², with the ratio of adjacent sides on plan not exceeding 2:1.","ref":"4.4.6","why":"Keeping panels between beams to 35m2 stops the slab spanning too far unsupported over fill, so it stays stiff enough to bridge minor settlement without sagging or cracking.","source":"NHBC Standards 2026","sourceShort":"NHBC","refLabel":"Clause"},{"id":"4.4-03","chapter":"4.4","chapterTitle":"Raft, pile, pier and beam foundations","part":"Foundations","question":"During excavation for a ground beam you uncover an existing drain crossing the trench. How should it be dealt with?","options":["Supported, protected and bridged so that it carries no load","Rigidly encased in concrete as the beam is poured","Backfilled around with well-compacted hardcore","Left as found, provided it is recorded on the drawings"],"correct":0,"explanation":"Clause 4.4.5.2 requires existing services or drains to be supported and protected, bridged to prevent any load carrying, and not rigidly encased in concrete or masonry.","ref":"4.4.5.2","why":"A drain trapped or crushed under rigid concrete can crack unnoticed; leaking water then washes out fines beneath the foundation, causing settlement, so it must be bridged to carry no load and stay maintainable.","source":"NHBC Standards 2026","sourceShort":"NHBC","refLabel":"Clause"},{"id"
