ckness.","ref":"6.7.7.2"},{"id":"6.7-08","chapter":"6.7","chapterTitle":"Doors, windows and glazing","part":"Superstructure (excluding roofs)","question":"What is the maximum moisture content for windows and frames when fixed?","options":["9%","12%","15%","17%"],"correct":3,"explanation":"Table 4 of Clause 6.7.7.3 gives a maximum moisture content of 17% for windows and frames when fixed; lower limits apply to internal joinery depending on heating.","ref":"6.7.7.3"},{"id":"6.7-09","chapter":"6.7","chapterTitle":"Doors, windows and glazing","part":"Superstructure (excluding roofs)","question":"To reduce twisting, what hinges should an external door be hung on?","options":["1 pair of 75mm hinges","1 1/2 pairs of 100mm hinges","1 pair of 100mm hinges","1 1/2 pairs of 75mm hinges"],"correct":1,"explanation":"Table 8 of Clause 6.7.11.5 requires external doors to be hung on 1 1/2 pairs of 100mm hinges; internal doors need 1 pair of 75mm hinges.","ref":"6.7.11.5"},{"id":"6.8-01","chapter":"6.8","chapterTitle":"Fireplaces, chimneys and flues","part":"Superstructure (excluding roofs)","question":"For how long should a newly built chimney be allowed to dry naturally before use?","options":["A minimum of 14 days","A minimum of 7 days","A minimum of 21 days","A minimum of 28 days"],"correct":0,"explanation":"Clause 6.8.23.4 states a chimney should be allowed to dry naturally for a minimum period of 14 days before use.","ref":"6.8.23.4"},{"id":"6.8-02","chapter":"6.8","chapterTitle":"Fireplaces, chimneys and flues","part":"Superstructure (excluding roofs)","question":"Materials used for chimneys serving solid fuel appliances should be capable of resisting fluctuating temperatures up to what level?","options":["500°C","750°C","900°C","1,100°C"],"correct":3,"explanation":"Clause 6.8.6.1 states that materials used for chimneys should be capable of resisting fluctuating temperatures up to 1,100°C.","ref":"6.8.6.1"},{"id":"6.8-03","chapter":"6.8","chapterTitle":"Fireplaces, chimneys and flues","part":"Superstructure (excluding roofs)","question":"A clay brick chimney above roof level has no capping with an adequate overhang and drip. What bricks should be used?","options":["F1,S1 or F1,S2 bricks to BS EN 771","F2,S1 or F2,S2 bricks to BS EN 771","F0,S2 bricks to BS EN 771","Any clay bricks laid in sulfate-resisting mortar"],"correct":1,"explanation":"Clause 6.8.6.3 requires unprotected clay brick chimneys above roof level to be constructed using F2,S1 or F2,S2 bricks to BS EN 771, bedded in 1:1/2:4 to 4 1/2 cement:lime:sand or 1:3 or 4 cement:sand with plasticiser.","ref":"6.8.6.3"},{"id":"6.8-04","chapter":"6.8","chapterTitle":"Fireplaces, chimneys and flues","part":"Superstructure (excluding roofs)","question":"On a steeply pitched roof, two DPCs should be used in the chimney where the difference in level between the lower and higher intersection of the chimney with the roof is more than what?","options":["300mm","375mm","450mm","600mm"],"correct":2,"explanation":"Clause 6.8.6.4 requires two DPCs at suitable levels where the difference in level between the lower and higher intersection of the chimney with the roof will be more than 450mm.","ref":"6.8.6.4"},{"id":"6.8-05","chapter":"6.8","chapterTitle":"Fireplaces, chimneys and flues","part":"Superstructure (excluding roofs)","question":"How far should a flue terminal be built into the top of the chimney masonry?","options":["A minimum of 125mm, or 0.25x the length of the terminal, whichever is greater","A minimum of 100mm, or 0.5x the length of the terminal, whichever is greater","A minimum of 150mm in all cases","A minimum of 75mm, or 0.25x the length of the terminal, whichever is less"],"correct":0,"explanation":"Clause 6.8.7.2 requires terminals to be built into the top of the masonry to a minimum of 125mm or 0.25x the length of the terminal, whichever is the greater, and sealed to the flue liner.","ref":"6.8.7.2"},{"id":"6.8-06","chapter":"6.8","chapterTitle":"Fireplaces, chimneys and flues","part":"Superstructure (excluding roofs)","question":"What is the minimum distance a chimney capping drip should project from the chimney face to shed water clear of the masonry?","options":["20mm","25mm","30mm","40mm"],"correct":2,"explanation":"Clause 6.8.7.3 requires chimney cappings to have a drip at least 30mm from the chimney face to shed water clear of the masonry.","ref":"6.8.7.3"},{"id":"6.8-07","chapter":"6.8","chapterTitle":"Fireplaces, chimneys and flues","part":"Superstructure (excluding roofs)","question":"Where a long gas flue pipe needs support, how should the supports be arranged?","options":["Directly above each socket, at a maximum spacing of 2.4m","At every joint, at a maximum spacing of 1.2m","Midway between sockets, at a maximum spacing of 1.5m","Directly below each socket, at a maximum spacing of 1.8m"],"correct":3,"explanation":"Clause 6.8.10.1 states that long gas flue pipes should have support directly below each socket, with a maximum spacing of 1.8m.","ref":"6.8.10.1"},{"id":"6.8-08","chapter":"6.8","chapterTitle":"Fireplaces, chimneys and flues","part":"Superstructure (excluding roofs)","question":"A subcontractor proposes using a flexible flue liner in the chimney of a new build home with a gas appliance. What does the standard say?","options":["It is acceptable if the liner complies with BS EN 1856","Flexible flue liners are not acceptable in a new build","It is acceptable for gas appliances but not solid fuel","It is acceptable if assessed in accordance with Technical Requirement R3"],"correct":1,"explanation":"Clause 6.8.11.1 states that flexible flue liners are not acceptable in a new build; the same position applies to liquid fuel installations under Clause 6.8.16.3.","ref":"6.8.11.1"},{"id":"6.8-09","chapter":"6.8","chapterTitle":"Fireplaces, chimneys and flues","part":"Superstructure (excluding roofs)","question":"In the absence of specific guidance from the appliance manufacturer, at what height above ground does BS 5440-1 advise a gas flue terminal should be guarded?","options":["Less than 2m above ground","Less than 2.5m above ground","Less than 3m above ground","Less than 1.5m above ground"],"correct":0,"explanation":"Clause 6.8.12 notes BS 5440-1 advises that terminals less than 2m above ground, above a balcony, or above a flat roof which people have access to, should be guarded.","ref":"6.8.12"},{"id":"6.8-10","chapter":"6.8","chapterTitle":"Fireplaces, chimneys and flues","part":"Superstructure (excluding roofs)","question":"Where combustible material below a constructional hearth is separated from the underside of the hearth by an air space, what is the minimum air space required?","options":["25mm","40mm","50mm","75mm"],"correct":2,"explanation":"Clause 6.8.18 states combustible material should not be placed under a constructional hearth unless it supports the hearth edges, is at least 250mm from the material to the top of the hearth, or is separated from the underside of the hearth by an air space of at least 50mm.","ref":"6.8.18"},{"id":"6.8-11","chapter":"6.8","chapterTitle":"Fireplaces, chimneys and flues","part":"Superstructure (excluding roofs)","question":"On site you find a heavy stone fireplace surround being fixed to the wall using adhesive only. What does the standard require?","options":["Adhesive fixing is acceptable if the manufacturer approves it","Adhesive fixing is acceptable on solid masonry walls only","Adhesive fixing is acceptable provided the surround is in one piece","Adhesive-only fixing is not acceptable; mechanical fixings must be used"],"correct":3,"explanation":"Clause 6.8.19 states that methods relying solely on adhesive for fixing fireplace surrounds to the structure are not acceptable; surrounds should be fixed using mechanical fixings, generally of stainless steel to BS EN ISO 3506-1.","ref":"6.8.19"},{"id":"6.8-12","chapter":"6.8","chapterTitle":"Fireplaces, chimneys and flues","part":"Superstructure (excluding roofs)","question":"Where masonry density is at least 1,500kg/m3, what is the maximum height of an unrestrained chimney unless designed by an engineer?","options":["4.5x the smallest plan dimension of the chimney","3.5x the smallest plan dimension of the chimney","5x the smallest plan dimension of the chimney","6x the smallest plan dimension of the chimney"],"correct":0,"explanation":"Clause 6.8.23.1 states the height of an unrestrained chimney should not exceed 4.5x the smallest plan dimension (where masonry density is a minimum of 1,500kg/m3), or it should be designed by an engineer in accordance with Technical Requirement R5.","ref":"6.8.23.1"},{"id":"6.8-13","chapter":"6.8","chapterTitle":"Fireplaces, chimneys and flues","part":"Superstructure (excluding roofs)","question":"Unless the manufacturer recommends otherwise, what should the space between flue liners and the surrounding masonry be filled with?","options":["Ordinary structural concrete","Weak insulating concrete","Dry sharp sand","Nothing - it should be left as an air void"],"correct":1,"explanation":"Clause 6.8.21 requires spaces between the lining and the surrounding masonry to be filled with weak insulating concrete (or in accordance with the manufacturer's recommendations); ordinary concrete should not be used.","ref":"6.8.21"},{"id":"6.9-01","chapter":"6.9","chapterTitle":"Curtain walling and cladding","part":"Superstructure (excluding roofs)","question":"When should certification and test documentation for a curtain walling or cladding system be made available to NHBC?","options":["At handover of the completed building","Within 28 days of completing the installation","Before work begins on site","Only if NHBC requests it during construction"],"correct":2,"explanation":"Clause 6.9.3 requires certification and test documentation to be made available to NHBC before work begins on site and used as reference to ensure compliance.","ref":"6.9.3"},{"id":"6.9-02","chapter":"6.9","chapterTitle":"Curtain walling and cladding","part":"Superstructure (excluding roofs)","question":"On site you notice aluminium cladding components being installed in direct contact with a concrete structure. What does the standard require?","options":["Aluminium components should be separated from direct contact with cementitious surfaces","Direct contact is acceptable if the aluminium is powder coated","Direct contact is acceptable provided the concrete is fully cured","The aluminium should be replaced with galvanised mild steel"],"correct":0,"explanation":"Clause 6.9.5 requires fixings and supports to be installed ensuring aluminium components are separated from direct contact with cementitious surfaces, and dissimilar metals separated to avoid bimetallic corrosion.","ref":"6.9.5"},{"id":"6.9-03","chapter":"6.9","chapterTitle":"Curtain walling and cladding","part":"Superstructure (excluding roofs)","question":"For what minimum period should secondary components of a curtain walling or cladding system, such as seals and gaskets, provide satisfactory in-service performance?","options":["10 years","15 years","20 years","25 years"],"correct":3,"explanation":"Clause 6.9.6 requires secondary components to provide satisfactory in-service performance for a minimum of 25 years; primary components should perform for the design life of the building.","ref":"6.9.6"},{"id":"6.9-04","chapter":"6.9","chapterTitle":"Curtain walling and cladding","part":"Superstructure (excluding roofs)","question":"Where rainscreen cladding insulation is fixed to the backing wall, what non-combustible fixing provision is required in addition to the other fixings?","options":["A minimum of one non-combustible fixing per 2m2","A minimum of one non-combustible fixing per 1m2 or per insulation batt, whichever is the lesser","A minimum of two non-combustible fixings per insulation batt in all cases","Non-combustible fixings are only needed where adhesive is not used"],"correct":1,"explanation":"Clause 6.9.8 requires, for rainscreen cladding, a minimum of one non-combustible fixing per 1m2 or per insulation batt, whichever is the lesser, in addition to the other fixings.","ref":"6.9.8"},{"id":"6.9-05","chapter":"6.9","chapterTitle":"Curtain walling and cladding","part":"Superstructure (excluding roofs)","question":"In areas of very severe exposure, what breather membrane should be used behind cladding?","options":["Type 2 to BS EN 13859-2","Type 3 to BS EN 13859-2","Type 1 to BS EN 13859-2","Any polyethylene sheet to BS 6515"],"correct":2,"explanation":"Clause 6.9.9 states breather membranes should comply with BS EN 13859-2:2014 (Type 1 in areas of very severe exposure) or be in accordance with Technical Requirement R3.","ref":"6.9.9"},{"id":"6.9-06","chapter":"6.9","chapterTitle":"Curtain walling and cladding","part":"Superstructure (excluding roofs)","question":"Above what opening size should a screen be provided to prevent birds and animals entering the cladding cavity?","options":["4mm","6mm","8mm","10mm"],"correct":3,"explanation":"Clause 6.9.15 requires a screen where openings are larger than 10mm, provided in accordance with the design, at the top and bottom of the rainscreen and at penetrations through the cladding.","ref":"6.9.15"},{"id":"6.9-07","chapter":"6.9","chapterTitle":"Curtain walling and cladding","part":"Superstructure (excluding roofs)","question":"Air and water testing of a prototype curtain walling system should be carried out to the CWCT Standard test sequence up to what maximum test pressure?","options":["600 pascals","450 pascals","1,200 pascals","2,400 pascals"],"correct":0,"explanation":"Clause 6.9.17.6 requires the prototype to pass the CWCT Standard test sequence (A or B) up to a maximum test pressure of 600 pascals, increased to 0.25x the design wind pressure where that pressure exceeds 2.4 kPa.","ref":"6.9.17.6"},{"id":"6.9-08","chapter":"6.9","chapterTitle":"Curtain walling and cladding","part":"Superstructure (excluding roofs)","question":"What minimum proportion of a completed curtain walling system should be hose tested on site for resistance to water penetration?","options":["2%","5%","10%","15%"],"correct":1,"explanation":"Clause 6.9.17.7 requires a minimum of 5% of the completed curtain walling system to be tested, especially in vulnerable areas such as joints and interfaces, with results made available to NHBC.","ref":"6.9.17.7"},{"id":"6.9-09","chapter":"6.9","chapterTitle":"Curtain walling and cladding","part":"Superstructure (excluding roofs)","question":"What is the minimum air gap width required behind rainscreen panels with open joints?","options":["25mm","38mm","50mm","75mm"],"correct":2,"explanation":"Clause 6.9.18.2 requires a minimum 50mm air gap behind panels with open joints, or 38mm behind panels with baffled or labyrinth (rebated) joints.","ref":"6.9.18.2"},{"id":"6.9-10","chapter":"6.9","chapterTitle":"Curtain walling and cladding","part":"Superstructure (excluding roofs)","question":"In a pressure-equalised rainscreen cavity, what is the maximum spacing of vertical cavity closers within 6m of an internal or external corner?","options":["300mm","6.0m","3.0m","1.5m"],"correct":3,"explanation":"Clause 6.9.18.5 requires vertical cavity closers at centres not exceeding 1.5m within 6m of an internal or external corner; elsewhere centres should not exceed 6m, with a closer generally within 300mm of an external corner.","ref":"6.9.18.5"},{"id":"6.9-11","chapter":"6.9","chapterTitle":"Curtain walling and cladding","part":"Superstructure (excluding roofs)","question":"For an insulated render system on a timber framed backing wall, what cavity is required between the wall and the insulation?","options":["A minimum 15mm cavity, drained and vented","A minimum 10mm cavity, drained only","A minimum 25mm cavity, vented only","A minimum 50mm cavity, drained and vented"],"correct":0,"explanation":"Clause 6.9.19.1 requires timber and steel framed backing walls to have a cavity a minimum of 15mm wide, which is drained and vented for timber frame (drained only for steel frame).","ref":"6.9.19.1"},{"id":"6.9-12","chapter":"6.9","chapterTitle":"Curtain walling and cladding","part":"Superstructure (excluding roofs)","question":"What is the minimum lap for reinforcement mesh in an insulated render system?","options":["50mm","100mm","150mm","200mm"],"correct":1,"explanation":"Clause 6.9.19.4 requires reinforcement to be lapped to a minimum of 100mm, with additional mesh where increased stress may occur, such as at the corners of window or door openings.","ref":"6.9.19.4"},{"id":"6.10-01","chapter":"6.10","chapterTitle":"Light steel framed walls and floors","part":"Superstructure (excluding roofs)","question":"Who must carry out the Stage 2 project certification check on the design of primary structural components formed from light steel frame?","options":["The steel frame manufacturer's in-house design engineer","An NHBC registered LSF certifier","The local authority building control officer","The Steel Construction Institute (SCI)"],"correct":1,"explanation":"Clause 6.10.3 requires the design of all primary structural components to be subject to a Stage 2 certification check by an NHBC registered LSF certifier, who must not be the designer of the LSF or employed by the same practice. SCI carries out the Stage 1 system certification, not Stage 2.","ref":"6.10.3"},{"id":"6.10-02","chapter":"6.10","chapterTitle":"Light steel framed walls and floors","part":"Superstructure (excluding roofs)","question":"What is the typical maximum spacing of light steel floor joists, unless a greater spacing is justified by an engineer or a system-specific assessment?","options":["400mm","450mm","600mm","900mm"],"correct":2,"explanation":"Clause 6.10.4.1 states floors should have a typical maximum joist spacing of 600mm, although greater spacings may be applied when designed by an engineer in accordance with Technical Requirement R5 or covered by an SCI system-specific Stage 1 assessment.","ref":"6.10.4.1"},{"id":"6.10-03","chapter":"6.10","chapterTitle":"Light steel framed walls and floors","part":"Superstructure (excluding roofs)","question":"What is the minimum depth of the ventilated void required below a light steel ground floor on a normal (non-shrinkable) site?","options":["150mm","225mm","100mm","125mm"],"correct":0,"explanation":"Clause 6.10.4.1 requires light steel ground floors to have a 150mm minimum void below the floor, ventilated by openings on at least two opposite sides.","ref":"6.10.4.1"},{"id":"6.10-04","chapter":"6.10","chapterTitle":"Light steel framed walls and floors","part":"Superstructure (excluding roofs)","question":"You are building light steel ground floors on shrinkable soil assessed as having high volume change potential. What total underfloor void depth does the standard require?","options":["150mm","200mm","250mm","300mm"],"correct":3,"explanation":"Clause 6.10.4.1 states that where heave can occur in shrinkable soil of high potential, the minimum underfloor void should be increased by 150mm, giving 300mm total (medium potential is 250mm total and low potential 200mm total).","ref":"6.10.4.1"},{"id":"6.10-05","chapter":"6.10","chapterTitle":"Light steel framed walls and floors","part":"Superstructure (excluding roofs)","question":"What is the minimum zinc coating required for pre-galvanized light steel framing members in normal locations?","options":["450g/m²","275g/m²","150g/m²","600g/m²"],"correct":1,"explanation":"Clause 6.10.7.2 requires all steel to be pre-galvanized in accordance with BS EN 10346 with a minimum 275g/m² zinc coating (or 150g/m² aluminium-zinc alloy coating). The higher 450g/m² figure applies to ground floor joists and ring beams 150mm or more above ground level.","ref":"6.10.7.2"},{"id":"6.10-06","chapter":"6.10","chapterTitle":"Light steel framed walls and floors","part":"Superstructure (excluding roofs)","question":"On site, a plumber asks to cut a notch part-way along the span of a light steel floor joist to run a pipe. What does the standard say?","options":["Notches are not acceptable anywhere in the span; only end notching for interconnecting trimming joists is permitted, in accordance with the design","It is acceptable provided a grommet is fitted to protect the pipe","It is acceptable if the notch is no deeper than a quarter of the joist depth","It is acceptable with the site manager's written approval"],"correct":0,"explanation":"Clause 6.10.7.4 states end notching of light steel joists may be required for the interconnection of trimming joists and should be in accordance with the design, but notches elsewhere in the span are not acceptable.","ref":"6.10.7.4"},{"id":"6.10-07","chapter":"6.10","chapterTitle":"Light steel framed walls and floors","part":"Superstructure (excluding roofs)","question":"Where restraint straps are needed and joists run parallel to the wall, how should the straps be arranged?","options":["Maximum 2m apart and carried over two joists","Maximum 1.2m apart and carried over three joists","Maximum 2m apart and carried over three joists","Maximum 1.5m apart and carried over two joists"],"correct":2,"explanation":"Clause 6.10.9 states straps should be placed at a maximum of 2m apart and carried over three joists, supported on noggings fixed between the joists, with packing between the wall and the first joist.","ref":"6.10.9"},{"id":"6.10-08","chapter":"6.10","chapterTitle":"Light steel framed walls and floors","part":"Superstructure (excluding roofs)","question":"When erecting wall frames you find a 15mm gap under the base rail. What packing does the standard require?","options":["Steel shims under each stud position only","Cement:sand grout under the base rail only","Stop work and obtain advice from the frame designer or manufacturer","Shims under each stud position plus cement:sand grout under the whole length of the base rail"],"correct":3,"explanation":"Table 5 in Clause 6.10.10.1 states that for gaps of 10-20mm, shims should be provided under each stud position and the whole length of the base rail grouted with cement:sand mortar. Frame designer advice is only needed for gaps over 20mm.","ref":"6.10.10.1"},{"id":"6.10-09","chapter":"6.10","chapterTitle":"Light steel framed walls and floors","part":"Superstructure (excluding roofs)","question":"Where frame anchor fixings go into masonry, what is the minimum crushing strength of the solid concrete blocks that must receive them?","options":["3.6N/mm²","7.3N/mm²","2.9N/mm²","10.4N/mm²"],"correct":1,"explanation":"Clause 6.10.10.2 requires that where fixings are into masonry, they are into solid concrete blocks with a minimum crushing strength of 7.3N/mm² and positioned to receive the fixings.","ref":"6.10.10.2"},{"id":"6.10-10","chapter":"6.10","chapterTitle":"Light steel framed walls and floors","part":"Superstructure (excluding roofs)","question":"What is the minimum thickness of moisture-resistant P5 chipboard floor decking on light steel joists at 600mm centres for domestic loads?","options":["18mm","15mm","22mm","25mm"],"correct":2,"explanation":"Table 6 in Clause 6.10.12 requires BS EN 312 moisture-resistant type P5 chipboard to be a minimum of 22mm thick at 600mm joist centres (18mm is only sufficient at 400mm centres).","ref":"6.10.12"},{"id":"6.10-11","chapter":"6.10","chapterTitle":"Light steel framed walls and floors","part":"Superstructure (excluding roofs)","question":"What is the minimum clear cavity width required between the insulation and masonry cladding on a light steel framed wall?","options":["25mm","50mm","75mm","15mm"],"correct":1,"explanation":"Table 8 in Clause 6.10.16.1 requires a minimum 50mm clear cavity for masonry cladding; render on board background needs 25mm and other cladding 15mm.","ref":"6.10.16.1"},{"id":"6.10-12","chapter":"6.10","chapterTitle":"Light steel framed walls and floors","part":"Superstructure (excluding roofs)","question":"As a general rule, what is the minimum height the base rail of a light steel frame should be kept above external ground level?","options":["150mm","100mm","75mm","225mm"],"correct":0,"explanation":"Clause 6.10.16.2 requires the base rail of LSF to be kept a minimum of 150mm above the external ground level (or waterproofing layer of a flat roof, balcony or terrace) and cavity fill; going lower needs enhanced protection such as 600g/m² galvanizing.","ref":"6.10.16.2"},{"id":"6.10-13","chapter":"6.10","chapterTitle":"Light steel framed walls and floors","part":"Superstructure (excluding roofs)","question":"What is the minimum density of wall ties for masonry cladding tied to a light steel frame?","options":["2.5 ties per m²","4.4 ties per m²","7.0 ties per m²","3.7 ties per m²"],"correct":3,"explanation":"Clause 6.10.21 requires wall ties for masonry cladding to be installed at a minimum density of 3.7 ties/m², for example spaced at a maximum of 600mm horizontally and 450mm vertically, unless an alternative density is justified by building-specific calculation under the Stage 2 certificate.","ref":"6.10.21"},{"id":"6.11-01","chapter":"6.11","chapterTitle":"Render","part":"Superstructure (excluding roofs)","question":"You are applying site-mixed render on a cold morning with no manufacturer's guidance available. What air temperature condition must be met?","options":["At least 3°C and steady","Above 0°C at the time of application","At least 5°C and rising, checked throughout the day on a thermometer","At least 8°C for the full working day"],"correct":2,"explanation":"Clause 6.11.3 states that where no manufacturer's guidance is available, or when using site-mixed render, the air temperature should be at least 5°C and rising, with temperatures checked throughout the day on a thermometer.","ref":"6.11.3"},{"id":"6.11-02","chapter":"6.11","chapterTitle":"Render","part":"Superstructure (excluding roofs)","question":"When a spatterdash coat is dashed onto a smooth masonry background to provide a key, what thickness should the rough texture be?","options":["Approximately 3-7mm","Approximately 1-2mm","Approximately 8-12mm","Approximately 10-15mm"],"correct":0,"explanation":"Clause 6.11.4.1 states a spatterdash coat typically comprises cement and sand at 1:3 mixed with water and often a bonding agent, applied by dashing onto the background to give a rough texture approximately 3-7mm thick.","ref":"6.11.4.1"},{"id":"6.11-03","chapter":"6.11","chapterTitle":"Render","part":"Superstructure (excluding roofs)","question":"A plot in a severe exposure zone has an external leaf of F2,S1 clay bricks and the cavity is designed to be fully filled with insulation. What does the standard say about rendering this wall?","options":["It is permitted provided a spatterdash coat is applied first","It is permitted if a designation ii (M6) render mix is used","It is permitted where the bricks have a water absorption of 9% to 15%","It is not permitted"],"correct":3,"explanation":"Clause 6.11.4.2 states render on an external leaf of clay bricks (F2,S1 or F1,S1 designation to BS EN 771) in severe or very severe exposures is not permitted where the cavity is to be fully filled with insulation.","ref":"6.11.4.2"},{"id":"6.11-04","chapter":"6.11","chapterTitle":"Render","part":"Superstructure (excluding roofs)","question":"To reduce localised cracking of render around openings, where should austenitic stainless steel bed joint reinforcement be placed in the external masonry leaf?","options":["In the first course above the opening only, projecting 300mm beyond it","In the first two courses above and below the opening, projecting 600mm beyond it where possible","In every third course for the full height of the wall","In the first two courses above the opening only, projecting 450mm beyond it"],"correct":1,"explanation":"Clause 6.11.5.1 requires bed joint reinforcement to BS EN 845-3 in the first two courses of the external masonry leaf above and below any opening to help distribute tensile stress, projecting 600mm beyond the opening where possible.","ref":"6.11.5.1"},{"id":"6.11-05","chapter":"6.11","chapterTitle":"Render","part":"Superstructure (excluding roofs)","question":"To avoid cracking, ribbed metal lath backgrounds should be divided by movement joints into bays no wider than what?","options":["6m","3m","5m","9m"],"correct":2,"explanation":"Clause 6.11.5.3 requires ribbed metal lath backgrounds to be divided with movement joints into bays no more than 5m wide, positioned at every storey height for timber framed backgrounds or a maximum of 5m vertically for other backgrounds.","ref":"6.11.5.3"},{"id":"6.11-06","chapter":"6.11","chapterTitle":"Render","part":"Superstructure (excluding roofs)","question":"What is the basic rule on the relative strength of render coats?","options":["Coats should not be stronger than the background or any previous coat they are applied to","Each coat should be stronger than the one before to build up durability","All coats should be exactly the same strength as the background","Only the final coat needs to be weaker than the background"],"correct":0,"explanation":"Clause 6.11.6 states render coats should not be stronger than the background or any previous coat to which they are applied; weaker coats can be achieved by reducing cement content or decreasing coat thickness.","ref":"6.11.6"},{"id":"6.11-07","chapter":"6.11","chapterTitle":"Render","part":"Superstructure (excluding roofs)","question":"What is the minimum nominal total finished thickness of site-made render in severe and very severe exposure zones?","options":["16mm","13mm","20mm","25mm"],"correct":2,"explanation":"Clause 6.11.6.4 requires render to have a nominal total finished thickness of not less than 20mm in severe and very severe exposure zones (16mm applies in sheltered and moderate zones).","ref":"6.11.6.4"},{"id":"6.11-08","chapter":"6.11","chapterTitle":"Render","part":"Superstructure (excluding roofs)","question":"The design shows site-made render continuing below the DPC. What precaution does the standard require for the mix?","options":["Use a weaker designation iv (M2) mix to accommodate movement","Use the standard wall mix but apply it thicker","Use a designation i (M12) mix for maximum durability","Use a stronger M4 mix that is sulfate resisting"],"correct":3,"explanation":"Clause 6.11.7.7 states it is preferable to stop render at DPC level, but where it continues below the DPC, site-made render should use a stronger mix (M4) that is sulfate resisting, or factory-made render in accordance with the manufacturer's recommendations.","ref":"6.11.7.7"},{"id":"6.11-09","chapter":"6.11","chapterTitle":"Render","part":"Superstructure (excluding roofs)","question":"When rendering onto a board background, what reinforcement does the render require?","options":["Galvanized steel mesh at the board joints only","Alkali-resistant mesh embedded into the base coat across the whole surface","Stainless steel mesh around openings only","No mesh is needed provided the boards are external grade"],"correct":1,"explanation":"Clause 6.11.8.6 requires render on board backgrounds to have alkali-resistant mesh embedded into the base coat across the whole surface.","ref":"6.11.8.6"},{"id":"7.1-01","chapter":"7.1","chapterTitle":"Flat roofs, terraces and balconies","part":"Roofs","question":"According to the chapter definitions, a flat roof is a roof with a maximum slope from the horizontal of how many degrees?","options":["5 degrees","10 degrees","12.5 degrees","15 degrees"],"correct":1,"explanation":"The definitions in Chapter 7.1 state that a flat roof is a roof with a maximum slope of 10 degrees from the horizontal.","ref":"7.1 (Definitions)"},{"id":"7.1-02","chapter":"7.1","chapterTitle":"Flat roofs, terraces and balconies","part":"Roofs","question":"Where a flat roof or terrace abuts a wall, what is the normal minimum height of the waterproofing upstand, measured from the drainage layer?","options":["75mm","100mm","150mm","225mm"],"correct":2,"explanation":"Clause 7.1.16 states the waterproofing layer should extend up the wall to form a minimum 150mm upstand measured from the balcony/terrace drainage layer; this may be reduced to 75mm only at an accessible threshold.","ref":"7.1.16"},{"id":"7.1-03","chapter":"7.1","chapterTitle":"Flat roofs, terraces and balconies","part":"Roofs","question":"Where a flat roof, balcony or terrace has an upstand on all sides, what is the minimum drainage provision?","options":["Two outlets connected to separate downpipes, or one outlet plus an overflow","A single outlet of increased diameter","One outlet plus a second outlet on the same downpipe","An edge drainage slot on at least two sides"],"correct":0,"explanation":"Clause 7.1.4.1 requires that where there is an upstand on all sides, drainage should consist of a minimum of two outlets connected to separate downpipes, or one outlet plus an overflow.","ref":"7.1.4.1"},{"id":"7.1-04","chapter":"7.1","chapterTitle":"Flat roofs, terraces and balconies","part":"Roofs","question":"Where tapered insulation is used to form the falls, what is the minimum design fall the insulation manufacturer should design to?","options":["1:20","1:30","1:40","1:60"],"correct":3,"explanation":"Clause 7.1.4.2 states that where tapered insulation is used, drainage should be designed by the insulation manufacturer with design falls of no less than 1:60.","ref":"7.1.4.2"},{"id":"7.1-05","chapter":"7.1","chapterTitle":"Flat roofs, terraces and balconies","part":"Roofs","question":"What is the minimum size of firring pieces used to form falls where joists are at 600mm centres?","options":["38mm wide x 38mm deep","38mm wide x 50mm deep","50mm wide x 50mm deep","50mm wide x 75mm deep"],"correct":1,"explanation":"Table 1 in Clause 7.1.4.2 gives a minimum width of 38mm and minimum depth of 50mm for firring pieces at 600mm joist centres (38mm x 38mm applies at 400 or 450mm centres).","ref":"7.1.4.2"},{"id":"7.1-06","chapter":"7.1","chapterTitle":"Flat roofs, terraces and balconies","part":"Roofs","question":"What is the suggested design fall for a flat roof waterproofed with a membrane or liquid applied waterproofing?","options":["1:80","1:60","1:40","1:20"],"correct":2,"explanation":"Table 2 in Clause 7.1.4.2 gives a design fall of 1:40 for membrane and liquid applied waterproofing, with a minimum finished fall of 1:80.","ref":"7.1.4.2"},{"id":"7.1-07","chapter":"7.1","chapterTitle":"Flat roofs, terraces and balconies","part":"Roofs","question":"What is NHBC's position on zero fall roofs?","options":["They are not accepted for roofs with exposed waterproofing layers","They are accepted on any roof if outlets are placed at points of maximum deflection","They are accepted for membrane roofs under 50m² in area","They are accepted provided the design fall is doubled elsewhere on the roof"],"correct":0,"explanation":"Clause 7.1.4.3 states that zero falls are not accepted for roofs with exposed waterproofing layers; such roofs should be designed to the falls shown in Table 2.","ref":"7.1.4.3"},{"id":"7.1-08","chapter":"7.1","chapterTitle":"Flat roofs, terraces and balconies","part":"Roofs","question":"Before the waterproofing layer is laid, who should carry out the site survey of the deck to identify any backfalls?","options":["The specialist waterproofing contractor","The deck erector","The NHBC building inspector","The structural engineer"],"correct":1,"explanation":"Clause 7.1.4.4 requires a site survey of the deck to be carried out by the deck erector prior to laying the waterproofing layer, with a formal handover procedure between the deck erector and the specialist waterproofing contractor.","ref":"7.1.4.4"},{"id":"7.1-09","chapter":"7.1","chapterTitle":"Flat roofs, terraces and balconies","part":"Roofs","question":"What size should holding-down straps be where they are required to prevent a timber flat roof lifting from the supporting structure?","options":["30mm x 2.5mm and 1m long","25mm x 2mm and 800mm long","30mm x 5mm and 1.5m long","50mm x 3mm and 1.2m long"],"correct":0,"explanation":"Clause 7.1.6.2 states holding-down straps should be 30mm x 2.5mm and 1m long, spaced at a maximum of 2m centres at the perimeters, with the lowest fixing within 150mm of the bottom of the vertical strap.","ref":"7.1.6.2"},{"id":"7.1-10","chapter":"7.1","chapterTitle":"Flat roofs, terraces and balconies","part":"Roofs","question":"Where timber joists or concrete beam/roof elements provide lateral restraint to support walls, what minimum bearing should they have?","options":["75mm","90mm","100mm","150mm"],"correct":1,"explanation":"Clause 7.1.5 states that joists or concrete beams providing lateral restraint should have a minimum bearing of 90mm, or restraint straps at maximum 2m centres where they run parallel to walls.","ref":"7.1.5"},{"id":"7.1-11","chapter":"7.1","chapterTitle":"Flat roofs, terraces and balconies","part":"Roofs","question":"What minimum service life should the structural elements of a balcony have?","options":["30 years","50 years","60 years","80 years"],"correct":2,"explanation":"Clause 7.1.6.1 states that structural elements of balconies should have a service life of at least 60 years.","ref":"7.1.6.1"},{"id":"7.1-12","chapter":"7.1","chapterTitle":"Flat roofs, terraces and balconies","part":"Roofs","question":"A design shows timber posts supporting a projecting balcony. What does the standard say about this?","options":["Timber should not be used for posts or columns supporting a balcony","It is acceptable if the timber is preservative treated","It is acceptable if the posts are inspected annually","It is acceptable provided the posts are oversized by 25%"],"correct":0,"explanation":"Clause 7.1.6.1 states timber should not be used for posts or columns supporting a balcony, nor for gallows brackets, guardrails, infill joists or cantilevered joists or decks.","ref":"7.1.6.1"},{"id":"7.1-13","chapter":"7.1","chapterTitle":"Flat roofs, terraces and balconies","part":"Roofs","question":"On site, flat roof joists need packing to bring them level. What packing does the standard permit?","options":["Timber offcuts nailed to the wall plate","Strips of DPC folded to the required thickness","Plastic shims pushed in dry","Hard packing such as tiles or slates bedded in mortar"],"correct":3,"explanation":"Clause 7.1.6.1 states joists should be levelled where necessary using hard packing such as tiles or slates bedded in mortar; loose or soft packing, including timber, should not be used.","ref":"7.1.6.1"},{"id":"7.1-14","chapter":"7.1","chapterTitle":"Flat roofs, terraces and balconies","part":"Roofs","question":"What is the minimum thickness of OSB3 deck boarding for a flexible membrane roof covering where joists are at 600mm centres?","options":["12mm","15mm","18mm","22mm"],"correct":2,"explanation":"Table 3 in Clause 7.1.6.1 requires oriented strand board type OSB3 to be a minimum of 18mm thick at 600mm joist centres (15mm at 450mm centres).","ref":"7.1.6.1"},{"id":"7.1-15","chapter":"7.1","chapterTitle":"Flat roofs, terraces and balconies","part":"Roofs","question":"Which timber species should be avoided in plywood decking used under a lead roof covering?","options":["Oak, Douglas fir and Western red cedar","Yellow pine and maritime pine","Spruce and European larch","Sweet chestnut and beech"],"correct":0,"explanation":"Table 5 (note 1) in Clause 7.1.6.1 states that oak, Douglas fir and Western red cedar should be avoided in plywood decking for lead roof coverings (yellow and maritime pine are to be avoided under hard metal coverings).","ref":"7.1.6.1"},{"id":"7.1-16","chapter":"7.1","chapterTitle":"Flat roofs, terraces and balconies","part":"Roofs","question":"Flat roof joists span 3.5m. How many rows of strutting are needed?","options":["One row at the centre of the span","None, strutting is only needed over 4.5m","Two rows equally spaced along the span","Three rows at quarter points of the span"],"correct":0,"explanation":"Table 6 in Clause 7.1.6.2 requires one row of strutting at the centre of the span for joist spans between 2.5m and 4.5m; two rows are needed over 4.5m.","ref":"7.1.6.2"},{"id":"7.1-17","chapter":"7.1","chapterTitle":"Flat roofs, terraces and balconies","part":"Roofs","question":"What minimum movement gap should be left where plywood or OSB deck boards abut a rigid upstand?","options":["3mm","5mm","10mm","15mm"],"correct":2,"explanation":"Clause 7.1.6.3 requires a minimum movement gap of 10mm (or 2mm per metre of boarding, whichever is the greater) where boards abut a rigid upstand.","ref":"7.1.6.3"},{"id":"7.1-18","chapter":"7.1","chapterTitle":"Flat roofs, terraces and balconies","part":"Roofs","question":"A designer proposes cross laminated timber (CLT) panels as the deck for a warm flat roof. What is NHBC's position?","options":["Acceptable if the panels are covered within 24 hours","Acceptable with a third-party assessed coating to each panel","Acceptable only on roofs under 10 degrees pitch","CLT panels are not accepted for flat roof construction"],"correct":3,"explanation":"Clause 7.1.6.3 states that due to the semi-impervious nature of CLT panels and the risk of trapping moisture during construction, they are not accepted for flat roof construction.","ref":"7.1.6.3"},{"id":"7.1-19","chapter":"7.1","chapterTitle":"Flat roofs, terraces and balconies","part":"Roofs","question":"At approximately what intervals should precast concrete decks have an allowance for movement?","options":["Every 10m","Every 15m","Every 20m","Every 30m"],"correct":1,"explanation":"Clause 7.1.7.1 states precast concrete decks should have allowance for movement approximately every 15m and at abutments.","ref":"7.1.7.1"},{"id":"7.1-20","chapter":"7.1","chapterTitle":"Flat roofs, terraces and balconies","part":"Roofs","question":"What is the nominal thickness of a 1:4 cement:sand screed laid unbonded on a separating layer to form falls on a concrete roof?","options":["40mm","55mm","70mm","90mm"],"correct":2,"explanation":"Table 7 in Clause 7.1.7.2 gives a nominal thickness of 70mm (50mm minimum) for a screed laid unbonded on a separating layer; a bonded screed is 40mm nominal (25mm minimum).","ref":"7.1.7.2"},{"id":"7.1-21","chapter":"7.1","chapterTitle":"Flat roofs, terraces and balconies","part":"Roofs","question":"For a fully bonded waterproofing layer on an in-situ concrete deck, how long does the concrete usually need to dry before it can achieve effective bonding adhesion?","options":["7 days","14 days","21 days","28 days"],"correct":3,"explanation":"Clause 7.1.7.3 states that a bond test should be undertaken to check the concrete is sufficiently dry, which is usually around 28 days for fully bonded waterproofing, or to the manufacturer's recommendations.","ref":"7.1.7.3"},{"id":"7.1-22","chapter":"7.1","chapterTitle":"Flat roofs, terraces and balconies","part":"Roofs","question":"For bonded systems on profiled self-supporting metal flat roof sheeting, the crown width should be at least what proportion of the profile width?","options":["35%","40%","45%","50%"],"correct":2,"explanation":"Clause 7.1.8.2 requires a crown width of at least 45% of the profile width for bonded systems (40% for mechanically fixed systems), not including the crown stiffener grooves.","ref":"7.1.8.2"},{"id":"7.1-23","chapter":"7.1","chapterTitle":"Flat roofs, terraces and balconies","part":"Roofs","question":"On a profiled self-supporting metal roof, what minimum vapour resistance must the AVCL on the warm side of the insulation achieve?","options":["100MNs/g","250MNs/g","500MNs/g","1000MNs/g"],"correct":2,"explanation":"Clause 7.1.9 states the AVCL must be fully sealed around all penetrations and at the roof perimeter, and have a vapour resistance of at least 500MNs/g.","ref":"7.1.9"},{"id":"7.1-24","chapter":"7.1","chapterTitle":"Flat roofs, terraces and balconies","part":"Roofs","question":"Which insulation board is suitable for use in an inverted warm roof without needing an independent third-party assessment?","options":["Polyisocyanurate (PIR) board","Extruded polystyrene (XPS) board","Phenolic foam (PF) board","Cellular glass (CG) board"],"correct":1,"explanation":"Table 8 in Clause 7.1.10.2 shows extruded polystyrene (XPS) as acceptable for inverted warm roofs; PIR and PF are for warm roofs only, and EPS or cellular glass need an independent third-party assessment for inverted use.","ref":"7.1.10.2"},{"id":"7.1-25","chapter":"7.1","chapterTitle":"Flat roofs, terraces and balconies","part":"Roofs","question":"What is the minimum side and end lap for the water flow reducing layer (WFRL) on an inverted warm roof?","options":["100mm","150mm","225mm","300mm"],"correct":3,"explanation":"The note to Clause 7.1.10.2 states all side and end laps of the WFRL should be a minimum of 300mm, with the layer installed at right angles to the designed slope, starting at the bottom of the slope.","ref":"7.1.10.2"},{"id":"7.1-26","chapter":"7.1","chapterTitle":"Flat roofs, terraces and balconies","part":"Roofs","question":"In a cold flat roof, what minimum unobstructed ventilation space is required above the insulation?","options":["25mm","32mm","38mm","50mm"],"correct":3,"explanation":"Clause 7.1.10.3 requires cold flat roofs to have an unobstructed minimum 50mm ventilation space above the insulation, with cross ventilation openings equivalent to a minimum 25mm continuous gap and a maximum 5m between ventilators on opposite sides.","ref":"7.1.10.3"},{"id":"7.1-27","chapter":"7.1","chapterTitle":"Flat roofs, terraces and balconies","part":"Roofs","question":"The air temperature on site is 4°C and the roofers want to lay the waterproofing membrane. What does the standard require?","options":["Carry on, as membranes can be laid at any temperature above freezing","Lay the membrane but double all the laps","Warm the rolls indoors and then install immediately","Do not install the membrane unless otherwise agreed with the manufacturer"],"correct":3,"explanation":"Clause 7.1.11.1 states membranes should not be installed or handled when the product temperature and the air temperature is 5°C or less, unless otherwise agreed with the manufacturer.","ref":"7.1.11.1"},{"id":"7.1-28","chapter":"7.1","chapterTitle":"Flat roofs, terraces and balconies","part":"Roofs","question":"Where shingle ballast is used on an inverted roof, what specification should it meet?","options":["Rounded 20-40mm diameter shingle, minimum 50mm deep","Angular 10-20mm gravel, minimum 40mm deep","Rounded 5-15mm pea gravel, minimum 75mm deep","Crushed 40-60mm stone, minimum 25mm deep"],"correct":0,"explanation":"Clause 7.1.11.1 requires inverted roofs to be ballasted using minimum 40mm paving slabs or 20-40mm diameter rounded shingle ballast a minimum of 50mm deep, subject to any fire protection requirements.","ref":"7.1.11.1"},{"id":"7.1-29","chapter":"7.1","chapterTitle":"Flat roofs, terraces and balconies","part":"Roofs","question":"Above what roof area should the waterproofing layer be subject to an appropriate integrity test by a suitably qualified surveyor, as well as visual inspection?","options":["50m²","25m²","75m²","100m²"],"correct":0,"explanation":"Clause 7.1.11.2 requires waterproofing layers on flat roofs, terraces and balconies greater than 50m², or roofs which are difficult to access (such as on buildings over three storeys), to have a visual inspection and an appropriate integrity test by a suitably qualified surveyor.","ref":"7.1.11.2"},{"id":"7.1-30","chapter":"7.1","chapterTitle":"Flat roofs, terraces and balconies","part":"Roofs","question":"What is the minimum finished fall at the waterproofing layer for a green or biodiverse roof?","options":["1:40","1:60","1:80","1:100"],"correct":1,"explanation":"Clause 7.1.12 requires green and biodiverse roofs to be designed with a finished fall at the waterproofing layer of 1:60 (1 degree) minimum.","ref":"7.1.12"},{"id":"7.1-31","chapter":"7.1","chapterTitle":"Flat roofs, terraces and balconies","part":"Roofs","question":"How should the overflows on a Blue Roof be arranged?","options":["Connected into the main rainwater downpipes","Set below the water attenuation level for early discharge","Omitted, as the flow restrictor outlets act as overflows","Independent of the rainwater drainage system and visible in operation"],"correct":3,"explanation":"Clause 7.1.13 requires Blue Roofs to include overflows independent of the rainwater drainage system to avoid water ingress if the attenuation level is exceeded, with operation of an overflow visible to warn of a potential blockage.","ref":"7.1.13"},{"id":"7.1-32","chapter":"7.1","chapterTitle":"Flat roofs, terraces and balconies","part":"Roofs","question":"At an accessible threshold, what is the maximum upstand height permitted at the door position?","options":["10mm","15mm","20mm","25mm"],"correct":1,"explanation":"Clause 7.1.16 states accessible thresholds should have a maximum 15mm upstand at the threshold measured at the door position, with any transition ramps and sills sloped at no more than 15 degrees.","ref":"7.1.16"},{"id":"7.1-33","chapter":"7.1","chapterTitle":"Flat roofs, terraces and balconies","part":"Roofs","question":"What as-built gap should be provided between individual units of decking or paving on a balcony or terrace to ensure adequate drainage?","options":["6mm-8mm","3mm-5mm","10mm-12mm","15mm-18mm"],"correct":0,"explanation":"Clause 7.1.16 requires as-built gaps of 6mm-8mm between individual units of decking or paving, and 10mm-12mm gaps between the units and perimeter upstands/thresholds.","ref":"7.1.16"},{"id":"7.1-34","chapter":"7.1","chapterTitle":"Flat roofs, terraces and balconies","part":"Roofs","question":"Copings on masonry balcony walls should project at least how far beyond the faces of the wall below?","options":["30mm","45mm","50mm","75mm"],"correct":1,"explanation":"Clause 7.1.18.3 requires copings to project a minimum of 45mm beyond the faces of the wall below and incorporate a drip feature that discharges water at least 30mm away from the face of the wall.","ref":"7.1.18.3"},{"id":"7.1-35","chapter":"7.1","chapterTitle":"Flat roofs, terraces and balconies","part":"Roofs","question":"On site, a subcontractor proposes fixing balustrade posts down through the coping of a parapet wall. What does the standard recommend?","options":["Accept it, provided each fixing is sealed with mastic","Accept it if the coping is GRP rather than concrete","Accept it where the posts are at more than 1m centres","Fix the balustrade to the face of the wall below the coping instead"],"correct":3,"explanation":"Clause 7.1.18.4 states balustrading should not be fixed through a coping or capping because of the difficulty of achieving a waterproof junction and maintaining an imperforate DPC; the issue is avoided by fixing to the face of the wall below the coping or capping.","ref":"7.1.18.4"},{"id":"7.1-36","chapter":"7.1","chapterTitle":"Flat roofs, terraces and balconies","part":"Roofs","question":"Where a balcony or small terrace is edge drained, what is the maximum plan depth of the water collecting surface?","options":["1,500mm","2,000mm","2,500mm","3,000mm"],"correct":2,"explanation":"Clause 7.1.19.2 permits edge drainage of balconies and small/access terraces provided the plan depth of the collecting surface is not more than 2,500mm, with no part of the discharge within 400mm of an adjacent wall.","ref":"7.1.19.2"},{"id":"7.2-01","chapter":"7.2","chapterTitle":"Pitched roofs","part":"Roofs","question":"What is the maximum spacing at which trussed rafters should be evenly spaced?","options":["400mm centres","450mm centres","600mm centres","750mm centres"],"correct":2,"explanation":"Clause 7.2.3.1 states trussed rafters should be evenly spaced at maximum 600mm centres, and the spacing should not be altered without prior consent from the designer.","ref":"7.2.3.1"},{"id":"7.2-02","chapter":"7.2","chapterTitle":"Pitched roofs","part":"Roofs","question":"What is the minimum bearing length for a mono pitched truss into a shoe where the span is 4m or more?","options":["75mm","90mm","100mm","125mm"],"correct":0,"explanation":"Table 1 in Clause 7.2.3.1 gives a minimum bearing length of 75mm for mono pitched trusses spanning 4m or more (50mm where the span is less than 4m).","ref":"7.2.3.1"},{"id":"7.2-03","chapter":"7.2","chapterTitle":"Pitched roofs","part":"Roofs","question":"What is the maximum support spacing for fixing 9.5mm plasterboard to a trussed rafter ceiling?","options":["400mm","450mm","600mm","900mm"],"correct":1,"explanation":"Clause 7.2.3.1 states 9.5mm plasterboard should be fixed at a maximum support spacing of 450mm, while 12.5-15mm plasterboard may be fixed at up to 600mm.","ref":"7.2.3.1"},{"id":"7.2-04","chapter":"7.2","chapterTitle":"Pitched roofs","part":"Roofs","question":"Where raised collar trusses are used as part of a room-in-roof construction, what is the maximum permitted horizontal deflection of the trusses at the supports?","options":["+/- 2mm","+/- 4mm","+/- 6mm","+/- 8mm"],"correct":2,"explanation":"Clause 7.2.3 states that where raised collar trusses are used in room-in-roof construction, the horizontal deflection of the trusses at the supports should be no more than +/- 6mm.","ref":"7.2.3"},{"id":"7.2-05","chapter":"7.2","chapterTitle":"Pitched roofs","part":"Roofs","question":"In a traditional cut roof, what is the typical minimum size for struts, unless designed by an engineer?","options":["75mm x 50mm","100mm x 50mm","100mm x 75mm","125mm x 50mm"],"correct":1,"explanation":"Table 3 in Clause 7.2.3.2 gives a minimum size of 100mm x 50mm for struts, unless designed by an engineer in accordance with Technical Requirement R5.","ref":"7.2.3.2"},{"id":"7.2-06","chapter":"7.2","chapterTitle":"Pitched roofs","part":"Roofs","question":"How should trussed rafters be carried on site to avoid damage?","options":["Flat, to reduce wind resistance while moving them","On their side, supported at mid-span only","Upright, because fasteners can loosen when carried flat","In any orientation, provided the joints are supported"],"correct":2,"explanation":"Clause 7.2.4 states trusses should be carried upright, as fasteners can loosen when trusses are carried flat.","ref":"7.2.4"},{"id":"7.2-07","chapter":"7.2","chapterTitle":"Pitched roofs","part":"Roofs","question":"On site, a trussed rafter needs to be modified to suit a service run. Under what circumstances can a trussed rafter be cut, modified or repaired?","options":["Only if approved verbally by the site manager","Only where the work is witnessed by an NHBC inspector","Only if the truss supplier is notified after the work is done","Only in accordance with written or drawn instructions issued and approved by the trussed rafter designer"],"correct":3,"explanation":"Clause 7.2.4 states trussed rafters should not be cut, modified or repaired, except in accordance with written or drawn instructions issued and approved by the trussed rafter designer.","ref":"7.2.4"},{"id":"7.2-08","chapter":"7.2","chapterTitle":"Pitched roofs","part":"Roofs","question":"Where tiling battens are preservative treated, what desired service life applies under the durability requirements?","options":["15 years","30 years","40 years","60 years"],"correct":3,"explanation":"Table 4 in Clause 7.2.5 requires tiling battens to be preservative treated to Use Class 2 with a desired service life of 60 years, or to be of a naturally durable species.","ref":"7.2.5"},{"id":"7.2-09","chapter":"7.2","chapterTitle":"Pitched roofs","part":"Roofs","question":"What is the minimum length requirement for a wall plate?","options":["A minimum of 2m, or extending over at least two trusses","A minimum of 3m, or extending over at least three joists, rafters or trusses","A minimum of 4m, or extending over at least four joists, rafters or trusses","A minimum of 6m, or extending over at least five trusses"],"correct":1,"explanation":"Clause 7.2.6 states wall plates should be a minimum of 3m or extend over at least three joists, rafters or trusses, and be joined using half-lapped joints, including at corners.","ref":"7.2.6"},{"id":"7.2-10","chapter":"7.2","chapterTitle":"Pitched roofs","part":"Roofs","question":"How far should plain tiles and slates project beyond the gable wall or bargeboard at a verge?","options":["25-38mm","30-60mm","38-50mm","50-75mm"],"correct":2,"explanation":"Clause 7.2.19.2 states plain tiles and slates at the verge should project 38-50mm beyond the gable wall or bargeboard (interlocking tiles project 30-60mm).","ref":"7.2.19.2"},{"id":"7.2-11","chapter":"7.2","chapterTitle":"Pitched roofs","part":"Roofs","question":"Where a roof needs to resist uplift, what is the maximum spacing for holding-down straps fixed to the wall plate?","options":["1m centres","1.2m centres","1.5m centres","2m centres"],"correct":3,"explanation":"Clause 7.2.6 states holding-down straps should be a minimum of 1m long with a cross section of 30mm x 2.5mm and spaced at a maximum of 2m centres.","ref":"7.2.6"},{"id":"7.2-12","chapter":"7.2","chapterTitle":"Pitched roofs","part":"Roofs","question":"What is the purpose of angle ties at the corners of a hipped roof?","options":["To stop the hip rafter deflecting under load","To prevent the wall plates from spreading","To provide a fixing point for the jack rafters","To tie the roof together at purlin level"],"correct":1,"explanation":"Clause 7.2.7 states angle ties should be used at the corners of hipped roofs to prevent the wall plates from spreading; dragon ties are used to prevent heavily loaded hip rafters spreading.","ref":"7.2.7"},{"id":"7.2-13","chapter":"7.2","chapterTitle":"Pitched roofs","part":"Roofs","question":"In aggressive environments such as coastal locations, which fixings are recommended for solar roof panels?","options":["Hot dip galvanized steel fixings","Grade 304 stainless steel fixings","Grade 316 stainless steel fixings","Zinc-plated steel fixings"],"correct":2,"explanation":"Clause 7.2.26.4 recommends grade 316 stainless steel fixings in aggressive environments such as coastal locations.","ref":"7.2.26.4"},{"id":"7.2-14","chapter":"7.2","chapterTitle":"Pitched roofs","part":"Roofs","question":"For homes up to and including three storeys (two storeys in Scotland), what is the maximum spacing of lateral restraint straps?","options":["1.25m","1.5m","2m","2.5m"],"correct":2,"explanation":"Clause 7.2.8 states lateral restraint straps should be at a maximum spacing of 2m for homes up to and including three storeys (two storeys in Scotland); for four storeys or over the maximum is 1.25m.","ref":"7.2.8"},{"id":"7.2-15","chapter":"7.2","chapterTitle":"Pitched roofs","part":"Roofs","question":"What is the minimum anchorage downturn for a lateral restraint strap?","options":["100mm","120mm","150mm","200mm"],"correct":0,"explanation":"Clause 7.2.8 states lateral restraint straps should be a minimum size of 30mm x 5mm and have a minimum anchorage downturn of 100mm, with the downturn fixed on a substantial piece of blockwork.","ref":"7.2.8"},{"id":"7.2-16","chapter":"7.2","chapterTitle":"Pitched roofs","part":"Roofs","question":"What is the minimum timber size for roof bracing to trussed rafter roofs?","options":["75mm x 25mm","89mm x 38mm","97mm x 22mm","100mm x 25mm"],"correct":3,"explanation":"Clause 7.2.9.1 states roof bracing should be provided using a minimum timber size of 100mm x 25mm (3mm tolerance).","ref":"7.2.9.1"},{"id":"7.2-17","chapter":"7.2","chapterTitle":"Pitched roofs","part":"Roofs","question":"How should roof bracing be fixed to the rafters it crosses?","options":["Nailed once to each rafter using 2.65mm x 50mm nails","Nailed twice to each rafter using 3.35mm x 65mm galvanized round wire nails","Screwed once to alternate rafters using 4mm x 50mm screws","Nailed twice to alternate rafters using 3.35mm x 50mm nails"],"correct":1,"explanation":"Clause 7.2.9.1 states bracing should be nailed twice to each rafter it crosses, using 3.35mm x 65mm (10 gauge) galvanized round wire nails or minimum 3.1mm x 75mm mechanically driven gun nails.","ref":"7.2.9.1"},{"id":"7.2-18","chapter":"7.2","chapterTitle":"Pitched roofs","part":"Roofs","question":"On site you are building a large house with trussed rafters spanning 13m. What does the standard require for the roof bracing?","options":["The bracing should be designed by an engineer in accordance with Technical Requirement R5","Standard trussed rafter bracing in accordance with Table 6 of the chapter may be used","Chevron bracing at approximately 45 degrees nailed to three trusses is sufficient","Diagonal bracing may simply be doubled up at each gable end"],"correct":0,"explanation":"Clause 7.2.9 states that for large houses with truss spans of over 12m, homes with complex roofs or roofs near exposed sites, the bracing should be designed by an engineer in accordance with Technical Requirement R5.","ref":"7.2.9"},{"id":"7.2-19","chapter":"7.2","chapterTitle":"Pitched roofs","part":"Roofs","question":"On a duo pitched trussed rafter roof, chevron bracing between the webs should be provided where the span exceeds what dimension?","options":["6m","8m","10m","12m"],"correct":1,"explanation":"Clause 7.2.9.2 states chevron bracing should be provided where the span exceeds 8m, at approximately 45 degrees, nailed to at least three trusses; over 11m span it should be engineer designed.","ref":"7.2.9.2"},{"id":"7.2-20","chapter":"7.2","chapterTitle":"Pitched roofs","part":"Roofs","question":"On a mono pitched trussed rafter roof, chevron bracing between the webs should be provided where the span exceeds what dimension?","options":["4m","5m","8m","11m"],"correct":1,"explanation":"Clause 7.2.9.3 states chevron bracing to mono pitched roofs should be provided where the span exceeds 5m; for mono pitched roofs over 8m span, chevron bracing should be designed by an engineer.","ref":"7.2.9.3"},{"id":"7.2-21","chapter":"7.2","chapterTitle":"Pitched roofs","part":"Roofs","question":"Where continuous plywood or OSB sheathing is used as diaphragm bracing to the underside of attic truss rafters, what is the minimum width of the sheathing?","options":["600mm","750mm","900mm","1200mm"],"correct":2,"explanation":"Clause 7.2.9.4 states continuous internal 9mm plywood or OSB sheathing should be a minimum of 900mm wide, face fixed to the underside of the rafters for the full length of the roof.","ref":"7.2.9.4"},{"id":"7.2-22","chapter":"7.2","chapterTitle":"Pitched roofs","part":"Roofs","question":"The floor of a site formed attic truss spans 3.5m between node points. What strutting is required?","options":["None is required for this span","One row of strutting at the centre of the span","Two rows of strutting at equal spacing","Three rows of strutting at quarter points"],"correct":1,"explanation":"Table 7 in Clause 7.2.10 requires one row of strutting at the centre of the span for floor spans of 2.5m to 4.5m; over 4.5m needs two rows at equal spacing.","ref":"7.2.10"},{"id":"7.2-23","chapter":"7.2","chapterTitle":"Pitched roofs","part":"Roofs","question":"What is the minimum opening width for a roof void access hatch?","options":["520mm in each direction","550mm in each direction","600mm in each direction","650mm in each direction"],"correct":0,"explanation":"Clause 7.2.12.1 states access hatches should have a minimum opening width of 520mm in each direction, and should not be located directly over stairs or in other hazardous locations.","ref":"7.2.12.1"},{"id":"7.2-24","chapter":"7.2","chapterTitle":"Pitched roofs","part":"Roofs","question":"Where a loft hatch has a push-up cover, what is the minimum weight of the cover needed to ensure adequate compression of the seals (unless clamps are fitted)?","options":["5.5kg","6.5kg","7.5kg","8.5kg"],"correct":0,"explanation":"Clause 7.2.12.1 states hatches should have a push-up cover with a minimum weight of 5.5kg, or be fitted with clamps, to ensure adequate compression of the seals.","ref":"7.2.12.1"},{"id":"7.2-25","chapter":"7.2","chapterTitle":"Pitched roofs","part":"Roofs","question":"In a site formed dormer, what should support the dormer cheek studs?","options":["A double rafter or a double floor joist","A single rafter with solid noggings","The lintel over the window opening","A trimmer bearing onto the wall plate"],"correct":0,"explanation":"Clause 7.2.13.1 states cheek studs should be supported by either a double rafter or a double floor joist.","ref":"7.2.13.1"},{"id":"7.2-26","chapter":"7.2","chapterTitle":"Pitched roofs","part":"Roofs","question":"What is the minimum thickness of lead used to clad dormer cheeks in a sheltered to moderate exposure zone?","options":["2.65mm code black (Code 6)","2.24mm code red (Code 5)","1.32mm code green (Code 3)","1.80mm code blue (Code 4)"],"correct":3,"explanation":"Clause 7.2.13.1 states lead used to clad dormer cheeks should be a minimum thickness of 1.80mm code blue (Code 4) or 2.24mm code red (Code 5) in a sheltered to moderate exposure zone.","ref":"7.2.13.1"},{"id":"7.2-27","chapter":"7.2","chapterTitle":"Pitched roofs","part":"Roofs","question":"What is the minimum horizontal lap for an unsupported underlay on a roof pitched at less than 15 degrees?","options":["75mm","100mm","150mm","225mm"],"correct":3,"explanation":"Table 10 in Clause 7.2.14 requires a minimum 225mm horizontal lap for unsupported underlay below 15 degrees pitch; at 15 degrees and above the minimum is 150mm.","ref":"7.2.14"},{"id":"7.2-28","chapter":"7.2","chapterTitle":"Pitched roofs","part":"Roofs","question":"At abutments, what is the minimum height the roofing underlay should be supported and turned up?","options":["50mm","75mm","100mm","150mm"],"correct":2,"explanation":"Clause 7.2.14 states that at abutments the underlay should be supported and turned up by a minimum of 100mm.","ref":"7.2.14"},{"id":"7.2-29","chapter":"7.2","chapterTitle":"Pitched roofs","part":"Roofs","question":"For a cold roof with a Type HR underlay and an air permeable covering, pitched between 10 and 15 degrees, what minimum eaves ventilation is required?","options":["3,000mm2/m","7,000mm2/m","10,000mm2/m","25,000mm2/m"],"correct":3,"explanation":"Table 11 in Clause 7.2.15.1 requires 25,000mm2/m minimum eaves/low-level ventilation for cold roofs with Type HR underlay pitched at 10 to 15 degrees; over 15 degrees the minimum is 10,000mm2/m.","ref":"7.2.15.1"},{"id":"7.2-30","chapter":"7.2","chapterTitle":"Pitched roofs","part":"Roofs","question":"A cold roof with a Type HR underlay and air permeable tiles is pitched at 40 degrees. As well as 10,000mm2/m eaves ventilation, what else is required?","options":["Eaves ventilation increased to 25,000mm2/m","An additional 5,000mm2/m of ridge or high-level ventilation beneath the underlay","No additional ventilation is required at this pitch","Counterbattens to create 25mm batten space ventilation"],"correct":1,"explanation":"Table 11 in Clause 7.2.15.1 requires an additional 5,000mm2/m ridge or high-level ventilation where the roof pitch exceeds 35 degrees, the span exceeds 10m, or the roof is a lean-to or mono pitched.","ref":"7.2.15.1"},{"id":"7.2-31","chapter":"7.2","chapterTitle":"Pitched roofs","part":"Roofs","question":"What is the minimum lap at joints in an AVCL, and where should the joints be located?","options":["50mm laps, located mid-way between rafters","75mm laps, located anywhere convenient","100mm laps, located on rafters","150mm laps, located on battens"],"correct":2,"explanation":"Clause 7.2.15.2 states joints in AVCLs should have 100mm minimum laps and should be located on rafters; taped joints for enhanced airtightness should still occur over rafters.","ref":"7.2.15.2"},{"id":"7.2-32","chapter":"7.2","chapterTitle":"Pitched roofs","part":"Roofs","question":"To allow for movement in roof timbers and prevent 'hogging' of the tiles, how far below the top of the adjacent roof framing should a compartment wall stop?","options":["Approximately 25mm, with a soft fire-stopping material used","Approximately 35mm, with a rigid fire-stopping board used","Approximately 50mm, with mortar packing used","It should finish level with the framing, with no gap"],"correct":0,"explanation":"Clause 7.2.16 states compartment walls should stop approximately 25mm below the top of adjacent roof framing, with a soft fire-stopping material used to allow for movement in roof timbers and prevent hogging of the tiles.","ref":"7.2.16"},{"id":"7.2-33","chapter":"7.2","chapterTitle":"Pitched roofs","part":"Roofs","question":"What is the minimum length of a tiling batten, and how many rafters should it span?","options":["1.8m, spanning a minimum of four rafters","1.5m, spanning a minimum of three rafters","0.9m, spanning a minimum of two rafters","1.2m, spanning a minimum of three rafters"],"correct":3,"explanation":"Clause 7.2.17 states battens should be a minimum of 1.2m long and span a minimum of three rafters.","ref":"7.2.17"},{"id":"7.2-34","chapter":"7.2","chapterTitle":"Pitched roofs","part":"Roofs","question":"On a roof with a batten spacing of more than 200mm, how many battens in any group of four may be joined over any one truss or rafter?","options":["No more than one","No more than two","No more than three","All four, provided joints are skew nailed"],"correct":0,"explanation":"Clause 7.2.17 states that where batten spacing is more than 200mm, no more than one batten in any group of four should be joined over any one truss or rafter.","ref":"7.2.17"},{"id":"7.2-35","chapter":"7.2","chapterTitle":"Pitched roofs","part":"Roofs","question":"What are the minimum length and batten penetration requirements for tile and slate fixings?","options":["A minimum of 30mm long, penetrating 10mm into battens","A minimum of 38mm long, penetrating 15mm into battens","A minimum of 45mm long, penetrating 20mm into battens","A minimum of 50mm long, penetrating 25mm into battens"],"correct":1,"explanation":"Clause 7.2.19 states fixings should be a minimum of 38mm long and penetrate a minimum of 15mm into battens.","ref":"7.2.19"},{"id":"7.2-36","chapter":"7.2","chapterTitle":"Pitched roofs","part":"Roofs","question":"What mortar mix should be used when bedding tiles or slates?","options":["1:3 cement:sand with plasticiser","1:4 cement:sand with plasticiser","1:5 cement:sand with plasticiser","1:1:6 cement:lime:sand"],"correct":0,"explanation":"Clause 7.2.19.3 states the mortar should be 1:3 cement:sand with plasticiser, based on sharp sand with soft sand added for workability, the sharp sand being not less than one third of the total sand content.","ref":"7.2.19.3"},{"id":"7.2-37","chapter":"7.2","chapterTitle":"Pitched roofs","part":"Roofs","question":"At abutments, what are the minimum upstand and lap for lead flashings?","options":["50mm upstand and 75mm lap","65mm upstand and 100mm lap","75mm upstand and 100mm lap","100mm upstand and 150mm lap"],"correct":2,"explanation":"Clause 7.2.20.1 states lead flashings should have a minimum upstand of 75mm and a minimum lap of 100mm, tucked 25mm into a bed joint and wedged at not more than 450mm centres.","ref":"7.2.20.1"},{"id":"7.2-38","chapter":"7.2","chapterTitle":"Pitched roofs","part":"Roofs","question":"In a lead-lined valley, what is the maximum length of each strip of lead?","options":["1.0m","1.5m","2.0m","3.0m"],"correct":1,"explanation":"Clause 7.2.21 states lead in valleys should be laid in strips no longer than 1.5m, lapped by a minimum of 150mm where pitches are above 30 degrees.","ref":"7.2.21"},{"id":"7.2-39","chapter":"7.2","chapterTitle":"Pitched roofs","part":"Roofs","question":"Above what roof area should rainwater drainage be provided?","options":["Roofs greater than 10m2","Roofs greater than 8m2","Roofs greater than 4m2","Roofs greater than 6m2"],"correct":3,"explanation":"Clause 7.2.22 states drainage should be provided where roofs are greater than 6m2, with consideration given to providing drainage to smaller roofs such as dormer and porch roofs and balconies.","ref":"7.2.22"},{"id":"8.1-01","chapter":"8.1","chapterTitle":"Internal services","part":"Internal services and low or zero carbon technologies (LZC)","question":"What is the minimum depth below ground surface for water service pipes?","options":["450mm","600mm","750mm","900mm"],"correct":2,"explanation":"Clause 8.1.3.2 requires service pipes to be a minimum of 750mm below the ground surface; where this is not possible, adequate precautions should be taken against frost and mechanical damage.","ref":"8.1.3.2"},{"id":"8.1-02","chapter":"8.1","chapterTitle":"Internal services","part":"Internal services and low or zero carbon technologies (LZC)","question":"The design of the water supply should be based on what minimum dynamic pressure at the stop valve inside the home?","options":["1.0 bar","1.5 bar","2.0 bar","2.5 bar"],"correct":1,"explanation":"Clause 8.1.3.2 states the design should be based on a minimum 1.5 bar dynamic pressure at the stop valve inside the home.","ref":"8.1.3.2"},{"id":"8.1-03","chapter":"8.1","chapterTitle":"Internal services","part":"Internal services and low or zero carbon technologies (LZC)","question":"What minimum flow rate should be available at the stop valve inside the home?","options":["20 litres per minute","25 litres per minute","30 litres per minute","35 litres per minute"],"correct":0,"explanation":"Clause 8.1.3.2 requires a minimum of 20L/min flow rate to be available at the stop valve inside the home.","ref":"8.1.3.2"},{"id":"8.1-04","chapter":"8.1","chapterTitle":"Internal services","part":"Internal services and low or zero carbon technologies (LZC)","question":"You are insulating a cold water tank located in an unheated loft. Where does the standard say insulation should be omitted?","options":["On the sides of the tank","Over the tank cover","Around the pipework connected to the tank","Beneath the tank"],"correct":3,"explanation":"Clause 8.1.3.4 states insulation should be provided as specified in the design, but not beneath a cold water tank, and on each side of raised tanks in unheated roof spaces.","ref":"8.1.3.4"},{"id":"8.1-05","chapter":"8.1","chapterTitle":"Internal services","part":"Internal services and low or zero carbon technologies (LZC)","question":"How far above the shut-off water level in a cold water cistern should the warning/overflow pipe be situated?","options":["25mm","32mm","40mm","50mm"],"correct":0,"explanation":"Clause 8.1.4.4 requires warning and overflow pipes to be situated 25mm above the shut-off water level in the cistern, and to be a minimum of 19mm internal diameter.","ref":"8.1.4.4"},{"id":"8.1-06","chapter":"8.1","chapterTitle":"Internal services","part":"Internal services and low or zero carbon technologies (LZC)","question":"What is the maximum depth of a vertical chase for gas pipework set into a plastered masonry wall of thickness T?","options":["T/8","T/6","T/3","T/2"],"correct":2,"explanation":"Clause 8.1.5.1 (Figure 5 guidance) gives the maximum depth of chase as T/6 for horizontal chases and T/3 for vertical chases.","ref":"8.1.5.1"},{"id":"8.1-07","chapter":"8.1","chapterTitle":"Internal services","part":"Internal services and low or zero carbon technologies (LZC)","question":"A plot has a gas supply to the home and the kitchen is fitted with an electric hob. What does the standard say about providing a gas point at the cooker space?","options":["A gas point must still be provided at the cooker space","A gas point is not required because an electric hob is provided","A capped gas point must be provided within 300mm of the hob","A gas point is only required if the buyer requests one"],"correct":1,"explanation":"Clause 8.1.5.1 states that where there is a gas supply to the home, a gas point at the cooker space is provided, but this is not required where an electric hob is provided.","ref":"8.1.5.1"},{"id":"8.1-08","chapter":"8.1","chapterTitle":"Internal services","part":"Internal services and low or zero carbon technologies (LZC)","question":"What is the minimum number of 13A outlets that should be provided in the main bedroom?","options":["Two","Four","Six","Eight"],"correct":2,"explanation":"Table 3 in Clause 8.1.6.2 requires a minimum of six outlets for the main bedroom and a minimum of four outlets for other bedrooms.","ref":"8.1.6.2"},{"id":"8.1-09","chapter":"8.1","chapterTitle":"Internal services","part":"Internal services and low or zero carbon technologies (LZC)","question":"A cable without special protection is run outside the safe zones in a wall. What minimum depth from the wall surface is acceptable?","options":["50mm","75mm","100mm","150mm"],"correct":0,"explanation":"Clause 8.1.6.3 states cables without special protection should be run vertically or horizontally to the outlet, within the safe zone, or a minimum of 50mm from the surface of a wall or from the top or bottom of a timber joist or batten.","ref":"8.1.6.3"},{"id":"8.1-10","chapter":"8.1","chapterTitle":"Internal services","part":"Internal services and low or zero carbon technologies (LZC)","question":"In a kitchen (not a bathroom), what is the minimum horizontal separation between an electrical accessory and the edge of any bowl of a sink or wash basin?","options":["150mm","200mm","250mm","300mm"],"correct":3,"explanation":"Clause 8.1.6.4 requires a minimum separation of 300mm measured horizontally to the edge of any bowl of a sink or wash basin opening, to avoid splashing.","ref":"8.1.6.4"},{"id":"8.1-11","chapter":"8.1","chapterTitle":"Internal services","part":"Internal services and low or zero carbon technologies (LZC)","question":"What minimum electrical supply should be provided to a cooking space?","options":["A 20A supply, suitably switched and terminated","A 30A supply, suitably switched and terminated","A 40A supply, suitably switched and terminated","A 45A supply, suitably switched and terminated"],"correct":1,"explanation":"Clause 8.1.6.7 requires cooking spaces to have a minimum 30A supply which is suitably switched and terminated, plus a 13A socket outlet where there is a gas supply.","ref":"8.1.6.7"},{"id":"8.1-12","chapter":"8.1","chapterTitle":"Internal services","part":"Internal services and low or zero carbon technologies (LZC)","question":"An unvented cylinder discharge pipe terminates at low level onto a garden path. What is the maximum height of the discharge above ground level?","options":["25mm","50mm","75mm","100mm"],"correct":3,"explanation":"Clause 8.1.9.3 states that where low-level discharge is onto the ground, the pipe should discharge downwards a maximum of 100mm above ground level, protected from being touched, normally by a cage over the pipe.","ref":"8.1.9.3"},{"id":"8.1-13","chapter":"8.1","chapterTitle":"Internal services","part":"Internal services and low or zero carbon technologies (LZC)","question":"An unvented system discharge pipe terminates at high level onto a pitched roof. How far away from plastic guttering must the termination be?","options":["2m","3m","4m","5m"],"correct":1,"explanation":"Clause 8.1.9.4 states high-level discharge is only acceptable when it terminates onto a roof capable of withstanding water at high temperature and the termination is 3m away from plastic guttering.","ref":"8.1.9.4"},{"id":"8.1-14","chapter":"8.1","chapterTitle":"Internal services","part":"Internal services and low or zero carbon technologies (LZC)","question":"What minimum thickness of unfaced mineral wool should be used to wrap a soil pipe passing through the home for sound insulation?","options":["25mm","40mm","50mm","60mm"],"correct":0,"explanation":"Clause 8.1.10.3 requires soil pipes to be wrapped with a minimum 25mm of unfaced mineral wool of at least 10kg/m³ density, continued through the thickness of each sound-insulating floor.","ref":"8.1.10.3"},{"id":"8.2-01","chapter":"8.2","chapterTitle":"Electrical generating technologies","part":"Internal services and low or zero carbon technologies (LZC)","question":"For solar PV installations, a site is defined as a coastal location when it is within
