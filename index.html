2.3","why":"Piling on plaster thicker than the background can key and support risks sagging, cracking and the coat parting from the wall under its own weight.","source":"NHBC Standards 2026","sourceShort":"NHBC","refLabel":"Clause"},{"id":"9.2-04","chapter":"9.2","chapterTitle":"Wall and ceiling finishes","part":"Finishes","question":"Within the field of plasterboards, what are the typical maximum centres for screw fixings?","options":["150mm for ceilings and 230mm for walls","200mm for ceilings and 250mm for walls","300mm for ceilings and 230mm for walls","230mm for ceilings and 300mm for walls"],"correct":3,"explanation":"Clause 9.2.4.4 states screw fixings will typically be at maximum centres of 230mm for ceilings and 300mm for walls within the field of the boards, with closer centres possibly specified at edges and corners.","ref":"9.2.4.4","why":"Screws too far apart let boards deflect or drum under load, cracking the skim finish and joints and risking the board working loose over time.","source":"NHBC Standards 2026","sourceShort":"NHBC","refLabel":"Clause"},{"id":"9.2-05","chapter":"9.2","chapterTitle":"Wall and ceiling finishes","part":"Finishes","question":"What is the maximum weight of ceramic wall tiles that lightweight plaster should carry?","options":["20kg/m²","25kg/m²","32kg/m²","40kg/m²"],"correct":0,"explanation":"Clause 9.2.5 states tiles should be suitable for the location, intended use and background, and their weight on lightweight plaster should not exceed 20kg/m².","ref":"9.2.5","why":"Lightweight plaster has limited mechanical strength, so heavier tiles than 20kg/m² can overstress the bond and pull tiles off the wall — a real hazard in bathrooms and showers.","source":"NHBC Standards 2026","sourceShort":"NHBC","refLabel":"Clause"},{"id":"9.2-06","chapter":"9.2","chapterTitle":"Wall and ceiling finishes","part":"Finishes","question":"When fixing dry lining with adhesive dabs, at what centres should the dabs be positioned, measured vertically?","options":["150mm","200mm","300mm","400mm"],"correct":2,"explanation":"Clause 9.2.4.4 requires adhesive dabs at 300mm centres measured vertically, with each dab 50mm to 75mm wide and approximately 250mm long.","ref":"9.2.4.4","why":"Evenly spaced dabs give consistent support across the board so it can't bow or drum in the gaps, which would otherwise crack joints and any tiling fixed to it.","source":"NHBC Standards 2026","sourceShort":"NHBC","refLabel":"Clause"},{"id":"9.2-07","chapter":"9.2","chapterTitle":"Wall and ceiling finishes","part":"Finishes","question":"The tiler is due on site to tile a bathroom wall where the dry lining was fixed with dabs of adhesive. How long should the backing have been completed before wall tiling takes place?","options":["3 days","5 days","7 days","10 days"],"correct":3,"explanation":"Clause 9.2.5 states backing surfaces should be completed at least 10 days before wall tiling takes place where dry lining is fixed with dabs of adhesive.","ref":"9.2.5","why":"Adhesive dabs need time to gain strength; tiling too soon adds weight and wet trades before the bond has cured, risking the board pulling away from the wall with the tiles.","source":"NHBC Standards 2026","sourceShort":"NHBC","refLabel":"Clause"},{"id":"9.3-01","chapter":"9.3","chapterTitle":"Floor finishes","part":"Finishes","question":"What cement:sand mix is generally suitable for a non-structural floor screed?","options":["Between 1:2 and 1:3","Between 1:3 and 1:4½","Between 1:5 and 1:6","Between 1:6 and 1:8"],"correct":1,"explanation":"Clause 9.3.4.1 states non-structural screed should be of a suitable sand cement mix, generally between 1:3 and 1:4½ cement:sand; where deeper than 40mm, concrete may be used.","ref":"9.3.4.1","why":"Too weak a cement:sand mix leaves a screed that dusts and crumbles underfoot, while too rich a mix shrinks and cracks — the 1:3 to 1:4½ range balances strength against cracking risk.","source":"NHBC Standards 2026","sourceShort":"NHBC","refLabel":"Clause"},{"id":"9.3-02","chapter":"9.3","chapterTitle":"Floor finishes","part":"Finishes","question":"Where services are bedded in the screed, what is the minimum cover required over the highest point of pipes and insulation?","options":["25mm","30mm","40mm","50mm"],"correct":0,"explanation":"Clause 9.3.4.1 requires a minimum 25mm of cover over the highest point of pipes and insulation where services are bedded in the screed.","ref":"9.3.4.1","why":"Enough cover over pipes stops them being nicked or cracked by trimming screws or point loads, and stops the thin screed above them cracking or telegraphing the pipe line through the finish.","source":"NHBC Standards 2026","sourceShort":"NHBC","refLabel":"Clause"},{"id":"9.3-03","chapter":"9.3","chapterTitle":"Floor finishes","part":"Finishes","question":"What is the minimum thickness at any point for a non-structural cement and sand screed installed on a separating membrane?","options":["25mm","40mm","50mm","65mm"],"correct":2,"explanation":"Table 2 in Clause 9.3.4.2 gives a minimum thickness of 50mm at any point for screed installed on a separating membrane (eg 1000g polyethylene); on resilient slabs or quilts it is 65mm.","ref":"9.3.4.2","why":"A screed floating unbonded on a membrane gets no support from the base below, so it needs the extra thickness to resist flexing and cracking under foot traffic and furniture loads.","source":"NHBC Standards 2026","sourceShort":"NHBC","refLabel":"Clause"},{"id":"9.3-04","chapter":"9.3","chapterTitle":"Floor finishes","part":"Finishes","question":"How thick should a Grade I or II mastic asphalt floor finish be, including the finish and underlay?","options":["5mm to 10mm","10mm to 15mm","12mm to 18mm","15mm to 20mm"],"correct":3,"explanation":"Clause 9.3.8 states mastic asphalt floor finishes should be either Grade I or II and 15mm-20mm thick, which applies to the floor finishes and underlay.","ref":"9.3.8","why":"Mastic asphalt relies on a minimum thickness to stay a continuous, crack-free waterproof and wearing layer; too thin and it splits or wears through under use.","source":"NHBC Standards 2026","sourceShort":"NHBC","refLabel":"Clause"},{"id":"9.3-05","chapter":"9.3","chapterTitle":"Floor finishes","part":"Finishes","question":"A concrete base is due to receive ceramic floor tiles. Generally, how long should it be left to dry before tiling starts?","options":["3 weeks","6 weeks","2 months","6 months"],"correct":1,"explanation":"Clause 9.3.5 states the substrate should be sufficiently dry before tiling; generally six weeks for concrete bases and three weeks for screed is adequate.","ref":"9.3.5","why":"Tiling onto a concrete base that's still drying traps residual moisture behind the tiles, which can break down the adhesive bond and cause tiles to debond or blow later.","source":"NHBC Standards 2026","sourceShort":"NHBC","refLabel":"Clause"},{"id":"9.3-06","chapter":"9.3","chapterTitle":"Floor finishes","part":"Finishes","question":"In tiled floors, at what centres should movement joints be used to separate bays?","options":["8m to 10m","10m to 12m","12m to 15m","15m to 20m"],"correct":0,"explanation":"Clause 9.3.5 states movement joints should be used to separate bays at 8-10m centres; with underfloor heating, bays should be no greater than 40m² with an edge length not greater than 8m.","ref":"9.3.5","why":"Tiled floors expand and contract with temperature and moisture; without movement joints at these centres the built-up stress can crack, lift or tent the tiling.","source":"NHBC Standards 2026","sourceShort":"NHBC","refLabel":"Clause"},{"id":"9.3-07","chapter":"9.3","chapterTitle":"Floor finishes","part":"Finishes","question":"Where a concrete slab is to receive wood flooring and is not moisture tested, how long should it generally be allowed to cure?","options":["6 weeks","2 months","3 months","6 months"],"correct":3,"explanation":"Clause 9.3.6.3 states screeds or concrete to receive wood flooring should be allowed to cure for a sufficient period of time, generally two months for 50mm screed and six months for concrete slabs.","ref":"9.3.6.3","why":"Wood flooring is very sensitive to residual moisture; laying it on concrete that hasn't had long enough to cure lets trapped moisture make boards cup, swell or rot from below.","source":"NHBC Standards 2026","sourceShort":"NHBC","refLabel":"Clause"},{"id":"9.3-08","chapter":"9.3","chapterTitle":"Floor finishes","part":"Finishes","question":"Flexible sheet flooring materials should not be exposed to temperatures below what value for the 24 hours before, or during, laying?","options":["10°C","15°C","18°C","21°C"],"correct":2,"explanation":"Clause 9.3.7 states flexible sheet flooring materials should not be exposed to temperatures less than 18°C for a period of 24 hours before, or during, laying.","ref":"9.3.7","why":"Below 18°C, sheet flooring becomes stiff and hard to lay flat, and adhesives don't bond properly, leading to lifting, bubbling or poor seams once the material warms up.","source":"NHBC Standards 2026","sourceShort":"NHBC","refLabel":"Clause"},{"id":"9.4-01","chapter":"9.4","chapterTitle":"Finishes and fitments","part":"Finishes","question":"How much circulation space should the kitchen specification allow in front of all work surfaces, cupboards and appliances?","options":["0.6m","0.75m","0.9m","1m"],"correct":3,"explanation":"Clause 9.4.3 states the kitchen specification should allow for 1m circulation space in front of all work surfaces, cupboards and appliances.","ref":"9.4.3","why":"Enough circulation space lets appliance and cupboard doors open fully and people move safely past them, avoiding a cramped kitchen where doors, drawers and worktops obstruct everyday use.","source":"NHBC Standards 2026","sourceShort":"NHBC","refLabel":"Clause"},{"id":"9.4-02","chapter":"9.4","chapterTitle":"Finishes and fitments","part":"Finishes","question":"Where a kitchen appliance is intended but not provided, what depth can be assumed for it?","options":["500mm","600mm","650mm","700mm"],"correct":1,"explanation":"Clause 9.4.3 states a depth of 600mm can be assumed for appliances where they are intended but not provided.","ref":"9.4.3","why":"Allowing a standard 600mm depth for an appliance not yet fitted keeps the gap correctly sized so the actual appliance fits later without units needing to be ripped out and reset.","source":"NHBC Standards 2026","sourceShort":"NHBC","refLabel":"Clause"},{"id":"9.4-03","chapter":"9.4","chapterTitle":"Finishes and fitments","part":"Finishes","question":"In which homes is an airing cupboard required?","options":["Homes which do not have central or whole home heating","All new homes, regardless of the heating system","Homes with more than three bedrooms","Only homes where the buyer requests one in the specification"],"correct":0,"explanation":"Clause 9.4.3 states airing cupboards are required in homes which do not have central or whole home heating.","ref":"9.4.3","why":"Without central heating there's no other reliable warm space to dry laundry and air linen, so an airing cupboard with a heat source (eg the cylinder) is needed to stop damp, musty stored fabrics.","source":"NHBC Standards 2026","sourceShort":"NHBC","refLabel":"Clause"},{"id":"9.4-04","chapter":"9.4","chapterTitle":"Finishes and fitments","part":"Finishes","question":"What is the minimum spacing required between shelves in an airing cupboard?","options":["200mm","250mm","300mm","350mm"],"correct":2,"explanation":"Clause 9.4.6 requires airing cupboards to have a 300mm minimum spacing between shelves, a minimum 0.5m² of easily reached shelving, and no shelving higher than 1.5m.","ref":"9.4.6","why":"Enough gap between shelves lets air circulate around folded or hanging items so they actually dry and air properly, rather than staying damp and musty in a packed cupboard.","source":"NHBC Standards 2026","sourceShort":"NHBC","refLabel":"Clause"},{"id":"9.4-05","chapter":"9.4","chapterTitle":"Finishes and fitments","part":"Finishes","question":"A kitchen worktop has been cut on site to fit around a unit. How should the cut edge be finished?","options":["Sealed using a metal or plastic strip glued to the edge with waterproof adhesive, or an appropriate waterproof joint","Left as cut, provided it will be concealed by the adjacent unit","Sanded smooth and coated with a clear varnish","Covered with a bead of decorative silicone only"],"correct":0,"explanation":"Clause 9.4.6 states that where worktops or unit panels are cut, edges should be sealed using a metal or plastic strip glued to the edge with waterproof adhesive, or alternatively an appropriate waterproof joint.","ref":"9.4.6","why":"An unsealed cut edge on a worktop exposes the absorbent chipboard core to water splashes, causing it to swell, delaminate and rot from the inside around sinks and hobs.","source":"NHBC Standards 2026","sourceShort":"NHBC","refLabel":"Clause"},{"id":"9.4-06","chapter":"9.4","chapterTitle":"Finishes and fitments","part":"Finishes","question":"How should skirting be formed at external and internal angles?","options":["Butt jointed square at all angles and filled","Fixed with visible brackets at each corner","Left with an expansion gap at every corner","Mitred and scribed, as appropriate"],"correct":3,"explanation":"Clause 9.4.4 states skirting should be mitred and scribed at external and internal angles as appropriate, tightly abut architraves, and run level and scribed to floors.","ref":"9.4.4","why":"Neatly mitred and scribed skirting closes the joint tightly at corners and floor level, avoiding gaps that look poor, collect dirt, or open up further as the timber shrinks.","source":"NHBC Standards 2026","sourceShort":"NHBC","refLabel":"Clause"},{"id":"9.5-01","chapter":"9.5","chapterTitle":"Painting and decorating","part":"Finishes","question":"What is the maximum moisture content of timber when painting or decorating it?","options":["12%","15%","18%","20%"],"correct":2,"explanation":"Clause 9.5.5 states that when painting or decorating timber, the moisture content should be a maximum of 18%.","ref":"9.5.5","why":"Painting timber that's still damp traps moisture under the film, so as the wood dries afterwards the coating blisters, peels or bubbles, and trapped damp can encourage rot.","source":"NHBC Standards 2026","sourceShort":"NHBC","refLabel":"Clause"},{"id":"9.5-02","chapter":"9.5","chapterTitle":"Painting and decorating","part":"Finishes","question":"When applying undercoat and gloss to timber, within what period of the previous coat should each coat be applied?","options":["One month","Two months","Three months","Six months"],"correct":0,"explanation":"Clause 9.5.5 requires each coat to be applied within one month of the previous, with a minimum of one priming coat, one undercoat and one finishing coat unless the manufacturer recommends otherwise.","ref":"9.5.5","why":"Leaving too long between coats lets the previous layer harden and lose its key, so the next coat bonds poorly and is more likely to peel or flake off in service.","source":"NHBC Standards 2026","sourceShort":"NHBC","refLabel":"Clause"},{"id":"9.5-03","chapter":"9.5","chapterTitle":"Painting and decorating","part":"Finishes","question":"What is the minimum number of coats of varnish that should be applied to interior surfaces?","options":["Two","Three","Four","Five"],"correct":1,"explanation":"Clause 9.5.5 states varnish should be applied with a minimum of three coats on interior surfaces; on exterior surfaces the use of clear varnishes should be avoided due to their short service life.","ref":"9.5.5","why":"A single thin coat of varnish gives too little film thickness to resist wear and moisture, so building up three coats is needed for a durable, protective finish that won't wear through quickly.","source":"NHBC Standards 2026","sourceShort":"NHBC","refLabel":"Clause"},{"id":"9.5-04","chapter":"9.5","chapterTitle":"Painting and decorating","part":"Finishes","question":"Before a decorative finish is applied to galvanized steel, what preparation does the standard describe?","options":["Suitable preparation with a mordant wash","Blast cleaning back to bright metal","Rubbing down with wire wool and white spirit","Application of two coats of red oxide primer"],"correct":0,"explanation":"Clause 9.5.6 states decorative finishes may be applied to galvanized steel following suitable preparation with a mordant wash.","ref":"9.5.6","why":"New galvanizing is smooth and non-porous with poor paint adhesion, so a mordant wash etches the zinc surface to give paint a key — without it the finish can flake or peel off.","source":"NHBC Standards 2026","sourceShort":"NHBC","refLabel":"Clause"},{"id":"9.5-05","chapter":"9.5","chapterTitle":"Painting and decorating","part":"Finishes","question":"When decorating plaster and plasterboard surfaces, what is the minimum number of coats of paint that should be applied?","options":["One","Two","Three","Four"],"correct":1,"explanation":"Clause 9.5.7.2 states a minimum of two coats of paint should be applied to plaster and plasterboard surfaces, after joints are completed, imperfections filled and the surface stabilised.","ref":"9.5.7.2","why":"One coat alone won't evenly hide filled joints and patches of differing suction on plaster and plasterboard, leaving a patchy, uneven look; a second coat gives uniform, durable cover.","source":"NHBC Standards 2026","sourceShort":"NHBC","refLabel":"Clause"},{"id":"9.5-06","chapter":"9.5","chapterTitle":"Painting and decorating","part":"Finishes","question":"A decorator is wallpapering a wall that has electrical switch plates. How should the wallpaper be finished around them?","options":["Cut the paper neatly to the edge of the switch plate and seal with clear adhesive","Overlap the paper onto the face of the switch plate by a few millimetres","Leave a 5mm gap around the switch plate to allow for movement","Temporarily remove the switch plate and trim the paper accurately so it tucks behind the fitting"],"correct":3,"explanation":"Clause 9.5.8 states electrical switch plates should be temporarily removed and the papering accurately trimmed so that it will tuck behind the fitting upon completion.","ref":"9.5.8","why":"Removing the switch plate first lets the paper be trimmed and tucked neatly behind it, avoiding a torn, gappy edge around the fitting that would look poor and let the paper lift.","source":"NHBC Standards 2026","sourceShort":"NHBC","refLabel":"Clause"},{"id":"10.1-01","chapter":"10.1","chapterTitle":"Garages","part":"External works","question":"An unreinforced edge thickened concrete slab is being used as the foundation for a detached garage. What is the maximum dimension in any direction before movement joints must be provided?","options":["3m","4.5m","6m","9m"],"correct":2,"explanation":"Clause 10.1.3.3 states unreinforced concrete slabs should have dimensions not exceeding 6m in any direction; for dimensions greater than this, movement joints should be provided.","ref":"10.1.3.3","why":"Unreinforced concrete moves with temperature and moisture changes. Beyond 6m that movement is restrained enough to crack the slab randomly, letting water in and weakening its ability to carry vehicle loads.","source":"NHBC Standards 2026","sourceShort":"NHBC","refLabel":"Clause"},{"id":"10.1-02","chapter":"10.1","chapterTitle":"Garages","part":"External works","question":"You are casting an unreinforced ground-bearing floor slab in a double garage. Above what floor area must the slab either be reinforced or divided into smaller bays with construction joints?","options":["10m2","16m2","20m2","25m2"],"correct":1,"explanation":"Clause 10.1.4.7 states that if the floor area of a garage exceeds 16m2, either the slab should be reinforced or construction joints provided which equally divide the floor into bays of less than 16m2.","ref":"10.1.4.7","why":"Larger unreinforced garage slabs are more prone to shrinkage cracking under the point loads of a parked car. Reinforcement or dividing joints control where cracks form so the floor stays sound and usable.","source":"NHBC Standards 2026","sourceShort":"NHBC","refLabel":"Clause"},{"id":"10.1-03","chapter":"10.1","chapterTitle":"Garages","part":"External works","question":"In a single leaf garage wall over 2.5m long that requires piers, what is the maximum spacing of piers at intermediate positions?","options":["1.5m","2m","2.5m","3m"],"correct":3,"explanation":"Clause 10.1.5.1 states piers in single leaf walls should be located at intermediate centres not exceeding 3m, as well as at corners and either side of a major opening such as a garage door.","ref":"10.1.5.1","why":"Thin single-leaf walls have little inherent stiffness against wind pressure. Piers at close centres brace the wall so it doesn't bow or buckle in high winds, since there's no cavity leaf to share the load.","source":"NHBC Standards 2026","sourceShort":"NHBC","refLabel":"Clause"},{"id":"10.1-04","chapter":"10.1","chapterTitle":"Garages","part":"External works","question":"Where a garage flat roof needs holding-down straps to prevent uplift, what is the maximum spacing of the straps where the roof members bear on the supporting wall?","options":["1.5m","2m","2.5m","3m"],"correct":1,"explanation":"Clause 10.1.9.1 requires holding-down straps at not more than 2m centres where the roof members bear on the supporting wall, to prevent uplift.","ref":"10.1.9.1","why":"Flat and shallow-pitch garage roofs with lightweight coverings act like sails and can lift off in strong wind gusts. Closely spaced holding-down straps tie the roof to the wall to stop it blowing off.","source":"NHBC Standards 2026","sourceShort":"NHBC","refLabel":"Clause"},{"id":"10.1-05","chapter":"10.1","chapterTitle":"Garages","part":"External works","question":"A masonry garage gable is built from aerated concrete blocks. Unless the design states otherwise, what restraint strapping is required at the gable?","options":["Two straps per roof slope at maximum 2m centres plus one near the apex","Three straps per roof slope at maximum 2m centres","Two straps per roof slope at maximum 1.5m centres","Three straps per roof slope at maximum 1.5m centres"],"correct":3,"explanation":"Clause 10.1.9.3 states that for walls of perforated bricks/blocks or concrete/aerated concrete blocks, three restraint straps per roof slope at maximum 1.5m centres are required; two straps at 2m centres plus one near the apex applies to solid bricks.","ref":"10.1.9.3","why":"Aerated and perforated blocks hold strap fixings less securely than solid brick, so closer strap spacing is needed to stop the gable wall bulging or toppling outward under wind pressure on the roof.","source":"NHBC Standards 2026","sourceShort":"NHBC","refLabel":"Clause"},{"id":"10.1-06","chapter":"10.1","chapterTitle":"Garages","part":"External works","question":"What does the standard say about water services in a garage?","options":["A rising main should not be located within a garage","A rising main may be located in a garage provided it is insulated","A water outlet in a garage does not need provision for draining down","Pipes in an attached garage do not need insulating"],"correct":0,"explanation":"Clause 10.1.11.1 states a rising main should not be located within a garage, and that any water supply or outlet in a garage should have adequate provision for isolating and draining down, with pipes insulated to minimise the risk of freezing.","ref":"10.1.11.1","why":"Garages are unheated, so pipework left exposed there is at high risk of freezing and bursting, flooding the garage and cutting the home's water supply, often when a hard frost hits.","source":"NHBC Standards 2026","sourceShort":"NHBC","refLabel":"Clause"},{"id":"10.2-01","chapter":"10.2","chapterTitle":"Drives, paths and landscaping","part":"External works","question":"A gabion wall is proposed on site to provide support to a new private drive. What does the standard say about this?","options":["Flexible retaining walls such as gabions should not be used to support homes, garages, roads, drives, car parking areas or drainage systems","Gabions may support drives provided they are less than 600mm high","Gabions may support drives if backfilled with clean crushed rock","Gabions may support drives but not roads or car parking areas"],"correct":0,"explanation":"Clause 10.2.3 states flexible retaining walls such as gabion and timber structures should not be used to provide support to homes, garages, roads, drives, car parking areas or drainage systems.","ref":"10.2.3","why":"Gabions and similar flexible walls are designed to deform and settle under load, so if relied on to hold up a home, road or drive, ongoing movement can crack structures and cause dips or subsidence.","source":"NHBC Standards 2026","sourceShort":"NHBC","refLabel":"Clause"},{"id":"10.2-02","chapter":"10.2","chapterTitle":"Drives, paths and landscaping","part":"External works","question":"Above what height must all retaining structures be designed by an engineer in accordance with Technical Requirement R5?","options":["450mm","600mm","900mm","1,200mm"],"correct":1,"explanation":"Clause 10.2.4 requires all retaining structures more than 600mm high to be designed by an engineer in accordance with Technical Requirement R5.","ref":"10.2.4","why":"Lateral soil pressure rises sharply with wall height, so taller retaining walls need proper engineering to avoid overturning or bursting outward, which could bury or injure anyone standing nearby.","source":"NHBC Standards 2026","sourceShort":"NHBC","refLabel":"Clause"},{"id":"10.2-03","chapter":"10.2","chapterTitle":"Drives, paths and landscaping","part":"External works","question":"Where guarding is needed at a retaining structure, what is its minimum height?","options":["900mm","1,000mm","1,100mm","1,200mm"],"correct":2,"explanation":"Clause 10.2.5 states guarding should be a minimum of 1,100mm high, not be readily climbable by children and not allow a 100mm diameter sphere to pass through.","ref":"10.2.5","why":"A drop of more than 600mm without adequate guarding is a real fall hazard, especially for children; the height and gap limits stop people falling over or squeezing/climbing through.","source":"NHBC Standards 2026","sourceShort":"NHBC","refLabel":"Clause"},{"id":"10.2-04","chapter":"10.2","chapterTitle":"Drives, paths and landscaping","part":"External works","question":"A new drive abuts the home. How far below the DPC should the drive surface be, assuming no channel or other means of collection is provided?","options":["75mm","100mm","150mm","225mm"],"correct":2,"explanation":"Clause 10.2.6.1 states that where drives, paths or paved areas abut the home they should be at least 150mm below the DPC and laid to fall away from the home, unless a channel or other suitable means of collection and disposal is provided.","ref":"10.2.6.1","why":"Keeping the drive well below the DPC and falling away from the house stops rain splashing or pooling against the wall, which would otherwise bridge the damp-proof course and let moisture into the home.","source":"NHBC Standards 2026","sourceShort":"NHBC","refLabel":"Clause"},{"id":"10.2-05","chapter":"10.2","chapterTitle":"Drives, paths and landscaping","part":"External works","question":"What is the maximum gradient permitted for private roads, shared private drives and private drives?","options":["1:4","1:6","1:8","1:10"],"correct":1,"explanation":"Clause 10.2.6.1 states private roads, shared private drives and private drives should have a maximum gradient of 1:6, with suitable transition lengths where the gradient is more than 1:10 and changes.","ref":"10.2.6.1","why":"Steeper gradients cause cars to ground on the transition, lose traction in wet or icy conditions, or roll back unexpectedly, so 1:6 keeps everyday vehicle access safe and usable.","source":"NHBC Standards 2026","sourceShort":"NHBC","refLabel":"Clause"},{"id":"10.2-06","chapter":"10.2","chapterTitle":"Drives, paths and landscaping","part":"External works","question":"In a concrete house path, what is the maximum spacing of movement joints across the full width of the path?","options":["4m","5m","6m","8m"],"correct":0,"explanation":"Clause 10.2.6.5 states movement joints, not less than 10mm wide, should be provided across the full width of the path at not more than 4m centres.","ref":"10.2.6.5","why":"Concrete paths expand and contract with weather, and without joints at regular centres they crack randomly across their width, creating trip hazards and gaps where water gets in and frost damage starts.","source":"NHBC Standards 2026","sourceShort":"NHBC","refLabel":"Clause"},{"id":"10.2-07","chapter":"10.2","chapterTitle":"Drives, paths and landscaping","part":"External works","question":"Where a garden is to be finished in turf or seeding, what minimum thickness of topsoil should be provided?","options":["100mm","150mm","200mm","250mm"],"correct":0,"explanation":"Clause 10.2.9.3 states that where gardens are to be finished in turf or seeding, a minimum thickness of 100mm topsoil should be provided, suitable for general landscape purposes and free of hazardous contaminants.","ref":"10.2.9.3","why":"Grass needs enough depth of fertile soil to root properly and survive dry spells; too thin a topsoil layer leads to poor establishment, bare patches and drainage problems in the garden.","source":"NHBC Standards 2026","sourceShort":"NHBC","refLabel":"Clause"},{"id":"10.2-08","chapter":"10.2","chapterTitle":"Drives, paths and landscaping","part":"External works","question":"Timber decking is planned at more than 600mm above ground level. What does the standard require for its design?","options":["It only needs to be built from naturally durable timber","It must always be limited to 600mm above ground level","It may be built to the decking supplier's standard details without further checks","It should follow guidance published by the Timber Decking and Cladding Association, or be designed by an engineer to Technical Requirement R5"],"correct":3,"explanation":"Clause 10.2.10 states decking more than 600mm above ground level should be in accordance with guidance published by the Timber Decking and Cladding Association (TDCA), or designed by an engineer in accordance with Technical Requirement R5.","ref":"10.2.10","why":"Raised decking carries people and furniture well above ground, so posts and joists face real structural and fall risks; following TDCA guidance or an engineer's design prevents collapse or injury.","source":"NHBC Standards 2026","sourceShort":"NHBC","refLabel":"Clause"},{"id":"11.1-01","chapter":"11.1","chapterTitle":"MMC systems: general requirements","part":"Modern Methods of Construction","question":"How far in advance of works starting on site should the System Manual and supporting design information be issued to NHBC?","options":["Four weeks","Six weeks","Eight weeks","Twelve weeks"],"correct":2,"explanation":"Clause 11.1.3 states that a System Manual and supporting design information should be issued to NHBC at least eight weeks in advance of the works starting on site, in accordance with NHBC rules.","ref":"11.1.3","why":"Giving NHBC eight weeks lets the design and certification evidence be reviewed before units are built and fixed in place, so structural, fire or moisture problems are caught while they can still be corrected cheaply rather than after homes are closed up.","source":"NHBC Standards 2026","sourceShort":"NHBC","refLabel":"Clause"},{"id":"11.1-02","chapter":"11.1","chapterTitle":"MMC systems: general requirements","part":"Modern Methods of Construction","question":"An MMC system manufacturer must operate under a Quality Management System certified to which standard?","options":["ISO 14001:2015, certified by any independent auditor","ISO 9001:2015, certified by a UKAS accredited independent certification body","ISO 45001:2018, certified by a UKAS accredited independent certification body","BS EN 1090, certified by NHBC System Review"],"correct":1,"explanation":"Clause 11.1.4 requires MMC systems to be supplied by a manufacturer operating under a QMS certified by a UKAS accredited, independent certification body in accordance with ISO 9001:2015.","ref":"11.1.4","why":"Because factory-built units can't be checked on site the way traditional brick-and-block work can, an independently audited ISO 9001 system is the only real assurance that materials, tolerances and critical details are being controlled consistently, batch after batch.","source":"NHBC Standards 2026","sourceShort":"NHBC","refLabel":"Clause"},{"id":"11.1-03","chapter":"11.1","chapterTitle":"MMC systems: general requirements","part":"Modern Methods of Construction","question":"As a minimum, what information should the Unit Identification Number (UIN) on an MMC unit indicate?","options":["The production number, unit descriptor, and date and place of manufacture","The site address, plot number and date of delivery to site","The manufacturer's name, system name and document revision number","The unit weight, lifting point positions and maximum stacking height"],"correct":0,"explanation":"Clause 11.1.4.2 states that as a minimum the UIN should indicate the production number, unit descriptor (unit type and variant), and date and place of manufacture.","ref":"11.1.4.2","why":"If a fault turns up in one unit, the UIN lets the manufacturer trace exactly which production run and date it came from, so every other affected unit already delivered or installed elsewhere can be identified and fixed, like a product recall.","source":"NHBC Standards 2026","sourceShort":"NHBC","refLabel":"Clause"},{"id":"11.1-04","chapter":"11.1","chapterTitle":"MMC systems: general requirements","part":"Modern Methods of Construction","question":"MMC units formed from steel should be manufactured and installed in accordance with the relevant parts of which standard?","options":["BS 8103","BS EN 1990","BS 6093","BS EN 1090"],"correct":3,"explanation":"Clause 11.1.4.1 states that units formed from steel should be manufactured and installed in accordance with the relevant parts of BS EN 1090.","ref":"11.1.4.1","why":"BS EN 1090 governs weld quality and fabrication tolerances for structural steel, which matters because a poor weld inside a steel MMC unit carries primary loads yet becomes invisible once the unit is clad and lined at the factory.","source":"NHBC Standards 2026","sourceShort":"NHBC","refLabel":"Clause"},{"id":"11.1-05","chapter":"11.1","chapterTitle":"MMC systems: general requirements","part":"Modern Methods of Construction","question":"Where units are stacked on top of each other during storage, what should the System Manual define?","options":["The maximum wind speed at which stacking of units is permitted on site","The maximum stacking height of units and the method of temporary unit connections","The minimum clear spacing between stacks and the required crane capacity","The maximum storage duration and the sequence in which units are delivered"],"correct":1,"explanation":"Clause 11.1.5.1 states the System Manual should define the maximum stacking height of units and the method of temporary unit connections (for volumetric units) to ensure effective load transfer and resistance to sliding.","ref":"11.1.5.1","why":"Without a defined stacking height and secure temporary connections, stacked units can slide, tip or crush the units beneath them during storage, risking a collapse that injures workers or wrecks units before they're even built into the home.","source":"NHBC Standards 2026","sourceShort":"NHBC","refLabel":"Clause"},{"id":"11.1-06","chapter":"11.1","chapterTitle":"MMC systems: general requirements","part":"Modern Methods of Construction","question":"On site you notice rainwater ponding on the tops of installed volumetric units. How does the standard require the tops of volumetric units to be designed?","options":["With adequate falls to avoid standing water, directing water away from unit joints and cavities","Perfectly level, with water removed by mopping or wet vacuum before the next lift","With a permanent central outlet discharging into the internal soil stack","With a 25mm upstand at all edges to hold water away from the joints"],"correct":0,"explanation":"Clause 11.1.5.2 states the tops of volumetric units should be designed with adequate falls to avoid the risk of standing water, with water directed away from unit joints and cavities and temporary drainage provided.","ref":"11.1.5.2","why":"Standing water on an unroofed unit can work into joints and cavities and get sealed in once construction continues, leading to hidden mould and timber decay that's effectively impossible to put right after the building is closed up.","source":"NHBC Standards 2026","sourceShort":"NHBC","refLabel":"Clause"},{"id":"11.1-07","chapter":"11.1","chapterTitle":"MMC systems: general requirements","part":"Modern Methods of Construction","question":"Factory installed gypsum plasterboard linings show facing paper delamination and mould growth caused by construction moisture during storage. What does the standard require?","options":["Allow the boards to dry out fully, then treat with a fungicidal wash and redecorate","Seal the affected areas with a stain-block primer and overboard with a new layer","Remove and replace the boards in accordance with the plasterboard manufacturer's recommendations and check the supporting structure","Replace only the individual boards where mould is visible and monitor the remainder"],"correct":2,"explanation":"Clause 11.1.5.2 states that factory installed gypsum linings showing signs of facing paper delamination or mould growth due to construction moisture should be removed and replaced in accordance with plasterboard manufacturers recommendations, and the supporting structure checked.","ref":"11.1.5.2","why":"Wetted plasterboard delaminates and loses strength and fire performance, and mould growth is a health hazard, so factory-fitted boards showing these signs must be replaced now rather than papered over and hidden behind later finishes.","source":"NHBC Standards 2026","sourceShort":"NHBC","refLabel":"Clause"},{"id":"11.1-08","chapter":"11.1","chapterTitle":"MMC systems: general requirements","part":"Modern Methods of Construction","question":"What minimum experience must an NHBC registered MMC certifier have as a suitably qualified civil or structural engineer?","options":["One year's experience in offsite construction generally","Three years' experience in the use of the particular MMC system or in its main components","Five years' experience in the use of any MMC system","Ten years' experience in structural engineering design"],"correct":1,"explanation":"Clause 11.1.7 states MMC certifiers should be a suitably qualified civil or structural engineer with a minimum of three years' experience in the use of a particular MMC system or in the main components of the MMC system.","ref":"11.1.7","why":"Since much of an MMC structure can't be seen or checked on site once assembled, the certifier's design check is often the only independent verification the load path actually works, so genuine hands-on experience with that system is essential, not just a qualification.","source":"NHBC Standards 2026","sourceShort":"NHBC","refLabel":"Clause"},{"id":"11.1-09","chapter":"11.1","chapterTitle":"MMC systems: general requirements","part":"Modern Methods of Construction","question":"Who should design medium-rise MMC building structures of over three storeys high?","options":["The manufacturer's in-house design team in accordance with BS 8103","An NHBC registered MMC certifier","An engineer in accordance with Technical Requirement R5","An independent technical approvals authority"],"correct":2,"explanation":"Clause 11.1.6.1 states that medium-rise building structures of over three storeys high should be designed by an engineer in accordance with Technical Requirement R5.","ref":"11.1.6.1","why":"Taller MMC buildings carry compounding wind, stability and fire-spread risks with more severe consequences if the frame fails, so an engineer's specific structural design and check is needed rather than relying on generic low-rise guidance.","source":"NHBC Standards 2026","sourceShort":"NHBC","refLabel":"Clause"},{"id":"11.1-10","chapter":"11.1","chapterTitle":"MMC systems: general requirements","part":"Modern Methods of Construction","question":"Under the NHBC system risk categories for verification, which risk category applies to volumetric apartment buildings and buildings above 4 storeys?","options":["Risk category 1","Risk category 2","Risk category 3","Risk category 4"],"correct":3,"explanation":"Clause 11.1.10 (Table 3) assigns risk category 4 to volumetric apartment buildings and buildings above 4 storeys; volumetric houses up to 4 storeys are risk category 3.","ref":"11.1.10","why":"Taller, more densely occupied volumetric buildings carry greater consequences if a defect goes unnoticed and are harder to put right once built, so they're assigned tighter, more rigorous verification than lower-risk houses.","source":"NHBC Standards 2026","sourceShort":"NHBC","refLabel":"Clause"},{"id":"11.1-11","chapter":"11.1","chapterTitle":"MMC systems: general requirements","part":"Modern Methods of Construction","question":"Before joints between units or temporary openings are sealed, what should installers check?","options":["All cavities are dry, insulation is complete, surfaces are clean and dry, and cavity barriers and fire-stops have been installed","The external cladding is complete, scaffolding is struck, and services have been commissioned","The units have been loaded with at least one storey above to close up the joints","The sealant has been tested on site and the weather forecast is dry for 48 hours"],"correct":0,"explanation":"Clause 11.1.9.5 states that before joints between units or temporary openings are sealed, installers should ensure all cavities are dry, insulation is complete, all surfaces are clean and dry, and cavity barriers and fire-stops have been installed.","ref":"11.1.9.5","why":"Once a joint is sealed there's no getting back in, so trapped moisture rots timber and grows mould, unfinished insulation causes cold spots and condensation, and a missing fire-stop leaves a hidden path for fire and smoke to spread undetected.","source":"NHBC Standards 2026","sourceShort":"NHBC","refLabel":"Clause"},{"id":"11.2-01","chapter":"11.2","chapterTitle":"Closed panel systems","part":"Modern Methods of Construction","question":"A timber frame wall panel arrives on site with studs, sheathing, insulation between the studs and a factory fitted non-transparent air and vapour control layer. How will NHBC categorise this system?","options":["Open panel, because the insulation is only fitted between the studs","Open panel, because no internal linings or external cladding are fitted","Closed panel, because any factory fitted insulation makes a panel closed","Closed panel, because the air and vapour control layer is non-transparent"],"correct":3,"explanation":"The definitions in Chapter 11.2 state that if a non-transparent AVCL is used the system will be considered by NHBC as closed panel; open panels may include insulation between studs and a transparent AVCL so the construction can be viewed on site.","ref":"11.2 (Introduction)","why":"An opaque AVCL means the frame, insulation and moisture detailing behind it can never be visually inspected on site, so NHBC treats it as closed panel and demands independent system certification instead of relying on a site check.","source":"NHBC Standards 2026","sourceShort":"NHBC","refLabel":"Clause"},{"id":"11.2-02","chapter":"11.2","chapterTitle":"Closed panel systems","part":"Modern Methods of Construction","question":"What minimum clear cavity width should be provided between the insulation and render on a board background cladding?","options":["15mm","25mm","50mm","75mm"],"correct":1,"explanation":"Clause 11.2.8.1 (Table 1) requires a minimum cavity width of 25mm for render on board background cladding; masonry cladding requires 50mm.","ref":"11.2.8.1","why":"Without enough clear air space, wind-driven rain that gets past the render can't drain or evaporate away and instead sits against the insulation and sheathing, causing saturation, mould and timber decay within the wall build-up.","source":"NHBC Standards 2026","sourceShort":"NHBC","refLabel":"Clause"},{"id":"11.2-03","chapter":"11.2","chapterTitle":"Closed panel systems","part":"Modern Methods of Construction","question":"On a SIP wall system, how should lifting holes be treated once panels are in position?","options":["Filled and sealed using a material providing the same level of protection as the material removed","Left open to provide ventilation to the panel core","Filled with general purpose expanding polyurethane foam","Covered externally with a patch of breather membrane"],"correct":0,"explanation":"Clause 11.2.5.1 states that lifting holes in SIPs should be filled and sealed using a material providing the same level of protection as the material removed.","ref":"11.2.5.1","why":"Lifting holes cut through a SIP's foam core and facings that give it fire resistance and airtightness, so leaving them unsealed creates a route for fire to travel through the panel and for air and moisture to leak in.","source":"NHBC Standards 2026","sourceShort":"NHBC","refLabel":"Clause"},{"id":"11.2-04","chapter":"11.2","chapterTitle":"Closed panel systems","part":"Modern Methods of Construction","question":"The lowest timber of a closed panel timber frame wall should normally be 150mm above finished ground level. Where the site is not subject to a high water table and the cavity will not have standing water, to what may this be reduced?","options":["50mm","60mm","75mm","100mm"],"correct":2,"explanation":"Clause 11.2.8.2 states the lowest timber should be a minimum of 150mm above finished ground level, which may be reduced to 75mm where the site is not subject to a high water table or where the cavity will not have standing water.","ref":"11.2.8.2","why":"Keeping the sole plate clear of ground level stops repeated wetting from rain splash-back or shallow standing water, which is the single biggest cause of rot starting at the base of a timber frame wall.","source":"NHBC Standards 2026","sourceShort":"NHBC","refLabel":"Clause"},{"id":"11.2-05","chapter":"11.2","chapterTitle":"Closed panel systems","part":"Modern Methods of Construction","question":"Where factory installed lightweight claddings extend to the edges of panels, what is the maximum deviation from plumb or level permitted in the overall interface joint between units?","options":["5mm","6mm","8mm","10mm"],"correct":0,"explanation":"Clause 11.2.11.4 states cladding interfaces should have a maximum of 5mm from plumb or level in the overall interface joint between units, unless specified otherwise by the design.","ref":"11.2.11.4","why":"Excess deviation between factory-fixed cladding panels opens gaps or steps at the joint that let wind-driven rain track in and look poor, and because the finish is already applied at the factory there's little scope to correct it on site.","source":"NHBC Standards 2026","sourceShort":"NHBC","refLabel":"Clause"},{"id":"11.2-06","chapter":"11.2","chapterTitle":"Closed panel systems","part":"Modern Methods of Construction","question":"At junctions between adjoining floor cassettes, what is the maximum level difference permitted between floor decking at any position?","options":["5mm","4mm","3mm","2mm"],"correct":3,"explanation":"Clause 11.2.10 states cassette junctions should not exceed 2mm level difference between floor decking at any position, and should have a nominal 3mm gap at decking joints filled or covered.","ref":"11.2.10","why":"A bigger step between adjoining floor decking creates a trip hazard and telegraphs through as a visible ridge in laminate or vinyl flooring, and can put uneven strain on the joint over time.","source":"NHBC Standards 2026","sourceShort":"NHBC","refLabel":"Clause"},{"id":"11.2-07","chapter":"11.2","chapterTitle":"Closed panel systems","part":"Modern Methods of Construction","question":"What does the standard require for joints in air and vapour control membranes?","options":["50mm minimum laps, located wherever is most convenient","100mm minimum laps, located on studs or noggings","100mm minimum laps, located mid-way between studs","150mm minimum laps, located on the base rail only"],"correct":1,"explanation":"Clause 11.2.13 states joints in air and vapour control membranes should have 100mm minimum laps and be located on studs or noggings.","ref":"11.2.13","why":"A lap that isn't backed onto a solid stud or nogging can't be taped down securely and will work loose, letting warm moist air leak into the cold frame and cause hidden interstitial condensation and decay.","source":"NHBC Standards 2026","sourceShort":"NHBC","refLabel":"Clause"},{"id":"11.2-08","chapter":"11.2","chapterTitle":"Closed panel systems","part":"Modern Methods of Construction","question":"For closed panel timber frame and SIPs incorporating structural timber, what moisture content should all structural timber elements have before internal AVCLs, insulation or plasterboard linings are installed?","options":["Less than 16%","Less than 18%","Less than 20%","Less than 24%"],"correct":2,"explanation":"Clause 11.2.13 states that all structural timber elements (including the OSB of the SIP, if applicable) should have a moisture content of less than 20% before any internal AVCLs, insulation or plasterboard linings are installed.","ref":"11.2.13","why":"Sealing timber above 20% moisture inside an airtight, vapour-controlled wall traps that moisture with nowhere to dry out to, so the frame rots from within and can feed mould growth on the inner lining.","source":"NHBC Standards 2026","sourceShort":"NHBC","refLabel":"Clause"},{"id":"11.2-09","chapter":"11.2","chapterTitle":"Closed panel systems","part":"Modern Methods of Construction","question":"What minimum laps should breather membranes have at horizontal and vertical joints?","options":["75mm at horizontal joints and 100mm at vertical joints","100mm at horizontal joints and 100mm at vertical joints","150mm at horizontal joints and 150mm at vertical joints","100mm at horizontal joints and 150mm at vertical joints"],"correct":3,"explanation":"Clause 11.2.14 states breather membranes should be lapped to a minimum of 100mm at horizontal joints and a minimum of 150mm at vertical joints.","ref":"11.2.14","why":"Skimpy laps, especially where upper sheets don't overlap lower ones enough, let rain that beats past the cladding track sideways behind the membrane onto the sheathing, defeating its job as the wall's secondary weather barrier.","source":"NHBC Standards 2026","sourceShort":"NHBC","refLabel":"Clause"},{"id":"11.2-10","chapter":"11.2","chapterTitle":"Closed panel systems","part":"Modern Methods of Construction","question":"What is the minimum density of wall ties required for masonry cladding to closed panel systems?","options":["3.7 ties/m2, eg spaced at a maximum of 600mm horizontally and 450mm vertically","2.5 ties/m2, eg spaced at a maximum of 900mm horizontally and 450mm vertically","4.4 ties/m2, eg spaced at a maximum of 450mm horizontally and 450mm vertically","5.0 ties/m2, eg spaced at a maximum of 450mm horizontally and 300mm vertically"],"correct":0,"explanation":"Clause 11.2.16 states wall ties should be installed at a minimum density of 3.7 ties/m2 for masonry cladding, eg spaced at a maximum of 600mm horizontally and 450mm vertically.","ref":"11.2.16","why":"Too few ties leave the masonry outer leaf poorly restrained against wind suction, risking it bulging or being blown off, since the ties fixed into the studs are the only thing physically holding the outer leaf to the frame.","source":"NHBC Standards 2026","sourceShort":"NHBC","refLabel":"Clause"},{"id":"11.3-01","chapter":"11.3","chapterTitle":"Volumetric systems","part":"Modern Methods of Construction","question":"Who should design the connections between volumetric units?","options":["The manufacturer's factory production team","A Structural Engineer in accordance with Technical Requirement R5","An NHBC registered volumetric frame certifier","The installer, following the Installation Manual"],"correct":1,"explanation":"Clause 11.3.3.2 states connections between volumetric units should be designed by a Structural Engineer in accordance with Technical Requirement R5.","ref":"11.3.3.2","why":"Unit-to-unit connections are what turns a stack of separate boxes into one stable building able to resist wind loads and transfer them to the ground, so getting this engineering wrong compromises the whole structure's stability, hidden inside the joint once units are stacked.","source":"NHBC Standards 2026","sourceShort":"NHBC","refLabel":"Clause"},{"id":"11.3-02","chapter":"11.3","chapterTitle":"Volumetric systems","part":"Modern Methods of Construction","question":"A design proposes bedding volumetric units directly on the supporting slab, relying on their self-weight and friction to resist sliding. What does the standard require?","options":["This is acceptable for buildings up to two storeys","This is acceptable provided the slab is level to within the System Manual tolerances","Adhesive bonding should be added between the unit base and the slab","Units should be mechanically fixed to the slab or foundations and not rely wholly on frictional resistance"],"correct":3,"explanation":"Clause 11.3.3.2 states volumetric units should be mechanically fixed to the supporting slab or foundations and should not rely wholly on frictional resistance to resist sliding.","ref":"11.3.3.2","why":"Relying on self-weight and friction alone risks units sliding under wind or lateral load, especially if bearing surfaces are wet or dusty, so mechanical fixings give a guaranteed, checkable load path down to the foundations.","source":"NHBC Standards 2026","sourceShort":"NHBC","refLabel":"Clause"},{"id":"11.3-03","chapter":"11.3","chapterTitle":"Volumetric systems","part":"Modern Methods of Construction","question":"How may the overall stability of a building formed from volumetric units be provided?","options":["By the fully braced volumetric units, or by connection to an independent bracing system such as a building core, shear walls or stability frames","By diaphragm action of the external cladding alone","By the frictional interlock between stacked units","By tying the units into a masonry outer leaf at each storey"],"correct":0,"explanation":"Clause 11.3.3.1 states overall stability should be provided by either the fully braced volumetric units or connection to an independent bracing system such as a building core, shear walls and/or stability frame(s).","ref":"11.3.3.1","why":"Individual volumetric boxes often can't resist all the lateral wind load of a multi-storey building on their own, so a clear bracing route to the ground, such as a core or shear walls, is needed or the building could rack or lean.","source":"NHBC Standards 2026","sourceShort":"NHBC","refLabel":"Clause"},{"id":"11.3-04","chapter":"11.3","chapterTitle":"Volumetric systems","part":"Modern Methods of Construction","question":"At compartment walls, where should fire-stopping be provided at the base of volumetric units?","options":["Only where the cavity exceeds 25mm in width","At the mid-height of the ground floor units","To seal any gaps between the underside of units and the tops of foundations or substructure walls","Only where a timber frame backing wall is used"],"correct":2,"explanation":"Clause 11.3.5.1 states that at compartment walls fire-stopping should be provided to seal any gaps between the underside of units and the tops of foundations or substructure walls.","ref":"11.3.5.1","why":"Any gap left under a unit at a compartment wall gives fire and smoke a hidden route to bypass the compartment line into the unit or dwelling below, defeating the whole point of that fire separation.","source":"NHBC Standards 2026","sourceShort":"NHBC","refLabel":"Clause"},{"id":"11.3-05","chapter":"11.3","chapterTitle":"Volumetric systems","part":"Modern Methods of Construction","question":"Factory installed cavity barriers and fire-stopping may be damaged or dislodged during transport and installation of volumetric units. What should manufacturers and installers allow for?","options":["Replacement of all cavity barriers with site installed barriers as standard","Suitable access to inspect and verify concealed cavity barriers and fire-stopping post-installation","A 25% overprovision of cavity barriers in the factory to compensate","Certification of the barriers by the transport company before delivery"],"correct":1,"explanation":"Clause 11.3.5.1 states that as factory installed cavity barriers or fire-stopping may be damaged or dislodged during transportation or installation, manufacturers and installers should allow for suitable access to inspect and verify them post-installation.","ref":"11.3.5.1","why":"Craning and transporting units can knock factory-fitted fire-stopping loose with no visible sign from outside, so without a way to inspect it afterwards a critical fire safety barrier could be silently missing once people move in.","source":"NHBC Standards 2026","sourceShort":"NHBC","refLabel":"Clause"},{"id":"11.3-06","chapter":"11.3","chapterTitle":"Volumetric systems","part":"Modern Methods of Construction","question":"How should soil pipes running horizontally through a floor void above or below a habitable room be treated for sound insulation?","options":["Wrapped in at least 25mm of mineral wool (minimum 10kg/m3) and supported clear of the floor decking or ceiling","Wrapped in at least 15mm of mineral wool (minimum 10kg/m3) and clipped to the floor decking","Wrapped in at least 25mm of mineral wool (minimum 33kg/m3) and rested on the ceiling boards","Wrapped in at least 50mm of glass fibre quilt and fixed tight against the joists"],"correct":0,"explanation":"Clause 11.3.6 states all soil pipes running horizontally through a floor void above or below a habitable room should be wrapped in at least 25mm of mineral wool (10kg/m3 minimum) and be adequately supported to avoid contact with the floor decking or ceiling.","ref":"11.3.6","why":"An unwrapped soil pipe running through a floor void carries flushing and flow noise straight into rooms above or below, and once the floor is closed up that noise complaint is very costly to fix retrospectively.","source":"NHBC Standards 2026","sourceShort":"NHBC","refLabel":"Clause"},{"id":"11.3-07","chapter":"11.3","chapterTitle":"Volumetric systems","part":"Modern Methods of Construction","question":"Sound reduction is recommended between bedrooms and rooms containing a WC. In which situation does this NOT apply?","options":["Where the room containing the WC adjoins a study","Where the internal walls are proprietary partitions","Where the WC is on a different storey to the bedroom","Where the WC is an ensuite serving that bedroom"],"correct":3,"explanation":"Clause 11.3.6 requires the recommended sound reduction between bedrooms and rooms that include a WC, except where the WC is an ensuite serving that bedroom.","ref":"11.3.6","why":"WC use, especially flushing at night, is a common source of noise disturbance, so sound separation protects sleep in adjoining bedrooms, though it's relaxed for an ensuite since only that room's own occupant is affected.","source":"NHBC Standards 2026","sourceShort":"NHBC","refLabel":"Clause"},{"id":"11.3-08","chapter":"11.3","chapterTitle":"Volumetric systems","part":"Modern Methods of Construction","question":"For timber frame volumetric structures, how should the shrinkage and associated gap sizes needed to accommodate differential settlement be determined?","options":["By applying the standard allowances for platform timber frame in Clause 6.2.8","By using the manufacturer's rule of thumb of 6mm per storey","By specialist calculation","By measurement on site after the first heating season"],"correct":2,"explanation":"Clause 11.3.7 states that for timber frame volumetric structures the shrinkage and associated gap sizes to accommodate differential settlement should be subject to specialist calculation, as shrinkage can exceed that of traditional platform framed buildings.","ref":"11.3.7","why":"Stacked timber volumetric units accumulate shrinkage from many more layers of timber drying out than a platform-framed house, so getting the calculated gap sizes wrong risks cracked linings, jammed doors and windows, or overstressed staircases and services as the building settles.","source":"NHBC Standards 2026","sourceShort":"NHBC","refLabel":"Clause"},{"id":"11.3-09","chapter":"11.3","chapterTitle":"Volumetric systems","part":"Modern Methods of Construction","question":"For light steel frame volumetric walls, locally raised ground levels (up to the internal floor finish) to accommodate level thresholds can be accepted up to what proportion of the external perimeter of an individual building?","options":["Less than 10%","Less than 15%","Less than 20%","Less than 25%"],"correct":1,"explanation":"Clause 11.3.8.2 states locally raised ground levels to less than 15% of the external perimeter (of an individual building, measured on plan) to accommodate level thresholds can be accepted, with the cavity kept clear and draining.","ref":"11.3.8.2","why":"Raising ground against a light steel frame wall risks bridging the damp course and trapping moisture against the steel, causing corrosion, so limiting how much of the perimeter can be raised keeps that risk in check while still allowing level thresholds.","source":"NHBC Standards 2026","sourceShort":"NHBC","refLabel":"Clause"},{"id":"11.3-10","chapter":"11.3","chapterTitle":"Volumetric systems","part":"Modern Methods of Construction","question":"What minimum clear cavity width should be provided between the insulation and masonry cladding on a volumetric system?","options":["25mm","40mm","50mm","75mm"],"correct":2,"explanation":"Clause 11.3.8.1 (Table 1) requires a minimum cavity width of 50mm between the cladding and insulation where masonry cladding is used.","ref":"11.3.8.1","why":"An inadequate cavity behind masonry cladding stops wind-driven rain that gets through the brickwork from draining and evaporating away, risking saturation of the insulation and structure behind it.","source":"NHBC Standards 2026","sourceShort":"NHBC","refLabel":"Clause"},{"id":"11.3-11","chapter":"11.3","chapterTitle":"Volumetric systems","part":"Modern Methods of Construction","question":"Where staircases are factory installed into volumetric units, how should the top nosing of the staircase be positioned?","options":["Set 5mm below the floor decking to allow for shrinkage","Proud of the floor decking by up to 3mm to protect the decking edge","Set back from the decking edge and left loose until final fix","Level with the floor decking and fixed firmly"],"correct":3,"explanation":"Clause 11.3.13 states the top nosing of staircases should be level with the floor decking and fixed firmly.","ref":"11.3.13","why":"A nosing that's proud, sunken, or not firmly fixed creates a trip hazard right at the top of the stairs, one of the highest-risk points in the home, and could work loose over time with everyday use.","source":"NHBC Standards 2026","sourceShort":"NHBC","refLabel":"Clause"},{"id":"11.3-12","chapter":"11.3","chapterTitle":"Volumetric systems","part":"Modern Methods of Construction","question":"Prefabricated wiring systems in volumetric units should be tested and installed in accordance with which standard?","options":["BS 7671","BS 8488","BS 6398","BS EN 13859"],"correct":1,"explanation":"Clause 11.3.18.1 states prefabricated wiring systems should be tested and installed in accordance with BS 8488, with the manufacturer detailing which connectors should remain accessible for inspection, testing and maintenance.","ref":"11.3.18.1","why":"Factory-made wiring is buried inside the finished unit and can't be visually checked like traditional first-fix wiring, so testing to BS 8488 and defining which connectors stay accessible is the only way to confirm it's safe before it's sealed in.","source":"NHBC Standards 2026","sourceShort":"NHBC","refLabel":"Clause"},{"id":"11.3-13","chapter":"11.3","chapterTitle":"Volumetric systems","part":"Modern Methods of Construction","question":"Where factory installed lightweight claddings extend to the edges of units, what is the maximum deviation from the nominal design width of the interface joint in any unit edge width or height up to 3m?","options":["Plus or minus 3mm","Plus or minus 5mm","Plus or minus 6mm","Plus or minus 10mm"],"correct":2,"explanation":"Clause 11.3.11.4 states cladding interfaces should be adequately straight in elevation, with a maximum plus or minus 6mm deviation from the nominal design width in any unit edge width or height up to 3m.","ref":"11.3.11.4","why":"Excess deviation between adjoining unit claddings creates visible gaps or misalignment at the joint that can let water track in, and once units are craned into final position there's very little scope left to correct it.","source":"NHBC Standards 2026","sourceShort":"NHBC","refLabel":"Clause"},{"id":"6.2-15","chapter":"6.2","chapterTitle":"External timber framed walls","part":"Superstructure (excluding roofs)","question":"Where masonry cladding is used on a timber frame, where may additional studs be required in the wall panels?","options":["At corners only, to support the cavity barriers","At openings and vertical movement joints, to fix wall ties","At floor zones, to carry the ring beam","At gable panels, to support the verge trusses"],"correct":1,"explanation":"Clause 6.2.4.1 states that where masonry cladding is used, additional studs may be required at openings and vertical movement joints to fix wall ties.","ref":"6.2.4.1","why":"Openings and movement joints break the regular stud line, so extra studs are needed to give wall ties solid timber to fix into on both sides, keeping the masonry properly restrained at those weak points.","source":"NHBC Standards 2026","sourceShort":"NHBC","refLabel":"Clause"},{"id":"6.2-16","chapter":"6.2","chapterTitle":"External timber framed walls","part":"Superstructure (excluding roofs)","question":"When shotfiring the sole plate into masonry, what minimum crushing strength should the solid concrete blocks positioned to receive the fixings have?","options":["2.9N/mm²","3.6N/mm²","7.3N/mm²","10.4N/mm²"],"correct":2,"explanation":"Clause 6.2.5 states that where shotfiring into masonry, solid concrete blocks should be specified as BS EN 771 with a minimum crushing strength of 7.3N/mm² and positioned to receive the fixings.","ref":"6.2.5","why":"A block below 7.3N/mm2 crushing strength can spall or fail to hold a shot-fired pin, leaving the sole plate poorly anchored and unable to resist the wind and racking forces it's meant to transfer.","source":"NHBC Standards 2026","sourceShort":"NHBC","refLabel":"Clause"},{"id":"6.2-17","chapter":"6.2","chapterTitle":"External timber framed walls","part":"Superstructure (excluding roofs)","question":"How does the standard permit a prefabricated chimney on a timber framed home to be supported?","options":["By the masonry cladding, or by the timber frame including any roof construction supported by the frame","Only by an independent steel frame taken down to the foundations","Only by a masonry stack isolated from both the frame and the cladding","By proprietary brackets fixed directly to the sheathing boards"],"correct":0,"explanation":"Clause 6.2.4.7 states prefabricated chimneys should be supported by masonry cladding, or by the timber frame, including any roof construction supported by the timber frame.","ref":"6.2.4.7","why":"A prefabricated chimney is a heavy, rigid point load; without a defined structural path through masonry or the frame it can settle unevenly and crack flue joints, risking a fire or carbon monoxide leak.","source":"NHBC Standards 2026","sourceShort":"NHBC","refLabel":"Clause"},{"id":"6.2-18","chapter":"6.2","chapterTitle":"External timber framed walls","part":"Superstructure (excluding roofs)","question":"With masonry cladding and solid timber floor joists, what differential movement gap should be provided at second floor level in the absence of project-specific calculations?","options":["15mm","20mm","25mm","35mm"],"correct":3,"explanation":"Table 1 in Clause 6.2.8 gives an opening and closing gap of 35mm at second floor level for solid timber joists with masonry cladding; 25mm is the figure for engineered I-joists at that level.","ref":"6.2.8","table":"ch62-t1","why":"Shrinkage is cumulative up the building, so the gap grows with height to keep pace with the extra timber drying out below each floor, preventing the brick above from being crushed as the frame settles.","source":"NHBC Standards 2026","sourceShort":"NHBC","refLabel":"Clause"},{"id":"6.2-19","chapter":"6.2","chapterTitle":"External timber framed walls","part":"Superstructure (excluding roofs)","question":"A timber frame building with masonry cladding uses solid timber floor joists. What is required for the differential movement gap at fourth floor level?","options":["A 45mm opening and closing gap","A 53mm opening and closing gap","A 61mm opening and closing gap","Specialist calculations to be submitted to NHBC"],"correct":3,"explanation":"Table 1 in Clause 6.2.8 requires specialist calculations, based on BS EN 1995-1-1, to be submitted to NHBC for solid timber joists above third floor level; the millimetre figures given at fourth to sixth floor apply only to engineered I-joists.","ref":"6.2.8","table":"ch62-t1","why":"Solid sawn joists shrink less predictably than engineered ones at height because of higher moisture content and cross-grain movement, so project-specific engineering replaces the standard table above third floor.","source":"NHBC Standards 2026","sourceShort":"NHBC","refLabel":"Clause"},{"id":"6.2-20","chapter":"6.2","chapterTitle":"External timber framed walls","part":"Superstructure (excluding roofs)","question":"How is the differential movement gap at the eaves or verge determined for a timber frame building with masonry cladding?","options":["Add 5mm to the gap dimension at the level below","Add 10mm to the gap dimension at the level below","Use the same gap as the level below","Use a fixed 30mm gap regardless of building height"],"correct":0,"explanation":"Table 1 in Clause 6.2.8 states that at the eaves or verge, 5mm should be added to the gap dimension at the level below.","ref":"6.2.8","table":"ch62-t1","why":"The roof sits above every floor's accumulated shrinkage, so eaves and verges need an extra allowance on top of the topmost floor gap or the roof will bear down on the brickwork as the frame settles.","source":"NHBC Standards 2026","sourceShort":"NHBC","refLabel":"Clause"},{"id":"6.2-21","chapter":"6.2","chapterTitle":"External timber framed walls","part":"Superstructure (excluding roofs)","question":"The standard differential movement gaps for masonry cladding on timber frame assume outer leaf brickwork with an expansion rate no greater than what?","options":["1.5mm per storey","2.5mm per storey","4mm per storey","5mm per storey"],"correct":1,"explanation":"Clause 6.2.8 states Table 1 is based on outer leaf brickwork with expansion rates no greater than 2.5mm per storey, and the common details take upward clay brick expansion as 2.5mm per storey.","ref":"6.2.8","table":"ch62-t1","why":"Clay brick itself expands slightly and permanently as it absorbs moisture over time; ignoring this on top of frame shrinkage would understate the true gap needed and risk cracked or crushed brickwork.","source":"NHBC Standards 2026","sourceShort":"NHBC","refLabel":"Clause"},{"id":"6.2-22","chapter":"6.2","chapterTitle":"External timber framed walls","part":"Superstructure (excluding roofs)","question":"The standard differential movement gap sizes for masonry cladding on timber frame are based on brickwork up to how many storeys?","options":["Three storeys","Four storeys","Five storeys","Seven storeys"],"correct":2,"explanation":"Clause 6.2.8 states Table 1 is based on brickwork up to five storeys, with lightweight cladding above five storeys.","ref":"6.2.8","table":"ch62-t1","why":"The standard gaps are only proven up to five storeys of brick; beyond that the combined shrinkage and brick expansion becomes too large for these standard details, so lightweight cladding or bespoke calculations take over.","source":"NHBC Standards 2026","sourceShort":"NHBC","refLabel":"Clause"},{"id":"6.2-23","chapter":"6.2","chapterTitle":"External timber framed walls","part":"Superstructure (excluding roofs)","question":"The standard differential movement gap sizes assume a concrete ground floor. Where the ground floor is built with solid timber joists, how much should be added to the gaps?","options":["5mm","10mm","15mm","20mm"],"correct":2,"explanation":"Clause 6.2.8 states Table 1 assumes the ground floor is concrete, and for ground floors of timber joists 15mm should be added for solid timber and 10mm for engineered timber joists.","ref":"6.2.8","table":"ch62-t1","why":"A timber ground floor adds its own drying shrinkage over the void, unlike a rigid concrete slab, so extra allowance is needed or the floor's movement will add to the frame's and close up the gap.","source":"NHBC Standards 2026","sourceShort":"NHBC","refLabel":"Clause"},{"id":"6.2-24","chapter":"6.2","chapterTitle":"External timber framed walls","part":"Superstructure (excluding roofs)","question":"The movement gap between the top of the brickwork and the eaves soffit will be more than 10mm and is not protected by a purposely designed overhang. What does the standard require?","options":["The gap should be pointed up with a mortar fillet","The gap should be closed with a rigid PVC trim fixed to the brickwork","The gap can be left fully open to ventilate the cavity","The gap should be protected with a flexible compressible filler or mesh to prevent the entry of birds"],"correct":3,"explanation":"Clause 6.2.8 states that where a movement gap between the top of masonry cladding and the eaves or verge soffit exceeds 10mm and is not protected by a purposely designed overhang, it should be protected with a compressible filler or mesh to prevent the entry of birds, which must be flexible so as not to inhibit differential movement.","ref":"6.2.8","why":"A gap over 10mm left open invites birds and vermin into the wall or roof void, but any filler used must stay flexible or it will jam solid and resist the very shrinkage movement it's meant to accommodate.","source":"NHBC Standards 2026","sourceShort":"NHBC","refLabel":"Clause"},{"id":"6.2-25","chapter":"6.2","chapterTitle":"External timber framed walls","part":"Superstructure (excluding roofs)","question":"On a timber frame home with brick cladding, how should the window sills be detailed to deal with differential movement?","options":["The sill should not be built into the masonry, and an allowance for movement should be provided","The sill should be built into the masonry by a minimum of 50mm at each end","The sill should be bedded on mortar directly on the outer leaf","The sill should be rigidly fixed to both the frame and the cladding"],"correct":0,"explanation":"The movement details in Clause 6.2.8 show that with masonry cladding the window sill should not be built into the masonry and an allowance for movement should be provided, because the timber frame moves down while the brickwork expands upward.","ref":"6.2.8","why":"If the sill were built into the brickwork, the frame dropping as it dries and the brick rising as it expands would jam against each other, cracking the sill or the masonry beneath the window.","source":"NHBC Standards 2026","sourceShort":"NHBC","refLabel":"Clause"},{"id":"6.2-26","chapter":"6.2","chapterTitle":"External timber framed walls","part":"Superstructure (excluding roofs)","question":"Where a flat roof on the timber frame abuts masonry, what minimum upstand cover must be maintained after differential movement has occurred?","options":["50mm","65mm","75mm","100mm"],"correct":2,"explanation":"The movement details in Clause 6.2.8 require the flat roof to masonry abutment to allow for movement while maintaining a minimum 75mm cover after movement.","ref":"6.2.8","why":"Keeping 75mm of cover after the frame has shrunk stops the upstand being lost, which would let rain overtop the flashing at the roof-to-wall junction and get into the building.","source":"NHBC Standards 2026","sourceShort":"NHBC","refLabel":"Clause"},{"id":"6.2-27","chapter":"6.2","chapterTitle":"External timber framed walls","part":"Superstructure (excluding roofs)","question":"What does the standard say about fixing a juliette balcony support to the masonry cladding of a timber framed home?","options":["It is never acceptable to fix balcony supports to masonry cladding","It may be fixed to the masonry cladding subject to the engineer's design","It should be fixed through the cladding into the studs using rigid bolts","It should be supported only on posts independent of the building"],"correct":1,"explanation":"The balcony details in Clause 6.2.8 show a juliette balcony support fixed to the masonry cladding subject to the engineer's design.","ref":"6.2.8","why":"Masonry cladding isn't designed to carry balcony loads and moves independently of the frame, so an engineer must size the fixing to avoid overloading or cracking the brick skin as it settles and expands.","source":"NHBC Standards 2026","sourceShort":"NHBC","refLabel":"Clause"},{"id":"6.2-28","chapter":"6.2","chapterTitle":"External timber framed walls","part":"Superstructure (excluding roofs)","question":"When specifying compressible filler materials for movement joints, what should the specification be based on?","options":["The nominal gap size as built","The width of the wall cavity","The maximum gap before any movement occurs","The anticipated residual gap size after movement has occurred"],"correct":3,"explanation":"Clause 6.2.8 states that where compressible filler materials are specified, they should be specified based on the anticipated residual gap size after movement has occurred.","ref":"6.2.8","why":"Sizing filler on the as-built gap ignores that the gap will close as the frame shrinks; an oversized filler then gets crushed solid and starts transmitting load into the brickwork, cracking it.","source":"NHBC Standards 2026","sourceShort":"NHBC","refLabel":"Clause"},{"id":"6.2-29","chapter":"6.2","chapterTitle":"External timber framed walls","part":"Superstructure (excluding roofs)","question":"The installation, position and materials of cavity barriers and fire-stopping in a timber framed wall should be in accordance with what?","options":["The relevant Building Regulations and the design","Table 2 of Chapter 6.2 of the NHBC Standards","The cladding manufacturer's standard details alone","The site manager's judgement based on trade practice"],"correct":0,"explanation":"Clause 6.2.9.1 states the installation, position and materials for cavity barriers and fire-stopping should be in accordance with relevant Building Regulations and the design; Clause 6.2.2 also requires the design information issued to site to include the position and materials for cavity barriers.","ref":"6.2.9.1","why":"Cavity barriers stop fire and smoke racing through the wall's hidden voids and bypassing the building's compartmentation, so wrong materials or gaps in their line let a fire spread far faster than expected.","source":"NHBC Standards 2026","sourceShort":"NHBC","refLabel":"Clause"},{"id":"6.2-30","chapter":"6.2","chapterTitle":"External timber framed walls","part":"Superstructure (excluding roofs)","question":"You are build
