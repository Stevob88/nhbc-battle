:"4.4-04","chapter":"4.4","chapterTitle":"Raft, pile, pier and beam foundations","part":"Foundations","question":"A soft spot is found in the bottom of a foundation trench. What does the standard require?","options":["Fill the soft area with compacted hardcore up to trench bottom level","Cast the foundation as designed and monitor for settlement","Report it to NHBC and suspend all foundation work on site","Deepen the excavation locally to a sound bottom, or reinforce the concrete"],"correct":3,"explanation":"Table 1 in Clause 4.4.7.2 states that at soft spots, excavations should be deepened locally to a sound bottom, or the concrete should be reinforced; hard spots, by contrast, should be removed.","ref":"4.4.7.2","why":"A soft spot has less bearing capacity than the surrounding ground, so left untreated it settles more than the rest of the foundation, cracking walls above through differential settlement.","source":"NHBC Standards 2026","sourceShort":"NHBC","refLabel":"Clause"},{"id":"4.4-05","chapter":"4.4","chapterTitle":"Raft, pile, pier and beam foundations","part":"Foundations","question":"Piles found to be out of position by more than what distance require the engineer to reconsider the adequacy of the foundation design?","options":["50mm","65mm","75mm","100mm"],"correct":2,"explanation":"Clause 4.4.7.3 states that where piles are more than 75mm out of position, or out of alignment by more than 1:75, the engineer should reconsider the adequacy of the foundation design.","ref":"4.4.7.3","why":"Piles well out of position no longer line up with the load paths the design assumed, causing eccentric loading on beams and caps that can overstress the foundation, so the design needs rechecking.","source":"NHBC Standards 2026","sourceShort":"NHBC","refLabel":"Clause"},{"id":"4.4-06","chapter":"4.4","chapterTitle":"Raft, pile, pier and beam foundations","part":"Foundations","question":"Where strip, trench fill or ground beam foundations are used, what minimum clear cavity should be provided below the DPC?","options":["100mm","150mm","175mm","225mm"],"correct":3,"explanation":"Clause 4.4.13 requires a minimum 225mm clear cavity below the DPC where strip, trench fill or ground beams are used; a minimum 150mm clear cavity applies to other foundation types, provided weepholes and other measures allow the cavity to drain freely.","ref":"4.4.13","why":"A shallow cavity lets mortar snots and debris bridge across it, giving damp a path from outside to the inner leaf, so 225mm keeps the cavity clear enough to drain and stay dry.","source":"NHBC Standards 2026","sourceShort":"NHBC","refLabel":"Clause"},{"id":"4.5-01","chapter":"4.5","chapterTitle":"Vibratory ground improvement techniques","part":"Foundations","question":"Clay ground is generally unacceptable for vibratory ground improvement where its Plasticity Index is equal to or greater than what value?","options":["30%","40%","50%","60%"],"correct":1,"explanation":"Table 2 in Clause 4.5.6.1 lists ground with a Plasticity Index of 40% or greater as not generally acceptable for treatment.","ref":"4.5.6.1","why":"Very plastic clay is too sticky and cohesive for the vibrating poker to densify like granular soil, so treatment doesn't actually improve it and can just remould it into a weaker, unpredictable mass.","source":"NHBC Standards 2026","sourceShort":"NHBC","refLabel":"Clause"},{"id":"4.5-02","chapter":"4.5","chapterTitle":"Vibratory ground improvement techniques","part":"Foundations","question":"Intermediate layers of peat within the length of a stone column make the ground generally unacceptable for vibro treatment when their thickness exceeds what?","options":["100mm","150mm","200mm","300mm"],"correct":2,"explanation":"Clause 4.5.6.1 states ground is not generally acceptable where intermediate layers of peat are thicker than 200mm, either as a single layer or as the sum of individual layers throughout the length of the stone column.","ref":"4.5.6.1","why":"Peat keeps compressing and decaying long after the column is formed, so a thick peat layer under the column base causes ongoing settlement that undermines the foundation regardless of how well the stone was compacted.","source":"NHBC Standards 2026","sourceShort":"NHBC","refLabel":"Clause"},{"id":"4.5-03","chapter":"4.5","chapterTitle":"Vibratory ground improvement techniques","part":"Foundations","question":"Where soils have a Modified Plasticity Index of what value or greater should foundations on vibro-treated ground be designed to accommodate volume changes?","options":["10%","15%","20%","25%"],"correct":0,"explanation":"Clause 4.5.6.2 states that for soils with a Modified Plasticity Index of 10% or greater, foundations should be designed to accommodate volume changes.","ref":"4.5.6.2","why":"Highly plastic soils shrink and swell as moisture changes, similar to shrinkable clay, so even after vibro treatment the ground can still heave or settle seasonally unless the foundation is designed to cope with that movement.","source":"NHBC Standards 2026","sourceShort":"NHBC","refLabel":"Clause"},{"id":"4.5-04","chapter":"4.5","chapterTitle":"Vibratory ground improvement techniques","part":"Foundations","question":"Which foundation types are suitable for homes built on ground treated with vibro stone columns?","options":["Mass concrete trench fill or pad and beam foundations","Reinforced concrete strip, or reinforced concrete raft or semi-raft foundations","Unreinforced strip foundations laid on compressible board","Any foundation type, provided the stone columns pass load testing"],"correct":1,"explanation":"Clause 4.5.7.3 states only two types of foundation are suitable: a reinforced concrete strip foundation, or a reinforced concrete raft or semi-raft foundation positioned on a uniformly compacted bed of hardcore.","ref":"4.5.7.3","why":"Ground between stone columns stays untreated and less stiff than the columns themselves, so only a properly reinforced strip or raft can span this variable stiffness without cracking where support changes abruptly.","source":"NHBC Standards 2026","sourceShort":"NHBC","refLabel":"Clause"},{"id":"4.5-05","chapter":"4.5","chapterTitle":"Vibratory ground improvement techniques","part":"Foundations","question":"What does the standard say about ground floors for homes where vibratory ground improvement has been carried out?","options":["Ground-bearing slabs are acceptable where columns are at a maximum of 2m centres","Ground-bearing slabs are acceptable on a compacted hardcore bed","Suspended floors are only needed where the fill depth exceeds 600mm","Suspended ground floors should be provided unless the engineer substantiates an alternative acceptable to NHBC"],"correct":3,"explanation":"Clause 4.5.7.4 requires suspended ground floors for all homes where vibratory ground improvement has been conducted, unless the engineer can substantiate an alternative solution that is acceptable to NHBC.","ref":"4.5.7.4","why":"A ground-bearing slab sitting directly on alternating stiff columns and softer untreated ground between them can crack from differential settlement; a suspended floor spans clear of this variability instead of relying on it.","source":"NHBC Standards 2026","sourceShort":"NHBC","refLabel":"Clause"},{"id":"4.5-06","chapter":"4.5","chapterTitle":"Vibratory ground improvement techniques","part":"Foundations","question":"In the dry top feed method, how deep is each 'charge' of stone generally placed in the borehole before being compacted?","options":["300-500mm","500-800mm","800-1,000mm","1,000-1,500mm"],"correct":1,"explanation":"Clause 4.5.8 states that in the dry top feed method the charge of stone is generally 500-800mm deep, with successive charges added and compacted to bring the column up to working level.","ref":"4.5.8","why":"Adding stone in 500-800mm charges lets the vibrator fully compact each layer into the surrounding soil before the next is added, so the whole column depth ends up dense with no weak, poorly rammed sections.","source":"NHBC Standards 2026","sourceShort":"NHBC","refLabel":"Clause"},{"id":"4.5-07","chapter":"4.5","chapterTitle":"Vibratory ground improvement techniques","part":"Foundations","question":"Checks on site show a stone column has been installed 180mm out of alignment. What action does the standard require?","options":["No action, provided the columns are at a maximum of 2m centres","Pack additional stone around the head of the column","Replace it with a new column installed in the correct position","Reduce the design span of the foundation locally"],"correct":2,"explanation":"Clause 4.5.11.2 requires stone columns which are misaligned by more than 150mm in any direction to be replaced, with a new column installed in the correct position.","ref":"4.5.11.2","why":"A column that's badly out of place no longer sits where the design needs it to carry load, meaning part of the foundation could bear on weaker, untreated ground and settle unevenly.","source":"NHBC Standards 2026","sourceShort":"NHBC","refLabel":"Clause"},{"id":"4.5-08","chapter":"4.5","chapterTitle":"Vibratory ground improvement techniques","part":"Foundations","question":"A variation in the quantity of backfill used in compaction points of the same length must be recorded and reported to the engineer and specialist contractor when it exceeds what?","options":["25%","30%","40%","50%"],"correct":3,"explanation":"Table 3 in Clause 4.5.11.3 requires a variation of over 50% in the quantity of backfill used in compaction points of the same length to be recorded and reported as soon as possible, and no later than the end of the working day of occurrence.","ref":"4.5.11.3","why":"Needing much more or less backfill than expected for a similar column length usually means unexpected voids, softer ground or obstructions, which can mean the column isn't properly formed and won't carry the load assumed.","source":"NHBC Standards 2026","sourceShort":"NHBC","refLabel":"Clause"},{"id":"4.5-09","chapter":"4.5","chapterTitle":"Vibratory ground improvement techniques","part":"Foundations","question":"What is the minimum frequency for 600mm diameter plate tests on stone columns or treated ground?","options":["At least one test per day per rig","At least one test per week per rig","At least one test per ten stone columns","At least one test per home plot"],"correct":0,"explanation":"Table 4 in Clause 4.5.13.1 states 600mm diameter plate tests should be carried out on stone columns or treated ground at a frequency of at least one test per day per rig; mini zone tests are at least one per week per rig.","ref":"4.5.13.1","why":"Daily plate testing catches poor column workmanship or changing ground conditions as the rig moves across the site, before defective columns get built over and become impossible to inspect or fix.","source":"NHBC Standards 2026","sourceShort":"NHBC","refLabel":"Clause"},{"id":"4.6-01","chapter":"4.6","chapterTitle":"Engineered fill","part":"Foundations","question":"Under the definitions used for engineered fill, cohesive fill contains more than what proportion of fines passing a 0.063mm sieve?","options":["10%","15%","20%","25%"],"correct":1,"explanation":"The definitions in Chapter 4.6 describe cohesive fill as comprising greater than 15% fines passing a 0.063mm sieve, while granular fill has less than 15% fines.","ref":"4.6","why":"Fine, cohesive soil is far more sensitive to moisture than granular material — too wet it's weak, too dry it can later collapse when wetted — so classifying it early flags where tighter moisture control on site is essential.","source":"NHBC Standards 2026","sourceShort":"NHBC","refLabel":"Clause"},{"id":"4.6-02","chapter":"4.6","chapterTitle":"Engineered fill","part":"Foundations","question":"How long before filling starts should the earthworks specification and accompanying information be submitted to NHBC?","options":["At least 2 weeks","At least 4 weeks","At least 6 weeks","At least 8 weeks"],"correct":3,"explanation":"Clause 4.6.2 requires the earthworks specification and accompanying information, including relevant drawings, to be submitted to NHBC at least eight weeks prior to the commencement of filling or associated works.","ref":"4.6.2","why":"Eight weeks lets NHBC review the ground design before irreversible filling starts, catching problems on paper rather than after fill is already down and would need costly digging out and redoing.","source":"NHBC Standards 2026","sourceShort":"NHBC","refLabel":"Clause"},{"id":"4.6-03","chapter":"4.6","chapterTitle":"Engineered fill","part":"Foundations","question":"Most residential earthworks are classified as Geotechnical Category 2. What document must be prepared and submitted to NHBC for a Geo Cat 2 project?","options":["A geotechnical design statement","An earthworks method statement only","A geotechnical design report","A materials classification assessment only"],"correct":2,"explanation":"Clause 4.6.7.1 states that where the scope of the earthworks is defined as Geo Cat 2 or 3, a Geotechnical design report (GDR) shall be prepared and submitted to NHBC; a Geotechnical design statement is only for Geo Cat 1.","ref":"4.6.7.1","why":"Where fill directly carries the building's foundations there's real settlement risk, so a full report with proper data and justification is needed to prove the ground will perform, not just a brief summary statement.","source":"NHBC Standards 2026","sourceShort":"NHBC","refLabel":"Clause"},{"id":"4.6-04","chapter":"4.6","chapterTitle":"Engineered fill","part":"Foundations","question":"Before filling, excessively wet or soft soils should be removed from the formation level where their undrained shear strength is less than what value, unless they are treated?","options":["20kPa","30kPa","40kPa","50kPa"],"correct":2,"explanation":"Clause 4.6.5.1 lists excessively wet or soft soils, such as silty soils or clays with an undrained shear strength of less than 40kPa, as unsuitable materials to be removed where untreated.","ref":"4.6.5.1","why":"Soil this weak can't support the fill or building loads above without excessive settlement or shearing away underneath, so it has to come out or be improved before anything is built on top of it.","source":"NHBC Standards 2026","sourceShort":"NHBC","refLabel":"Clause"},{"id":"4.6-05","chapter":"4.6","chapterTitle":"Engineered fill","part":"Foundations","question":"Where relic structures cannot practicably be removed from beneath engineered fill, what is the minimum depth they must be below the underside of proposed building foundations?","options":["1m","1.5m","1.8m","2m"],"correct":3,"explanation":"Clause 4.6.5.2 requires any retained relic structure or obstructions to be a minimum of 2m beneath the underside of proposed building foundations, with their locations surveyed and accurately recorded.","ref":"4.6.5.2","why":"A buried structure left too close to the surface acts as a hard spot that carries load differently to the fill around it, causing uneven settlement right where the building bears down.","source":"NHBC Standards 2026","sourceShort":"NHBC","refLabel":"Clause"},{"id":"4.6-06","chapter":"4.6","chapterTitle":"Engineered fill","part":"Foundations","question":"Which statement about the use of Pulverised Fuel Ash (PFA) as engineered fill is correct?","options":["Conditioned or stockpiled PFA must not be placed below the water table or where it is at risk of saturation","Lagoon PFA is preferred because its moisture content is already high","PFA may be placed below the water table provided it is well compacted","PFA needs no geotechnical assessment because it is a processed by-product"],"correct":0,"explanation":"Clause 4.6.5.5 states that conditioned or stockpiled PFA must not be placed as fill below the water table or where it is at risk of saturation from rising water levels or inundation by surface waters; lagoon PFA is listed as unsuitable in Table 3.","ref":"4.6.5.5","why":"PFA that later becomes saturated by rising groundwater can collapse or wash out its fine particles, causing sudden settlement of the fill and everything built above it, so it must stay clear of the water table.","source":"NHBC Standards 2026","sourceShort":"NHBC","refLabel":"Clause"},{"id":"4.6-07","chapter":"4.6","chapterTitle":"Engineered fill","part":"Foundations","question":"Which type of chalk is generally acceptable to NHBC as a source of engineered fill?","options":["Structureless chalk of grades Dm and Dc","Structured chalk of grades C5 to A1","Any chalk, provided it is placed in 250mm layers","Chalk blended with lagoon PFA to control moisture"],"correct":1,"explanation":"Table 3 in Clause 4.6.6.1 lists structured chalk of grades C5 to A1 only as a suitable source for fill, while structureless chalk (grades Dm and Dc) is listed as an unsuitable fill material.","ref":"4.6.6.1","why":"Structured chalk keeps its grain skeleton and strength when compacted, but structureless chalk breaks down into a weak, putty-like mass when worked or wetted, losing the bearing capacity foundations rely on.","source":"NHBC Standards 2026","sourceShort":"NHBC","refLabel":"Clause"},{"id":"4.6-08","chapter":"4.6","chapterTitle":"Engineered fill","part":"Foundations","question":"Fill containing topsoil or significant organic matter is not acceptable as engineered fill where the organic content exceeds what proportion by volume?","options":["2%","4%","6%","10%"],"correct":2,"explanation":"Table 3 in Clause 4.6.6.1 lists soils containing topsoil or significant organic matter (such as leaves or wood) greater than 6% by volume as unsuitable fill materials.","ref":"4.6.6.1","why":"Organic matter rots away over years, shrinking in volume and leaving voids that cause slow, ongoing settlement long after the building is finished — a hidden failure that isn't visible when the fill first goes in.","source":"NHBC Standards 2026","sourceShort":"NHBC","refLabel":"Clause"},{"id":"4.6-09","chapter":"4.6","chapterTitle":"Engineered fill","part":"Foundations","question":"When treating fill materials to adjust their moisture content, what is the typical maximum addition of lime and/or cement acceptable to NHBC?","options":["2% by weight","4% by weight","5% by weight","10% by weight"],"correct":0,"explanation":"Clause 4.6.6.2 permits the addition of lime and/or cement typically up to 2% by weight to bring the moisture content nearer the optimum; stabilisation with over 2% lime or any cement to improve strength is not acceptable.","ref":"4.6.6.2","why":"A small dose of lime or cement just dries out over-wet material to hit the right compaction moisture; going higher starts chemically strengthening the soil, changing its long-term behaviour in ways standard fill testing doesn't cover.","source":"NHBC Standards 2026","sourceShort":"NHBC","refLabel":"Clause"},{"id":"4.6-10","chapter":"4.6","chapterTitle":"Engineered fill","part":"Foundations","question":"How does NHBC require a performance specification for earthworks to be used?","options":["On its own, as it already covers long-term requirements","In combination with an end product specification","In combination with a method specification","Only for landscape fill areas"],"correct":1,"explanation":"Clause 4.6.7.3 states that NHBC requires a performance specification to be used in combination with an end product specification.","ref":"4.6.7.3","why":"Passing an end product density check only proves the fill was compacted right on the day; pairing it with a performance spec checks the fill actually limits settlement in service, catching problems density alone can miss.","source":"NHBC Standards 2026","sourceShort":"NHBC","refLabel":"Clause"},{"id":"4.6-11","chapter":"4.6","chapterTitle":"Engineered fill","part":"Foundations","question":"Using a 4.5kg rammer test, what are the minimum end product acceptance criteria for engineered fill supporting building foundations?","options":["Greater than 90% maximum dry density and less than 10% air voids","Greater than 92% maximum dry density and less than 8% air voids","Greater than 95% maximum dry density and less than 5% air voids","Greater than 98% maximum dry density and less than 3% air voids"],"correct":2,"explanation":"Table 6 in Clause 4.6.7.3 requires fill for building foundations to achieve greater than 95% maximum dry density and less than 5% air voids with a 4.5kg or vibrating rammer (greater than 98% MDD applies to the 2.5kg rammer).","ref":"4.6.7.3","why":"Fill left with more air voids than this can later collapse or let water in, causing settlement under the building, so hitting these density and void limits keeps the ground stable long-term.","source":"NHBC Standards 2026","sourceShort":"NHBC","refLabel":"Clause"},{"id":"4.6-12","chapter":"4.6","chapterTitle":"Engineered fill","part":"Foundations","question":"What is the acceptable minimum depth of engineered fill beneath building foundations?","options":["300mm","450mm","500mm","600mm"],"correct":3,"explanation":"The note to Table 7 in Clause 4.6.7.3 states the acceptable minimum depth of engineered fill beneath building foundations is 600mm.","ref":"4.6.7.3","why":"600mm of properly tested fill gives enough verified, well-compacted material directly under the foundation to spread the load reliably, rather than the foundation partly bearing on unchecked ground of unknown behaviour.","source":"NHBC Standards 2026","sourceShort":"NHBC","refLabel":"Clause"},{"id":"4.6-13","chapter":"4.6","chapterTitle":"Engineered fill","part":"Foundations","question":"Engineered fill covered by this chapter should be capable of supporting foundation loads from buildings of up to how many storeys or equivalent weight?","options":["Two storeys","Three storeys","Four storeys","Five storeys"],"correct":1,"explanation":"Clause 4.6.8.1 states engineered fill covered within the chapter should be capable of supporting foundation loads from buildings of three storeys or equivalent weight.","ref":"4.6.8.1","why":"The compaction rules and foundation types in this chapter are calibrated for typical low-rise loads; heavier buildings impose more load and settlement risk than the standard testing regime is designed to cover safely.","source":"NHBC Standards 2026","sourceShort":"NHBC","refLabel":"Clause"},{"id":"4.6-14","chapter":"4.6","chapterTitle":"Engineered fill","part":"Foundations","question":"A groundworker suggests using an unreinforced strip foundation on engineered fill that has passed all compaction testing. What is NHBC's position?","options":["Unreinforced strips are not acceptable under any circumstances — all foundations on engineered fill must be reinforced","They are acceptable where all compaction results exceed 95% maximum dry density","They are acceptable if the fill is granular and less than 2m deep","They are acceptable subject to a plate load test at each plot"],"correct":0,"explanation":"Clause 4.6.8.2 states all foundations on engineered fills should be reinforced to provide the required stiffness, rigidity and robustness; unreinforced strip foundations would not be acceptable to NHBC under any circumstances.","ref":"4.6.8.2","why":"Even well-compacted fill is more variable than natural ground, so foundations need reinforcement to bridge any localised soft spots or uneven settlement without cracking, no matter how good the test results look.","source":"NHBC Standards 2026","sourceShort":"NHBC","refLabel":"Clause"},{"id":"4.6-15","chapter":"4.6","chapterTitle":"Engineered fill","part":"Foundations","question":"What is the normal maximum total settlement between any part of a building foundation and the surrounding ground over the design life of the building?","options":["15mm","20mm","25mm","40mm"],"correct":2,"explanation":"Clause 4.6.8.3 states the total settlement between any part of the building foundation and the surrounding ground or external area should not normally exceed 25mm over the 60-year design life.","ref":"4.6.8.3","why":"This is roughly the level of movement typical brickwork, cladding and finishes can absorb without visibly cracking, so keeping settlement under 25mm protects the building's appearance and structural integrity over its design life.","source":"NHBC Standards 2026","sourceShort":"NHBC","refLabel":"Clause"},{"id":"4.6-16","chapter":"4.6","chapterTitle":"Engineered fill","part":"Foundations","question":"Above what height do retaining walls on engineered fill require geotechnical and structural designs?","options":["0.45m","0.6m","0.9m","1.2m"],"correct":1,"explanation":"Clause 4.6.8.4 states geotechnical and structural designs are required where retaining walls are in excess of 0.6m in height.","ref":"4.6.8.4","why":"Taller retaining walls hold back much greater lateral soil pressure, and a failure could be structurally dangerous, so anything above a modest 0.6m needs a proper engineered design rather than a standard detail.","source":"NHBC Standards 2026","sourceShort":"NHBC","refLabel":"Clause"},{"id":"4.6-17","chapter":"4.6","chapterTitle":"Engineered fill","part":"Foundations","question":"Which of the following is classed as a non-standard compaction technique requiring details to be submitted to NHBC in writing before site works begin?","options":["Towed vibratory rollers used in accordance with SHW Table 6/4","Vibrating plate compactors working in thin layers","Smooth-wheeled deadweight rollers on granular fill","Dynamic compaction using heavy weights dropped from a crane"],"correct":3,"explanation":"Clause 4.6.9.2 lists dynamic compaction using heavy drop weights dropped from a crane, along with rapid impact compaction and high energy impact compaction, as non-standard techniques whose details should be submitted to NHBC in writing at least eight weeks before site works begin.","ref":"4.6.9.2","why":"Techniques like dynamic compaction behave less predictably than conventional rolling, so NHBC needs evidence or trials in advance to be confident the ground will actually be improved enough before the works go ahead.","source":"NHBC Standards 2026","sourceShort":"NHBC","refLabel":"Clause"},{"id":"4.6-18","chapter":"4.6","chapterTitle":"Engineered fill","part":"Foundations","question":"In-situ testing shows a layer of placed fill does not meet the compaction criteria in the earthworks specification. What should happen first?","options":["Appropriate action should be agreed with NHBC as soon as possible","The layer should always be excavated and replaced in full","The next layer should be placed and the failed area retested through it","The result should simply be noted in the site diary"],"correct":0,"explanation":"Clause 4.6.10.5 requires appropriate action to be agreed as soon as possible with NHBC where testing indicates non-compliant fill; options include drying, excavation and replacement, additional compaction and retesting, or performance testing.","ref":"4.6.10.5","why":"Fill that fails testing may not have the bearing capacity or settlement performance the design assumed, so quick agreement on remedial action stops bad material being buried under further layers and hidden until it causes damage.","source":"NHBC Standards 2026","sourceShort":"NHBC","refLabel":"Clause"},{"id":"4.6-19","chapter":"4.6","chapterTitle":"Engineered fill","part":"Foundations","question":"For end product compaction, what maximum uncompacted layer thickness would generally be acceptable, subject to site-specific requirements?","options":["150mm","200mm","250mm","300mm"],"correct":2,"explanation":"Clause 4.6.10.3 states that for end product compaction an uncompacted layer thickness of up to 250mm would be acceptable, with the maximum particle size no greater than one third of the compacted layer thickness or 75mm, whichever is lower.","ref":"4.6.10.3","why":"Layers thicker than 250mm can't be fully compacted right through by standard plant, leaving an under-compacted zone at the base that settles later even though the surface passes its test.","source":"NHBC Standards 2026","sourceShort":"NHBC","refLabel":"Clause"},{"id":"4.6-20","chapter":"4.6","chapterTitle":"Engineered fill","part":"Foundations","question":"Cohesive engineered fill compacted too dry of the optimum moisture content risks which problem?","options":["Being too weak to provide support without excessive settlement","Collapse settlement or heave when it becomes wetted","Excessive shrinkage cracking during hot weather","Frost heave during the first winter after placement"],"correct":1,"explanation":"Clause 4.6.10.3 states fill compacted too dry of the OMC risks being vulnerable to collapse settlement or heave when wetted; fill compacted too wet risks being too weak to provide adequate support.","ref":"4.6.10.3","why":"Fill compacted too dry has larger air voids between particles; when water later gets in from rain, a burst pipe or rising groundwater, those voids collapse suddenly, causing settlement of whatever is built above.","source":"NHBC Standards 2026","sourceShort":"NHBC","refLabel":"Clause"},{"id":"4.6-21","chapter":"4.6","chapterTitle":"Engineered fill","part":"Foundations","question":"What is the minimum horizontal clearance permitted between an excavation and a foundation on engineered fill?","options":["The depth of the excavation minus the depth of the structural foundation","The depth of the excavation plus the depth of the structural foundation","Twice the depth of the excavation","A fixed clearance of 1m in all cases"],"correct":0,"explanation":"Clause 4.6.11 states the minimum horizontal clearance between excavations and foundations must not be less than the depth of excavation minus the depth of the structural foundation, with particular attention needed below the water table.","ref":"4.6.11","why":"Digging too close to an existing foundation removes the ground that spreads and supports its bearing load, risking loss of support, settlement or even collapse of the foundation above.","source":"NHBC Standards 2026","sourceShort":"NHBC","refLabel":"Clause"},{"id":"4.6-22","chapter":"4.6","chapterTitle":"Engineered fill","part":"Foundations","question":"As a minimum, how many performance tests of each type are recommended so that a trend can be observed from the results (excluding preloading by surcharge)?","options":["One","Two","Three","Five"],"correct":2,"explanation":"Clause 4.6.12.3 recommends a minimum of three tests of each type are undertaken so that a trend can be observed from the results, with the exception of preloading by surcharge.","ref":"4.6.12.3","why":"A single test result could just be a local outlier; three results let you see whether performance is consistent or trending, rather than judging the whole fill on one unrepresentative reading.","source":"NHBC Standards 2026","sourceShort":"NHBC","refLabel":"Clause"},{"id":"4.6-23","chapter":"4.6","chapterTitle":"Engineered fill","part":"Foundations","question":"For a fill volume of less than 10,000 cubic metres, what is the minimum end product compliance testing frequency for placed engineered fill?","options":["5 tests per 1,000m³","3 tests per 1,000m³","2 tests per 1,000m³","1 test per 1,000m³"],"correct":0,"explanation":"Table 10 in Clause 4.6.12.5 requires a minimum of 5 tests per 1,000m³ for fill volumes under 10,000m³; the frequency reduces to 3 per 1,000m³ for 10,000-100,000m³ and 2 per 1,000m³ above 100,000m³.","ref":"4.6.12.5","why":"Smaller fill volumes get tested more intensively per cubic metre so confidence in overall quality matches that of larger sites, where averaging over more material allows a lower testing rate.","source":"NHBC Standards 2026","sourceShort":"NHBC","refLabel":"Clause"},{"id":"4.6-24","chapter":"4.6","chapterTitle":"Engineered fill","part":"Foundations","question":"Where reinforced strip foundations are proposed on engineered fill, who should produce the earthworks verification report?","options":["A third-party organisation separate from those undertaking the works","The earthworks contractor who placed the fill","The site manager, countersigned by the builder","The groundworker, with NHBC countersignature"],"correct":0,"explanation":"Clause 4.6.13 states that where reinforced strip foundations are proposed, the report should be produced by a third-party organisation separate from those undertaking the works; for beam grillage or semi-raft foundations it may be produced by a suitably experienced earthworks contractor.","ref":"4.6.13","why":"Reinforced strip foundations rely most on the fill being uniform, with the least built-in robustness to cope with variation, so independent third-party verification gives extra assurance before this higher-risk foundation choice is relied on.","source":"NHBC Standards 2026","sourceShort":"NHBC","refLabel":"Clause"},{"id":"5.1-01","chapter":"5.1","chapterTitle":"Substructure and ground-bearing floors","part":"Substructure, ground floors, drainage and basements","question":"What is the maximum depth of infill permitted beneath a ground-bearing floor slab?","options":["450mm","600mm","750mm","900mm"],"correct":1,"explanation":"Clause 5.1.8 states that infill beneath ground-bearing floors shall be a maximum of 600mm deep; ground-bearing slabs are not acceptable where infill exceeds this depth.","ref":"5.1.8","why":"Deep fill keeps settling long after the slab is down, and a ground-bearing slab can't bridge that movement. Beyond 600mm the risk of cracking and dishing floors is too high, so a suspended floor spanning clear of the fill is needed instead.","source":"NHBC Standards 2026","sourceShort":"NHBC","refLabel":"Clause"},{"id":"5.1-02","chapter":"5.1","chapterTitle":"Substructure and ground-bearing floors","part":"Substructure, ground floors, drainage and basements","question":"How are shrinkable soils classified in relation to substructure and ground-bearing floors?","options":["More than 20% fine particles and a Modified Plasticity Index of 5% or more","More than 30% fine particles and a Modified Plasticity Index of 15% or more","More than 35% fine particles and a Modified Plasticity Index of 10% or more","More than 40% fine particles and a Modified Plasticity Index of 20% or more"],"correct":2,"explanation":"Clause 5.1.4.3 classifies shrinkable soils as those containing more than 35% fine particles (silt and clay) with a Modified Plasticity Index of 10% or more.","ref":"5.1.4.3","why":"High clay/silt content with a high plasticity index means the soil swells when wet and shrinks badly when dry (worse near trees), causing ground heave or subsidence that can crack a ground-bearing slab if it's used on such soil.","source":"NHBC Standards 2026","sourceShort":"NHBC","refLabel":"Clause"},{"id":"5.1-03","chapter":"5.1","chapterTitle":"Substructure and ground-bearing floors","part":"Substructure, ground floors, drainage and basements","question":"Where a pipe is bedded into a substructure wall and connected with flexible joints on both sides, what is the maximum distance the joints may be from the face of the wall?","options":["150mm","225mm","300mm","450mm"],"correct":0,"explanation":"Clause 5.1.5.3 requires flexible joints on bedded pipes to be located as close as feasible to the outside face of the wall, but at a maximum of 150mm from the face of the wall.","ref":"5.1.5.3","why":"Keeping the flexible joint close to the wall face targets the pipe's give right where differential movement between building and ground actually happens. A joint too far out leaves an unsupported, rigid length of pipe that can fracture and leak into the fill.","source":"NHBC Standards 2026","sourceShort":"NHBC","refLabel":"Clause"},{"id":"5.1-04","chapter":"5.1","chapterTitle":"Substructure and ground-bearing floors","part":"Substructure, ground floors, drainage and basements","question":"Infill under slabs and backfill in trenches should be mechanically compacted in layers not exceeding what thickness?","options":["100mm","150mm","200mm","225mm"],"correct":3,"explanation":"Clause 5.1.7 states that infill under slabs and backfill in trenches should be properly placed and mechanically compacted to form a stable mass in layers not exceeding 225mm.","ref":"5.1.7","why":"Compacting in thick layers only firms up the surface, leaving loose material below that keeps settling after the slab is poured, cracking it. Thin 225mm layers get properly compacted right through, giving even, lasting support.","source":"NHBC Standards 2026","sourceShort":"NHBC","refLabel":"Clause"},{"id":"5.1-05","chapter":"5.1","chapterTitle":"Substructure and ground-bearing floors","part":"Substructure, ground floors, drainage and basements","question":"To be suitable for use below a ground-bearing slab, fill material should be well graded, inert and able to pass what size of screen in all directions?","options":["75mm x 75mm","100mm x 100mm","150mm x 150mm","225mm x 225mm"],"correct":2,"explanation":"Clause 5.1.9 requires fill to be well graded, inert, free from hazardous materials and able to pass a 150mm x 150mm screen in all directions.","ref":"5.1.9","why":"Oversized lumps leave voids in the fill that later collapse or let water channel through, causing uneven settlement and puncturing the DPM above. Fill that passes a 150mm screen packs down evenly to support the slab consistently.","source":"NHBC Standards 2026","sourceShort":"NHBC","refLabel":"Clause"},{"id":"5.1-06","chapter":"5.1","chapterTitle":"Substructure and ground-bearing floors","part":"Substructure, ground floors, drainage and basements","question":"On site, backfill is being compacted on one side of a foundation trench before the other, so the substructure wall acts as a temporary retaining wall. The filled trench is 1,000mm deep. Without an engineer's design, what is the minimum thickness of the wall leaf supporting the fill?","options":["200mm","300mm","400mm","500mm"],"correct":0,"explanation":"Table 2 in Clause 5.1.12.1 gives a minimum wall leaf thickness of 200mm for filled trench depths up to 1,100mm where the wall acts as a temporary retaining wall.","ref":"5.1.12.1","why":"Backfilling one side of the trench before the other loads the wall sideways like a retaining wall, a job it wasn't designed for. An undersized leaf can crack, bow or collapse under that unbalanced earth pressure before both sides are levelled up.","source":"NHBC Standards 2026","sourceShort":"NHBC","refLabel":"Clause"},{"id":"5.1-07","chapter":"5.1","chapterTitle":"Substructure and ground-bearing floors","part":"Substructure, ground floors, drainage and basements","question":"What is the minimum clear cavity depth that should normally be maintained below the DPC in a cavity wall?","options":["150mm","225mm","300mm","375mm"],"correct":1,"explanation":"Clause 5.1.12.2 requires a minimum 225mm clear cavity below the DPC; this may only be reduced to 150mm where specialised foundations are used and weepholes and other measures ensure free drainage.","ref":"5.1.12.2","why":"A clogged or too-shallow cavity lets mortar droppings and debris bridge across to the inner leaf, carrying damp through, and stops water reaching the weepholes. The 225mm gap keeps the cavity clear so it drains freely and stays dry.","source":"NHBC Standards 2026","sourceShort":"NHBC","refLabel":"Clause"},{"id":"5.1-08","chapter":"5.1","chapterTitle":"Substructure and ground-bearing floors","part":"Substructure, ground floors, drainage and basements","question":"On a steep slope, walls below DPC level acting as retaining walls should be designed by an engineer in which situation? (H is the height difference between floor/ground levels; T is the total wall thickness.)","options":["Where H is greater than 2 times T, or H exceeds 0.5m","Where H is greater than 3 times T, or H exceeds 1.5m","Where H is greater than 4 times T, or H exceeds 2m","Where H is greater than 4 times T, or H exceeds 1m"],"correct":3,"explanation":"Clause 5.1.4.4 requires engineer design of walls below DPC acting as retaining walls where (H) is greater than four times (T) or (H) exceeds 1m.","ref":"5.1.4.4","why":"On a steep slope a tall, thin substructure wall is effectively holding back a bank of soil. Past this H:T ratio the lateral earth pressure can exceed what unreinforced masonry can take, risking the wall bulging or failing outward.","source":"NHBC Standards 2026","sourceShort":"NHBC","refLabel":"Clause"},{"id":"5.1-09","chapter":"5.1","chapterTitle":"Substructure and ground-bearing floors","part":"Substructure, ground floors, drainage and basements","question":"What is the minimum width of sealed laps in a damp proof membrane (DPM) under a ground-bearing concrete floor slab?","options":["300mm","250mm","150mm","100mm"],"correct":0,"explanation":"Clause 5.1.20 requires the DPM to have sealed laps at least 300mm wide and to link with wall DPCs to form an impervious barrier.","ref":"5.1.20","why":"A narrow or poorly sealed lap can separate or let moisture track through the gap into the slab, causing damp floors and mould inside. A wide, well-sealed lap keeps the membrane continuous with no weak point for water to find.","source":"NHBC Standards 2026","sourceShort":"NHBC","refLabel":"Clause"},{"id":"5.2-01","chapter":"5.2","chapterTitle":"Suspended ground floors","part":"Substructure, ground floors, drainage and basements","question":"What is the minimum end bearing for precast concrete suspended ground floors on supporting walls?","options":["75mm","85mm","90mm","100mm"],"correct":2,"explanation":"Clause 5.2.5.2 states that bearings for precast floors should be as recommended by the manufacturer and in no case less than 90mm.","ref":"5.2.5.2","why":"Too little bearing risks the precast unit slipping off its support during construction loading, handling knocks or minor settlement, which can cause the floor to drop or fail structurally rather than just deflecting slightly.","source":"NHBC Standards 2026","sourceShort":"NHBC","refLabel":"Clause"},{"id":"5.2-02","chapter":"5.2","chapterTitle":"Suspended ground floors","part":"Substructure, ground floors, drainage and basements","question":"A beam and block floor uses non-loadbearing infill blocks, so a structural screed is needed to transfer loads. Which type of reinforcement is NOT acceptable to NHBC for that structural screed?","options":["Steel mesh reinforcement","Steel fibres to BS EN 14889-1","Class II polypropylene macro fibres to BS EN 14889-2","Class I polypropylene micro fibres to BS EN 14889-2"],"correct":3,"explanation":"Clause 5.2.4.3 states that Class I polypropylene micro fibres are not acceptable to NHBC for structural applications; they may only be used to assist in controlling shrinkage.","ref":"5.2.4.3","why":"Micro fibres only help control shrinkage cracking; they haven't been shown to carry structural load. Relying on them alone in a screed over non-structural infill blocks risks the screed cracking through and failing to transfer floor loads to the beams.","source":"NHBC Standards 2026","sourceShort":"NHBC","refLabel":"Clause"},{"id":"5.2-03","chapter":"5.2","chapterTitle":"Suspended ground floors","part":"Substructure, ground floors, drainage and basements","question":"How much ventilation should be provided to the void below a suspended ground floor?","options":["1,500mm2 per metre run of external wall or 500mm2 per m2 of floor area, whichever gives the greater opening","1,000mm2 per metre run of external wall or 300mm2 per m2 of floor area, whichever gives the greater opening","2,000mm2 per metre run of external wall or 750mm2 per m2 of floor area, whichever gives the greater opening","500mm2 per metre run of external wall or 1,500mm2 per m2 of floor area, whichever gives the greater opening"],"correct":0,"explanation":"Clause 5.2.10.2 requires void ventilation of 1,500mm2 per metre run of external wall or 500mm2 per m2 of floor area, whichever gives the greater opening area.","ref":"5.2.10.2","why":"An unventilated void traps ground moisture, letting humidity build, condense on cold joists and encourage wet or dry rot in timber, plus it can let soil gases accumulate. Adequate ventilation keeps air moving through to carry moisture away.","source":"NHBC Standards 2026","sourceShort":"NHBC","refLabel":"Clause"},{"id":"5.2-04","chapter":"5.2","chapterTitle":"Suspended ground floors","part":"Substructure, ground floors, drainage and basements","question":"A suspended floor is being built over shrinkable soil with high volume change potential where heave could occur. What total void is required below the floor?","options":["250mm","300mm","350mm","400mm"],"correct":1,"explanation":"Clause 5.2.10.2 requires an extra 150mm allowance for high volume change potential soil on top of the standard 150mm ventilation void, giving a 300mm total void.","ref":"5.2.10.2","why":"Shrinkable clay can heave upward with real force, especially after nearby trees are removed or in wet spells. Without the extra void, that heaving ground can lift and crack the suspended floor above it.","source":"NHBC Standards 2026","sourceShort":"NHBC","refLabel":"Clause"},{"id":"5.2-05","chapter":"5.2","chapterTitle":"Suspended ground floors","part":"Substructure, ground floors, drainage and basements","question":"How should ventilators be positioned for a suspended timber ground floor?","options":["At no more than 1.5m centres and within 300mm of the corner of the floor","At no more than 2m centres and within 600mm of the corner of the floor","At no more than 3m centres and within 450mm of the corner of the floor","At no more than 2m centres and within 450mm of the corner of the floor"],"correct":3,"explanation":"Clause 5.2.10.2 states that for timber floors, ventilators should be spaced at no more than 2m centres and within 450mm of the corner of the floor.","ref":"5.2.10.2","why":"Sparse or uneven ventilator spacing leaves stagnant pockets of trapped, humid air in the void, particularly in corners, letting condensation and rot take hold on joists there even though the rest of the floor is fine.","source":"NHBC Standards 2026","sourceShort":"NHBC","refLabel":"Clause"},{"id":"5.2-06","chapter":"5.2","chapterTitle":"Suspended ground floors","part":"Substructure, ground floors, drainage and basements","question":"Which of the following is an acceptable covering to the ground below a suspended timber ground floor?","options":["50mm concrete laid directly on the ground","75mm concrete on sand blinding","100mm concrete","150mm compacted hardcore on a polyethylene membrane"],"correct":2,"explanation":"Clause 5.2.10.1 requires the ground below a suspended timber floor to be covered with either 50mm concrete or fine aggregate on a polyethylene membrane laid on 50mm sand blinding, or 100mm concrete.","ref":"5.2.10.1","why":"Bare, uncovered ground lets moisture evaporate steadily into the void, raising humidity that condenses on the cold underside of timber joists and drives decay. A solid covering seals that moisture source off.","source":"NHBC Standards 2026","sourceShort":"NHBC","refLabel":"Clause"},{"id":"5.3-01","chapter":"5.3","chapterTitle":"Drainage below ground","part":"Substructure, ground floors, drainage and basements","question":"What is the minimum distance a septic tank or cesspool should be sited from homes (outside Scotland)?","options":["5m","7m","10m","15m"],"correct":1,"explanation":"Clause 5.3.5.3 requires septic tanks and cesspools to be a minimum of 7m from homes; in Scotland a minimum of 5m from homes and boundaries is acceptable for septic tanks.","ref":"5.3.5.3","why":"Keeping the tank this far off means odours, noise and mess from desludging stay away from the home, and any leak, overflow or gas escape from the tank is less likely to affect the building or its foundations.","source":"NHBC Standards 2026","sourceShort":"NHBC","refLabel":"Clause"},{"id":"5.3-02","chapter":"5.3","chapterTitle":"Drainage below ground","part":"Substructure, ground floors, drainage and basements","question":"What is the maximum distance a septic tank or cesspool should be from vehicular access to permit emptying?","options":["30m","40m","50m","60m"],"correct":0,"explanation":"Clause 5.3.5.3 requires septic tanks and cesspools to be a maximum of 30m from vehicular access so that they can be emptied.","ref":"5.3.5.3","why":"Septic tanks and cesspools need regular emptying by tanker, and beyond this distance the pump hose run becomes impractical. If it can't be emptied properly it will overflow, polluting the site and posing a health risk.","source":"NHBC Standards 2026","sourceShort":"NHBC","refLabel":"Clause"},{"id":"5.3-03","chapter":"5.3","chapterTitle":"Drainage below ground","part":"Substructure, ground floors, drainage and basements","question":"Where a pumped drainage system is used, the holding tank should be large enough to contain how much domestic effluent?","options":["6 hours' worth","12 hours' worth","36 hours' worth","24 hours' worth"],"correct":3,"explanation":"Clause 5.3.5.4 requires pumped installations to include a holding tank of sufficient volume to contain 24 hours of domestic effluent, based on 120L/150L per head per day.","ref":"5.3.5.4","why":"A pump failure or power cut would otherwise send sewage straight back up and overflow almost immediately. A full day's holding capacity buys time to notice the fault and get it fixed before any spill or health hazard occurs.","source":"NHBC Standards 2026","sourceShort":"NHBC","refLabel":"Clause"},{"id":"5.3-04","chapter":"5.3","chapterTitle":"Drainage below ground","part":"Substructure, ground floors, drainage and basements","question":"Pipe runs should be designed to maintain what self-cleansing velocity?","options":["0.3m/s","0.5m/s","0.7m/s","1.0m/s"],"correct":2,"explanation":"Clause 5.3.7.2 states that pipe runs should be designed to maintain a self-cleansing velocity of 0.7m/s and be as straight as practicable.","ref":"5.3.7.2","why":"Below this speed, solids in the flow settle out instead of being carried along, gradually building up blockages that back up into the home and mean digging up the drain to clear.","source":"NHBC Standards 2026","sourceShort":"NHBC","refLabel":"Clause"},{"id":"5.3-05","chapter":"5.3","chapterTitle":"Drainage below ground","part":"Substructure, ground floors, drainage and basements","question":"Where flows are less than 1.0L/second, the gradient for a 100mm diameter drain should be no flatter than what?","options":["1:40","1:60","1:80","1:100"],"correct":0,"explanation":"Clause 5.3.7.4 states that where flows are less than 1.0L/second, gradients for 100mm diameter pipes should not be flatter than 1:40.","ref":"5.3.7.4","why":"At low flow rates a flatter gradient doesn't generate enough velocity to keep solids moving, so they settle and build into a blockage over time; 1:40 is the flattest that still keeps the pipe self-cleansing.","source":"NHBC Standards 2026","sourceShort":"NHBC","refLabel":"Clause"},{"id":"5.3-06","chapter":"5.3","chapterTitle":"Drainage below ground","part":"Substructure, ground floors, drainage and basements","question":"Where peak flows are greater than 1.0L/second and the minimum gradients in the standard are used, a 150mm pipe should serve a minimum of how many WCs?","options":["Three","Five","Eight","Ten"],"correct":1,"explanation":"Clause 5.3.7.4 states that where peak flows are greater than 1.0L/second, 100mm pipes should serve a minimum of one WC and 150mm pipes a minimum of five.","ref":"5.3.7.4","why":"The minimum gradients only work if enough flow passes through to stay self-cleansing at that pipe size. Fewer than five WCs on a 150mm pipe risks too little velocity, letting solids settle and block the run.","source":"NHBC Standards 2026","sourceShort":"NHBC","refLabel":"Clause"},{"id":"5.3-07","chapter":"5.3","chapterTitle":"Drainage below ground","part":"Substructure, ground floors, drainage and basements","question":"Benching in a traditionally constructed manhole should be steel trowelled to a smooth finish with rounded corners and a fall of not less than what?","options":["1:40","1:30","1:20","1:12"],"correct":3,"explanation":"Clause 5.3.7.5 requires benching to be steel trowelled to provide a smooth finish, rounded corners and a fall of not less than 1:12.","ref":"5.3.7.5","why":"Rough or shallow-falling benching lets solids and debris catch and stick inside the manhole instead of being swept into the outgoing pipe, causing blockages and smells. A smooth, rounded 1:12 fall channels flow straight through.","source":"NHBC Standards 2026","sourceShort":"NHBC","refLabel":"Clause"},{"id":"5.3-08","chapter":"5.3","chapterTitle":"Drainage below ground","part":"Substructure, ground floors, drainage and basements","question":"Clay bricks used for manholes should have a minimum compressive strength of what?","options":["20N/mm2","35N/mm2","48N/mm2","60N/mm2"],"correct":2,"explanation":"Clause 5.3.7.5 requires clay bricks for manholes to comply with BS EN 771, be of low active soluble salt content and have a minimum compressive strength of 48N/mm2.","ref":"5.3.7.5","why":"Manhole walls sit buried under ground and traffic loading while permanently damp. Bricks below this strength can crush or spall in those wet conditions, weakening the structure and letting groundwater into the system.","source":"NHBC Standards 2026","sourceShort":"NHBC","refLabel":"Clause"},{"id":"5.3-09","chapter":"5.3","chapterTitle":"Drainage below ground","part":"Substructure, ground floors, drainage and basements","question":"What is the minimum capacity of a septic tank serving up to four users?","options":["2,700 litres","3,500 litres","2,000 litres","4,000 litres"],"correct":0,"explanation":"Clause 5.3.9.1 gives the capacity formula C = 180P + 2,000, with a minimum of 2,700L for up to four users.","ref":"5.3.9.1","why":"Sewage needs enough time sitting in the tank for solids to settle and start breaking down before the liquid discharges. An undersized tank shortens that retention time, so solids carry over and clog the soakaway or field drains downstream.","source":"NHBC Standards 2026","sourceShort":"NHBC","refLabel":"Clause"},{"id":"5.3-10","chapter":"5.3","chapterTitle":"Drainage below ground","part":"Substructure, ground floors, drainage and basements","question":"To restrict entry flow velocity, a drain less than 150mm in diameter running into a septic tank should have what gradient on the approach?","options":["No steeper than 1:40 for at least 10m","No steeper than 1:50 for at least 12m","No steeper than 1:60 for at least 15m","No steeper than 1:80 for at least 20m"],"correct":1,"explanation":"Clause 5.3.9.4 states that where the drain into the septic tank is less than 150mm in diameter, it should have a gradient no steeper than 1:50 for at least 12m.","ref":"5.3.9.4","why":"Effluent rushing into the tank at speed stirs up the settled sludge and scum layers, disrupting the separation the tank relies on. A shallow approach gradient slows entry flow so solids can settle properly.","source":"NHBC Standards 2026","sourceShort":"NHBC","refLabel":"Clause"},{"id":"5.3-11","chapter":"5.3","chapterTitle":"Drainage below ground","part":"Substructure, ground floors, drainage and basements","question":"Field drains taking treated effluent from a septic tank should be formed with perforated pipe laid at least how far below the surface?","options":["300mm","350mm","450mm","500mm"],"correct":3,"explanation":"Clause 5.3.10.4 requires field drains to be formed with perforated pipe laid at least 500mm below the surface, in trenches with a uniform gradient less than 1:200.","ref":"5.3.10.4","why":"Field drains laid too shallow are exposed to frost, surface loading and cultivation damage, and effluent gets too little soil depth to filter through before reaching groundwater, undermining treatment.","source":"NHBC Standards 2026","sourceShort":"NHBC","refLabel":"Clause"},{"id":"5.3-12","chapter":"5.3","chapterTitle":"Drainage below ground","part":"Substructure, ground floors, drainage and basements","question":"Percolation tests for a septic tank sub-surface irrigation system give an average percolation value of 150 seconds. What does the standard say about this ground?","options":["Field drains may be used, sized from the design charts as normal","Field drains may be used provided underdrains are also installed","The soil is unsuitable for field drains","The test should simply be repeated at a deeper level and the results averaged"],"correct":2,"explanation":"Table 7a in Clause 5.3.10.3 states that where the percolation value is over 140, the soil is unsuitable for field drains; underdrains are only a solution for values between 100 and 140.","ref":"5.3.10.3","why":"A percolation value this high means the ground drains too slowly to soak away treated effluent. It backs up and surfaces as ponding sewage, a pollution and health hazard rather than a working drainage field.","source":"NHBC Standards 2026","sourceShort":"NHBC","refLabel":"Clause"},{"id":"5.3-13","chapter":"5.3","chapterTitle":"Drainage below ground","part":"Substructure, ground floors, drainage and basements","question":"What is the minimum distance a surface water soakaway should be sited from the foundations of a building?","options":["5m","3m","7m","10m"],"correct":0,"explanation":"Clause 5.3.11.1 requires soakaways to be sited at least 5m from the foundations of a building, on land lower than or sloping away from buildings.","ref":"5.3.11.1","why":"Water dispersing from a soakaway too close to the building can saturate the ground right under or beside the footings, washing out fine material and softening the bearing ground, risking foundation movement.","source":"NHBC Standards 2026","sourceShort":"NHBC","refLabel":"Clause"},{"id":"5.3-14","chapter":"5.3","chapterTitle":"Drainage below ground","part":"Substructure, ground floors, drainage and basements","question":"On site you find a run of flexible drainage pipe crossing a garden area, not under a road, with less than 600mm of cover. Where protection is necessary, what does the standard require?","options":["A minimum 100mm concrete encasement all round the pipe","Concrete paving slabs laid as bridging above the pipe, with a minimum 75mm of granular material between the top of the pipe and the underside of the slabs","Reinforced concrete bridging slabs bearing directly on the pipe crown","Replacement of the flexible pipe with rigid pipe at the same depth"],"correct":1,"explanation":"Table 10 in Clause 5.3.14.2 states that flexible pipes in garden areas with less than 600mm cover should, where necessary, have concrete paving slabs laid as bridging with a minimum 75mm of granular material between the pipe top and the underside of the slabs.","ref":"5.3.14.2","why":"A flexible pipe under shallow cover in a garden has little to stop it being crushed by digging, foot traffic or a dropped tool. Bridging slabs on granular material spread that load around the pipe instead of onto it.","source":"NHBC Standards 2026","sourceShort":"NHBC","refLabel":"Clause"},{"id":"5.3-15","chapter":"5.3","chapterTitle":"Drainage below ground","part":"Substructure, ground floors, drainage and basements","question":"When backfilling a drainage trench, mechanical compaction should only be used once the compacted backfill is how far above the crown of the pipe?","options":["Over 150mm","Over 225mm","Over 300mm","Over 450mm"],"correct":3,"explanation":"Clause 5.3.15.2 states that backfill should be placed in layers no deeper than 300mm and mechanical compacting should only be used when compacted backfill is over 450mm above the crown of the pipe.","ref":"5.3.15.2","why":"Running a compactor directly over a pipe with little cover above it transmits point loads straight onto the pipe, crushing or deforming it. Waiting until there's enough protective backfill lets compaction proceed safely without damaging the pipe.","source":"NHBC Standards 2026","sourceShort":"NHBC","refLabel":"Clause"},{"id":"5.3-16","chapter":"5.3","chapterTitle":"Drainage below ground","part":"Substructure, ground floors, drainage and basements","question":"Suspended horizontal drainage of 110mm nominal diameter under a floor should typically be supported at what centres?","options":["400mm to 500mm","600mm to 700mm","900mm to 1,000mm","1,200mm to 1,500mm"],"correct":2,"explanation":"Clause 5.3.17.2 states that suspended horizontal drainage should be supported as per the manufacturer's recommendations, typically 900mm to 1,000mm centres for 110mm nominal diameter pipes and at every socket or joint.","ref":"5.3.17.2","why":"An unsupported pipe run sags between fixings, creating low spots where solids settle and cause blockages or joints pull apart. Regular support at these centres keeps the design gradient constant along the whole run.","source":"NHBC Standards 2026","sourceShort":"NHBC","refLabel":"Clause"},{"id":"5.4-01","chapter":"5.4","chapterTitle":"Waterproofing of basements and other below ground structures","part":"Substructure, ground floors, drainage and basements","question":"How far in advance of works starting on site should basement waterproofing design and specification information be provided to NHBC?","options":["At least eight weeks","At least four weeks","At least six weeks","At least two weeks"],"correct":0,"explanation":"Clause 5.4.2 requires design and specification information to be provided to NHBC at least eight weeks in advance of the works starting on site, in accordance with the NHBC Rules.","ref":"5.4.2","why":"Waterproofing has to be coordinated with the structural design at junctions, joints and service penetrations before excavation starts, because a defective system is very hard and expensive to fix once the basement is built and backfilled.","source":"NHBC Standards 2026","sourceShort":"NHBC","refLabel":"Clause"},{"id":"5.4-02","chapter":"5.4","chapterTitle":"Waterproofing of basements and other below ground structures","part":"Substructure, ground floors, drainage and basements","question":"Which qualification for a waterproofing design specialist is generally acceptable to NHBC?","options":["Chartered membership of the Institution of Civil Engineers","Certified Surveyor in Structural Waterproofing (CSSW) from the Property Care Association","An NVQ Level 3 in construction site supervision","A CITB Site Management Safety Training Scheme certificate"],"correct":1,"explanation":"Clause 5.4.3.1 states that designers who have successfully completed the Certified Surveyor in Structural Waterproofing (CSSW) qualification from the Property Care Association (PCA) are generally acceptable to NHBC.","ref":"5.4.3.1","why":"Basement waterproofing design is highly technical, and a wrong system choice or poor detailing at junctions is one of the most common causes of later water ingress. A specialist with recognised training is far less likely to get it wrong.","source":"NHBC Standards 2026","sourceShort":"NHBC","refLabel":"Clause"},{"id":"5.4-03","chapter":"5.4","chapterTitle":"Waterproofing of basements and other below ground structures","part":"Substructure, ground floors, drainage and basements","question":"In which situation should a combined waterproofing system (two system types together) be used?","options":["Where a Grade 1b environment is needed and the wall retains more than 300mm","Where a Grade 2 environment is needed and the wall retains more than 450mm","Where a Grade 3 environment is needed and the wall retains more than 150mm","Where a Grade 3 environment is needed and the wall retains more than 600mm"],"correct":3,"explanation":"Clause 5.4.3.2 requires combined systems where a Grade 3 environment is needed and the wall retains more than 600mm, unless it is demonstrated that the water table is permanently below the underside of the lowest floor slab.","ref":"5.4.3.2","why":"Relying on one waterproofing barrier alone for a habitable space against more than 600mm of retained ground gives no backup if that barrier fails or is damaged. Combining two independent systems means a fault in one doesn't let water straight through.","source":"NHBC Standards 2026","sourceShort":"NHBC","refLabel":"Clause"},{"id":"5.4-04","chapter":"5.4","chapterTitle":"Waterproofing of basements and other below ground structures","part":"Substructure, ground floors, drainage and basements","question":"Where it is necessary to establish the water table for a basement design, long-term water level monitoring should be carried out over what minimum period?","options":["Three months","Six months","One year","Two years"],"correct":2,"explanation":"Clause 5.4.4 requires a detailed hydrogeological assessment including long-term water level monitoring over at least one year to capture seasonal fluctuations, with boreholes monitored at intervals of three months or less.","ref":"5.4.4","why":"Groundwater levels rise and fall with the seasons, peaking after wet autumns and springs. A short reading can miss that peak and under-design the waterproofing, so at least a year of monitoring captures the true worst-case level it must resist.","source":"NHBC Standards 2026","sourceShort":"NHBC","refLabel":"Clause"},{"id":"5.4-05","chapter":"5.4","chapterTitle":"Waterproofing of basements and other below ground structures","part":"Substructure, ground floors, drainage and basements","question":"What grade of waterproofing protection is generally required for habitable accommodation below ground?","options":["Grade 3","Grade 2","Grade 1b","Grade 1a"],"correct":0,"explanation":"Table 2 in Clause 5.4.6.1 states that Grade 3, where no water ingress or damp areas is acceptable, is generally required for habitable accommodation.","ref":"5.4.6.1","why":"People living and keeping belongings in a room need it genuinely dry, since even damp patches or seepage would damage finishes and furnishings and can trigger mould and health problems, so habitable space is held to the strictest standard.","source":"NHBC Standards 2026","sourceShort":"NHBC","refLabel":"Clause"},{"id":"5.4-06","chapter":"5.4","chapterTitle":"Waterproofing of basements and other below ground structures","part":"Substructure, ground floors, drainage and basements","question":"Basement waterproofing should extend at least how far above the external ground level and connect with the superstructure damp proofing?","options":["100mm","150mm","225mm","300mm"],"correct":1,"explanation":"Clause 5.4.6.3 requires waterproofing to extend at least 150mm above the external ground level and connect with the superstructure damp proofing, generally by linking to a continuous cavity tray.","ref":"5.4.6.3","why":"Stopping the waterproofing short of the DPC leaves a gap at ground level where surface moisture can get behind the barrier and track up into the wall, bypassing all the protection built in below.","source":"NHBC Standards 2026","sourceShort":"NHBC","refLabel":"Clause"},{"id":"5.4-07","chapter":"5.4","chapterTitle":"Waterproofing of basements and other below ground structures","part":"Substructure, ground floors, drainage and basements","question":"In a Type B in-situ concrete system using water-resisting admixtures, what is the maximum design width for cracks that pass through the section?","options":["0.5mm","0.4mm","0.3mm","0.2mm"],"correct":3,"explanation":"Clause 5.4.7.2 states that where admixtures are used, crack widths should be no greater than 0.3mm maximum for flexural cracks and 0.2mm maximum for cracks that pass through the section.","ref":"5.4.7.2","why":"A crack that passes right through the concrete gives water under ground pressure a direct path into the basement. Keeping it to 0.2mm lets the crack self-heal and stay effectively watertight rather than becoming a leak point.","source":"NHBC Standards 2026","sourceShort":"NHBC","refLabel":"Clause"},{"id":"5.4-08","chapter":"5.4","chapterTitle":"Waterproofing of basements and other below ground structures","part":"Substructure, ground floors, drainage and basements","question":"Where a Type B in-situ concrete waterproofing design does not include admixtures, what minimum section thickness should be used?","options":["150mm","200mm","250mm","300mm"],"correct":2,"explanation":"Clause 5.4.7.2 states that where the design of in-situ concrete waterproofing does not include admixtures, a minimum section thickness of 250mm should be used, with crack widths limited to 0.2mm maximum.","ref":"5.4.7.2","why":"Without admixtures to help resist water penetration, the concrete depends purely on its own mass to keep water out under pressure and to hold crack widths down, so a thicker 250mm section is needed to do that job.","source":"NHBC Standards 2026","sourceShort":"NHBC","refLabel":"Clause"},{"id":"5.4-09","chapter":"5.4","chapterTitle":"Waterproofing of basements and other below ground structures","part":"Substructure, ground floors, drainage and basements","question":"In a Type C drained cavity system, as well as a primary pump and a pump failure alarm, what should the automatic pump system include?","options":["A secondary pump with battery or generator backup","A duplicate gravity overflow discharging to a soakaway","A manually switched standby pump in the sump","A high-level float switch connected to the mains supply only"],"correct":0,"explanation":"Clause 5.4.7.3 requires pump systems to operate automatically and include a primary pump, a secondary pump with battery or generator backup, and a suitable audio or visual alarm indicating pump failure.","ref":"5.4.7.3","why":"A single pump failing or losing power in a drained cavity system would let collected water build up and flood the basement unnoticed. A backed-up secondary pump keeps water being removed even if the primary pump or mains power fails.","source":"NHBC Standards 2026","sourceShort":"NHBC","refLabel":"Clause"},{"id":"6.1-01","chapter":"6.1","chapterTitle":"External masonry walls","part":"Superstructure (excluding roofs)","question":"What is the minimum bearing of a concrete floor onto a masonry wall for it to provide adequate lateral restraint?","options":["75mm","90mm","100mm","150mm"],"correct":1,"explanation":"Clause 6.1.3.2 states that concrete floors with a minimum bearing of 90mm onto the wall can provide adequate restraint; floors running parallel to, and not built into, walls require restraint straps.","ref":"6.1.3.2","why":"Floors act as horizontal diaphragms that brace the wall against wind and lateral pressure; too shallow a bearing means the floor can't grip the wall enough to transfer that load, leaving it free to bow or become unstable.","source":"NHBC Standards 2026","sourceShort":"NHBC","refLabel":"Clause"},{"id":"6.1-02","chapter":"6.1","chapterTitle":"External masonry walls","part":"Superstructure (excluding roofs)","question":"Where a partition wall is connected to an external wall with a tied joint, what is the maximum spacing of the wall ties or expanded metal?","options":["150mm","225mm","300mm","450mm"],"correct":2,"explanation":"Clause 6.1.3.4 states tied joints should be formed using expanded metal, wire wall ties or a proprietary equivalent, spaced at maximum 300mm intervals.","ref":"6.1.3.4","why":"Partitions and external walls often move differently (different materials, different foundations), so ties spaced this tightly let the joint flex a little without cracking, while still holding the partition upright as a buttress.","source":"NHBC Standards 2026","sourceShort":"NHBC","refLabel":"Clause"},{"id":"6.1-03","chapter":"6.1","chapterTitle":"External masonry walls","part":"Superstructure (excluding roofs)","question":"What is the normal spacing of vertical movement joints in a clay brick outer leaf?","options":["6m","7.5m to 9m","10m to 12m","15m to 20m"],"correct":2,"explanation":"Table 1 in Clause 6.1.3.5 gives a normal movement joint spacing of 10-12m for clay brick, with a joint width of 16mm.","ref":"6.1.3.5","why":"Clay brickwork expands as it absorbs moisture over years; without a joint at roughly this spacing to soak up the growth, the panel builds up compressive stress that shows up as cracking, bowing or spalled arrises.","source":"NHBC Standards 2026","sourceShort":"NHBC","refLabel":"Clause"},{"id":"6.1-04","chapter":"6.1","chapterTitle":"External masonry walls","part":"Superstructure (excluding roofs)","question":"In the inner leaf of a cavity wall, consideration should be given to providing movement joints in rooms where straight unbroken lengths of wall exceed what dimension?","options":["6m","8m","10m","12m"],"correct":0,"explanation":"Clause 6.1.3.5 states that although movement joints are not generally necessary in the inner leaf, consideration should be given to providing them in rooms with straight unbroken lengths of wall over 6m.","ref":"6.1.3.5","why":"Even though the inner leaf isn't exposed to weather, a very long unbroken run can still crack from restrained thermal and moisture movement, so a joint (or bed reinforcement) is considered to stop unsightly plaster cracking.","source":"NHBC Standards 2026","sourceShort":"NHBC","refLabel":"Clause"},{"id":"6.1-05","chapter":"6.1","chapterTitle":"External masonry walls","part":"Superstructure (excluding roofs)","question":"Which filler material is suitable for a movement joint in clay brickwork, which expands over time?","options":["Hemp","Flexible cellular polyethylene","Fibreboard","Cork"],"correct":1,"explanation":"Clause 6.1.3.5 states clay bricks expand and require joints formed from easily compressible materials such as flexible cellular polyethylene, cellular polyurethane or foam rubber; hemp, fibreboard and cork are only acceptable in contraction joints for concrete bricks and blocks.","ref":"6.1.3.5","why":"Because clay brick keeps expanding, the filler has to squash easily to absorb that growth; a stiff filler would resist compression, transmit stress back into the brickwork and cause spalling or joint blow-out instead of moving with it.","source":"NHBC Standards 2026","sourceShort":"NHBC","refLabel":"Clause"},{"id":"6.1-06","chapter":"6.1","chapterTitle":"External masonry walls","part":"Superstructure (excluding roofs)","question":"A site is classed as being in a 'very severe' exposure zone when the exposure to wind-driven rain is what?","options":["Less than 33 litres/m² per spell","33 to less than 56.5 litres/m² per spell","56.5 to less than 100 litres/m² per spell","100 or more litres/m² per spell"],"correct":3,"explanation":"The exposure zone key in Clause 6.1.6.2 defines very severe exposure as 100 or more litres/m² per spell of wind-driven rain.","ref":"6.1.6.2","why":"This figure sets how much wind-driven rain a site's outer leaf must cope with, which drives the cavity width, insulation type and detailing needed - get it wrong and you get penetrating damp on the inner leaf.","source":"NHBC Standards 2026","sourceShort":"NHBC","refLabel":"Clause"},{"id":"6.1-07","chapter":"6.1","chapterTitle":"External masonry walls","part":"Superstructure (excluding roofs)","question":"You are building a masonry home in Scotland. What does the standard require at the reveals of window and door openings?","options":["A checked rebate to avoid a straight through joint, or a proprietary cavity closer assessed under Technical Requirement R3","A double bead of silicone sealant between the frame and the masonry","A 25mm wide vertical DPC dressed over the face of the frame","An increased cavity width of 100mm at the reveal"],"correct":0,"explanation":"Clause 6.1.6.2 states that in Scotland, Northern Ireland, the Isle of Man and other places of very severe exposure to driving rain, masonry should form a rebate at the reveals to avoid a straight through joint, or a proprietary cavity closer assessed in accordance with Technical Requirement R3 should be used.","ref":"6.1.6.2","why":"A straight through joint at the reveal gives wind-driven rain a direct path across from outside to inside; the rebate or closer breaks that path so water can't bridge the cavity and cause damp patches around the frame.","source":"NHBC Standards 2026","sourceShort":"NHBC","refLabel":"Clause"},{"id":"6.1-08","chapter":"6.1","chapterTitle":"External masonry walls","part":"Superstructure (excluding roofs)","question":"In Scotland, what classification must all clay bricks used as facings achieve?","options":["F0,S2 to BS EN 771-1","F1,S1 to BS EN 771-1","F1,S2 to BS EN 771-1","F2,S2 or F2,S1 to BS EN 771-1"],"correct":3,"explanation":"Clause 6.1.6.3 states that in Scotland all clay bricks used as facings should be frost-resistant, F2,S2 or F2,S1 to BS EN 771-1, and concrete facing bricks should be 22N/mm² to BS EN 771-3.","ref":"6.1.6.3","why":"Scotland's wetter, colder conditions mean facing brick gets saturated often; a non-frost-resistant brick will have trapped water freeze, expand and spall the face off, so only frost-resistant classes are allowed.","source":"NHBC Standards 2026","sourceShort":"NHBC","refLabel":"Clause"},{"id":"6.1-09","chapter":"6.1","chapterTitle":"External masonry walls","part":"Superstructure (excluding roofs)","question":"Which combination of factors defines an area of severe exposure to frost attack?","options":["More than 30 days of frost a year, annual rainfall over 0.5m, and 45m above sea level","More than 60 days of frost a year, annual rainfall over 1m, and 90m above sea level","More than 90 days of frost a year, annual rainfall over 1.5m, and 120m above sea level","More than 60 days of frost a year and located within 8km of the coast"],"correct":1,"explanation":"Clause 6.1.6.3 states the hatched areas on the frost map have frost more than 60 days in a year, annual rainfall over 1m and are 90m above sea level, and are therefore considered at severe exposure to frost.","ref":"6.1.6.3","why":"Frost only damages masonry that is both wet and repeatedly freezing, so the map combines rainfall, altitude and frost days to flag genuinely high-risk ground - sites meeting all three need frost-resistant materials to avoid spalling.","source":"NHBC Standards 2026","sourceShort":"NHBC","refLabel":"Clause"},{"id":"6.1-10","chapter":"6.1","chapterTitle":"External masonry walls","part":"Superstructure (excluding roofs)","question":"A bricklayer is installing the first row of cavity insulation boards. How should the boards be supported?","options":["On a minimum of one wall tie per board, at the centre of the board","On a minimum of two wall ties per board, coinciding with horizontal joints in the insulation","On a minimum of three wall ties per board, staggered across the board face","On a minimum of four wall ties per board, one at each corner"],"correct":1,"explanation":"Clause 6.1.7.2 states the first row of insulation boards or batts should be supported on wall ties, with a minimum of two ties to each board or batt, which coincide with horizontal joints in the insulation.","ref":"6.1.7.2","why":"Unsupported boards can slip down inside the cavity, opening gaps that let moisture track across to the inner leaf and creating cold spots where condensation and mould can form, so ties hold the first row firmly in place.","source":"NHBC Standards 2026","sourceShort":"NHBC","refLabel":"Clause"},{"id":"6.1-11","chapter":"6.1","chapterTitle":"External masonry walls","part":"Superstructure (excluding roofs)","question":"Where partial fill cavity insulation is installed, what minimum clear cavity should normally be maintained between the insulation and the outer leaf?","options":["30mm","40mm","50mm","65mm"],"correct":2,"explanation":"Clause 6.1.7.4 states a minimum 50mm clear cavity should be maintained between partial cavity insulation and the outer leaf, with the insulation fixed only against the cavity face of the inner leaf.","ref":"6.1.7.4","why":"This gap gives any rain that gets past the outer leaf a clear drop to drain down and out via weepholes, instead of bridging across to touch the insulation or inner leaf and causing damp patches indoors.","source":"NHBC Standards 2026","sourceShort":"NHBC","refLabel":"Clause"},{"id":"6.1-12","chapter":"6.1","chapterTitle":"External masonry walls","part":"Superstructure (excluding roofs)","question":"In a
