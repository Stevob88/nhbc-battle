ct":3,"explanation":"Table 1 in Clause 6.2.8 requires specialist calculations, based on BS EN 1995-1-1, to be submitted to NHBC for solid timber joists above third floor level; the millimetre figures given at fourth to sixth floor apply only to engineered I-joists.","ref":"6.2.8","table":"ch62-t1"},{"id":"6.2-20","chapter":"6.2","chapterTitle":"External timber framed walls","part":"Superstructure (excluding roofs)","question":"How is the differential movement gap at the eaves or verge determined for a timber frame building with masonry cladding?","options":["Add 5mm to the gap dimension at the level below","Add 10mm to the gap dimension at the level below","Use the same gap as the level below","Use a fixed 30mm gap regardless of building height"],"correct":0,"explanation":"Table 1 in Clause 6.2.8 states that at the eaves or verge, 5mm should be added to the gap dimension at the level below.","ref":"6.2.8","table":"ch62-t1"},{"id":"6.2-21","chapter":"6.2","chapterTitle":"External timber framed walls","part":"Superstructure (excluding roofs)","question":"The standard differential movement gaps for masonry cladding on timber frame assume outer leaf brickwork with an expansion rate no greater than what?","options":["1.5mm per storey","2.5mm per storey","4mm per storey","5mm per storey"],"correct":1,"explanation":"Clause 6.2.8 states Table 1 is based on outer leaf brickwork with expansion rates no greater than 2.5mm per storey, and the common details take upward clay brick expansion as 2.5mm per storey.","ref":"6.2.8","table":"ch62-t1"},{"id":"6.2-22","chapter":"6.2","chapterTitle":"External timber framed walls","part":"Superstructure (excluding roofs)","question":"The standard differential movement gap sizes for masonry cladding on timber frame are based on brickwork up to how many storeys?","options":["Three storeys","Four storeys","Five storeys","Seven storeys"],"correct":2,"explanation":"Clause 6.2.8 states Table 1 is based on brickwork up to five storeys, with lightweight cladding above five storeys.","ref":"6.2.8","table":"ch62-t1"},{"id":"6.2-23","chapter":"6.2","chapterTitle":"External timber framed walls","part":"Superstructure (excluding roofs)","question":"The standard differential movement gap sizes assume a concrete ground floor. Where the ground floor is built with solid timber joists, how much should be added to the gaps?","options":["5mm","10mm","15mm","20mm"],"correct":2,"explanation":"Clause 6.2.8 states Table 1 assumes the ground floor is concrete, and for ground floors of timber joists 15mm should be added for solid timber and 10mm for engineered timber joists.","ref":"6.2.8","table":"ch62-t1"},{"id":"6.2-24","chapter":"6.2","chapterTitle":"External timber framed walls","part":"Superstructure (excluding roofs)","question":"The movement gap between the top of the brickwork and the eaves soffit will be more than 10mm and is not protected by a purposely designed overhang. What does the standard require?","options":["The gap should be pointed up with a mortar fillet","The gap should be closed with a rigid PVC trim fixed to the brickwork","The gap can be left fully open to ventilate the cavity","The gap should be protected with a flexible compressible filler or mesh to prevent the entry of birds"],"correct":3,"explanation":"Clause 6.2.8 states that where a movement gap between the top of masonry cladding and the eaves or verge soffit exceeds 10mm and is not protected by a purposely designed overhang, it should be protected with a compressible filler or mesh to prevent the entry of birds, which must be flexible so as not to inhibit differential movement.","ref":"6.2.8"},{"id":"6.2-25","chapter":"6.2","chapterTitle":"External timber framed walls","part":"Superstructure (excluding roofs)","question":"On a timber frame home with brick cladding, how should the window sills be detailed to deal with differential movement?","options":["The sill should not be built into the masonry, and an allowance for movement should be provided","The sill should be built into the masonry by a minimum of 50mm at each end","The sill should be bedded on mortar directly on the outer leaf","The sill should be rigidly fixed to both the frame and the cladding"],"correct":0,"explanation":"The movement details in Clause 6.2.8 show that with masonry cladding the window sill should not be built into the masonry and an allowance for movement should be provided, because the timber frame moves down while the brickwork expands upward.","ref":"6.2.8"},{"id":"6.2-26","chapter":"6.2","chapterTitle":"External timber framed walls","part":"Superstructure (excluding roofs)","question":"Where a flat roof on the timber frame abuts masonry, what minimum upstand cover must be maintained after differential movement has occurred?","options":["50mm","65mm","75mm","100mm"],"correct":2,"explanation":"The movement details in Clause 6.2.8 require the flat roof to masonry abutment to allow for movement while maintaining a minimum 75mm cover after movement.","ref":"6.2.8"},{"id":"6.2-27","chapter":"6.2","chapterTitle":"External timber framed walls","part":"Superstructure (excluding roofs)","question":"What does the standard say about fixing a juliette balcony support to the masonry cladding of a timber framed home?","options":["It is never acceptable to fix balcony supports to masonry cladding","It may be fixed to the masonry cladding subject to the engineer's design","It should be fixed through the cladding into the studs using rigid bolts","It should be supported only on posts independent of the building"],"correct":1,"explanation":"The balcony details in Clause 6.2.8 show a juliette balcony support fixed to the masonry cladding subject to the engineer's design.","ref":"6.2.8"},{"id":"6.2-28","chapter":"6.2","chapterTitle":"External timber framed walls","part":"Superstructure (excluding roofs)","question":"When specifying compressible filler materials for movement joints, what should the specification be based on?","options":["The nominal gap size as built","The width of the wall cavity","The maximum gap before any movement occurs","The anticipated residual gap size after movement has occurred"],"correct":3,"explanation":"Clause 6.2.8 states that where compressible filler materials are specified, they should be specified based on the anticipated residual gap size after movement has occurred.","ref":"6.2.8"},{"id":"6.2-29","chapter":"6.2","chapterTitle":"External timber framed walls","part":"Superstructure (excluding roofs)","question":"The installation, position and materials of cavity barriers and fire-stopping in a timber framed wall should be in accordance with what?","options":["The relevant Building Regulations and the design","Table 2 of Chapter 6.2 of the NHBC Standards","The cladding manufacturer's standard details alone","The site manager's judgement based on trade practice"],"correct":0,"explanation":"Clause 6.2.9.1 states the installation, position and materials for cavity barriers and fire-stopping should be in accordance with relevant Building Regulations and the design; Clause 6.2.2 also requires the design information issued to site to include the position and materials for cavity barriers.","ref":"6.2.9.1"},{"id":"6.2-30","chapter":"6.2","chapterTitle":"External timber framed walls","part":"Superstructure (excluding roofs)","question":"You are building a timber frame home in an area of very severe exposure to wind-driven rain. What should the wall construction include?","options":["A cavity increased to 75mm with a standard breather membrane","A fully filled cavity to stop water crossing to the frame","A 50mm cavity between sheathing and cladding, plus a high performance breather membrane or masonry cladding rendered or clad with an impervious material","A 25mm cavity provided the masonry is pointed with sulfate-resisting mortar"],"correct":2,"explanation":"Clause 6.2.10.1 states that in areas of very severe exposure the wall should include a 50mm cavity between the sheathing and the cladding and either a high performance breather membrane or masonry cladding which is rendered or clad with an impervious material.","ref":"6.2.10.1"},{"id":"6.2-31","chapter":"6.2","chapterTitle":"External timber framed walls","part":"Superstructure (excluding roofs)","question":"An electrician wants to run cables through the external wall cavity between the brickwork and the timber frame. What does the standard permit?","options":["Any electricity cables provided they are run in conduit","No electricity cables other than meter tails","No cables of any kind, including meter tails","Lighting circuits only, clipped to the sheathing"],"correct":1,"explanation":"Clause 6.2.10.1 states external wall cavities should not contain electricity cables other than meter tails.","ref":"6.2.10.1"},{"id":"6.2-32","chapter":"6.2","chapterTitle":"External timber framed walls","part":"Superstructure (excluding roofs)","question":"A continuous cavity tray is installed at sole plate level behind the brick cladding. Where should the perpend ventilators be installed?","options":["Below the tray only, at the base of the cavity","Above the tray only, so the sole plate is ventilated","They can be omitted where a continuous tray is fitted","Both above and below the tray, to provide drainage and ventilation to all areas of the frame"],"correct":3,"explanation":"Clause 6.2.10.2 states that if continuous cavity trays are installed at sole plate level, perpend ventilators should be installed above and below the tray to provide drainage and ventilation to all areas of the timber frame.","ref":"6.2.10.2"},{"id":"6.2-33","chapter":"6.2","chapterTitle":"External timber framed walls","part":"Superstructure (excluding roofs)","question":"Below which sole plates should a DPC be installed to separate the timber from the concrete or masonry?","options":["The sole plates of ground floor external walls and internal partitions","The sole plates of external walls only","External wall sole plates in areas of severe exposure only","None, provided the sole plate is bedded on a continuous bed of mortar"],"correct":0,"explanation":"Clause 6.2.10.3 states DPCs should be installed below the sole plates of ground floor walls and internal partitions, to provide effective separation between the timber and concrete/masonry.","ref":"6.2.10.3"},{"id":"6.2-34","chapter":"6.2","chapterTitle":"External timber framed walls","part":"Superstructure (excluding roofs)","question":"Horizontal timber cavity barriers behind masonry cladding should be protected by a DPC lapped behind the breather membrane. Where may this DPC be omitted?","options":["At first floor level, where the floor zone protects the barrier","Behind rendered masonry cladding","For horizontal timber cavity barriers under the eaves","It may never be omitted for horizontal barriers"],"correct":2,"explanation":"Clause 6.2.10.3 states a DPC should be installed above horizontal timber cavity barriers, lapped behind the breather membrane by 100mm to shed water away from the sheathing, but the DPC may be omitted for horizontal timber cavity barriers under the eaves.","ref":"6.2.10.3"},{"id":"6.2-35","chapter":"6.2","chapterTitle":"External timber framed walls","part":"Superstructure (excluding roofs)","question":"How should a DPC protect a vertical timber cavity barrier behind masonry cladding?","options":["It should be installed over the face against the sheathing","It should be installed over the face in contact with the masonry cladding","The barrier should be fully wrapped in DPC on all four faces","Vertical barriers do not require DPC protection"],"correct":1,"explanation":"Clause 6.2.10.3 states that at vertical timber cavity barriers the DPC should be installed over the face in contact with the masonry cladding; the same applies at the jamb and sill of windows and doors.","ref":"6.2.10.3"},{"id":"6.2-36","chapter":"6.2","chapterTitle":"External timber framed walls","part":"Superstructure (excluding roofs)","question":"Where a horizontal polythene-sleeved mineral wool cavity barrier behind masonry cladding is protected by its own sleeve, what minimum upstand should the sleeve provide?","options":["50mm","75mm","100mm","150mm"],"correct":2,"explanation":"Clause 6.2.10.3 states horizontal polythene-sleeved mineral wool cavity barriers may be protected by their polythene sleeve with a minimum 100mm upstand, or by a separate DPC arranged to shed moisture away from the sheathing.","ref":"6.2.10.3"},{"id":"6.2-37","chapter":"6.2","chapterTitle":"External timber framed walls","part":"Superstructure (excluding roofs)","question":"Where a checked rebate is formed at a window reveal in an area of severe exposure, what is the minimum overlap of the masonry to the window or door frame?","options":["12mm","20mm","25mm","40mm"],"correct":0,"explanation":"Clause 6.2.10.3 shows a 25mm checked rebate at the reveal with a minimum 12mm overlap of masonry to the window/door frame, required in Northern Ireland, Scotland, the Isle of Man and areas of severe or very severe exposure to driving rain.","ref":"6.2.10.3"},{"id":"6.2-38","chapter":"6.2","chapterTitle":"External timber framed walls","part":"Superstructure (excluding roofs)","question":"By how much should a cavity tray in the masonry cladding be lapped behind the breather membrane?","options":["75mm minimum","100mm minimum","150mm minimum","225mm minimum"],"correct":1,"explanation":"Clause 6.2.10.3 states cavity trays should be lapped behind the breather membrane by at least 100mm to deflect moisture away from the sheathing, and should have weepholes over openings or perpend ventilators where trays are continuous.","ref":"6.2.10.3"},{"id":"6.2-39","chapter":"6.2","chapterTitle":"External timber framed walls","part":"Superstructure (excluding roofs)","question":"What spacing is required for wall ties at the jambs of openings and at movement joints in the masonry cladding?","options":["Maximum 450mm vertically and within 300mm of the reveal or joint","Maximum 225mm vertically and within 150mm of the reveal or joint","Maximum 600mm vertically and within 225mm of the reveal or joint","Maximum 300mm vertically and within 225mm of the masonry reveal or movement joint"],"correct":3,"explanation":"Clause 6.2.14 states wall ties should be spaced at jambs of openings and at movement joints at a maximum of 300mm vertically and within 225mm of the masonry reveal or movement joint, with additional studs provided where needed; ties should also be within 225mm of the top of the wall, including at gables.","ref":"6.2.14"}];

function buildPool(profile){

function weightedSample(pool, boost, n){
  const items = pool.map(q=>({q, w: boost[q.chapter]||1}));
  const out = [];
  while(out.length<n && items.length){
    let total = items.reduce((s,it)=>s+it.w,0), r = Math.random()*total, i=0;
    for(; i<items.length; i++){ r -= items[i].w; if(r<=0) break; }
    i = Math.min(i, items.length-1);
    out.push(items[i].q); items.splice(i,1);
  }
  return out;
}

function isoWeek(d){
  d = d || new Date();
  const t = new Date(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()));
  const day = (t.getUTCDay()+6)%7;
  t.setUTCDate(t.getUTCDate()-day+3);
  const firstThu = new Date(Date.UTC(t.getUTCFullYear(),0,4));
  const fd = (firstThu.getUTCDay()+6)%7;
  firstThu.setUTCDate(firstThu.getUTCDate()-fd+3);
  const wk = 1 + Math.round((t-firstThu)/(7*864e5));
  return t.getUTCFullYear()+'-W'+String(wk).padStart(2,'0');
}
function hashSeed(str){
  let h = 1779033703 ^ str.length;
  for(let i=0;i<str.length;i++){ h = Math.imul(h ^ str.charCodeAt(i), 3432918353); h = (h<<13)|(h>>>19); }
  return function(){ h = Math.imul(h ^ (h>>>16), 2246822507); h = Math.imul(h ^ (h>>>13), 3266489909); return (h ^= h>>>16) >>> 0; };
}
function seededShuffle(arr, seedStr){
  const seed = hashSeed(seedStr), rand = ()=>seed()/4294967296;
  const a = arr.slice();
  for(let i=a.length-1;i>0;i--){ const j=Math.floor(rand()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; }
  return a;
}
function weeklyQuestions(){ return seededShuffle(QUESTIONS, 'battle-'+isoWeek()).slice(0, TEST_SIZE); }

function mergeEntries(list){
  const seen = new Map();
  list.forEach(e=>{ if(e && e.id && !seen.has(e.id)) seen.set(e.id, e); });
  const out = [...seen.values()];
  out.sort((a,b)=>(b.when||0)-(a.when||0));
  return out.slice(0, 1500);
}

/* League table: total points per player across every battle ever played */
function leagueRows(){
  const m = {};
  LB.entries.forEach(e=>{
    if(!e || !e.name) return;
    const k = e.name.trim().toLowerCase();
    const r = m[k] || (m[k] = {name:e.name, pts:0, rounds:0, best:0});
    r.pts += e.pts||0; r.rounds++; r.best = Math.max(r.best, e.pts||0);
  });
  return Object.values(m).sort((a,b)=>b.pts-a.pts || b.best-a.best);
}

/* Save a score to the shared board. Returns: shared | readonly | local | pending */
async function postScore(entry, isRetry){
  if(FIREBASE_URL){
    try{
      const r = await fetch(FIREBASE_URL+'/scores.json', {method:'POST', body: JSON.stringify(entry)});
      if(r.ok){ LB.entries = mergeEntries(LB.entries.concat([entry])); setPending(null); return 'shared'; }
      if(!isRetry){ await new Promise(rs=>setTimeout(rs, 1200+Math.random()*1200)); return postScore(entry, true); }
      return 'local';
    }catch(e){
      if(!isRetry){ await new Promise(rs=>setTimeout(rs, 1200+Math.random()*1200)); return postScore(entry, true); }
      return 'local';
    }
  }
  const art = await artifactNS();
  if(!art) return 'local';
  const remote = await fetchLB();
  const all = mergeEntries(remote.concat(LB.entries, [entry]));
  const json = JSON.stringify({v:1, entries:all});
  try{
    await art.publish({'data/leaderboard.json': {content: json, contentType:'application/json'}});
    LB.entries = all; setPending(null);
    return 'shared';
  }catch(e){
    const code = e && e.code;
    if(code==='not_writer' || code==='not_granted' || code==='consent_required') return 'readonly';
    if(code==='capability_disabled' || code==='capability_removed'){
      return await postScoreHtml(entry, all, json);
    }
    if(code==='conflict'){ setPending(entry); return 'pending'; }
    if((code==='rate_limited' || code==='upstream_error') && !isRetry){
      await new Promise(r=>setTimeout(r, 1500+Math.random()*1500));
      return postScore(entry, true);
    }
    return 'local';
  }
}
/* Fallback: rewrite the page itself with the board embedded (reloads all views) */
async function postScoreHtml(entry, all, json){
  const art = await artifactNS();
  if(!art) return 'local';
  try{
    const r = await fetch(location.pathname, {cache:'no-store'});
    if(!r.ok) return 'local';
    const src = await r.text();
    const marked = src.replace(/\/\*LBJSON\*\/[\s\S]*?\/\*LBJSON\*\//, '/*LBJSON*/'+json+'/*LBJSON*/');
    if(marked === src) return 'local';
    setPending(entry);
    await art.publish(marked);   /* success reloads this view; pending cleared on reload */
    return 'shared';
  }catch(e){
    const code = e && e.code;
    if(code==='not_writer' || code==='not_granted') { setPending(null); return 'readonly'; }
    if(code==='conflict') return 'pending';
    setPending(null);
    return 'local';
  }
}
/* On load: if a save was interrupted by a reload, retry once */
(async function retryPending(){
  const p = pendingEntry();
  if(!p) return;
  await refreshLB();
  if(LB.entries.some(e=>e.id===p.id)){ setPending(null); return; }
  const res = await postScore(p, true);
  if(res==='shared' || res==='readonly') setPending(null);
})();

function confettiBurst(){
  if(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const c = document.createElement('canvas'); c.id='confetti';
  document.body.appendChild(c);
  const ctx = c.getContext('2d'); c.width=innerWidth; c.height=innerHeight;
  const cols=['#2E86C1','#2E9E5B','#D64545','#E8B93B','#7E57C2'];
  const ps=Array.from({length:120},()=>({x:Math.random()*c.width,y:-20-Math.random()*c.height*.3,
    vy:2+Math.random()*3.5,vx:-1.5+Math.random()*3,r:3+Math.random()*4,cl:cols[Math.floor(Math.random()*5)],a:Math.random()*6.28,va:-.2+Math.random()*.4}));
  let t=0;
  (function tick(){
    ctx.clearRect(0,0,c.width,c.height); t++;
    ps.forEach(p=>{ p.x+=p.vx; p.y+=p.vy; p.a+=p.va;
      ctx.save(); ctx.translate(p.x,p.y); ctx.rotate(p.a); ctx.fillStyle=p.cl;
      ctx.fillRect(-p.r,-p.r/2,p.r*2,p.r); ctx.restore(); });
    if(t<160) requestAnimationFrame(tick); else c.remove();
  })();
}

function startQuiz(mode, pool, label, buildKey){
  const qs = buildKey ? weightedSample(pool, BUILDS[buildKey].boost, TEST_SIZE)
                      : shuffle(pool).slice(0, TEST_SIZE);
  S = { mode, label, buildKey: buildKey||null, qs, i:0, answers:{}, revealed:{} };
  renderQ();
}

function renderQ(){
  const q = S.qs[S.i], n = S.qs.length;
  const picked = S.answers[S.i], shown = S.revealed[S.i];
  app.innerHTML = `
  <div class="rail">
    <div class="rail-top">
      <span class="count">${S.i+1}/${n}</span>
      <span class="mode-tag">${S.mode==='battle'?'Battle':S.mode==='test'?'Mock test':'Practice'}</span>
      ${S.mode==='battle' ? `<span class="ptsline">${S.pts.toLocaleString()} pts</span>` : ''}
      ${S.mode==='battle' && S.streak>=3 ? `<span class="streak">&#128293; ${S.streak}</span>` : ''}
      <button class="quit" id="quit">End session</button>
    </div>
    <div class="track"><div class="fill" style="width:${(S.i)/n*100}%"></div></div>
  </div>
  <div class="qmeta">
    <span class="part">${esc(q.part)}</span>
    <span class="clause">Ch ${esc(q.chapter)} &middot; ${esc(q.chapterTitle)}</span>
  </div>
  <div class="qtext">${esc(q.question)}</div>
  <div id="opts">
    ${q.options.map((o,ix)=>{
      let cls='opt';
      if(shown){ if(ix===q.correct) cls+=' right'; else if(ix===picked) cls+=' wrong'; }
      else if(ix===picked) cls+=' sel';
      return `<button class="${cls}" data-ix="${ix}" ${shown?'disabled':''}>
        <span class="key">${'ABCD'[ix]}</span><span>${esc(o)}</span></button>`;
    }).join('')}
  </div>
  <div id="feedback">${shown ? explBlock(q, picked) : ''}</div>
  <div class="quiznav">
    ${S.i>0 && S.mode==='test' ? `<button class="btn btn-ghost" id="prev" style="flex:1">Back</button>`:''}
    <button class="btn btn-primary" id="next" style="flex:2" ${nextDisabled(picked, shown)?'disabled':''}>
      ${S.i===n-1 ? 'Finish' : 'Next question'}</button>
  </div>`;
  window.scrollTo(0,0);
  if(S.mode==='battle' && !shown) S.qStart = Date.now();

  document.getElementById('quit').onclick = ()=>{ if(confirmQuit()) home(); };
  const prev = document.getElementById('prev');
  if(prev) prev.onclick = ()=>{ S.i--; renderQ(); };
  document.querySelectorAll('.opt').forEach(b=>{
    b.onclick = ()=>{
      if(S.revealed[S.i]) return;
      const ix = +b.dataset.ix;
      S.answers[S.i] = ix;
      S.revealed[S.i] = true;
      if(S.mode==='battle'){
        const ok = ix === q.correct;
        let earned = 0;
        if(ok){
          const secs = (Date.now()-S.qStart)/1000;
          const speed = secs<=3 ? 50 : secs>=15 ? 0 : Math.round((50*(15-secs)/12)/5)*5;
          S.streak++; S.bestStreak = Math.max(S.bestStreak, S.streak);
          earned = 100 + speed + (S.streak>=3 ? 20 : 0);
        } else { S.streak = 0; }
        S.pts += earned; S.ptsEach[S.i] = earned;
        if(earned){
          const pop = document.createElement('div');
          pop.className='ptspop'; pop.textContent = '+'+earned;
          document.body.appendChild(pop);
          setTimeout(()=>pop.remove(), 950);
        }
      }
      renderQ();
    };
  });
  document.getElementById('next').onclick = ()=>{
    if(S.i === S.qs.length-1) finish(); else { S.i++; renderQ(); }
  };
}
function nextDisabled(picked, shown){
  return !shown;
}
function confirmQuit(){ return Object.keys(S.answers).length===0 || window.confirm('End this session? Progress won’t be saved.'); }

function tableBlock(q){
  const t = q.table && TABLES[q.table];
  if(!t) return '';
  return `<details class="reft"><summary>View the table</summary>
    <div class="tname">${t.label}</div>${t.html}</details>`;
}

function explBlock(q, picked){
  const ok = picked===q.correct;
  return `<div class="expl">
    <div class="verdict ${ok?'ok':'no'}">${ok?'Correct':'Not quite'}</div>
    <div>${esc(q.explanation)}</div>
    <span class="cl">NHBC Standards 2026 &middot; Clause ${esc(q.ref)}</span>
    ${tableBlock(q)}
  </div>`;
}

function finish(){
  const n = S.qs.length;
  let right = 0;
  S.qs.forEach((q,i)=>{ if(S.answers[i]===q.correct) right++; });
  const pct = Math.round(right/n*100);
  const when = new Date().toLocaleDateString('en-GB',{day:'numeric',month:'short'}) + ', ' +
               new Date().toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'});
  store.add({ pct, label: S.mode==='battle' ? S.label+' — '+S.pts.toLocaleString()+' pts' : S.label, when });

  // per-part breakdown
  const parts = {};
  S.qs.forEach((q,i)=>{
    parts[q.part] = parts[q.part] || {n:0,r:0};
    parts[q.part].n++; if(S.answers[i]===q.correct) parts[q.part].r++;
  });
  const band = pct>=90 ? 'Excellent — site-ready knowledge' :
               pct>=PASS ? 'Pass — solid working knowledge' :
               pct>=60 ? 'Below the mark — review the clauses below' :
               'Needs work — go back through the flagged chapters';
  S.result = { right, n, pct };
  const isBattle = S.mode==='battle';
  const hero = isBattle ? `
  <div class="card scorehead">
    <div class="big">${S.pts.toLocaleString()}</div>
    <div class="band ${pct>=PASS?'ok':'no'}">points &middot; ${right}/${n} correct</div>
    <div class="detail">${esc(S.label)}${S.bestStreak>=3?` &middot; best streak &#128293; ${S.bestStreak}`:''}</div>
    <div class="rankline" id="rankline"></div>
    <div class="savenote warn" id="savenote">Posting your score&hellip;</div>
  </div>
  <div class="card" id="miniboard" style="margin-top:12px"></div>` : `
  <div class="card scorehead">
    <div class="big">${pct}%</div>
    <div class="band ${pct>=PASS?'ok':'no'}">${band}</div>
    <div class="detail">${right} of ${n} correct &middot; ${esc(S.label)} &middot; pass mark ${PASS}%</div>
  </div>`;
  app.innerHTML = mast() + hero + `
  <div class="card break" style="margin-top:12px">
    <h3>By part</h3>
    ${Object.entries(parts).map(([p,v])=>`
      <div class="brow"><span>${esc(p)}</span><span class="n">${v.r}/${v.n}</span>
      <span class="bar"><i style="width:${v.r/v.n*100}%"></i></span></div>`).join('')}
  </div>
  <div class="filterrow review-toggle">
    <button class="fbtn on" data-f="wrong">Review mistakes (${n-right})</button>
    <button class="fbtn" data-f="all">All ${n}</button>
  </div>
  <div id="revlist"></div>
  <div class="quiznav">
    <button class="btn btn-ghost" id="again" style="flex:1">Same again</button>
    <button class="btn btn-primary" id="homebtn" style="flex:1">Home</button>
  </div>`;
  window.scrollTo(0,0);

  const renderRev = f => {
    document.getElementById('revlist').innerHTML = S.qs.map((q,i)=>{
      const picked = S.answers[i], ok = picked===q.correct;
      if(f==='wrong' && ok) return '';
      return `<div class="card rev">
        <div class="qmeta" style="margin-top:0"><span class="part">Q${i+1} &middot; ${esc(q.part)}</span>
        <span class="clause">Ch ${esc(q.chapter)}</span></div>
        <div class="qtext">${esc(q.question)}</div>
        ${!ok ? `<div class="ans you"><span class="tag">Your answer</span><span>${picked!==undefined?esc(q.options[picked]):'Not answered'}</span></div>`:''}
        <div class="ans cor"><span class="tag">Correct</span><span>${esc(q.options[q.correct])}</span></div>
        <div class="exline">${esc(q.explanation)}<span class="cl">Clause ${esc(q.ref)}</span></div>
        ${tableBlock(q)}
      </div>`;
    }).join('') || `<div class="card rev" style="text-align:center;color:var(--muted)">Nothing to review — full marks on this one.</div>`;
  };
  renderRev(right===n ? 'all' : 'wrong');
  if(right===n){ document.querySelector('[data-f="all"]').classList.add('on'); document.querySelector('[data-f="wrong"]').classList.remove('on'); }
  document.querySelectorAll('.fbtn').forEach(b=>{
    b.onclick = ()=>{ document.querySelectorAll('.fbtn').forEach(x=>x.classList.remove('on')); b.classList.add('on'); renderRev(b.dataset.f); };
  });
  document.getElementById('again').onclick = ()=>{
    if(S.mode==='battle') startBattle();
    else if(S.mode==='test' && S.buildKey) startQuiz('test', buildPool(BUILDS[S.buildKey]), S.label, S.buildKey);
    else startQuiz(S.mode, S.mode==='test'?QUESTIONS:S.qs.concat(), S.label);
  };
  document.getElementById('homebtn').onclick = home;

  if(isBattle){
    if(pct>=PASS) confettiBurst();
    const nm = playerName()||'Anon';
    const entry = { id: nm.replace(/\W+/g,'')+'-'+Date.now()+'-'+Math.floor(Math.random()*1e6),
      name: nm, pts: S.pts, correct: right, n, week: isoWeek(),
      date: new Date().toLocaleDateString('en-GB',{day:'numeric',month:'short'}), when: Date.now() };
    const note = document.getElementById('savenote');
    const renderMini = ()=>{
      if(!LB.entries.some(e=>e.id===entry.id)) LB.entries = mergeEntries(LB.entries.concat([entry]));
      const wk = isoWeek();
      const rows = LB.entries.filter(e=>e.week===wk).sort((a,b)=>b.pts-a.pts || (b.when||0)-(a.when||0));
      const rank = rows.findIndex(e=>e.id===entry.id)+1;
      const rl = document.getElementById('rankline');
      if(rl && rank){
        const lg = leagueRows(), lgPos = lg.findIndex(r=>r.name.trim().toLowerCase()===entry.name.trim().toLowerCase())+1;
        const wkTxt = rank===1 ? "Top this week! \u{1F3C6}" : `${rank}${rank===2?'nd':rank===3?'rd':'th'} of ${rows.length} this week`;
        rl.textContent = lgPos ? `${wkTxt} · ${lgPos}${lgPos===1?'st':lgPos===2?'nd':lgPos===3?'rd':'th'} in the league` : wkTxt;
      }
      const mb = document.getElementById('miniboard');
      if(mb) mb.innerHTML = `<div style="padding:12px 14px 2px"><h3 style="font-size:13px;letter-spacing:.9px;text-transform:uppercase;color:var(--muted)">This week's battle</h3></div>` +
        rows.slice(0,5).map((e,i)=>{
          const medal = i===0?'&#129351;':i===1?'&#129352;':i===2?'&#129353;':(i+1);
          return `<div class="lb-row${e.id===entry.id?' me':''}"><span class="rank">${medal}</span>
            <span class="who">${esc(e.name)}<br><span class="sub">${e.correct}/${e.n} correct</span></span>
            <span class="pts">${(e.pts||0).toLocaleString()}</span></div>`;
        }).join('');
    };
    renderMini();
    postScore(entry).then(status=>{
      if(status!=='shared') store.addLocalLB(entry);
      if(note){
        if(status==='shared'){ note.className='savenote ok'; note.textContent='Score posted to the shared leaderboard'; }
        else if(status==='readonly'){ note.className='savenote warn'; note.textContent="View-only link — your score is saved on this phone, not the shared board"; }
        else if(status==='pending'){ note.className='savenote warn'; note.textContent='Board was busy — your score will post on the next refresh'; }
        else { note.className='savenote warn'; note.textContent='Shared board not reachable here — score kept on this phone'; }
      }
      renderMini();
    });
  }
}

home();
</script>
