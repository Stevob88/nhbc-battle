ture and ground-bearing floors?","options":["More than 20% fine particles and a Modified Plasticity Index of 5% or more","More than 30% fine particles and a Modified Plasticity Index of 15% or more","More than 35% fine particles and a Modified Plasticity Index of 10% or more","More than 40% fine particles and a Modified Plasticity Index of 20% or more"],"correct":2,"explanation":"Clause 5.1.4.3 classifies shrinkable soils as those containing more than 35% fine particles (silt and clay) with a Modified Plasticity Index of 10% or more.","ref":"5.1.4.3"},{"id":"5.1-03","chapter":"5.1","chapterTitle":"Substructure and ground-bearing floors","part":"Substructure, ground floors, drainage and basements","question":"Where a pipe is bedded into a substructure wall and connected with flexible joints on both sides, what is the maximum distance the joints may be from the face of the wall?","options":["150mm","225mm","300mm","450mm"],"correct":0,"explanation":"Clause 5.1.5.3 requires flexible joints on bedded pipes to be located as close as feasible to the outside face of the wall, but at a maximum of 150mm from the face of the wall.","ref":"5.1.5.3"},{"id":"5.1-04","chapter":"5.1","chapterTitle":"Substructure and ground-bearing floors","part":"Substructure, ground floors, drainage and basements","question":"Infill under slabs and backfill in trenches should be mechanically compacted in layers not exceeding what thickness?","options":["100mm","150mm","200mm","225mm"],"correct":3,"explanation":"Clause 5.1.7 states that infill under slabs and backfill in trenches should be properly placed and mechanically compacted to form a stable mass in layers not exceeding 225mm.","ref":"5.1.7"},{"id":"5.1-05","chapter":"5.1","chapterTitle":"Substructure and ground-bearing floors","part":"Substructure, ground floors, drainage and basements","question":"To be suitable for use below a ground-bearing slab, fill material should be well graded, inert and able to pass what size of screen in all directions?","options":["75mm x 75mm","100mm x 100mm","150mm x 150mm","225mm x 225mm"],"correct":2,"explanation":"Clause 5.1.9 requires fill to be well graded, inert, free from hazardous materials and able to pass a 150mm x 150mm screen in all directions.","ref":"5.1.9"},{"id":"5.1-06","chapter":"5.1","chapterTitle":"Substructure and ground-bearing floors","part":"Substructure, ground floors, drainage and basements","question":"On site, backfill is being compacted on one side of a foundation trench before the other, so the substructure wall acts as a temporary retaining wall. The filled trench is 1,000mm deep. Without an engineer's design, what is the minimum thickness of the wall leaf supporting the fill?","options":["200mm","300mm","400mm","500mm"],"correct":0,"explanation":"Table 2 in Clause 5.1.12.1 gives a minimum wall leaf thickness of 200mm for filled trench depths up to 1,100mm where the wall acts as a temporary retaining wall.","ref":"5.1.12.1"},{"id":"5.1-07","chapter":"5.1","chapterTitle":"Substructure and ground-bearing floors","part":"Substructure, ground floors, drainage and basements","question":"What is the minimum clear cavity depth that should normally be maintained below the DPC in a cavity wall?","options":["150mm","225mm","300mm","375mm"],"correct":1,"explanation":"Clause 5.1.12.2 requires a minimum 225mm clear cavity below the DPC; this may only be reduced to 150mm where specialised foundations are used and weepholes and other measures ensure free drainage.","ref":"5.1.12.2"},{"id":"5.1-08","chapter":"5.1","chapterTitle":"Substructure and ground-bearing floors","part":"Substructure, ground floors, drainage and basements","question":"On a steep slope, walls below DPC level acting as retaining walls should be designed by an engineer in which situation? (H is the height difference between floor/ground levels; T is the total wall thickness.)","options":["Where H is greater than 2 times T, or H exceeds 0.5m","Where H is greater than 3 times T, or H exceeds 1.5m","Where H is greater than 4 times T, or H exceeds 2m","Where H is greater than 4 times T, or H exceeds 1m"],"correct":3,"explanation":"Clause 5.1.4.4 requires engineer design of walls below DPC acting as retaining walls where (H) is greater than four times (T) or (H) exceeds 1m.","ref":"5.1.4.4"},{"id":"5.1-09","chapter":"5.1","chapterTitle":"Substructure and ground-bearing floors","part":"Substructure, ground floors, drainage and basements","question":"What is the minimum width of sealed laps in a damp proof membrane (DPM) under a ground-bearing concrete floor slab?","options":["300mm","250mm","150mm","100mm"],"correct":0,"explanation":"Clause 5.1.20 requires the DPM to have sealed laps at least 300mm wide and to link with wall DPCs to form an impervious barrier.","ref":"5.1.20"},{"id":"5.2-01","chapter":"5.2","chapterTitle":"Suspended ground floors","part":"Substructure, ground floors, drainage and basements","question":"What is the minimum end bearing for precast concrete suspended ground floors on supporting walls?","options":["75mm","85mm","90mm","100mm"],"correct":2,"explanation":"Clause 5.2.5.2 states that bearings for precast floors should be as recommended by the manufacturer and in no case less than 90mm.","ref":"5.2.5.2"},{"id":"5.2-02","chapter":"5.2","chapterTitle":"Suspended ground floors","part":"Substructure, ground floors, drainage and basements","question":"A beam and block floor uses non-loadbearing infill blocks, so a structural screed is needed to transfer loads. Which type of reinforcement is NOT acceptable to NHBC for that structural screed?","options":["Steel mesh reinforcement","Steel fibres to BS EN 14889-1","Class II polypropylene macro fibres to BS EN 14889-2","Class I polypropylene micro fibres to BS EN 14889-2"],"correct":3,"explanation":"Clause 5.2.4.3 states that Class I polypropylene micro fibres are not acceptable to NHBC for structural applications; they may only be used to assist in controlling shrinkage.","ref":"5.2.4.3"},{"id":"5.2-03","chapter":"5.2","chapterTitle":"Suspended ground floors","part":"Substructure, ground floors, drainage and basements","question":"How much ventilation should be provided to the void below a suspended ground floor?","options":["1,500mm2 per metre run of external wall or 500mm2 per m2 of floor area, whichever gives the greater opening","1,000mm2 per metre run of external wall or 300mm2 per m2 of floor area, whichever gives the greater opening","2,000mm2 per metre run of external wall or 750mm2 per m2 of floor area, whichever gives the greater opening","500mm2 per metre run of external wall or 1,500mm2 per m2 of floor area, whichever gives the greater opening"],"correct":0,"explanation":"Clause 5.2.10.2 requires void ventilation of 1,500mm2 per metre run of external wall or 500mm2 per m2 of floor area, whichever gives the greater opening area.","ref":"5.2.10.2"},{"id":"5.2-04","chapter":"5.2","chapterTitle":"Suspended ground floors","part":"Substructure, ground floors, drainage and basements","question":"A suspended floor is being built over shrinkable soil with high volume change potential where heave could occur. What total void is required below the floor?","options":["250mm","300mm","350mm","400mm"],"correct":1,"explanation":"Clause 5.2.10.2 requires an extra 150mm allowance for high volume change potential soil on top of the standard 150mm ventilation void, giving a 300mm total void.","ref":"5.2.10.2"},{"id":"5.2-05","chapter":"5.2","chapterTitle":"Suspended ground floors","part":"Substructure, ground floors, drainage and basements","question":"How should ventilators be positioned for a suspended timber ground floor?","options":["At no more than 1.5m centres and within 300mm of the corner of the floor","At no more than 2m centres and within 600mm of the corner of the floor","At no more than 3m centres and within 450mm of the corner of the floor","At no more than 2m centres and within 450mm of the corner of the floor"],"correct":3,"explanation":"Clause 5.2.10.2 states that for timber floors, ventilators should be spaced at no more than 2m centres and within 450mm of the corner of the floor.","ref":"5.2.10.2"},{"id":"5.2-06","chapter":"5.2","chapterTitle":"Suspended ground floors","part":"Substructure, ground floors, drainage and basements","question":"Which of the following is an acceptable covering to the ground below a suspended timber ground floor?","options":["50mm concrete laid directly on the ground","75mm concrete on sand blinding","100mm concrete","150mm compacted hardcore on a polyethylene membrane"],"correct":2,"explanation":"Clause 5.2.10.1 requires the ground below a suspended timber floor to be covered with either 50mm concrete or fine aggregate on a polyethylene membrane laid on 50mm sand blinding, or 100mm concrete.","ref":"5.2.10.1"},{"id":"5.3-01","chapter":"5.3","chapterTitle":"Drainage below ground","part":"Substructure, ground floors, drainage and basements","question":"What is the minimum distance a septic tank or cesspool should be sited from homes (outside Scotland)?","options":["5m","7m","10m","15m"],"correct":1,"explanation":"Clause 5.3.5.3 requires septic tanks and cesspools to be a minimum of 7m from homes; in Scotland a minimum of 5m from homes and boundaries is acceptable for septic tanks.","ref":"5.3.5.3"},{"id":"5.3-02","chapter":"5.3","chapterTitle":"Drainage below ground","part":"Substructure, ground floors, drainage and basements","question":"What is the maximum distance a septic tank or cesspool should be from vehicular access to permit emptying?","options":["30m","40m","50m","60m"],"correct":0,"explanation":"Clause 5.3.5.3 requires septic tanks and cesspools to be a maximum of 30m from vehicular access so that they can be emptied.","ref":"5.3.5.3"},{"id":"5.3-03","chapter":"5.3","chapterTitle":"Drainage below ground","part":"Substructure, ground floors, drainage and basements","question":"Where a pumped drainage system is used, the holding tank should be large enough to contain how much domestic effluent?","options":["6 hours' worth","12 hours' worth","36 hours' worth","24 hours' worth"],"correct":3,"explanation":"Clause 5.3.5.4 requires pumped installations to include a holding tank of sufficient volume to contain 24 hours of domestic effluent, based on 120L/150L per head per day.","ref":"5.3.5.4"},{"id":"5.3-04","chapter":"5.3","chapterTitle":"Drainage below ground","part":"Substructure, ground floors, drainage and basements","question":"Pipe runs should be designed to maintain what self-cleansing velocity?","options":["0.3m/s","0.5m/s","0.7m/s","1.0m/s"],"correct":2,"explanation":"Clause 5.3.7.2 states that pipe runs should be designed to maintain a self-cleansing velocity of 0.7m/s and be as straight as practicable.","ref":"5.3.7.2"},{"id":"5.3-05","chapter":"5.3","chapterTitle":"Drainage below ground","part":"Substructure, ground floors, drainage and basements","question":"Where flows are less than 1.0L/second, the gradient for a 100mm diameter drain should be no flatter than what?","options":["1:40","1:60","1:80","1:100"],"correct":0,"explanation":"Clause 5.3.7.4 states that where flows are less than 1.0L/second, gradients for 100mm diameter pipes should not be flatter than 1:40.","ref":"5.3.7.4"},{"id":"5.3-06","chapter":"5.3","chapterTitle":"Drainage below ground","part":"Substructure, ground floors, drainage and basements","question":"Where peak flows are greater than 1.0L/second and the minimum gradients in the standard are used, a 150mm pipe should serve a minimum of how many WCs?","options":["Three","Five","Eight","Ten"],"correct":1,"explanation":"Clause 5.3.7.4 states that where peak flows are greater than 1.0L/second, 100mm pipes should serve a minimum of one WC and 150mm pipes a minimum of five.","ref":"5.3.7.4"},{"id":"5.3-07","chapter":"5.3","chapterTitle":"Drainage below ground","part":"Substructure, ground floors, drainage and basements","question":"Benching in a traditionally constructed manhole should be steel trowelled to a smooth finish with rounded corners and a fall of not less than what?","options":["1:40","1:30","1:20","1:12"],"correct":3,"explanation":"Clause 5.3.7.5 requires benching to be steel trowelled to provide a smooth finish, rounded corners and a fall of not less than 1:12.","ref":"5.3.7.5"},{"id":"5.3-08","chapter":"5.3","chapterTitle":"Drainage below ground","part":"Substructure, ground floors, drainage and basements","question":"Clay bricks used for manholes should have a minimum compressive strength of what?","options":["20N/mm2","35N/mm2","48N/mm2","60N/mm2"],"correct":2,"explanation":"Clause 5.3.7.5 requires clay bricks for manholes to comply with BS EN 771, be of low active soluble salt content and have a minimum compressive strength of 48N/mm2.","ref":"5.3.7.5"},{"id":"5.3-09","chapter":"5.3","chapterTitle":"Drainage below ground","part":"Substructure, ground floors, drainage and basements","question":"What is the minimum capacity of a septic tank serving up to four users?","options":["2,700 litres","3,500 litres","2,000 litres","4,000 litres"],"correct":0,"explanation":"Clause 5.3.9.1 gives the capacity formula C = 180P + 2,000, with a minimum of 2,700L for up to four users.","ref":"5.3.9.1"},{"id":"5.3-10","chapter":"5.3","chapterTitle":"Drainage below ground","part":"Substructure, ground floors, drainage and basements","question":"To restrict entry flow velocity, a drain less than 150mm in diameter running into a septic tank should have what gradient on the approach?","options":["No steeper than 1:40 for at least 10m","No steeper than 1:50 for at least 12m","No steeper than 1:60 for at least 15m","No steeper than 1:80 for at least 20m"],"correct":1,"explanation":"Clause 5.3.9.4 states that where the drain into the septic tank is less than 150mm in diameter, it should have a gradient no steeper than 1:50 for at least 12m.","ref":"5.3.9.4"},{"id":"5.3-11","chapter":"5.3","chapterTitle":"Drainage below ground","part":"Substructure, ground floors, drainage and basements","question":"Field drains taking treated effluent from a septic tank should be formed with perforated pipe laid at least how far below the surface?","options":["300mm","350mm","450mm","500mm"],"correct":3,"explanation":"Clause 5.3.10.4 requires field drains to be formed with perforated pipe laid at least 500mm below the surface, in trenches with a uniform gradient less than 1:200.","ref":"5.3.10.4"},{"id":"5.3-12","chapter":"5.3","chapterTitle":"Drainage below ground","part":"Substructure, ground floors, drainage and basements","question":"Percolation tests for a septic tank sub-surface irrigation system give an average percolation value of 150 seconds. What does the standard say about this ground?","options":["Field drains may be used, sized from the design charts as normal","Field drains may be used provided underdrains are also installed","The soil is unsuitable for field drains","The test should simply be repeated at a deeper level and the results averaged"],"correct":2,"explanation":"Table 7a in Clause 5.3.10.3 states that where the percolation value is over 140, the soil is unsuitable for field drains; underdrains are only a solution for values between 100 and 140.","ref":"5.3.10.3"},{"id":"5.3-13","chapter":"5.3","chapterTitle":"Drainage below ground","part":"Substructure, ground floors, drainage and basements","question":"What is the minimum distance a surface water soakaway should be sited from the foundations of a building?","options":["5m","3m","7m","10m"],"correct":0,"explanation":"Clause 5.3.11.1 requires soakaways to be sited at least 5m from the foundations of a building, on land lower than or sloping away from buildings.","ref":"5.3.11.1"},{"id":"5.3-14","chapter":"5.3","chapterTitle":"Drainage below ground","part":"Substructure, ground floors, drainage and basements","question":"On site you find a run of flexible drainage pipe crossing a garden area, not under a road, with less than 600mm of cover. Where protection is necessary, what does the standard require?","options":["A minimum 100mm concrete encasement all round the pipe","Concrete paving slabs laid as bridging above the pipe, with a minimum 75mm of granular material between the top of the pipe and the underside of the slabs","Reinforced concrete bridging slabs bearing directly on the pipe crown","Replacement of the flexible pipe with rigid pipe at the same depth"],"correct":1,"explanation":"Table 10 in Clause 5.3.14.2 states that flexible pipes in garden areas with less than 600mm cover should, where necessary, have concrete paving slabs laid as bridging with a minimum 75mm of granular material between the pipe top and the underside of the slabs.","ref":"5.3.14.2"},{"id":"5.3-15","chapter":"5.3","chapterTitle":"Drainage below ground","part":"Substructure, ground floors, drainage and basements","question":"When backfilling a drainage trench, mechanical compaction should only be used once the compacted backfill is how far above the crown of the pipe?","options":["Over 150mm","Over 225mm","Over 300mm","Over 450mm"],"correct":3,"explanation":"Clause 5.3.15.2 states that backfill should be placed in layers no deeper than 300mm and mechanical compacting should only be used when compacted backfill is over 450mm above the crown of the pipe.","ref":"5.3.15.2"},{"id":"5.3-16","chapter":"5.3","chapterTitle":"Drainage below ground","part":"Substructure, ground floors, drainage and basements","question":"Suspended horizontal drainage of 110mm nominal diameter under a floor should typically be supported at what centres?","options":["400mm to 500mm","600mm to 700mm","900mm to 1,000mm","1,200mm to 1,500mm"],"correct":2,"explanation":"Clause 5.3.17.2 states that suspended horizontal drainage should be supported as per the manufacturer's recommendations, typically 900mm to 1,000mm centres for 110mm nominal diameter pipes and at every socket or joint.","ref":"5.3.17.2"},{"id":"5.4-01","chapter":"5.4","chapterTitle":"Waterproofing of basements and other below ground structures","part":"Substructure, ground floors, drainage and basements","question":"How far in advance of works starting on site should basement waterproofing design and specification information be provided to NHBC?","options":["At least eight weeks","At least four weeks","At least six weeks","At least two weeks"],"correct":0,"explanation":"Clause 5.4.2 requires design and specification information to be provided to NHBC at least eight weeks in advance of the works starting on site, in accordance with the NHBC Rules.","ref":"5.4.2"},{"id":"5.4-02","chapter":"5.4","chapterTitle":"Waterproofing of basements and other below ground structures","part":"Substructure, ground floors, drainage and basements","question":"Which qualification for a waterproofing design specialist is generally acceptable to NHBC?","options":["Chartered membership of the Institution of Civil Engineers","Certified Surveyor in Structural Waterproofing (CSSW) from the Property Care Association","An NVQ Level 3 in construction site supervision","A CITB Site Management Safety Training Scheme certificate"],"correct":1,"explanation":"Clause 5.4.3.1 states that designers who have successfully completed the Certified Surveyor in Structural Waterproofing (CSSW) qualification from the Property Care Association (PCA) are generally acceptable to NHBC.","ref":"5.4.3.1"},{"id":"5.4-03","chapter":"5.4","chapterTitle":"Waterproofing of basements and other below ground structures","part":"Substructure, ground floors, drainage and basements","question":"In which situation should a combined waterproofing system (two system types together) be used?","options":["Where a Grade 1b environment is needed and the wall retains more than 300mm","Where a Grade 2 environment is needed and the wall retains more than 450mm","Where a Grade 3 environment is needed and the wall retains more than 150mm","Where a Grade 3 environment is needed and the wall retains more than 600mm"],"correct":3,"explanation":"Clause 5.4.3.2 requires combined systems where a Grade 3 environment is needed and the wall retains more than 600mm, unless it is demonstrated that the water table is permanently below the underside of the lowest floor slab.","ref":"5.4.3.2"},{"id":"5.4-04","chapter":"5.4","chapterTitle":"Waterproofing of basements and other below ground structures","part":"Substructure, ground floors, drainage and basements","question":"Where it is necessary to establish the water table for a basement design, long-term water level monitoring should be carried out over what minimum period?","options":["Three months","Six months","One year","Two years"],"correct":2,"explanation":"Clause 5.4.4 requires a detailed hydrogeological assessment including long-term water level monitoring over at least one year to capture seasonal fluctuations, with boreholes monitored at intervals of three months or less.","ref":"5.4.4"},{"id":"5.4-05","chapter":"5.4","chapterTitle":"Waterproofing of basements and other below ground structures","part":"Substructure, ground floors, drainage and basements","question":"What grade of waterproofing protection is generally required for habitable accommodation below ground?","options":["Grade 3","Grade 2","Grade 1b","Grade 1a"],"correct":0,"explanation":"Table 2 in Clause 5.4.6.1 states that Grade 3, where no water ingress or damp areas is acceptable, is generally required for habitable accommodation.","ref":"5.4.6.1"},{"id":"5.4-06","chapter":"5.4","chapterTitle":"Waterproofing of basements and other below ground structures","part":"Substructure, ground floors, drainage and basements","question":"Basement waterproofing should extend at least how far above the external ground level and connect with the superstructure damp proofing?","options":["100mm","150mm","225mm","300mm"],"correct":1,"explanation":"Clause 5.4.6.3 requires waterproofing to extend at least 150mm above the external ground level and connect with the superstructure damp proofing, generally by linking to a continuous cavity tray.","ref":"5.4.6.3"},{"id":"5.4-07","chapter":"5.4","chapterTitle":"Waterproofing of basements and other below ground structures","part":"Substructure, ground floors, drainage and basements","question":"In a Type B in-situ concrete system using water-resisting admixtures, what is the maximum design width for cracks that pass through the section?","options":["0.5mm","0.4mm","0.3mm","0.2mm"],"correct":3,"explanation":"Clause 5.4.7.2 states that where admixtures are used, crack widths should be no greater than 0.3mm maximum for flexural cracks and 0.2mm maximum for cracks that pass through the section.","ref":"5.4.7.2"},{"id":"5.4-08","chapter":"5.4","chapterTitle":"Waterproofing of basements and other below ground structures","part":"Substructure, ground floors, drainage and basements","question":"Where a Type B in-situ concrete waterproofing design does not include admixtures, what minimum section thickness should be used?","options":["150mm","200mm","250mm","300mm"],"correct":2,"explanation":"Clause 5.4.7.2 states that where the design of in-situ concrete waterproofing does not include admixtures, a minimum section thickness of 250mm should be used, with crack widths limited to 0.2mm maximum.","ref":"5.4.7.2"},{"id":"5.4-09","chapter":"5.4","chapterTitle":"Waterproofing of basements and other below ground structures","part":"Substructure, ground floors, drainage and basements","question":"In a Type C drained cavity system, as well as a primary pump and a pump failure alarm, what should the automatic pump system include?","options":["A secondary pump with battery or generator backup","A duplicate gravity overflow discharging to a soakaway","A manually switched standby pump in the sump","A high-level float switch connected to the mains supply only"],"correct":0,"explanation":"Clause 5.4.7.3 requires pump systems to operate automatically and include a primary pump, a secondary pump with battery or generator backup, and a suitable audio or visual alarm indicating pump failure.","ref":"5.4.7.3"},{"id":"6.1-01","chapter":"6.1","chapterTitle":"External masonry walls","part":"Superstructure (excluding roofs)","question":"What is the minimum bearing of a concrete floor onto a masonry wall for it to provide adequate lateral restraint?","options":["75mm","90mm","100mm","150mm"],"correct":1,"explanation":"Clause 6.1.3.2 states that concrete floors with a minimum bearing of 90mm onto the wall can provide adequate restraint; floors running parallel to, and not built into, walls require restraint straps.","ref":"6.1.3.2"},{"id":"6.1-02","chapter":"6.1","chapterTitle":"External masonry walls","part":"Superstructure (excluding roofs)","question":"Where a partition wall is connected to an external wall with a tied joint, what is the maximum spacing of the wall ties or expanded metal?","options":["150mm","225mm","300mm","450mm"],"correct":2,"explanation":"Clause 6.1.3.4 states tied joints should be formed using expanded metal, wire wall ties or a proprietary equivalent, spaced at maximum 300mm intervals.","ref":"6.1.3.4"},{"id":"6.1-03","chapter":"6.1","chapterTitle":"External masonry walls","part":"Superstructure (excluding roofs)","question":"What is the normal spacing of vertical movement joints in a clay brick outer leaf?","options":["6m","7.5m to 9m","10m to 12m","15m to 20m"],"correct":2,"explanation":"Table 1 in Clause 6.1.3.5 gives a normal movement joint spacing of 10-12m for clay brick, with a joint width of 16mm.","ref":"6.1.3.5"},{"id":"6.1-04","chapter":"6.1","chapterTitle":"External masonry walls","part":"Superstructure (excluding roofs)","question":"In the inner leaf of a cavity wall, consideration should be given to providing movement joints in rooms where straight unbroken lengths of wall exceed what dimension?","options":["6m","8m","10m","12m"],"correct":0,"explanation":"Clause 6.1.3.5 states that although movement joints are not generally necessary in the inner leaf, consideration should be given to providing them in rooms with straight unbroken lengths of wall over 6m.","ref":"6.1.3.5"},{"id":"6.1-05","chapter":"6.1","chapterTitle":"External masonry walls","part":"Superstructure (excluding roofs)","question":"Which filler material is suitable for a movement joint in clay brickwork, which expands over time?","options":["Hemp","Flexible cellular polyethylene","Fibreboard","Cork"],"correct":1,"explanation":"Clause 6.1.3.5 states clay bricks expand and require joints formed from easily compressible materials such as flexible cellular polyethylene, cellular polyurethane or foam rubber; hemp, fibreboard and cork are only acceptable in contraction joints for concrete bricks and blocks.","ref":"6.1.3.5"},{"id":"6.1-06","chapter":"6.1","chapterTitle":"External masonry walls","part":"Superstructure (excluding roofs)","question":"A site is classed as being in a 'very severe' exposure zone when the exposure to wind-driven rain is what?","options":["Less than 33 litres/m² per spell","33 to less than 56.5 litres/m² per spell","56.5 to less than 100 litres/m² per spell","100 or more litres/m² per spell"],"correct":3,"explanation":"The exposure zone key in Clause 6.1.6.2 defines very severe exposure as 100 or more litres/m² per spell of wind-driven rain.","ref":"6.1.6.2"},{"id":"6.1-07","chapter":"6.1","chapterTitle":"External masonry walls","part":"Superstructure (excluding roofs)","question":"You are building a masonry home in Scotland. What does the standard require at the reveals of window and door openings?","options":["A checked rebate to avoid a straight through joint, or a proprietary cavity closer assessed under Technical Requirement R3","A double bead of silicone sealant between the frame and the masonry","A 25mm wide vertical DPC dressed over the face of the frame","An increased cavity width of 100mm at the reveal"],"correct":0,"explanation":"Clause 6.1.6.2 states that in Scotland, Northern Ireland, the Isle of Man and other places of very severe exposure to driving rain, masonry should form a rebate at the reveals to avoid a straight through joint, or a proprietary cavity closer assessed in accordance with Technical Requirement R3 should be used.","ref":"6.1.6.2"},{"id":"6.1-08","chapter":"6.1","chapterTitle":"External masonry walls","part":"Superstructure (excluding roofs)","question":"In Scotland, what classification must all clay bricks used as facings achieve?","options":["F0,S2 to BS EN 771-1","F1,S1 to BS EN 771-1","F1,S2 to BS EN 771-1","F2,S2 or F2,S1 to BS EN 771-1"],"correct":3,"explanation":"Clause 6.1.6.3 states that in Scotland all clay bricks used as facings should be frost-resistant, F2,S2 or F2,S1 to BS EN 771-1, and concrete facing bricks should be 22N/mm² to BS EN 771-3.","ref":"6.1.6.3"},{"id":"6.1-09","chapter":"6.1","chapterTitle":"External masonry walls","part":"Superstructure (excluding roofs)","question":"Which combination of factors defines an area of severe exposure to frost attack?","options":["More than 30 days of frost a year, annual rainfall over 0.5m, and 45m above sea level","More than 60 days of frost a year, annual rainfall over 1m, and 90m above sea level","More than 90 days of frost a year, annual rainfall over 1.5m, and 120m above sea level","More than 60 days of frost a year and located within 8km of the coast"],"correct":1,"explanation":"Clause 6.1.6.3 states the hatched areas on the frost map have frost more than 60 days in a year, annual rainfall over 1m and are 90m above sea level, and are therefore considered at severe exposure to frost.","ref":"6.1.6.3"},{"id":"6.1-10","chapter":"6.1","chapterTitle":"External masonry walls","part":"Superstructure (excluding roofs)","question":"A bricklayer is installing the first row of cavity insulation boards. How should the boards be supported?","options":["On a minimum of one wall tie per board, at the centre of the board","On a minimum of two wall ties per board, coinciding with horizontal joints in the insulation","On a minimum of three wall ties per board, staggered across the board face","On a minimum of four wall ties per board, one at each corner"],"correct":1,"explanation":"Clause 6.1.7.2 states the first row of insulation boards or batts should be supported on wall ties, with a minimum of two ties to each board or batt, which coincide with horizontal joints in the insulation.","ref":"6.1.7.2"},{"id":"6.1-11","chapter":"6.1","chapterTitle":"External masonry walls","part":"Superstructure (excluding roofs)","question":"Where partial fill cavity insulation is installed, what minimum clear cavity should normally be maintained between the insulation and the outer leaf?","options":["30mm","40mm","50mm","65mm"],"correct":2,"explanation":"Clause 6.1.7.4 states a minimum 50mm clear cavity should be maintained between partial cavity insulation and the outer leaf, with the insulation fixed only against the cavity face of the inner leaf.","ref":"6.1.7.4"},{"id":"6.1-12","chapter":"6.1","chapterTitle":"External masonry walls","part":"Superstructure (excluding roofs)","question":"In areas of very severe exposure in England and Wales, what residual cavity is required with partial fill insulation where the outer leaf is fair faced masonry?","options":["50mm","65mm","75mm","100mm"],"correct":2,"explanation":"Clause 6.1.7.4 states that in areas of very severe exposure in England and Wales, a residual cavity of 75mm is required where the outer leaf is fair faced masonry.","ref":"6.1.7.4"},{"id":"6.1-13","chapter":"6.1","chapterTitle":"External masonry walls","part":"Superstructure (excluding roofs)","question":"For a fair faced masonry wall in a very severe exposure area, what is the minimum thickness of built-in full fill cavity insulation?","options":["75mm","100mm","125mm","150mm"],"correct":3,"explanation":"Table 2 in Clause 6.1.7.4 requires a minimum built-in insulation thickness of 150mm for fair faced masonry in the very severe exposure category; fair faced masonry with full cavity insulation is not permitted there in cavity widths of less than 150mm.","ref":"6.1.7.4"},{"id":"6.1-14","chapter":"6.1","chapterTitle":"External masonry walls","part":"Superstructure (excluding roofs)","question":"What minimum compressive strength of concrete block could be used for one- and two-storey homes?","options":["2.9N/mm²","3.6N/mm²","7.3N/mm²","10.4N/mm²"],"correct":0,"explanation":"Clause 6.1.8.1 states that for one- and two-storey homes, blocks with a minimum compressive strength of 2.9N/mm² could be used; 7.3N/mm² blocks are required for certain parts of three-storey homes or those with storey heights over 2.7m.","ref":"6.1.8.1"},{"id":"6.1-15","chapter":"6.1","chapterTitle":"External masonry walls","part":"Superstructure (excluding roofs)","question":"Concrete blocks used in the outer leaf without protective cladding or render should meet which requirement?","options":["Compressive strength of at least 2.9N/mm² or density of at least 1,200kg/m³","Compressive strength greater than 3.6N/mm² or density of at least 1,350kg/m³","Compressive strength greater than 7.3N/mm² or density of at least 1,500kg/m³","Compressive strength greater than 10.4N/mm² regardless of density"],"correct":2,"explanation":"Clause 6.1.8.2 states concrete blocks used in the outer leaf without protective cladding or render should have a compressive strength greater than 7.3N/mm² or a density of at least 1,500kg/m³, be made with dense aggregate, or be aircrete blocks with suitability confirmed by the manufacturer.","ref":"6.1.8.2"},{"id":"6.1-16","chapter":"6.1","chapterTitle":"External masonry walls","part":"Superstructure (excluding roofs)","question":"What minimum compressive strength of clay brick is acceptable for a three-storey home?","options":["7.3N/mm²","9N/mm²","13N/mm²","22N/mm²"],"correct":2,"explanation":"Clause 6.1.9 states that for three-storey homes, clay bricks to BS EN 771 with a minimum compressive strength of 13N/mm² are acceptable; 9N/mm² is adequate for one- and two-storey homes.","ref":"6.1.9"},{"id":"6.1-17","chapter":"6.1","chapterTitle":"External masonry walls","part":"Superstructure (excluding roofs)","question":"A delivery of clay facing bricks arrives on site classified F0,S1. What does the standard say about using them?","options":["They may be used provided sulfate-resisting mortar is specified","They are not acceptable externally unless completely protected by a cladding which can satisfactorily resist the passage of water","They may be used on elevations sheltered from driving rain","They may only be used below DPC level"],"correct":1,"explanation":"Clause 6.1.9 states bricks that are not freeze-/thaw-resistant (F0,S2 or F0,S1 to BS EN 771) are not acceptable for use externally, unless completely protected by a cladding which can satisfactorily resist the passage of water.","ref":"6.1.9"},{"id":"6.1-18","chapter":"6.1","chapterTitle":"External masonry walls","part":"Superstructure (excluding roofs)","question":"Where squared or random rubble stone masonry is used, it should be brought to course at regular intervals of not more than what?","options":["300mm","450mm","600mm","900mm"],"correct":1,"explanation":"Clause 6.1.10 states that where squared or random rubble is used, the stone masonry should be brought to course at regular intervals of not more than 450mm, and bed joints of up to 25mm wide may be acceptable.","ref":"6.1.10"},{"id":"6.1-19","chapter":"6.1","chapterTitle":"External masonry walls","part":"Superstructure (excluding roofs)","question":"During construction of a cavity wall, what is the maximum difference in height allowed between the two leaves, provided the ties are sufficiently flexible?","options":["Two block courses","Four block courses","Six block courses","Eight block courses"],"correct":2,"explanation":"Clause 6.1.11.3 states the difference in heights between the two leaves of a cavity wall under construction can be up to six block courses, provided the ties are sufficiently flexible to ensure coursing is achieved without breaking the bond.","ref":"6.1.11.3"},{"id":"6.1-20","chapter":"6.1","chapterTitle":"External masonry walls","part":"Superstructure (excluding roofs)","question":"What thickness limits apply to bed and perpend joints made with general purpose mortar, unless the manufacturer recommends otherwise?","options":["Not less than 4mm nor more than 12mm","Not less than 6mm nor more than 15mm","Not less than 8mm nor more than 18mm","Not less than 10mm nor more than 20mm"],"correct":1,"explanation":"Clause 6.1.11.3 states the thickness of bed and perpend joints made with general purpose and lightweight mortars should be not less than 6mm nor more than 15mm unless specific manufacturers recommendations are given.","ref":"6.1.11.3"},{"id":"6.1-21","chapter":"6.1","chapterTitle":"External masonry walls","part":"Superstructure (excluding roofs)","question":"Where courses are corbelled outwards in ordinary masonry without reinforcement, what is the maximum extent of the corbel for a wall of thickness T?","options":["T/6","T/4","T/3","T/2"],"correct":2,"explanation":"Clause 6.1.11.5 shows the maximum corbel as T/3 for both solid and cavity walls; where reinforcing is used, corbels should be designed by an engineer in accordance with Technical Requirement R5.","ref":"6.1.11.5"},{"id":"6.1-22","chapter":"6.1","chapterTitle":"External masonry walls","part":"Superstructure (excluding roofs)","question":"Horizontal chases for services in a masonry leaf should be limited to what proportion of the depth of the leaf?","options":["1/6","1/4","1/3","1/2"],"correct":0,"explanation":"Clause 6.1.11.6 states chases should be limited to 1/6 of the depth of the leaf where horizontal and 1/3 of the depth where vertical.","ref":"6.1.11.6"},{"id":"6.1-23","chapter":"6.1","chapterTitle":"External masonry walls","part":"Superstructure (excluding roofs)","question":"What is the minimum end bearing length for a simple lintel spanning over 1.2m?","options":["75mm","100mm","150mm","225mm"],"correct":2,"explanation":"Table 5 in Clause 6.1.12 requires a minimum bearing length of 150mm for a simple lintel with a span over 1.2m; 100mm applies only to simple lintels spanning up to 1.2m.","ref":"6.1.12"},{"id":"6.1-24","chapter":"6.1","chapterTitle":"External masonry walls","part":"Superstructure (excluding roofs)","question":"What is the maximum overhang of brickwork or masonry permitted beyond the edge of a lintel?","options":["15mm","25mm","40mm","50mm"],"correct":1,"explanation":"Clause 6.1.12.3 states lintels should not have brickwork or masonry which overhangs more than 25mm.","ref":"6.1.12.3"},{"id":"6.1-25","chapter":"6.1","chapterTitle":"External masonry walls","part":"Superstructure (excluding roofs)","question":"You are building in an area of severe exposure to driving rain. What damp proof protection is required over the lintels?","options":["Combined lintels alone provide sufficient protection in all cases","Cavity trays are only needed over openings wider than 1.2m","A separate cavity tray is only required over steel lintels","A separate cavity tray should be provided over all lintels"],"correct":3,"explanation":"Clause 6.1.12.2 states that in Scotland, Northern Ireland, the Isle of Man and areas of severe or very severe exposure to driving rain, a separate cavity tray should be provided over all lintels.","ref":"6.1.12.2"},{"id":"6.1-26","chapter":"6.1","chapterTitle":"External masonry walls","part":"Superstructure (excluding roofs)","question":"For general wall areas above the DPC in exposure categories other than severe or very severe, what cement:lime:sand mortar mix is recommended for clay bricks?","options":["1:½:4½","1:1:4½","1:1:5½","1:2:9"],"correct":2,"explanation":"Table 6 in Clause 6.1.14 recommends a 1:1:5½ cement:lime:sand mix (designation iii, mortar class M4) for general wall areas above the DPC in other exposure categories; 1:½:4½ is the high durability mix for severe or very severe exposure and below DPC.","ref":"6.1.14"},{"id":"6.1-27","chapter":"6.1","chapterTitle":"External masonry walls","part":"Superstructure (excluding roofs)","question":"A gauge of site-mixed mortar was knocked up mid-morning and is still on the spot boards after lunch. How long after mixing can non-retarded mortar be used?","options":["One hour","Two hours","Three hours","Four hours"],"correct":1,"explanation":"Clause 6.1.14.3 states mortar should be the correct mix and used within two hours, unless it is retarded mortar, and mortar which has started to set should not be retempered.","ref":"6.1.14.3"},{"id":"6.1-28","chapter":"6.1","chapterTitle":"External masonry walls","part":"Superstructure (excluding roofs)","question":"At the base of walls, what is the minimum height of the DPC above adjoining finished ground or paving level?","options":["100mm","150mm","225mm","300mm"],"correct":1,"explanation":"Table 8 and the horizontal DPC guidance in Clause 6.1.17.1 state a DPC should be provided a minimum of 150mm above adjoining surfaces and linked with the DPM in solid floors.","ref":"6.1.17.1"},{"id":"6.1-29","chapter":"6.1","chapterTitle":"External masonry walls","part":"Superstructure (excluding roofs)","question":"Where fair faced masonry is supported by lintels, how should weepholes be provided over openings?","options":["At least two per opening, at not more than 450mm intervals","One per opening, at not more than 600mm intervals","At least two per opening, at not more than 900mm intervals","At least three per opening, at not more than 300mm intervals"],"correct":0,"explanation":"Clause 6.1.17.1 states weepholes should be provided at a maximum of 450mm intervals and each opening should have at least two weepholes, with stop ends to cavity trays or combined lintels.","ref":"6.1.17.1"},{"id":"6.1-30","chapter":"6.1","chapterTitle":"External masonry walls","part":"Superstructure (excluding roofs)","question":"On a standard strip foundation, the concrete fill in a cavity wall should stop at least how far below the base DPC?","options":["150mm","225mm","300mm","450mm"],"correct":1,"explanation":"Clause 6.1.17.1 states the concrete fill in a cavity wall should stop at least 225mm below the base DPC, which may be reduced to 150mm where special foundations, such as rafts, are used.","ref":"6.1.17.1"},{"id":"6.1-31","chapter":"6.1","chapterTitle":"External masonry walls","part":"Superstructure (excluding roofs)","question":"What is the minimum upstand of a cavity tray, measured from the inside face of the outer leaf to the outside of the inner leaf?","options":["100mm","120mm","140mm","150mm"],"correct":2,"explanation":"Clause 6.1.17.1 states cavity trays should have a 140mm minimum upstand from the inside face of the outer leaf to the outside of the inner leaf.","ref":"6.1.17.1"},{"id":"6.1-32","chapter":"6.1","chapterTitle":"External masonry walls","part":"Superstructure (excluding roofs)","question":"What is the maximum spacing of wall ties in the general wall area of a masonry cavity wall?","options":["450mm horizontally and 225mm vertically","600mm horizontally and 450mm vertically","750mm horizontally and 300mm vertically","900mm horizontally and 450mm vertically"],"correct":3,"explanation":"Table 9 in Clause 6.1.18.1 gives a maximum wall tie spacing in the general wall area of 900mm horizontally and 450mm vertically.","ref":"6.1.18.1"},{"id":"6.1-33","chapter":"6.1","chapterTitle":"External masonry walls","part":"Superstructure (excluding roofs)","question":"It is a cold morning and the forecast shows temperatures dropping. Below what air temperature should brickwork and blockwork not be built?","options":["3°C and falling","1°C and falling","0°C and falling","5°C and falling"],"correct":0,"explanation":"Clause 6.1.20.1 states brickwork and blockwork should not be built when the air temperature is below 3°C and falling; work can resume when the temperature is 1°C and rising, with the expectation it will exceed 3°C.","ref":"6.1.20.1"},{"id":"6.2-01","chapter":"6.2","chapterTitle":"External timber framed walls","part":"Superstructure (excluding roofs)","question":"Who is required to check the design of a timber frame superstructure and sign the certificate for a home?","options":["An architect experienced in panelised construction, appointed by the builder","The timber frame designer, provided they hold professional indemnity insurance","Any structural engineer from the same practice as the timber frame designer","An NHBC-listed certifier who is a suitably qualified civil or structural engineer with at least three years' timber frame experience, and not the designer"],"correct":3,"explanation":"Clause 6.2.3 requires the timber frame certifier to be on NHBC's list, be a suitably qualified civil or structural engineer with a minimum of three years' experience in timber frame construction, and not be the designer of the frame nor from the same practice.","ref":"6.2.3"},{"id":"6.2-02","chapter":"6.2","chapterTitle":"External timber framed walls","part":"Superstructure (excluding roofs)","question":"What is the minimum width of individual timber studs in a load-bearing timber framed wall?","options":["38mm","44mm","47mm","50mm"],"correct":0,"explanation":"Clause 6.2.4.1 states individual timber studs should have a minimum width of 38mm and a maximum spacing of 600mm, unless other adequate support is provided for wall boards and fixings.","ref":"6.2.4.1"},{"id":"6.2-03","chapter":"6.2","chapterTitle":"External timber framed walls","part":"Superstructure (excluding roofs)","question":"What is the maximum permitted overhang of the sole plate over the supporting structure for standard stud widths?","options":["12mm","15mm","20mm","25mm"],"correct":0,"explanation":"Clause 6.2.4.3 (Figure 2) shows a maximum 12mm overhang of the frame over the supporting structure, increased to 20mm for 140mm wide studs.","ref":"6.2.4.3"},{"id":"6.2-04","chapter":"6.2","chapterTitle":"External timber framed walls","part":"Superstructure (excluding roofs)","question":"On site, the sole plate needs packing to get it level. Packing exceeding what thickness must be agreed between the timber frame manufacturer's engineer and NHBC?","options":["20mm","25mm","30mm","35mm"],"correct":0,"explanation":"Clause 6.2.4.4 states packing exceeding 20mm should be agreed between the timber frame manufacturer's engineer and NHBC; the methods listed are generally acceptable for packing up to 20mm.","ref":"6.2.4.4"},{"id":"6.2-05","chapter":"6.2","chapterTitle":"External timber framed walls","part":"Superstructure (excluding roofs)","question":"Where holding-down devices are manufactured from galvanized mild steel, what minimum zinc coating is required on each side?","options":["Z275","460g/m²","710g/m²","940g/m²"],"correct":3,"explanation":"Clause 6.2.5 requires holding-down devices to be austenitic stainless steel minimum grade 1.4301, or galvanized mild steel with a zinc coating to BS EN ISO 1461 of minimum 940g/m² on each side; Z275 applies only to sole plate anchors within the internal envelope.","ref":"6.2.5"},{"id":"6.2-06","chapter":"6.2","chapterTitle":"External timber framed walls","part":"Superstructure (excluding roofs)","question":"Which grades of oriented strand board are acceptable as sheathing to a timber frame wall panel?","options":["OSB/1 only","OSB/2 only","OSB/2 or OSB/3","OSB/3 or OSB/4"],"correct":3,"explanation":"Clause 6.2.7 lists oriented strand board to BS EN 300 type OSB/3 or OSB/4 as acceptable sheathing materials.","ref":"6.2.7"},{"id":"6.2-07","chapter":"6.2","chapterTitle":"External timber framed walls","part":"Superstructure (excluding roofs)","question":"With masonry cladding and solid timber floor joists, what differential movement gap should be provided at first floor level in the absence of project-specific calculations?","options":["15mm","20mm","25mm","35mm"],"correct":1,"explanation":"Table 1 in Clause 6.2.8 gives a 20mm opening and closing gap at first floor level for solid timber joists with masonry cladding; 15mm applies to engineered I-joists at that level.","ref":"6.2.8","table":"ch62-t1"},{"id":"6.2-08","chapter":"6.2","chapterTitle":"External timber framed walls","part":"Superstructure (excluding roofs)","question":"A movement joint should be protected by a cover strip when the expected movement gap exceeds what size?","options":["20mm","25mm","30mm","35mm"],"correct":3,"explanation":"Clause 6.2.8 states joints should be protected by a cover strip where the movement gap/joint is expected to be more than 35mm.","ref":"6.2.8"},{"id":"6.2-09","chapter":"6.2","chapterTitle":"External timber framed walls","part":"Superstructure (excluding roofs)","question":"What is the minimum cavity width, measured between the cladding and the sheathing, where masonry cladding is used on a timber frame?","options":["15mm","25mm","35mm","50mm nominal"],"correct":3,"explanation":"Table 2 in Clause 6.2.10.1 gives a minimum cavity width of 50mm nominal for masonry cladding; 25mm nominal applies to render on backed lathing and 15mm to other cladding.","ref":"6.2.10.1"},{"id":"6.2-10","chapter":"6.2","chapterTitle":"External timber framed walls","part":"Superstructure (excluding roofs)","question":"Cavity vents between masonry cladding and a timber frame wall should be equivalent to open brick perpend joints at what spacing?","options":["Every 1.2m","Every 1.5m","Every 1.8m","Every 2.4m"],"correct":0,"explanation":"Clause 6.2.10.2 states cavity vents should be equivalent to open brick perpend joints every 1.2m, located to prevent the ingress of rain and to drain moisture from the cavity.","ref":"6.2.10.2"},{"id":"6.2-11","chapter":"6.2","chapterTitle":"External timber framed walls","part":"Superstructure (excluding roofs)","question":"On a site not subject to a high water table, how high above finished ground level should sole plates normally be positioned?","options":["At least 150mm, which may be reduced to 75mm where specific conditions are met","At least 75mm in all circumstances","At least 100mm, which may be reduced to 50mm where specific conditions are met","At least 225mm in all circumstances"],"correct":0,"explanation":"Clause 6.2.10.3 states sole plates should be positioned at least 150mm above finished ground level, which may be reduced to 75mm where the site is not subject to a high water table, the cavity will not have standing water, and any radon/gas membrane is not compromised.","ref":"6.2.10.3"},{"id":"6.2-12","chapter":"6.2","chapterTitle":"External timber framed walls","part":"Superstructure (excluding roofs)","question":"Where a polyethylene sheet is used as the air and vapour control layer, what is the minimum gauge required?","options":["250 gauge (62.5 micron)","300 gauge (75 micron)","400 gauge (100 micron)","500 gauge (125 micron)"],"correct":3,"explanation":"Clause 6.2.12 requires the air and vapour control layer to be a minimum 500 gauge (125 micron) polyethylene sheet, vapour control plasterboard or a product assessed in accordance with Technical Requirement R3.","ref":"6.2.12"},{"id":"6.2-13","chapter":"6.2","chapterTitle":"External timber framed walls","part":"Superstructure (excluding roofs)","question":"What minimum laps are required at joints in a breather membrane?","options":["50mm on horizontal joints and 100mm on vertical joints","75mm on horizontal joints and 100mm on vertical joints","100mm on horizontal joints and 150mm on vertical joints","150mm on horizontal joints and 225mm on vertical joints"],"correct":2,"explanation":"Clause 6.2.13 requires breather membranes to be lapped with a minimum 100mm overlap on horizontal joints and 150mm on vertical joints, with upper layers over lower layers so rain runs away from the sheathing.","ref":"6.2.13"},{"id":"6.2-14","chapter":"6.2","chapterTitle":"External timber framed walls","part":"Superstructure (excluding roofs)","question":"What is the maximum spacing of wall ties connecting masonry cladding to a timber frame wall?","options":["900mm horizontally and 450mm vertically","600mm horizontally and 600mm vertically","450mm horizontally and 300mm vertically","600mm horizontally and 450mm vertically"],"correct":3,"explanation":"Clause 6.2.14 states wall ties should be spaced at a maximum of 600mm horizontally and 450mm vertically, be of austenitic stainless steel, and be fixed to the studs and not the sheathing.","ref":"6.2.14"},{"id":"6.3-01","chapter":"6.3","chapterTitle":"Internal walls","part":"Superstructure (excluding roofs)","question":"Where an internal masonry wall is tied rather than bonded to another wall, what is the maximum vertical spacing for expanded metal strips or wall ties?","options":["225mm","300mm","450mm","600mm"],"correct":1,"explanation":"Clause 6.3.4.4 states internal masonry walls should be fully bonded or tied, either with a tooth at alternate courses, or an expanded metal strip or wall tie at a maximum vertical spacing of 300mm.","ref":"6.3.4.4"},{"id":"6.3-02","chapter":"6.3","chapterTitle":"Internal walls","part":"Superstructure (excluding roofs)","question":"A lintel in an internal masonry wall spans an opening of 1.5m. What is the minimum length of bearing at each end?","options":["75mm","100mm","150mm","225mm"],"correct":2,"explanation":"Table 2 of Clause 6.3.4.7 requires a minimum bearing of 150mm for spans over 1.2m; 100mm applies only to spans up to 1.2m.","ref":"6.3.4.7"},{"id":"6.3-03","chapter":"6.3","chapterTitle":"Internal walls","part":"Superstructure (excluding roofs)","question":"What is the minimum size for individual studs, rails and head binders in an internal load-bearing timber wall?","options":["38mm x 75mm","38mm x 63mm","43mm x 38mm","38mm x 89mm"],"correct":0,"explanation":"Clause 6.3.5.1 states individual studs, rails and head binders should be 38mm x 75mm minimum, although larger sizes may be required to achieve adequate fire resistance.","ref":"6.3.5.1"},{"id":"6.3-04","chapter":"6.3","chapterTitle":"Internal walls","part":"Superstructure (excluding roofs)","question":"What is the maximum moisture content for timber in internal walls at the time of dry lining, to minimise shrinkage?","options":["12%","15%","18%","20%"],"correct":3,"explanation":"Clause 6.3.5.3 states timber should have a maximum moisture content of 20% at the time of dry lining to minimise shrinkage.","ref":"6.3.5.3"},{"id":"6.3-05","chapter":"6.3","chapterTitle":"Internal walls","part":"Superstructure (excluding roofs)","question":"At the junction with the roof, how far below the top of the adjacent roof framing should a compartment or separating wall stop?","options":["Approximately 25mm","Approximately 10mm","Approximately 50mm","Approximately 75mm"],"correct":0,"explanation":"Clause 6.3.6.2 states compartment or separating walls should stop approximately 25mm below the top of adjacent roof framing, with soft fire-stopping installed to allow for movement in roof timbers and prevent 'hogging' of the tiles.","ref":"6.3.6.2"},{"id":"6.3-06","chapter":"6.3","chapterTitle":"Internal walls","part":"Superstructure (excluding roofs)","question":"On site, an electrician wants to cut a vertical chase into one leaf of a masonry separating wall. What is the maximum depth allowed?","options":["1/6 of the thickness of the single leaf","1/4 of the thickness of the single leaf","1/3 of the thickness of the single leaf","1/2 of the thickness of the single leaf"],"correct":2,"explanation":"Clause 6.3.7.1 states vertical chases should not exceed 1/3 of the thickness of the single leaf, while horizontal chases should not exceed 1/6.","ref":"6.3.7.1"},{"id":"6.3-07","chapter":"6.3","chapterTitle":"Internal walls","part":"Superstructure (excluding roofs)","question":"A 75mm timber stud partition separates a WC from a bedroom. Using a single layer of 12.5mm plasterboard (10kg/m2 minimum) each side, what else is needed to achieve the required sound reduction?","options":["A 50mm clear air gap between the linings","25mm unfaced mineral wool (10kg/m3 minimum) between the studs","A resilient bar fixed to one side of the studs","9.5mm plasterboard as a second layer on one side"],"correct":1,"explanation":"Clause 6.3.7.2 permits one layer of 12.5mm plasterboard (each sheet 10kg/m2 minimum) on each side with 25mm unfaced mineral wool (10kg/m3 minimum) between the studs, with all joints well sealed; the alternative is two layers of 12.5mm plasterboard each side.","ref":"6.3.7.2"},{"id":"6.3-08","chapter":"6.3","chapterTitle":"Internal walls","part":"Superstructure (excluding roofs)","question":"Unless designed otherwise, what is the minimum stud size and maximum spacing for a timber partition wall?","options":["38mm x 75mm studs at 400mm centres","43mm x 38mm studs at 450mm centres","63mm x 50mm studs at 400mm centres","63mm x 38mm studs at 600mm centres"],"correct":3,"explanation":"Table 3 of Clause 6.3.9.2 gives the minimum specification for partition studs as 63mm x 38mm at maximum 600mm centres.","ref":"6.3.9.2"},{"id":"6.3-09","chapter":"6.3","chapterTitle":"Internal walls","part":"Superstructure (excluding roofs)","question":"Where a DPC beneath an internal partition is not continuous, what is the minimum lap required?","options":["50mm","100mm","150mm","225mm"],"correct":1,"explanation":"Clause 6.3.13 states DPCs should be continuous or lapped by a minimum of 100mm, be at least the width of the wall or partition and be linked with any adjoining DPM.","ref":"6.3.13"},{"id":"6.4-01","chapter":"6.4","chapterTitle":"Timber and concrete upper floors","part":"Superstructure (excluding roofs)","question":"What imposed load does BS EN 1991-1-1 recommend for the design of upper floors in self-contained homes?","options":["1.0kN/m2","1.25kN/m2","1.5kN/m2","2.0kN/m2"],"correct":2,"explanation":"Clause 6.4.3.1 states imposed loads should be calculated in accordance with BS EN 1991-1-1, which recommends 1.5kN/m2 for self-contained homes.","ref":"6.4.3.1"},{"id":"6.4-02","chapter":"6.4","chapterTitle":"Timber and concrete upper floors","part":"Superstructure (excluding roofs)","question":"A lightweight non load-bearing partition runs parallel to I-joists and is supported on noggings fixed to the joists either side. Unless designed otherwise, what should the noggings be?","options":["38mm x 90mm minimum at 600mm centres, fixed with metal clips","38mm x 63mm minimum at 400mm centres, skew nailed","50mm x 100mm minimum at 450mm centres, fixed with metal clips","35mm x 97mm minimum at 600mm centres, nailed twice to each joist"],"correct":0,"explanation":"Clause 6.4.3.1 states that, unless designed otherwise, noggings should be a minimum 38mm x 90mm at 600mm centres and fixed with metal clips, with the sole plate of the partition fixed to the noggings.","ref":"6.4.3.1"},{"id":"6.4-03","chapter":"6.4","chapterTitle":"Timber and concrete upper floors","part":"Superstructure (excluding roofs)","question":"For a composite profiled metal decking floor designed using the detailed approach with shrinkage effects taken into account, what should the total deflection be limited to?","options":["16mm or span/375, whichever is the lesser","24mm or span/250, whichever is the lesser","14mm or span/333, whichever is the lesser","20mm or span/300, whichever is the lesser"],"correct":1,"explanation":"Clause 6.4.3.4 states that when shrinkage effects are taken into account, total deflection should be limited to 24mm or span/250, whichever is the lesser; if shrinkage is ignored, the limit is 16mm or span/375.","ref":"6.4.3.4"},{"id":"6.4-04","chapter":"6.4","chapterTitle":"Timber and concrete upper floors","part":"Superstructure (excluding roofs)","question":"What is the minimum bearing for precast concrete beam and block floor units on masonry?","options":["50mm","60mm","75mm","90mm"],"correct":3,"explanation":"Clause 6.4.7 states bearings for precast concrete floors should be solid and level, a minimum of 90mm on masonry (with open frogs in brickwork filled) and 75mm minimum on steelwork.","ref":"6.4.7"},{"id":"6.4-05","chapter":"6.4","chapterTitle":"Timber and concrete upper floors","part":"Superstructure (excluding roofs)","question":"What is the maximum instantaneous deflection of floor joists under combined bending and shear where strutting is provided?","options":["10mm","12mm","14mm","16mm"],"correct":2,"explanation":"Clause 6.4.9 states instantaneous deflection should be no more than 0.003 x the span, with a maximum of 14mm where strutting is provided, or 12mm where strutting is not provided.","ref":"6.4.9"},{"id":"6.4-06","chapter":"6.4","chapterTitle":"Timber and concrete upper floors","part":"Superstructure (excluding roofs)","question":"What clearance should be left between the first joist and the wall face to aid installation of services and fixing of floor decking?","options":["10mm-25mm","25mm-75mm","50mm-100mm","75mm-150mm"],"correct":1,"explanation":"Clause 6.4.10.2 states there should be a clearance of 25mm-75mm between the first joist and the wall face to aid the installation of services and the fixing of floor decking.","ref":"6.4.10.2"},{"id":"6.4-07","chapter":"6.4","chapterTitle":"Timber and concrete upper floors","part":"Superstructure (excluding roofs)","question":"What is the minimum end bearing for a solid timber joist supported on a timber wall plate?","options":["75mm","45mm","90mm","100mm"],"correct":0,"explanation":"Table 3 of Clause 6.4.10.3 gives a minimum bearing of 75mm for solid joists on a timber wall plate; on masonry walls the minimum is 90mm (75mm where the joist is not providing restraint).","ref":"6.4.10.3"},{"id":"6.4-08","chapter":"6.4","chapterTitle":"Timber and concrete upper floors","part":"Superstructure (excluding roofs)","question":"Solid timber joists overlap on an intermediate load-bearing wall. What is the maximum the joists should project beyond the bearing?","options":["50mm","75mm","100mm","150mm"],"correct":2,"explanation":"Clause 6.4.11 states solid timber joists bearing onto intermediate load-bearing walls should be nailed together where they overlap and should not project more than 100mm.","ref":"6.4.11"},{"id":"6.4-09","chapter":"6.4","chapterTitle":"Timber and concrete upper floors","part":"Superstructure (excluding roofs)","question":"Solid timber joists are being notched into a steel beam. What projections should be provided to allow for timber shrinkage?","options":["6mm top and 3mm bottom","10mm top and 5mm bottom","15mm top and 5mm bottom","12mm top and 2mm bottom"],"correct":3,"explanation":"Clause 6.4.12 states solid timber joists connected to steel beams should have 12mm top and 2mm bottom projections to allow for timber shrinkage, and be provided with strutting to prevent rotation.","ref":"6.4.12"},{"id":"6.4-10","chapter":"6.4","chapterTitle":"Timber and concrete upper floors","part":"Superstructure (excluding roofs)","question":"What is the minimum bearing of a joist hanger on masonry?","options":["50mm","75mm","90mm","100mm"],"correct":1,"explanation":"Clause 6.4.13 states joist hangers should have a 75mm minimum bearing on masonry, bear on level beds, be tight to the wall and not be cut into the walling.","ref":"6.4.13"},{"id":"6.4-11","chapter":"6.4","chapterTitle":"Timber and concrete upper floors","part":"Superstructure (excluding roofs)","question":"Unless in accordance with Technical Requirement R3, what cross-section should galvanized steel restraint straps to upper floors have?","options":["30mm x 5mm","25mm x 3mm","40mm x 3mm","50mm x 6mm"],"correct":0,"explanation":"Clause 6.4.14 states restraint straps should be galvanized steel with a 30mm x 5mm cross-section or be in accordance with Technical Requirement R3, and be spaced at a maximum of 2m centres.","ref":"6.4.14"},{"id":"6.4-12","chapter":"6.4","chapterTitle":"Timber and concrete upper floors","part":"Superstructure (excluding roofs)","question":"Solid timber floor joists span 4.8m. How many rows of strutting are needed?","options":["None","One row at mid span","One row at each third point plus blocking at supports only","Two rows at equal spacing"],"correct":3,"explanation":"Table 4 of Clause 6.4.15 requires two rows of strutting at equal spacing for solid timber and I-joist spans over 4.5m; one row at the centre of span applies to spans of 2.5m-4.5m.","ref":"6.4.15"},{"id":"6.4-13","chapter":"6.4","chapterTitle":"Timber and concrete upper floors","part":"Superstructure (excluding roofs)","question":"Where fire compartment walls are built off trimmers and trimming joists, what maximum instantaneous deflection should be observed for those joists under total dead and imposed loads?","options":["10mm","12mm","14mm","16mm"],"correct":0,"explanation":"Clause 6.4.16 states a maximum limit of 10mm instantaneous deflection under total dead and imposed loads should be observed for trimmers and trimming joists supporting fire compartment walls, to avoid residual gaps at wall heads or distorted walls.","ref":"6.4.16"},{"id":"6.4-14","chapter":"6.4","chapterTitle":"Timber and concrete upper floors","part":"Superstructure (excluding roofs)","question":"A plumber needs to drill a solid timber joist (up to 250mm deep). What is the maximum hole size, and where should holes be located?","options":["0.15 x joist depth, on the top edge 0.1-0.2 x span from the end","0.2 x joist depth, anywhere in the middle third of the span","0.25 x joist depth, on the centre line 0.25-0.4 x span from the end","0.3 x joist depth, on the centre line at mid span only"],"correct":2,"explanation":"Table 6 of Clause 6.4.18 permits drilling of joists up to 250mm depth on the centre line in a zone 0.25-0.4 x span, with a maximum hole size of 0.25 x the depth of the joist, and a minimum 100mm horizontal separation between notches and holes.","ref":"6.4.18"},{"id":"6.4-15","chapter":"6.4","chapterTitle":"Timber and concrete upper floors","part":"Superstructure (excluding roofs)","question":"What is the minimum thickness of moisture-resistant chipboard floor decking for joists at 600mm centres under normal domestic loads?","options":["15mm","18mm","19mm","22mm"],"correct":3,"explanation":"Table 7 of Clause 6.4.19.1 requires 22mm moisture-resistant chipboard (BS EN 312 type P5) at 600mm joist centres; 18mm is only acceptable at 400mm or 450mm centres.","ref":"6.4.19.1"},{"id":"6.5-01","chapter":"6.5","chapterTitle":"Steelwork","part":"Superstructure (excluding roofs)","question":"The steel beam tables in this chapter are based on which steel grade?","options":["S235","S275","S355","S460"],"correct":1,"explanation":"Clause 6.5.1 states the information provided in the chapter is in accordance with BS EN 1993-1-1 using grade S275 steel, although more economical or smaller beams may be designed by an engineer.","ref":"6.5.1"},{"id":"6.5-02","chapter":"6.5","chapterTitle":"Steelwork","part":"Superstructure (excluding roofs)","question":"When using the chapter tables to size a steel beam supporting a masonry partition, which condition must be met?","options":["The partition may be up to 3.5m high","The beam may also carry timber floor loads","The span of the steel beam is less than 4m","The partition can be offset to one edge of the beam flange"],"correct":2,"explanation":"Clause 6.5.2.1 requires the span of the steel beam to be less than 4m, the partition to be built centrally on the beam and less than 2.7m high, and the beam to support only the partition weight and self-weight; otherwise design to Technical Requirement R5 is needed.","ref":"6.5.2.1"},{"id":"6.5-03","chapter":"6.5","chapterTitle":"Steelwork","part":"Superstructure (excluding roofs)","question":"When calculating the effective floor area supported by a steel trimmer beam, a void in the floor contains a staircase. What adjustment should be made?","options":["Deduct the staircase void area from the effective area","No adjustment - voids are always ignored","Add 1m2 to the effective area of every beam in the floor","Add 2m2 to the effective area supported by any beam which fully or partially supports that staircase"],"correct":3,"explanation":"Clause 6.5.2.2 states that where any area shown as void contains a staircase, 2m2 should be added to the effective area supported by any beam which fully or partially supports that staircase.","ref":"6.5.2.2"},{"id":"6.5-04","chapter":"6.5","chapterTitle":"Steelwork","part":"Superstructure (excluding roofs)","question":"For corrosion purposes, what counts as a coastal location, requiring an additional zinc corrosion rate of 1.5 micrometres per annum to be added?","options":["A site within 500m of the general coastline of the United Kingdom","A site within 1km of the general coastline of the United Kingdom","A site within 2km of any tidal water","A site within 5km of the general coastline of the United Kingdom"],"correct":0,"explanation":"Note 2 to Table 4 in Clause 6.5.3 defines a coastal location as a site within 500m of the general coastline of the UK; an additional corrosion rate for zinc of 1.5 micrometres per annum should be added, and if the cumulative rate exceeds 3.0 micrometres per annum an engineered corrosion protection design is required.","ref":"6.5.3"},{"id":"6.5-05","chapter":"6.5","chapterTitle":"Steelwork","part":"Superstructure (excluding roofs)","question":"Unless corrosion protection is to an engineered design, how should steelwork below ground or within the splash zone be encased?","options":["In at least 50mm of Grade ST1 concrete","In two coats of ordinary gloss paint over primer","In at least 75mm of minimum Grade ST2 concrete including a wrapping mesh","In at least 100mm of Grade ST4 concrete with no mesh required"],"correct":2,"explanation":"Clause 6.5.3 states that unless encased by at least 75mm of minimum Grade ST2 concrete including a wrapping mesh (D49 or similar), corrosion protection for steelwork below ground and/or within the splash zone (up to 150mm above ground level) should be to an engineered design based on in-situ testing.","ref":"6.5.3"},{"id":"6.5-06","chapter":"6.5","chapterTitle":"Steelwork","part":"Superstructure (excluding roofs)","question":"What is the minimum bearing for steelwork supported on masonry?","options":["75mm","100mm","150mm","200mm"],"correct":1,"explanation":"Clause 6.5.4.2 states bearings for steelwork supported on masonry should be a minimum of 100mm, and clean, dry and level; beam supports should not occur above window or door openings.","ref":"6.5.4.2"},{"id":"6.5-07","chapter":"6.5","chapterTitle":"Steelwork","part":"Superstructure (excluding roofs)","question":"What is the minimum compressive strength for a padstone supporting a steel beam?","options":["2.8N/mm2","5N/mm2","7.3N/mm2","10N/mm2"],"correct":3,"explanation":"Clause 6.5.5 states padstones should be formed in one unit with a minimum compressive strength of 10N/mm2, from in-situ concrete, precast concrete, concrete blocks, clay bricks or engineering bricks.","ref":"6.5.5"},{"id":"6.5-08","chapter":"6.5","chapterTitle":"Steelwork","part":"Superstructure (excluding roofs)","question":"A steel beam runs in line with the wall supporting it, acting as a lintel over an opening. What is the minimum length of padstone?","options":["200mm","150mm","100mm","300mm"],"correct":0,"explanation":"The notes to Tables 7 and 8 in Clause 6.5.5 state that when steelwork acts as a lintel in line with the supporting wall, the minimum length of padstone should be 200mm, the padstone depth should match adjacent coursing and the web of the beam should be over the centre of the wall.","ref":"6.5.5"},{"id":"6.5-09","chapter":"6.5","chapterTitle":"Steelwork","part":"Superstructure (excluding roofs)","question":"Two steel beams supporting a timber floor are to be joined using the bolted cleat connections detailed in this chapter. What is the maximum difference in depth allowed between the beams?","options":["10mm","25mm","40mm","60mm"],"correct":2,"explanation":"Clause 6.5.6 states this connection method may only be used where both beams have been chosen from Table 3, they only support timber floors, and the beams do not differ in depth by more than 40mm; otherwise the connection should be designed by an engineer.","ref":"6.5.6"},{"id":"6.6-01","chapter":"6.6","chapterTitle":"Staircases","part":"Superstructure (excluding roofs)","question":"How should artificial lighting to staircases and landings within homes and common areas be controlled?","options":["By a single switch at the head of the stairs","By pull cords at each landing","By a timer switch set for hours of darkness","By two-way switching, or automatic light-sensitive controls"],"correct":3,"explanation":"Clause 6.6.4 states artificial light sources should be provided to all staircases and landings and be controlled by two-way switching; alternatively, automatic light-sensitive controls may be used.","ref":"6.6.4"},{"id":"6.6-02","chapter":"6.6","chapterTitle":"Staircases","part":"Superstructure (excluding roofs)","question":"By how much may a floor finish such as a screed reduce the bottom rise of a flight of stairs and still be acceptable?","options":["A maximum of 12mm","A maximum of 5mm","A maximum of 18mm","A maximum of 25mm"],"correct":0,"explanation":"Clause 6.6.8.2 states account should be taken of the thickness of screeds, and floor finishes that reduce the bottom rise by a maximum of 12mm are acceptable.","ref":"6.6.8.2"},{"id":"6.6-03","chapter":"6.6","chapterTitle":"Staircases","part":"Superstructure (excluding roofs)","question":"What is the minimum clearance between a handrail and any surface, throughout its full length?","options":["15mm","25mm","40mm","50mm"],"correct":1,"explanation":"Clause 6.6.11 states the handrail should have a 25mm minimum clearance from any surface throughout its full length, ensure a firm handhold and be unobstructed.","ref":"6.6.11"},{"id":"6.6-04","chapter":"6.6","chapterTitle":"Staircases","part":"Superstructure (excluding roofs)","question":"How should the top nosing of a timber staircase be fixed?","options":["Proud of the floor decking and nailed to the trimmer","Glued to the landing edge with no mechanical fixing","Level with the floor decking and screwed into the joist","Set 12mm below the floor decking and dowelled to the string"],"correct":2,"explanation":"Clause 6.6.12 states the top nosing should be level with the floor decking and screwed into the joist, with the wall string cut to sit over the floor joist to land evenly on the floor or landing.","ref":"6.6.12"},{"id":"6.6-05","chapter":"6.6","chapterTitle":"Staircases","part":"Superstructure (excluding roofs)","question":"The joiner wants to install the timber staircase but the roof coverings and windows are not yet complete. What does the standard say?","options":["Installation may go ahead if the stairs are covered with building paper","Installation may go ahead provided the stairs were factory primed","Only the bottom flight may be fixed before the building is weathertight","Timber staircases should be fixed in place only when the building is weathertight"],"correct":3,"explanation":"Clause 6.6.16 states timber staircases should be fixed in place only when the building is weathertight, and should be protected to prevent damage and unsightly marking during construction.","ref":"6.6.16"},{"id":"6.6-06","chapter":"6.6","chapterTitle":"Staircases","part":"Superstructure (excluding roofs)","question":"Which type of wall is generally unable to have stairs secured to it?","options":["Metal stud walls","Timber stud walls with additional noggings","Block walls","Brick walls"],"correct":0,"explanation":"Clause 6.6.6 notes that stairs generally are unable to be secured to metal stud walls; timber stud walls may require additional noggings and block walls should be sufficiently robust to receive appropriate fixings.","ref":"6.6.6"},{"id":"6.7-01","chapter":"6.7","chapterTitle":"Doors, windows and glazing","part":"Superstructure (excluding roofs)","question":"How far should a window sill project beyond the wall face to help shed water clear of the wall?","options":["At least 15mm","At least 25mm","At least 40mm","At least 50mm"],"correct":1,"explanation":"Clause 6.7.3.1 states that sills should project at least 25mm beyond the wall face, with the head of frames set back from the edge of the lintel/cavity tray.","ref":"6.7.3.1"},{"id":"6.7-02","chapter":"6.7","chapterTitle":"Doors, windows and glazing","part":"Superstructure (excluding roofs)","question":"In which locations should checked rebates be used at door and window openings?","options":["England and Wales only","All coastal sites within 10km of the sea","Scotland, Northern Ireland, the Isle of Man and areas of very severe exposure to driving rain","Any building of three storeys or more"],"correct":2,"explanation":"Clause 6.7.3.1 requires checked rebates in Scotland, Northern Ireland, the Isle of Man and areas where exposure to driving rain is very severe (severe/very severe when building in timber frame), unless proprietary cavity closers with a satisfactory assessment are used.","ref":"6.7.3.1"},{"id":"6.7-03","chapter":"6.7","chapterTitle":"Doors, windows and glazing","part":"Superstructure (excluding roofs)","question":"What gap is recommended between a non-white PVC-U frame and a structural opening that is between 3.0m and 4.5m wide?","options":["22mm","15mm","12mm","10mm"],"correct":0,"explanation":"Table 1 of Clause 6.7.3.3 recommends a 22mm gap for non-white PVC-U frames in structural openings from 3.0m to 4.5m, as darker frames experience greater thermal movement.","ref":"6.7.3.3"},{"id":"6.7-04","chapter":"6.7","chapterTitle":"Doors, windows and glazing","part":"Superstructure (excluding roofs)","question":"For coupled door and window frame assemblies, what minimum amount of on-site watertightness testing of critical coupling joints is required?","options":["1% by length of all critical coupling joints","2% by length of all critical coupling joints","10% by length of all critical coupling joints","5% by length of all critical coupling joints"],"correct":3,"explanation":"Clause 6.7.4.6 requires a minimum of 5% by length of all critical coupling joints to be tested using the CWCT hose test method, with a minimum of two installations tested where the same type is used across a development.","ref":"6.7.4.6"},{"id":"6.7-05","chapter":"6.7","chapterTitle":"Doors, windows and glazing","part":"Superstructure (excluding roofs)","question":"In a drained and vented glazing system, what minimum edge clearance should normally be provided between the glass edge and the frame?","options":["3mm","5mm","10mm","12mm"],"correct":1,"explanation":"Clause 6.7.5.4 requires a minimum 5mm edge clearance between the glass edge and frame to prevent contact, ensure drainage and allow for differential thermal expansion; it may only reduce to 3mm at side and top rebates of very well-drained frames with glass up to 2m long.","ref":"6.7.5.4"},{"id":"6.7-06","chapter":"6.7","chapterTitle":"Doors, windows and glazing","part":"Superstructure (excluding roofs)","question":"A supplier proposes fully bedded glazing for insulating glass units. When is a fully bedded system acceptable?","options":["Factory glazing only, where the insulated unit is less than 1m2","Site glazing only, where the unit is less than 2m2","Any glazing where the frame is timber","Any glazing provided a drained cavity is formed behind the unit"],"correct":0,"explanation":"Clause 6.7.5.4 states fully bedded systems are acceptable for factory glazing only where the insulated unit is less than 1m2, with no gaps around the perimeter of the unit; drained and vented systems are needed for site-fixed IGUs and units over 1m2.","ref":"6.7.5.4"},{"id":"6.7-07","chapter":"6.7","chapterTitle":"Doors, windows and glazing","part":"Superstructure (excluding roofs)","question":"What is the minimum thickness for an external timber door?","options":["35mm minimum","40mm minimum","42.5mm minimum (44mm nominal)","54mm minimum (56mm nominal)"],"correct":2,"explanation":"Clause 6.7.7.2 states external doors should be 42.5mm minimum (44mm nominal) in thi
