rranged?","options":["Directly above each socket, at a maximum spacing of 2.4m","At every joint, at a maximum spacing of 1.2m","Midway between sockets, at a maximum spacing of 1.5m","Directly below each socket, at a maximum spacing of 1.8m"],"correct":3,"explanation":"Clause 6.8.10.1 states that long gas flue pipes should have support directly below each socket, with a maximum spacing of 1.8m.","ref":"6.8.10.1","why":"An unsupported length of gas flue pipe can sag or pull apart at its socket joints under its own weight, opening a gap through which flue gases - potentially including carbon monoxide - can leak into the building.","source":"NHBC Standards 2026","sourceShort":"NHBC","refLabel":"Clause"},{"id":"6.8-08","chapter":"6.8","chapterTitle":"Fireplaces, chimneys and flues","part":"Superstructure (excluding roofs)","question":"A subcontractor proposes using a flexible flue liner in the chimney of a new build home with a gas appliance. What does the standard say?","options":["It is acceptable if the liner complies with BS EN 1856","Flexible flue liners are not acceptable in a new build","It is acceptable for gas appliances but not solid fuel","It is acceptable if assessed in accordance with Technical Requirement R3"],"correct":1,"explanation":"Clause 6.8.11.1 states that flexible flue liners are not acceptable in a new build; the same position applies to liquid fuel installations under Clause 6.8.16.3.","ref":"6.8.11.1","why":"Flexible liners are designed for relining old, irregular chimneys, not new masonry work; they have a shorter service life and are more easily damaged than a rigid liner, so they don't meet the durability a new-build chimney needs to last.","source":"NHBC Standards 2026","sourceShort":"NHBC","refLabel":"Clause"},{"id":"6.8-09","chapter":"6.8","chapterTitle":"Fireplaces, chimneys and flues","part":"Superstructure (excluding roofs)","question":"In the absence of specific guidance from the appliance manufacturer, at what height above ground does BS 5440-1 advise a gas flue terminal should be guarded?","options":["Less than 2m above ground","Less than 2.5m above ground","Less than 3m above ground","Less than 1.5m above ground"],"correct":0,"explanation":"Clause 6.8.12 notes BS 5440-1 advises that terminals less than 2m above ground, above a balcony, or above a flat roof which people have access to, should be guarded.","ref":"6.8.12","why":"A terminal within easy reach is both a burn/contact hazard to occupants and vulnerable to accidental knocks or interference that could block or damage the flue, risking dangerous combustion gases venting incorrectly.","source":"NHBC Standards 2026","sourceShort":"NHBC","refLabel":"Clause"},{"id":"6.8-10","chapter":"6.8","chapterTitle":"Fireplaces, chimneys and flues","part":"Superstructure (excluding roofs)","question":"Where combustible material below a constructional hearth is separated from the underside of the hearth by an air space, what is the minimum air space required?","options":["25mm","40mm","50mm","75mm"],"correct":2,"explanation":"Clause 6.8.18 states combustible material should not be placed under a constructional hearth unless it supports the hearth edges, is at least 250mm from the material to the top of the hearth, or is separated from the underside of the hearth by an air space of at least 50mm.","ref":"6.8.18","why":"Without enough separation or an air gap, heat conducted down through the hearth slab can slowly ignite combustible material hidden beneath it, such as timber joists, starting a fire that's out of sight until it's well established.","source":"NHBC Standards 2026","sourceShort":"NHBC","refLabel":"Clause"},{"id":"6.8-11","chapter":"6.8","chapterTitle":"Fireplaces, chimneys and flues","part":"Superstructure (excluding roofs)","question":"On site you find a heavy stone fireplace surround being fixed to the wall using adhesive only. What does the standard require?","options":["Adhesive fixing is acceptable if the manufacturer approves it","Adhesive fixing is acceptable on solid masonry walls only","Adhesive fixing is acceptable provided the surround is in one piece","Adhesive-only fixing is not acceptable; mechanical fixings must be used"],"correct":3,"explanation":"Clause 6.8.19 states that methods relying solely on adhesive for fixing fireplace surrounds to the structure are not acceptable; surrounds should be fixed using mechanical fixings, generally of stainless steel to BS EN ISO 3506-1.","ref":"6.8.19","why":"A heavy stone surround held up by adhesive alone can lose its bond over time or after a knock, and a falling surround of that weight is a serious crush hazard - mechanical fixings guarantee it stays attached to the structure.","source":"NHBC Standards 2026","sourceShort":"NHBC","refLabel":"Clause"},{"id":"6.8-12","chapter":"6.8","chapterTitle":"Fireplaces, chimneys and flues","part":"Superstructure (excluding roofs)","question":"Where masonry density is at least 1,500kg/m3, what is the maximum height of an unrestrained chimney unless designed by an engineer?","options":["4.5x the smallest plan dimension of the chimney","3.5x the smallest plan dimension of the chimney","5x the smallest plan dimension of the chimney","6x the smallest plan dimension of the chimney"],"correct":0,"explanation":"Clause 6.8.23.1 states the height of an unrestrained chimney should not exceed 4.5x the smallest plan dimension (where masonry density is a minimum of 1,500kg/m3), or it should be designed by an engineer in accordance with Technical Requirement R5.","ref":"6.8.23.1","why":"A chimney that's too tall relative to its width becomes a slender, top-heavy structure vulnerable to being cracked or blown over by wind loading, so the height-to-width limit keeps it stable without needing an engineer's design.","source":"NHBC Standards 2026","sourceShort":"NHBC","refLabel":"Clause"},{"id":"6.8-13","chapter":"6.8","chapterTitle":"Fireplaces, chimneys and flues","part":"Superstructure (excluding roofs)","question":"Unless the manufacturer recommends otherwise, what should the space between flue liners and the surrounding masonry be filled with?","options":["Ordinary structural concrete","Weak insulating concrete","Dry sharp sand","Nothing - it should be left as an air void"],"correct":1,"explanation":"Clause 6.8.21 requires spaces between the lining and the surrounding masonry to be filled with weak insulating concrete (or in accordance with the manufacturer's recommendations); ordinary concrete should not be used.","ref":"6.8.21","why":"Ordinary strong concrete is too rigid to cope with the flue liner expanding and contracting as it heats and cools, so it would crack the liner over repeated use; weak insulating concrete flexes with this movement and helps keep the flue warm for a good draught.","source":"NHBC Standards 2026","sourceShort":"NHBC","refLabel":"Clause"},{"id":"6.9-01","chapter":"6.9","chapterTitle":"Curtain walling and cladding","part":"Superstructure (excluding roofs)","question":"When should certification and test documentation for a curtain walling or cladding system be made available to NHBC?","options":["At handover of the completed building","Within 28 days of completing the installation","Before work begins on site","Only if NHBC requests it during construction"],"correct":2,"explanation":"Clause 6.9.3 requires certification and test documentation to be made available to NHBC before work begins on site and used as reference to ensure compliance.","ref":"6.9.3","why":"Checking certification and test evidence before the system goes up on site catches an unsuitable or unproven cladding system while it can still be changed, rather than after it's fixed to the building and failing on site.","source":"NHBC Standards 2026","sourceShort":"NHBC","refLabel":"Clause"},{"id":"6.9-02","chapter":"6.9","chapterTitle":"Curtain walling and cladding","part":"Superstructure (excluding roofs)","question":"On site you notice aluminium cladding components being installed in direct contact with a concrete structure. What does the standard require?","options":["Aluminium components should be separated from direct contact with cementitious surfaces","Direct contact is acceptable if the aluminium is powder coated","Direct contact is acceptable provided the concrete is fully cured","The aluminium should be replaced with galvanised mild steel"],"correct":0,"explanation":"Clause 6.9.5 requires fixings and supports to be installed ensuring aluminium components are separated from direct contact with cementitious surfaces, and dissimilar metals separated to avoid bimetallic corrosion.","ref":"6.9.5","why":"Wet cement is alkaline and attacks aluminium, and aluminium touching a different metal sets up bimetallic corrosion — both eat the metal away over time, weakening fixings and risking cladding coming loose.","source":"NHBC Standards 2026","sourceShort":"NHBC","refLabel":"Clause"},{"id":"6.9-03","chapter":"6.9","chapterTitle":"Curtain walling and cladding","part":"Superstructure (excluding roofs)","question":"For what minimum period should secondary components of a curtain walling or cladding system, such as seals and gaskets, provide satisfactory in-service performance?","options":["10 years","15 years","20 years","25 years"],"correct":3,"explanation":"Clause 6.9.6 requires secondary components to provide satisfactory in-service performance for a minimum of 25 years; primary components should perform for the design life of the building.","ref":"6.9.6","why":"Seals and gaskets wear out long before the structure does, so a 25-year minimum ensures they keep the wall watertight and airtight for a realistic period rather than failing and letting water in within a few years.","source":"NHBC Standards 2026","sourceShort":"NHBC","refLabel":"Clause"},{"id":"6.9-04","chapter":"6.9","chapterTitle":"Curtain walling and cladding","part":"Superstructure (excluding roofs)","question":"Where rainscreen cladding insulation is fixed to the backing wall, what non-combustible fixing provision is required in addition to the other fixings?","options":["A minimum of one non-combustible fixing per 2m2","A minimum of one non-combustible fixing per 1m2 or per insulation batt, whichever is the lesser","A minimum of two non-combustible fixings per insulation batt in all cases","Non-combustible fixings are only needed where adhesive is not used"],"correct":1,"explanation":"Clause 6.9.8 requires, for rainscreen cladding, a minimum of one non-combustible fixing per 1m2 or per insulation batt, whichever is the lesser, in addition to the other fixings.","ref":"6.9.8","why":"Adhesive or standard fixings alone can burn or melt in a fire, letting insulation drop away; non-combustible fixings hold insulation in place so it doesn't fuel the fire or expose escape routes.","source":"NHBC Standards 2026","sourceShort":"NHBC","refLabel":"Clause"},{"id":"6.9-05","chapter":"6.9","chapterTitle":"Curtain walling and cladding","part":"Superstructure (excluding roofs)","question":"In areas of very severe exposure, what breather membrane should be used behind cladding?","options":["Type 2 to BS EN 13859-2","Type 3 to BS EN 13859-2","Type 1 to BS EN 13859-2","Any polyethylene sheet to BS 6515"],"correct":2,"explanation":"Clause 6.9.9 states breather membranes should comply with BS EN 13859-2:2014 (Type 1 in areas of very severe exposure) or be in accordance with Technical Requirement R3.","ref":"6.9.9","why":"The heaviest wind-driven rain hits very severely exposed walls, so a higher-grade Type 1 membrane is needed to stop water forcing its way through and soaking the insulation or frame behind it.","source":"NHBC Standards 2026","sourceShort":"NHBC","refLabel":"Clause"},{"id":"6.9-06","chapter":"6.9","chapterTitle":"Curtain walling and cladding","part":"Superstructure (excluding roofs)","question":"Above what opening size should a screen be provided to prevent birds and animals entering the cladding cavity?","options":["4mm","6mm","8mm","10mm"],"correct":3,"explanation":"Clause 6.9.15 requires a screen where openings are larger than 10mm, provided in accordance with the design, at the top and bottom of the rainscreen and at penetrations through the cladding.","ref":"6.9.15","why":"Birds and vermin nesting in an unscreened cavity block drainage and ventilation paths, damage membranes and insulation, and can introduce a fire risk from nesting material inside the wall.","source":"NHBC Standards 2026","sourceShort":"NHBC","refLabel":"Clause"},{"id":"6.9-07","chapter":"6.9","chapterTitle":"Curtain walling and cladding","part":"Superstructure (excluding roofs)","question":"Air and water testing of a prototype curtain walling system should be carried out to the CWCT Standard test sequence up to what maximum test pressure?","options":["600 pascals","450 pascals","1,200 pascals","2,400 pascals"],"correct":0,"explanation":"Clause 6.9.17.6 requires the prototype to pass the CWCT Standard test sequence (A or B) up to a maximum test pressure of 600 pascals, increased to 0.25x the design wind pressure where that pressure exceeds 2.4 kPa.","ref":"6.9.17.6","why":"Testing a prototype to 600 pascals simulates the worst wind-driven rain the wall will see in service, so design or jointing weaknesses are found and fixed before hundreds of identical panels go up on the building.","source":"NHBC Standards 2026","sourceShort":"NHBC","refLabel":"Clause"},{"id":"6.9-08","chapter":"6.9","chapterTitle":"Curtain walling and cladding","part":"Superstructure (excluding roofs)","question":"What minimum proportion of a completed curtain walling system should be hose tested on site for resistance to water penetration?","options":["2%","5%","10%","15%"],"correct":1,"explanation":"Clause 6.9.17.7 requires a minimum of 5% of the completed curtain walling system to be tested, especially in vulnerable areas such as joints and interfaces, with results made available to NHBC.","ref":"6.9.17.7","why":"Workmanship varies panel to panel on a real building even when the design is sound, so hose testing a 5% sample catches poorly sealed joints and interfaces that a factory prototype test could never reveal.","source":"NHBC Standards 2026","sourceShort":"NHBC","refLabel":"Clause"},{"id":"6.9-09","chapter":"6.9","chapterTitle":"Curtain walling and cladding","part":"Superstructure (excluding roofs)","question":"What is the minimum air gap width required behind rainscreen panels with open joints?","options":["25mm","38mm","50mm","75mm"],"correct":2,"explanation":"Clause 6.9.18.2 requires a minimum 50mm air gap behind panels with open joints, or 38mm behind panels with baffled or labyrinth (rebated) joints.","ref":"6.9.18.2","why":"A 50mm gap gives water that gets past the joints room to run down and drain out without wetting the insulation or backing wall, and is needed for the cavity to pressure-equalise properly.","source":"NHBC Standards 2026","sourceShort":"NHBC","refLabel":"Clause"},{"id":"6.9-10","chapter":"6.9","chapterTitle":"Curtain walling and cladding","part":"Superstructure (excluding roofs)","question":"In a pressure-equalised rainscreen cavity, what is the maximum spacing of vertical cavity closers within 6m of an internal or external corner?","options":["300mm","6.0m","3.0m","1.5m"],"correct":3,"explanation":"Clause 6.9.18.5 requires vertical cavity closers at centres not exceeding 1.5m within 6m of an internal or external corner; elsewhere centres should not exceed 6m, with a closer generally within 300mm of an external corner.","ref":"6.9.18.5","why":"Wind pressure is highest and most turbulent at corners, so closers need to be closer together there to keep each compartment properly pressure-equalised and stop rain being forced through the open joints.","source":"NHBC Standards 2026","sourceShort":"NHBC","refLabel":"Clause"},{"id":"6.9-11","chapter":"6.9","chapterTitle":"Curtain walling and cladding","part":"Superstructure (excluding roofs)","question":"For an insulated render system on a timber framed backing wall, what cavity is required between the wall and the insulation?","options":["A minimum 15mm cavity, drained and vented","A minimum 10mm cavity, drained only","A minimum 25mm cavity, vented only","A minimum 50mm cavity, drained and vented"],"correct":0,"explanation":"Clause 6.9.19.1 requires timber and steel framed backing walls to have a cavity a minimum of 15mm wide, which is drained and vented for timber frame (drained only for steel frame).","ref":"6.9.19.1","why":"The cavity keeps render and insulation off the structural timber, so any moisture that does get through can drain and the timber can dry out, preventing hidden rot behind the finish.","source":"NHBC Standards 2026","sourceShort":"NHBC","refLabel":"Clause"},{"id":"6.9-12","chapter":"6.9","chapterTitle":"Curtain walling and cladding","part":"Superstructure (excluding roofs)","question":"What is the minimum lap for reinforcement mesh in an insulated render system?","options":["50mm","100mm","150mm","200mm"],"correct":1,"explanation":"Clause 6.9.19.4 requires reinforcement to be lapped to a minimum of 100mm, with additional mesh where increased stress may occur, such as at the corners of window or door openings.","ref":"6.9.19.4","why":"A lap shorter than 100mm leaves a weak point where the mesh can't properly carry tensile stress across the joint, so the render is far more likely to crack right along that line.","source":"NHBC Standards 2026","sourceShort":"NHBC","refLabel":"Clause"},{"id":"6.10-01","chapter":"6.10","chapterTitle":"Light steel framed walls and floors","part":"Superstructure (excluding roofs)","question":"Who must carry out the Stage 2 project certification check on the design of primary structural components formed from light steel frame?","options":["The steel frame manufacturer's in-house design engineer","An NHBC registered LSF certifier","The local authority building control officer","The Steel Construction Institute (SCI)"],"correct":1,"explanation":"Clause 6.10.3 requires the design of all primary structural components to be subject to a Stage 2 certification check by an NHBC registered LSF certifier, who must not be the designer of the LSF or employed by the same practice. SCI carries out the Stage 1 system certification, not Stage 2.","ref":"6.10.3","why":"An independent check on the primary steel frame design catches calculation or detailing errors before construction, because a mistake in load-bearing steelwork affects the safety and stability of the whole building, not just one component.","source":"NHBC Standards 2026","sourceShort":"NHBC","refLabel":"Clause"},{"id":"6.10-02","chapter":"6.10","chapterTitle":"Light steel framed walls and floors","part":"Superstructure (excluding roofs)","question":"What is the typical maximum spacing of light steel floor joists, unless a greater spacing is justified by an engineer or a system-specific assessment?","options":["400mm","450mm","600mm","900mm"],"correct":2,"explanation":"Clause 6.10.4.1 states floors should have a typical maximum joist spacing of 600mm, although greater spacings may be applied when designed by an engineer in accordance with Technical Requirement R5 or covered by an SCI system-specific Stage 1 assessment.","ref":"6.10.4.1","why":"Going wider than 600mm without an engineer's justification risks excessive floor deflection and bounce, leading to springy floors, cracked tile or plaster finishes, and decking that isn't properly supported.","source":"NHBC Standards 2026","sourceShort":"NHBC","refLabel":"Clause"},{"id":"6.10-03","chapter":"6.10","chapterTitle":"Light steel framed walls and floors","part":"Superstructure (excluding roofs)","question":"What is the minimum depth of the ventilated void required below a light steel ground floor on a normal (non-shrinkable) site?","options":["150mm","225mm","100mm","125mm"],"correct":0,"explanation":"Clause 6.10.4.1 requires light steel ground floors to have a 150mm minimum void below the floor, ventilated by openings on at least two opposite sides.","ref":"6.10.4.1","why":"Ventilating the void removes moisture rising from the ground, preventing condensation forming on the cold steel joists that would otherwise corrode them and dampen the floor decking from below.","source":"NHBC Standards 2026","sourceShort":"NHBC","refLabel":"Clause"},{"id":"6.10-04","chapter":"6.10","chapterTitle":"Light steel framed walls and floors","part":"Superstructure (excluding roofs)","question":"You are building light steel ground floors on shrinkable soil assessed as having high volume change potential. What total underfloor void depth does the standard require?","options":["150mm","200mm","250mm","300mm"],"correct":3,"explanation":"Clause 6.10.4.1 states that where heave can occur in shrinkable soil of high potential, the minimum underfloor void should be increased by 150mm, giving 300mm total (medium potential is 250mm total and low potential 200mm total).","ref":"6.10.4.1","why":"Shrinkable clay swells and heaves upward when wet; a deeper void gives the ground room to move without the heave pushing up on and damaging the suspended steel floor above it.","source":"NHBC Standards 2026","sourceShort":"NHBC","refLabel":"Clause"},{"id":"6.10-05","chapter":"6.10","chapterTitle":"Light steel framed walls and floors","part":"Superstructure (excluding roofs)","question":"What is the minimum zinc coating required for pre-galvanized light steel framing members in normal locations?","options":["450g/m²","275g/m²","150g/m²","600g/m²"],"correct":1,"explanation":"Clause 6.10.7.2 requires all steel to be pre-galvanized in accordance with BS EN 10346 with a minimum 275g/m² zinc coating (or 150g/m² aluminium-zinc alloy coating). The higher 450g/m² figure applies to ground floor joists and ring beams 150mm or more above ground level.","ref":"6.10.7.2","why":"Light steel sections are thin, so an inadequate galvanized coating corrodes through much faster than on heavier steelwork, weakening structural members well before the building's intended design life.","source":"NHBC Standards 2026","sourceShort":"NHBC","refLabel":"Clause"},{"id":"6.10-06","chapter":"6.10","chapterTitle":"Light steel framed walls and floors","part":"Superstructure (excluding roofs)","question":"On site, a plumber asks to cut a notch part-way along the span of a light steel floor joist to run a pipe. What does the standard say?","options":["Notches are not acceptable anywhere in the span; only end notching for interconnecting trimming joists is permitted, in accordance with the design","It is acceptable provided a grommet is fitted to protect the pipe","It is acceptable if the notch is no deeper than a quarter of the joist depth","It is acceptable with the site manager's written approval"],"correct":0,"explanation":"Clause 6.10.7.4 states end notching of light steel joists may be required for the interconnection of trimming joists and should be in accordance with the design, but notches elsewhere in the span are not acceptable.","ref":"6.10.7.4","why":"Cutting a notch mid-span removes material exactly where bending stress in the joist is highest, seriously weakening it and risking a structural failure of the floor under normal loading.","source":"NHBC Standards 2026","sourceShort":"NHBC","refLabel":"Clause"},{"id":"6.10-07","chapter":"6.10","chapterTitle":"Light steel framed walls and floors","part":"Superstructure (excluding roofs)","question":"Where restraint straps are needed and joists run parallel to the wall, how should the straps be arranged?","options":["Maximum 2m apart and carried over two joists","Maximum 1.2m apart and carried over three joists","Maximum 2m apart and carried over three joists","Maximum 1.5m apart and carried over two joists"],"correct":2,"explanation":"Clause 6.10.9 states straps should be placed at a maximum of 2m apart and carried over three joists, supported on noggings fixed between the joists, with packing between the wall and the first joist.","ref":"6.10.9","why":"Restraint straps tie masonry walls back to the floor so wind loads pushing on the wall are transferred into the building's structure; spaced too far apart or over too few joists, they can't do this reliably and the wall can bow.","source":"NHBC Standards 2026","sourceShort":"NHBC","refLabel":"Clause"},{"id":"6.10-08","chapter":"6.10","chapterTitle":"Light steel framed walls and floors","part":"Superstructure (excluding roofs)","question":"When erecting wall frames you find a 15mm gap under the base rail. What packing does the standard require?","options":["Steel shims under each stud position only","Cement:sand grout under the base rail only","Stop work and obtain advice from the frame designer or manufacturer","Shims under each stud position plus cement:sand grout under the whole length of the base rail"],"correct":3,"explanation":"Table 5 in Clause 6.10.10.1 states that for gaps of 10-20mm, shims should be provided under each stud position and the whole length of the base rail grouted with cement:sand mortar. Frame designer advice is only needed for gaps over 20mm.","ref":"6.10.10.1","why":"A gap left ungrouted under the base rail lets the load concentrate on isolated high points instead of spreading evenly, risking local buckling or distortion of the frame once it's loaded.","source":"NHBC Standards 2026","sourceShort":"NHBC","refLabel":"Clause"},{"id":"6.10-09","chapter":"6.10","chapterTitle":"Light steel framed walls and floors","part":"Superstructure (excluding roofs)","question":"Where frame anchor fixings go into masonry, what is the minimum crushing strength of the solid concrete blocks that must receive them?","options":["3.6N/mm²","7.3N/mm²","2.9N/mm²","10.4N/mm²"],"correct":1,"explanation":"Clause 6.10.10.2 requires that where fixings are into masonry, they are into solid concrete blocks with a minimum crushing strength of 7.3N/mm² and positioned to receive the fixings.","ref":"6.10.10.2","why":"Weaker blocks can crush or crack under the tension and shear the anchor is designed to resist, so the fixing pulls out and the frame loses its anchorage against wind uplift and lateral load.","source":"NHBC Standards 2026","sourceShort":"NHBC","refLabel":"Clause"},{"id":"6.10-10","chapter":"6.10","chapterTitle":"Light steel framed walls and floors","part":"Superstructure (excluding roofs)","question":"What is the minimum thickness of moisture-resistant P5 chipboard floor decking on light steel joists at 600mm centres for domestic loads?","options":["18mm","15mm","22mm","25mm"],"correct":2,"explanation":"Table 6 in Clause 6.10.12 requires BS EN 312 moisture-resistant type P5 chipboard to be a minimum of 22mm thick at 600mm joist centres (18mm is only sufficient at 400mm centres).","ref":"6.10.12","why":"Thinner decking at wider joist spacing deflects more than it should under normal domestic loads, causing bouncy floors, cracked tile or floor finishes, or the board itself failing over time.","source":"NHBC Standards 2026","sourceShort":"NHBC","refLabel":"Clause"},{"id":"6.10-11","chapter":"6.10","chapterTitle":"Light steel framed walls and floors","part":"Superstructure (excluding roofs)","question":"What is the minimum clear cavity width required between the insulation and masonry cladding on a light steel framed wall?","options":["25mm","50mm","75mm","15mm"],"correct":1,"explanation":"Table 8 in Clause 6.10.16.1 requires a minimum 50mm clear cavity for masonry cladding; render on board background needs 25mm and other cladding 15mm.","ref":"6.10.16.1","why":"The cavity lets any rain that gets through the outer masonry drain away freely instead of bridging across to the insulation or steel frame, where trapped moisture would cause damp and corrosion.","source":"NHBC Standards 2026","sourceShort":"NHBC","refLabel":"Clause"},{"id":"6.10-12","chapter":"6.10","chapterTitle":"Light steel framed walls and floors","part":"Superstructure (excluding roofs)","question":"As a general rule, what is the minimum height the base rail of a light steel frame should be kept above external ground level?","options":["150mm","100mm","75mm","225mm"],"correct":0,"explanation":"Clause 6.10.16.2 requires the base rail of LSF to be kept a minimum of 150mm above the external ground level (or waterproofing layer of a flat roof, balcony or terrace) and cavity fill; going lower needs enhanced protection such as 600g/m² galvanizing.","ref":"6.10.16.2","why":"Keeping the base rail clear of ground level stops rain splash-back and standing water reaching the most vulnerable part of the steel frame, which would otherwise corrode and could rot any adjoining timber.","source":"NHBC Standards 2026","sourceShort":"NHBC","refLabel":"Clause"},{"id":"6.10-13","chapter":"6.10","chapterTitle":"Light steel framed walls and floors","part":"Superstructure (excluding roofs)","question":"What is the minimum density of wall ties for masonry cladding tied to a light steel frame?","options":["2.5 ties per m²","4.4 ties per m²","7.0 ties per m²","3.7 ties per m²"],"correct":3,"explanation":"Clause 6.10.21 requires wall ties for masonry cladding to be installed at a minimum density of 3.7 ties/m², for example spaced at a maximum of 600mm horizontally and 450mm vertically, unless an alternative density is justified by building-specific calculation under the Stage 2 certificate.","ref":"6.10.21","why":"Enough ties are needed to physically hold the heavy masonry cladding onto the light steel frame against wind suction; too few and the outer leaf can lean away from or detach from the frame.","source":"NHBC Standards 2026","sourceShort":"NHBC","refLabel":"Clause"},{"id":"6.11-01","chapter":"6.11","chapterTitle":"Render","part":"Superstructure (excluding roofs)","question":"You are applying site-mixed render on a cold morning with no manufacturer's guidance available. What air temperature condition must be met?","options":["At least 3°C and steady","Above 0°C at the time of application","At least 5°C and rising, checked throughout the day on a thermometer","At least 8°C for the full working day"],"correct":2,"explanation":"Clause 6.11.3 states that where no manufacturer's guidance is available, or when using site-mixed render, the air temperature should be at least 5°C and rising, with temperatures checked throughout the day on a thermometer.","ref":"6.11.3","why":"Render that freezes before it cures has ice crystals disrupt the setting cement, weakening the render so it crumbles or delaminates once it thaws, so a rising 5°C minimum protects the cure.","source":"NHBC Standards 2026","sourceShort":"NHBC","refLabel":"Clause"},{"id":"6.11-02","chapter":"6.11","chapterTitle":"Render","part":"Superstructure (excluding roofs)","question":"When a spatterdash coat is dashed onto a smooth masonry background to provide a key, what thickness should the rough texture be?","options":["Approximately 3-7mm","Approximately 1-2mm","Approximately 8-12mm","Approximately 10-15mm"],"correct":0,"explanation":"Clause 6.11.4.1 states a spatterdash coat typically comprises cement and sand at 1:3 mixed with water and often a bonding agent, applied by dashing onto the background to give a rough texture approximately 3-7mm thick.","ref":"6.11.4.1","why":"A smooth background gives render nothing to grip, so a rough dashed coat of roughly this thickness provides a mechanical key strong enough to stop the base coat slipping or falling off later.","source":"NHBC Standards 2026","sourceShort":"NHBC","refLabel":"Clause"},{"id":"6.11-03","chapter":"6.11","chapterTitle":"Render","part":"Superstructure (excluding roofs)","question":"A plot in a severe exposure zone has an external leaf of F2,S1 clay bricks and the cavity is designed to be fully filled with insulation. What does the standard say about rendering this wall?","options":["It is permitted provided a spatterdash coat is applied first","It is permitted if a designation ii (M6) render mix is used","It is permitted where the bricks have a water absorption of 9% to 15%","It is not permitted"],"correct":3,"explanation":"Clause 6.11.4.2 states render on an external leaf of clay bricks (F2,S1 or F1,S1 designation to BS EN 771) in severe or very severe exposures is not permitted where the cavity is to be fully filled with insulation.","ref":"6.11.4.2","why":"Frost-vulnerable clay brick, severe exposure and a fully filled cavity together trap moisture against a brick that can't cope with it, risking frost damage, sulfate attack and damp reaching the insulation.","source":"NHBC Standards 2026","sourceShort":"NHBC","refLabel":"Clause"},{"id":"6.11-04","chapter":"6.11","chapterTitle":"Render","part":"Superstructure (excluding roofs)","question":"To reduce localised cracking of render around openings, where should austenitic stainless steel bed joint reinforcement be placed in the external masonry leaf?","options":["In the first course above the opening only, projecting 300mm beyond it","In the first two courses above and below the opening, projecting 600mm beyond it where possible","In every third course for the full height of the wall","In the first two courses above the opening only, projecting 450mm beyond it"],"correct":1,"explanation":"Clause 6.11.5.1 requires bed joint reinforcement to BS EN 845-3 in the first two courses of the external masonry leaf above and below any opening to help distribute tensile stress, projecting 600mm beyond the opening where possible.","ref":"6.11.5.1","why":"Corners of openings concentrate tensile stress whenever the masonry moves, so reinforcement there spreads that stress out and stops the classic diagonal cracks running from window and door corners.","source":"NHBC Standards 2026","sourceShort":"NHBC","refLabel":"Clause"},{"id":"6.11-05","chapter":"6.11","chapterTitle":"Render","part":"Superstructure (excluding roofs)","question":"To avoid cracking, ribbed metal lath backgrounds should be divided by movement joints into bays no wider than what?","options":["6m","3m","5m","9m"],"correct":2,"explanation":"Clause 6.11.5.3 requires ribbed metal lath backgrounds to be divided with movement joints into bays no more than 5m wide, positioned at every storey height for timber framed backgrounds or a maximum of 5m vertically for other backgrounds.","ref":"6.11.5.3","why":"Metal lath render expands and contracts with temperature and moisture; splitting large areas into 5m bays with movement joints relieves that stress before it builds up enough to crack the render.","source":"NHBC Standards 2026","sourceShort":"NHBC","refLabel":"Clause"},{"id":"6.11-06","chapter":"6.11","chapterTitle":"Render","part":"Superstructure (excluding roofs)","question":"What is the basic rule on the relative strength of render coats?","options":["Coats should not be stronger than the background or any previous coat they are applied to","Each coat should be stronger than the one before to build up durability","All coats should be exactly the same strength as the background","Only the final coat needs to be weaker than the background"],"correct":0,"explanation":"Clause 6.11.6 states render coats should not be stronger than the background or any previous coat to which they are applied; weaker coats can be achieved by reducing cement content or decreasing coat thickness.","ref":"6.11.6","why":"A harder coat over a weaker one restrains the weaker layer as it shrinks, so the weaker coat cracks instead of moving freely; keeping each coat no stronger than the one beneath avoids this.","source":"NHBC Standards 2026","sourceShort":"NHBC","refLabel":"Clause"},{"id":"6.11-07","chapter":"6.11","chapterTitle":"Render","part":"Superstructure (excluding roofs)","question":"What is the minimum nominal total finished thickness of site-made render in severe and very severe exposure zones?","options":["16mm","13mm","20mm","25mm"],"correct":2,"explanation":"Clause 6.11.6.4 requires render to have a nominal total finished thickness of not less than 20mm in severe and very severe exposure zones (16mm applies in sheltered and moderate zones).","ref":"6.11.6.4","why":"Thicker render gives more resistance to saturation and better weathering, which is needed where wind-driven rain loading on the wall is at its highest in severe and very severe exposure zones.","source":"NHBC Standards 2026","sourceShort":"NHBC","refLabel":"Clause"},{"id":"6.11-08","chapter":"6.11","chapterTitle":"Render","part":"Superstructure (excluding roofs)","question":"The design shows site-made render continuing below the DPC. What precaution does the standard require for the mix?","options":["Use a weaker designation iv (M2) mix to accommodate movement","Use the standard wall mix but apply it thicker","Use a designation i (M12) mix for maximum durability","Use a stronger M4 mix that is sulfate resisting"],"correct":3,"explanation":"Clause 6.11.7.7 states it is preferable to stop render at DPC level, but where it continues below the DPC, site-made render should use a stronger mix (M4) that is sulfate resisting, or factory-made render in accordance with the manufacturer's recommendations.","ref":"6.11.7.7","why":"Ground moisture wicking up below the DPC carries sulfates from the soil that attack ordinary cement, making it expand and crumble; a sulfate-resisting mix resists this constant wetting and chemical attack.","source":"NHBC Standards 2026","sourceShort":"NHBC","refLabel":"Clause"},{"id":"6.11-09","chapter":"6.11","chapterTitle":"Render","part":"Superstructure (excluding roofs)","question":"When rendering onto a board background, what reinforcement does the render require?","options":["Galvanized steel mesh at the board joints only","Alkali-resistant mesh embedded into the base coat across the whole surface","Stainless steel mesh around openings only","No mesh is needed provided the boards are external grade"],"correct":1,"explanation":"Clause 6.11.8.6 requires render on board backgrounds to have alkali-resistant mesh embedded into the base coat across the whole surface.","ref":"6.11.8.6","why":"Standard mesh loses strength in the highly alkaline, wet render mix, so alkali-resistant mesh is needed to keep its tensile strength and control cracking as the board background moves.","source":"NHBC Standards 2026","sourceShort":"NHBC","refLabel":"Clause"},{"id":"7.1-01","chapter":"7.1","chapterTitle":"Flat roofs, terraces and balconies","part":"Roofs","question":"According to the chapter definitions, a flat roof is a roof with a maximum slope from the horizontal of how many degrees?","options":["5 degrees","10 degrees","12.5 degrees","15 degrees"],"correct":1,"explanation":"The definitions in Chapter 7.1 state that a flat roof is a roof with a maximum slope of 10 degrees from the horizontal.","ref":"7.1 (Definitions)","why":"Below 10° gravity alone won't shed water fast enough like a pitched, tiled roof does, so anything flatter needs a continuous waterproof membrane and designed falls - otherwise rain simply sits on the surface and finds its way in.","source":"NHBC Standards 2026","sourceShort":"NHBC","refLabel":"Clause"},{"id":"7.1-02","chapter":"7.1","chapterTitle":"Flat roofs, terraces and balconies","part":"Roofs","question":"Where a flat roof or terrace abuts a wall, what is the normal minimum height of the waterproofing upstand, measured from the drainage layer?","options":["75mm","100mm","150mm","225mm"],"correct":2,"explanation":"Clause 7.1.16 states the waterproofing layer should extend up the wall to form a minimum 150mm upstand measured from the balcony/terrace drainage layer; this may be reduced to 75mm only at an accessible threshold.","ref":"7.1.16","why":"A shallow upstand lets wind-driven rain or a build-up of surface water splash or track over the top where the deck meets the wall - a classic leak point into the room below if the upstand isn't tall enough.","source":"NHBC Standards 2026","sourceShort":"NHBC","refLabel":"Clause"},{"id":"7.1-03","chapter":"7.1","chapterTitle":"Flat roofs, terraces and balconies","part":"Roofs","question":"Where a flat roof, balcony or terrace has an upstand on all sides, what is the minimum drainage provision?","options":["Two outlets connected to separate downpipes, or one outlet plus an overflow","A single outlet of increased diameter","One outlet plus a second outlet on the same downpipe","An edge drainage slot on at least two sides"],"correct":0,"explanation":"Clause 7.1.4.1 requires that where there is an upstand on all sides, drainage should consist of a minimum of two outlets connected to separate downpipes, or one outlet plus an overflow.","ref":"7.1.4.1","why":"With upstands on every side there's no fall-back route if the single outlet blocks with leaves or debris - water has nowhere to go but up and over, so a second outlet or overflow stops it flooding the deck and building.","source":"NHBC Standards 2026","sourceShort":"NHBC","refLabel":"Clause"},{"id":"7.1-04","chapter":"7.1","chapterTitle":"Flat roofs, terraces and balconies","part":"Roofs","question":"Where tapered insulation is used to form the falls, what is the minimum design fall the insulation manufacturer should design to?","options":["1:20","1:30","1:40","1:60"],"correct":3,"explanation":"Clause 7.1.4.2 states that where tapered insulation is used, drainage should be designed by the insulation manufacturer with design falls of no less than 1:60.","ref":"7.1.4.2","why":"A fall shallower than 1:60 risks flattening out to nothing once the insulation boards settle and construction tolerances are accounted for, leaving pools that speed up membrane ageing, algae growth and freeze-thaw cracking.","source":"NHBC Standards 2026","sourceShort":"NHBC","refLabel":"Clause"},{"id":"7.1-05","chapter":"7.1","chapterTitle":"Flat roofs, terraces and balconies","part":"Roofs","question":"What is the minimum size of firring pieces used to form falls where joists are at 600mm centres?","options":["38mm wide x 38mm deep","38mm wide x 50mm deep","50mm wide x 50mm deep","50mm wide x 75mm deep"],"correct":1,"explanation":"Table 1 in Clause 7.1.4.2 gives a minimum width of 38mm and minimum depth of 50mm for firring pieces at 600mm joist centres (38mm x 38mm applies at 400 or 450mm centres).","ref":"7.1.4.2","why":"Wider joist spacing means the firring has to span further unsupported, so it needs extra depth to stay rigid - an undersized firring sags between joists and the fall it's meant to create disappears, causing ponding.","source":"NHBC Standards 2026","sourceShort":"NHBC","refLabel":"Clause"},{"id":"7.1-06","chapter":"7.1","chapterTitle":"Flat roofs, terraces and balconies","part":"Roofs","question":"What is the suggested design fall for a flat roof waterproofed with a membrane or liquid applied waterproofing?","options":["1:80","1:60","1:40","1:20"],"correct":2,"explanation":"Table 2 in Clause 7.1.4.2 gives a design fall of 1:40 for membrane and liquid applied waterproofing, with a minimum finished fall of 1:80.","ref":"7.1.4.2","why":"The design fall is deliberately set at roughly double what's needed because timber and steel decks deflect and creep over time; building in that margin ensures the roof still drains properly years later instead of flattening to ponding.","source":"NHBC Standards 2026","sourceShort":"NHBC","refLabel":"Clause"},{"id":"7.1-07","chapter":"7.1","chapterTitle":"Flat roofs, terraces and balconies","part":"Roofs","question":"What is NHBC's position on zero fall roofs?","options":["They are not accepted for roofs with exposed waterproofing layers","They are accepted on any roof if outlets are placed at points of maximum deflection","They are accepted for membrane roofs under 50m² in area","They are accepted provided the design fall is doubled elsewhere on the roof"],"correct":0,"explanation":"Clause 7.1.4.3 states that zero falls are not accepted for roofs with exposed waterproofing layers; such roofs should be designed to the falls shown in Table 2.","ref":"7.1.4.3","why":"Standing water on an exposed membrane accelerates UV and thermal degradation, invites algae and moss, and freezes and expands in winter - all of which shorten the membrane's life and hide small defects until they leak.","source":"NHBC Standards 2026","sourceShort":"NHBC","refLabel":"Clause"},{"id":"7.1-08","chapter":"7.1","chapterTitle":"Flat roofs, terraces and balconies","part":"Roofs","question":"Before the waterproofing layer is laid, who should carry out the site survey of the deck to identify any backfalls?","options":["The specialist waterproofing contractor","The deck erector","The NHBC building inspector","The structural engineer"],"correct":1,"explanation":"Clause 7.1.4.4 requires a site survey of the deck to be carried out by the deck erector prior to laying the waterproofing layer, with a formal handover procedure between the deck erector and the specialist waterproofing contractor.","ref":"7.1.4.4","why":"Once the membrane goes down, correcting a low spot in the deck is far harder and costlier - catching backfalls at survey stage, with a formal handover, avoids sealing a ponding problem permanently under the waterproofing.","source":"NHBC Standards 2026","sourceShort":"NHBC","refLabel":"Clause"},{"id":"7.1-09","chapter":"7.1","chapterTitle":"Flat roofs, terraces and balconies","part":"Roofs","question":"What size should holding-down straps be where they are required to prevent a timber flat roof lifting from the supporting structure?","options":["30mm x 2.5mm and 1m long","25mm x 2mm and 800mm long","30mm x 5mm and 1.5m long","50mm x 3mm and 1.2m long"],"correct":0,"explanation":"Clause 7.1.6.2 states holding-down straps should be 30mm x 2.5mm and 1m long, spaced at a maximum of 2m centres at the perimeters, with the lowest fixing within 150mm of the bottom of the vertical strap.","ref":"7.1.6.2","why":"Lightweight flat roof structures can act like a sail in strong wind and lift clean off the building; holding-down straps anchor the deck to the structure below so uplift forces can't peel the roof away.","source":"NHBC Standards 2026","sourceShort":"NHBC","refLabel":"Clause"},{"id":"7.1-10","chapter":"7.1","chapterTitle":"Flat roofs, terraces and balconies","part":"Roofs","question":"Where timber joists or concrete beam/roof elements provide lateral restraint to support walls, what minimum bearing should they have?","options":["75mm","90mm","100mm","150mm"],"correct":1,"explanation":"Clause 7.1.5 states that joists or concrete beams providing lateral restraint should have a minimum bearing of 90mm, or restraint straps at maximum 2m centres where they run parallel to walls.","ref":"7.1.5","why":"Joists or beams providing lateral restraint are stopping the wall from buckling under wind load - too shallow a bearing and the connection can pull apart under movement, leaving the wall unrestrained.","source":"NHBC Standards 2026","sourceShort":"NHBC","refLabel":"Clause"},{"id":"7.1-11","chapter":"7.1","chapterTitle":"Flat roofs, terraces and balconies","part":"Roofs","question":"What minimum service life should the structural elements of a balcony have?","options":["30 years","50 years","60 years","80 years"],"correct":2,"explanation":"Clause 7.1.6.1 states that structural elements of balconies should have a service life of at least 60 years.","ref":"7.1.6.1","why":"A balcony is a structural, safety-critical element that's hard to inspect and expensive to replace once built in; a 60-year design life matches the life of the building and guards against a hidden structural failure risking a fall.","source":"NHBC Standards 2026","sourceShort":"NHBC","refLabel":"Clause"},{"id":"7.1-12","chapter":"7.1","chapterTitle":"Flat roofs, terraces and balconies","part":"Roofs","question":"A design shows timber posts supporting a projecting balcony. What does the standard say about this?","options":["Timber should not be used for posts or columns supporting a balcony","It is acceptable if the timber is preservative treated","It is acceptable if the posts are inspected annually","It is acceptable provided the posts are oversized by 25%"],"correct":0,"explanation":"Clause 7.1.6.1 states timber should not be used for posts or columns supporting a balcony, nor for gallows brackets, guardrails, infill joists or cantilevered joists or decks.","ref":"7.1.6.1","why":"Timber posts and columns are exposed to constant wetting and drying outdoors and can rot from within without obvious external signs - since they'd be carrying the whole balcony's load, a hidden failure there risks collapse.","source":"NHBC Standards 2026","sourceShort":"NHBC","refLabel":"Clause"},{"id":"7.1-13","chapter":"7.1","chapterTitle":"Flat roofs, terraces and balconies","part":"Roofs","question":"On site, flat roof joists need packing to bring them level. What packing does the standard permit?","options":["Timber offcuts nailed to the wall plate","Strips of DPC folded to the required thickness","Plastic shims pushed in dry","Hard packing such as tiles or slates bedded in mortar"],"correct":3,"explanation":"Clause 7.1.6.1 states joists should be levelled where necessary using hard packing such as tiles or slates bedded in mortar; loose or soft packing, including timber, should not be used.","ref":"7.1.6.1","why":"Loose, soft or timber packing compresses, rots or shifts over time, letting the joist settle unevenly - that throws the carefully designed fall out and creates ponding or an unstable bearing years after handover.","source":"NHBC Standards 2026","sourceShort":"NHBC","refLabel":"Clause"},{"id":"7.1-14","chapter":"7.1","chapterTitle":"Flat roofs, terraces and balconies","part":"Roofs","question":"What is the minimum thickness of OSB3 deck boarding for a flexible membrane roof covering where joists are at 600mm centres?","options":["12mm","15mm","18mm","22mm"],"correct":2,"explanation":"Table 3 in Clause 7.1.6.1 requires oriented strand board type OSB3 to be a minimum of 18mm thick at 600mm joist centres (15mm at 450mm centres).","ref":"7.1.6.1","why":"A deck that's too thin flexes under foot traffic and point loads, cracking rigid finishes and creating springy low spots that hold water on the membrane above - the thickness step-up at wider centres keeps it stiff enough.","source":"NHBC Standards 2026","sourceShort":"NHBC","refLabel":"Clause"},{"id":"7.1-15","chapter":"7.1","chapterTitle":"Flat roofs, terraces and balconies","part":"Roofs","question":"Which timber species should be avoided in plywood decking used under a lead roof covering?","options":["Oak, Douglas fir and Western red cedar","Yellow pine and maritime pine","Spruce and European larch","Sweet chestnut and beech"],"correct":0,"explanation":"Table 5 (note 1) in Clause 7.1.6.1 states that oak, Douglas fir and Western red cedar should be avoided in plywood decking for lead roof coverings (yellow and maritime pine are to be avoided under hard metal coverings).","ref":"7.1.6.1","why":"These timbers release acidic tannins and extractives that attack lead through electrochemical corrosion from underneath, quietly pitting and weakening the sheet until it perforates - the deck material choice directly protects the roof covering above it.","source":"NHBC Standards 2026","sourceShort":"NHBC","refLabel":"Clause"},{"id":"7.1-16","chapter":"7.1","chapterTitle":"Flat roofs, terraces and balconies","part":"Roofs","question":"Flat roof joists span 3.5m. How many rows of strutting are needed?","options":["One row at the centre of the span","None, strutting is only needed over 4.5m","Two rows equally spaced along the span","Three rows at quarter points of the span"],"correct":0,"explanation":"Table 6 in Clause 7.1.6.2 requires one row of strutting at the centre of the span for joist spans between 2.5m and 4.5m; two rows are needed over 4.5m.","ref":"7.1.6.2","why":"Strutting stops long joists twisting or buckling sideways under load; without it a joist can rotate out of true, causing uneven deflection that cracks finishes and disrupts the carefully set falls to the outlets.","source":"NHBC Standards 2026","sourceShort":"NHBC","refLabel":"Clause"},{"id":"7.1-17","chapter":"7.1","chapterTitle":"Flat roofs, terraces and balconies","part":"Roofs","question":"What minimum movement gap should be left where plywood or OSB deck boards abut a rigid upstand?","options":["3mm","5mm","10mm","15mm"],"correct":2,"explanation":"Clause 7.1.6.3 requires a minimum movement gap of 10mm (or 2mm per metre of boarding, whichever is the greater) where boards abut a rigid upstand.","ref":"7.1.6.3","why":"Timber decking swells and shrinks with moisture and temperature; without a gap it pushes hard against the rigid upstand and can tear or displace the waterproofing dressed up it, opening a leak path at the wall junction.","source":"NHBC Standards 2026","sourceShort":"NHBC","refLabel":"Clause"},{"id":"7.1-18","chapter":"7.1","chapterTitle":"Flat roofs, terraces and balconies","part":"Roofs","question":"A designer proposes cross laminated timber (CLT) panels as the deck for a warm flat roof. What is NHBC's position?","options":["Acceptable if the panels are covered within 24 hours","Acceptable with a third-party assessed coating to each panel","Acceptable only on roofs under 10 degrees pitch","CLT panels are not accepted for flat roof construction"],"correct":3,"explanation":"Clause 7.1.6.3 states that due to the semi-impervious nature of CLT panels and the risk of trapping moisture during construction, they are not accepted for flat roof construction.","ref":"7.1.6.3","why":"CLT panels are semi-impervious, so any rain that gets onto them before the roof is sealed becomes trapped inside the panel with no way to dry out, leading to hidden long-term decay that can't be detected or fixed.","source":"NHBC Standards 2026","sourceShort":"NHBC","refLabel":"Clause"},{"id":"7.1-19","chapter":"7.1","chapterTitle":"Flat roofs, terraces and balconies","part":"Roofs","question":"At approximately what intervals should precast concrete decks have an allowance for movement?","options":["Every 10m","Every 15m","Every 20m","Every 30m"],"correct":1,"explanation":"Clause 7.1.7.1 states precast concrete decks should have allowance for movement approximately every 15m and at abutments.","ref":"7.1.7.1","why":"Without movement joints roughly every 15m, thermal expansion and shrinkage in a long precast deck builds up stress that cracks the units or the joints between them, opening a route for water into the structure below.","source":"NHBC Standards 2026","sourceShort":"NHBC","refLabel":"Clause"},{"id":"7.1-20","chapter":"7.1","chapterTitle":"Flat roofs, terraces and balconies","part":"Roofs","question":"What is the nominal thickness of a 1:4 cement:sand screed laid unbonded on a separating layer to form falls on a concrete roof?","options":["40mm","55mm","70mm","90mm"],"correct":2,"explanation":"Table 7 in Clause 7.1.7.2 gives a nominal thickness of 70mm (50mm minimum) for a screed laid unbonded on a separating layer; a bonded screed is 40mm nominal (25mm minimum).","ref":"7.1.7.2","why":"An unbonded screed floats on a separating layer rather than gripping the structural deck, so it needs the extra thickness to be self-supporting and resist cracking under loads that a thinner, fully bonded screed could otherwise handle.","source":"NHBC Standards 2026","sourceShort":"NHBC","refLabel":"Clause"},{"id":"7.1-21","chapter":"7.1","chapterTitle":"Flat roofs, terraces and balconies","part":"Roofs","question":"For a fully bonded waterproofing layer on an in-situ concrete deck, how long does the concrete usually need to dry before it can achieve effective bonding adhesion?","options":["7 days","14 days","21 days","28 days"],"correct":3,"explanation":"Clause 7.1.7.3 states that a bond test should be undertaken to check the concrete is sufficiently dry, which is usually around 28 days for fully bonded waterproofing, or to the manufacturer's recommendations.","ref":"7.1.7.3","why":"Sealing a wet slab under a fully bonded membrane traps moisture with nowhere to escape, so as it tries to migrate out it blisters and delaminates the membrane - the 28-day wait lets the concrete dry enough for a lasting bond.","source":"NHBC Standards 2026","sourceShort":"NHBC","refLabel":"Clause"},{"id":"7.1-22","chapter":"7.1","chapterTitle":"Flat roofs, terraces and balconies","part":"Roofs","question":"For bonded systems on profiled self-supporting metal flat roof sheeting, the crown width should be at least what proportion of the profile width?","options":["35%","40%","45%","50%"],"correct":2,"explanation":"Clause 7.1.8.2 requires a crown width of at least 45% of the profile width for bonded systems (40% for mechanically fixed systems), not including the crown stiffener grooves.","ref":"7.1.8.2","why":"A narrow crown leaves too little flat bearing area for the membrane to properly stick to and resist foot traffic or wind uplift, so the wider crown requirement stops the membrane stressing or tearing over the unsupported troughs.","source":"NHBC Standards 2026","sourceShort":"NHBC","refLabel":"Clause"},{"id":"7.1-23","chapter":"7.1","chapterTitle":"Flat roofs, terraces and balconies","part":"Roofs","question":"On a profiled self-supporting metal roof, what minimum vapour resistance must the AVCL on the warm side of the insulation achieve?","options":["100MNs/g","250MNs/g","500MNs/g","1000MNs/g"],"correct":2,"explanation":"Clause 7.1.9 states the AVCL must be fully sealed around all penetrations and at the roof perimeter, and have a vapour resistance of at least 500MNs/g.","ref":"7.1.9","why":"Metal roofs give warm, moist air from inside the building nowhere else to go, so an AVCL below this vapour resistance lets condensation form on the cold underside of the metal, corroding the deck and fixings from within.","source":"NHBC Standards 2026","sourceShort":"NHBC","refLabel":"Clause"},{"id":"7.1-24","chapter":"7.1","chapterTitle":"Flat roofs, terraces and balconies","part":"Roofs","question":"Which insulation board is suitable for use in an inverted warm roof without needing an independent third-party assessment?","options":["Polyisocyanurate (PIR) board","Extruded polystyrene (XPS) board","Phenolic foam (PF) board","Cellular glass (CG) board"],"correct":1,"explanation":"Table 8 in Clause 7.1.10.2 shows extruded polystyrene (XPS) as acceptable for inverted warm roofs; PIR and PF are for warm roofs only, and EPS or cellular glass need an independent third-party assessment for inverted use.","ref":"7.1.10.2","why":"Inverted roof insulation sits under permanently draining and sometimes standing water, so it needs very low water absorption and dimensional stability when wet - XPS's closed-cell structure copes with this without losing its thermal performance or breaking down.","source":"NHBC Standards 2026","sourceShort":"NHBC","refLabel":"Clause"},{"id":"7.1-25","chapter":"7.1","chapterTitle":"Flat roofs, terraces and balconies","part":"Roofs","question":"What is the minimum side and end lap for the water flow reducing layer (WFRL) on an inverted warm roof?","options":["100mm","150mm","225mm","300mm"],"correct":3,"explanation":"The note to Clause 7.1.10.2 states all side and end laps of the WFRL should be a minimum of 300mm, with the layer installed at right angles to the designed slope, starting at the bottom of the slope.","ref":"7.1.10.2","why":"The WFRL's job is to shed rainwater away before it cools the insulation and reaches the membrane; laps shorter than 300mm let water track through the joints, undermining both thermal performance and the insulation's condition over time.","source":"NHBC Standards 2026","sourceShort":"NHBC","refLabel":"Clause"},{"id":"7.1-26","chapter":"7.1","chapterTitle":"Flat roofs, terraces and balconies","part":"Roofs","question":"In a cold flat roof, what minimum unobstructed ventilation space is required above the insulation?","options":["25mm","32mm","38mm","50mm"],"correct":3,"explanation":"Clause 7.1.10.3 requires cold flat roofs to have an unobstructed minimum 50mm ventilation space above the insulation, with cross ventilation openings equivalent to a minimum 25mm continuous gap and a maximum 5m between ventilators on opposite sides.","ref":"7.1.10.3","why":"Ventilation clears moist air that has migrated up through the ceiling before it can hit the cold underside of the deck and condense there - too little airway and that trapped moisture rots timber joists and boarding from inside.","source":"NHBC Standards 2026","sourceShort":"NHBC","refLabel":"Clause"},{"id":"7.1-27","chapter":"7.1","chapterTitle":"Flat roofs, terraces and balconies","part":"Roofs","question":"The air temperature on site is 4°C and the roofers want to lay the waterproofing membrane. What does the standard require?","options":["Carry on, as membranes can be laid at any temperature above freezing","Lay the membrane but double all the laps","Warm the rolls indoors and then install immediately","Do not install the membrane unless otherwise agreed with the manufacturer"],"correct":3,"explanation":"Clause 7.1.11.1 states membranes should not be installed or handled when the product temperature and the air temperature is 5°C or less, unless otherwise agreed with the manufacturer.","ref":"7.1.11.1","why":"Below 5°C bituminous and similar membranes stiffen and become brittle, so laps, welds and bonds can't form properly - a seam that looks fine on a cold day can fail and leak once the weather warms and the roof moves.","source":"NHBC Standards 2026","sourceShort":"NHBC","refLabel":"Clause"},{"id":"7.1-28","chapter":"7.1","chapterTitle":"Flat roofs, terraces and balconies","part":"Roofs","question":"Where shingle ballast is used on an inverted roof, what specification should it meet?","options":["Rounded 20-40mm diameter shingle, minimum 50mm deep","Angular 10-20mm gravel, minimum 40mm deep","Rounded 5-15mm pea gravel, minimum 75mm deep","Crushed 40-60mm stone, minimum 25mm deep"],"correct":0,"explanation":"Clause 7.1.11.1 requires inverted roofs to be ballasted using minimum 40mm paving slabs or 20-40mm diameter rounded shingle ballast a minimum of 50mm deep, subject to any fire protection requirements.","ref":"7.1.11.1","why":"The ballast has to be heavy and deep enough to stop the insulation floating or lifting off in wind and heavy rain, while being rounded rather than sharp so it doesn't puncture the waterproofing layer sitting beneath it.","source":"NHBC Standards 2026","sourceShort":"NHBC","refLabel":"Clause"},{"id":"7.1-29","chapter":"7.1","chapterTitle":"Flat roofs, terraces and balconies","part":"Roofs","question":"Above what roof area should the waterproofing layer be subject to an appropriate integrity test by a suitably qualified surveyor, as well as visual inspection?","options":["50m²","25m²","75m²","100m²"],"correct":0,"explanation":"Clause 7.1.11.2 requires waterproofing layers on flat roofs, terraces and balconies greater than 50m², or roofs which are difficult to access (such as on buildings over three storeys), to have a visual inspection and an appropriate integrity test by a suitably qualified surveyor.","ref":"7.1.11.2","why":"On a large or hard-to-reach roof a small pinhole in the membrane is easy to miss by eye alone but very costly to trace once it's covered and the building is occupied, so an electronic integrity test catches hidden defects early.","source":"NHBC Standards 2026","sourceShort":"NHBC","refLabel":"Clause"},{"id":"7.1-30","chapter":"7.1","chapterTitle":"Flat roofs, terraces and balconies","part":"Roofs","question":"What is the minimum finished fall at the waterproofing layer for a green or biodiverse roof?","options":["1:40","1:60","1:80","1:100"],"correct":1,"explanation":"Clause 7.1.12 requires green and biodiverse roofs to be designed with a finished fall at the waterproofing layer of 1:60 (1 degree) minimum.","ref":"7.1.12","why":"Waterlogged growing medium adds significant extra dead load risking structural overload, drowns the planting, and keeps the waterproofing constantly saturated - a proper fall keeps the roof draining rather than turning into a soggy, overloaded sponge.","source":"NHBC Standards 2026","sourceShort":"NHBC","refLabel":"Clause"},{"id":"7.1-31","chapter":"7.1","chapterTitle":"Flat roofs, terraces and balconies","part":"Roofs","question":"How should the overflows on a Blue Roof be arranged?","options":["Connected into the main rainwater downpipes","Set below the water attenuation level for early discharge","Omitted, as the flow restrictor outlets act as overflows","Independent of the rainwater drainage system and visible in operation"],"correct":3,"explanation":"Clause 7.1.13 requires Blue Roofs to include overflows independent of the rainwater drainage system to avoid water ingress if the attenuation level is exceeded, with operation of an overflow visible to warn of a potential blockage.","ref":"7.1.13","why":"Blue roofs deliberately hold rainwater back to slow it into the drains, so if the flow-restricted outlet blocks the water level keeps rising - an independent, visible overflow stops it reaching the building and gives an obvious warning of the blockage.","source":"NHBC Standards 2026","sourceShort":"NHBC","refLabel":"Clause"},{"id":"7.1-32","chapter":"7.1","chapterTitle":"Flat roofs, terraces and balconies","part":"Roofs","question":"At an accessible threshold, what is the maximum upstand height permitted at the door position?","options":["10mm","15mm","20mm","25mm"],"correct":1,"explanation":"Clause 7.1.16 states accessible thresholds should have a maximum 15mm upstand at the threshold measured at the door position, with any transition ramps and sills sloped at no more than 15 degrees.","ref":"7.1.16","why":"A high upstand at a doorway is a trip hazard and blocks step-free access for wheelchairs, pushchairs and older residents, so the design caps it at 15mm while still relying on the drip, sill and cavity tray to keep rain out.","source":"NHBC Standards 2026","sourceShort":"NHBC","refLabel":"Clause"},{"id":"7.1-33","chapter":"7.1","chapterTitle":"Flat roofs, terraces and balconies","part":"Roofs","question":"What as-built gap should be provided between individual units of decking or paving on a balcony or terrace to ensure adequate drainage?","options":["6mm-8mm","3mm-5mm","10mm-12mm","15mm-18mm"],"correct":0,"explanation":"Clause 7.1.16 requires as-built gaps of 6mm-8mm between individual units of decking or paving, and 10mm-12mm gaps between the units and perimeter upstands/thresholds.","ref":"7.1.16","why":"Without a gap between the decking units, rainwater sits on top of the boards instead of draining through to the waterproofing beneath, leaving a slippery, algae-prone surface and trapping moisture against the timber.","source":"NHBC Standards 2026","sourceShort":"NHBC","refLabel":"Clause"},{"id":"7.1-34","chapter":"7.1","chapterTitle":"Flat roofs, terraces and balconies","part":"Roofs","question":"Copings on masonry balcony walls should project at least how far beyond the faces of the wall below?","options":["30mm","45mm","50mm","75mm"],"correct":1,"explanation":"Clause 7.1.18.3 requires copings to project a minimum of 45mm beyond the faces of the wall below and incorporate a drip feature that discharges water at least 30mm away from the face of the wall.","ref":"7.1.18.3","why":"A coping without enough projection and a drip groove lets rain running off it track back underneath and down the wall face, saturating the masonry and causing staining and frost damage over repeated wetting cycles.","source":"NHBC Standards 2026","sourceShort":"NHBC","refLabel":"Clause"},{"id":"7.1-35","chapter":"7.1","chapterTitle":"Flat roofs, terraces and balconies","part":"Roofs","question":"On site, a subcontractor proposes fixing balustrade posts down through the coping of a parapet wall. What does the standard recommend?","options":["Accept it, provided each fixing is sealed with mastic","Accept it if the coping is GRP rather than concrete","Accept it where the posts are at more than 1m centres","Fix the balustrade to the face of the wall below the coping instead"],"correct":3,"explanation":"Clause 7.1.18.4 states balustrading should not be fixed through a coping or capping because of the difficulty of achieving a waterproof junction and maintaining an imperforate DPC; the issue is avoided by fixing to the face of the wall below the coping or capping.","ref":"7.1.18.4","why":"Driving a fixing through the coping punches a hole straight through the weatherproof cap and the DPC beneath it, creating a leak path into the wall that's almost impossible to reseal - fixing to the wall face instead avoids ever breaching it.","source":"NHBC Standards 2026","sourceShort":"NHBC","refLabel":"Clause"},{"id":"7.1-36","chapter":"7.1","chapterTitle":"Flat roofs, terraces and balconies","part":"Roofs","question":"Where a balcony or small terrace is edge drained, what is the maximum plan depth of the water collecting surface?","options":["1,500mm","2,000mm","2,500mm","3,000mm"],"correct":2,"explanation":"Clause 7.1.19.2 permits edge drainage of balconies and small/access terraces provided the plan depth of the collecting surface is not more than 2,500mm, with no part of the discharge within 400mm of an adjacent wall.","ref":"7.1.19.2","why":"Beyond that depth the water collecting on the deck becomes too concentrated by the time it reaches the edge, discharging as a heavy uncontrolled flow that erodes the ground below and causes nuisance splashing rather than a gentle, dispersed runoff.","source":"NHBC Standards 2026","sourceShort":"NHBC","refLabel":"Clause"},{"id":"7.2-01","chapter":"7.2","chapterTitle":"Pitched roofs","part":"Roofs","question":"What is the maximum spacing at which trussed rafters should be evenly spaced?","options":["400mm centres","450mm centres","600mm centres","750mm centres"],"correct":2,"explanation":"Clause 7.2.3.1 states trussed rafters should be evenly spaced at maximum 600mm centres, and the spacing should not be altered without prior consent from the designer.","ref":"7.2.3.1","why":"Battens, plasterboard, ceilings and coverings are all designed around a 600mm truss spacing, so widening it overloads those elements, causing sagging ceilings or the roof covering losing support between trusses.","source":"NHBC Standards 2026","sourceShort":"NHBC","refLabel":"Clause"},{"id":"7.2-02","chapter":"7.2","chapterTitle":"Pitched roofs","part":"Roofs","question":"What is the minimum bearing length for a mono pitched truss into a shoe where the span is 4m or more?","options":["75mm","90mm","100mm","125mm"],"correct":0,"explanation":"Table 1 in Clause 7.2.3.1 gives a minimum bearing length of 75mm for mono pitched trusses spanning 4m or more (50mm where the span is less than 4m).","ref":"7.2.3.1","why":"Longer spans deliver a bigger end reaction into the shoe, so a wider bearing spreads that load over more timber to stop the truss end crushing or slipping off its support.","source":"NHBC Standards 2026","sourceShort":"NHBC","refLabel":"Clause"},{"id":"7.2-03","chapter":"7.2","chapterTitle":"Pitched roofs","part":"Roofs","question":"What is the maximum support spacing for fixing 9.5mm plasterboard to a trussed rafter ceiling?","options":["400mm","450mm","600mm","900mm"],"correct":1,"explanation":"Clause 7.2.3.1 states 9.5mm plasterboard should be fixed at a maximum support spacing of 450mm, while 12.5-15mm plasterboard may be fixed at up to 600mm.","ref":"7.2.3.1","why":"Thin 9.5mm board has little stiffness of its own, so tighter support spacing stops it sagging, bowing or cracking at joints under its own weight and any loft traffic vibration.","source":"NHBC Standards 2026","sourceShort":"NHBC","refLabel":"Clause"},{"id":"7.2-04","chapter":"7.2","chapterTitle":"Pitched roofs","part":"Roofs","question":"Where raised collar trusses are used as part of a room-in-roof construction, what is the maximum permitted horizontal deflection of the trusses at the supports?","options":["+/- 2mm","+/- 4mm","+/- 6mm","+/- 8mm"],"correct":2,"explanation":"Clause 7.2.3 states that where raised collar trusses are used in room-in-roof construction, the horizontal deflection of the trusses at the supports should be no more than +/- 6mm.","ref":"7.2.3","why":"Excess spread at the supports pushes the walls outward, which can crack finishes, jam windows and doors, and undermine the stability of the room-in-roof structure.","source":"NHBC Standards 2026","sourceShort":"NHBC","refLabel":"Clause"},{"id":"7.2-05","chapter":"7.2","chapterTitle":"Pitched roofs","part":"Roofs","question":"In a traditional cut roof, what is the typical minimum size for struts, unless designed by an engineer?","options":["75mm x 50mm","100mm x 50mm","100mm x 75mm","125mm x 50mm"],"correct":1,"explanation":"Table 3 in Clause 7.2.3.2 gives a minimum size of 100mm x 50mm for struts, unless designed by an engineer in accordance with Technical Requirement R5.","ref":"7.2.3.2","why":"Struts carry purlin loads down to the load-bearing walls below, so an undersized strut can buckle, letting purlins and rafters deflect and the roof plane sag.","source":"NHBC Standards 2026","sourceShort":"NHBC","refLabel":"Clause"},{"id":"7.2-06","chapter":"7.2","chapterTitle":"Pitched roofs","part":"Roofs","question":"How should trussed rafters be carried on site to avoid damage?","options":["Flat, to reduce wind resistance while moving them","On their side, supported at mid-span only","Upright, because fasteners can loosen when carried flat","In any orientation, provided the joints are supported"],"correct":2,"explanation":"Clause 7.2.4 states trusses should be carried upright, as fasteners can loosen when trusses are carried flat.","ref":"7.2.4","why":"Carrying trusses flat bends them out of the plane they're engineered for, which loosens the punched metal plate connections before the truss is even fixed in place, weakening it invisibly.","source":"NHBC Standards 2026","sourceShort":"NHBC","refLabel":"Clause"},{"id":"7.2-07","chapter":"7.2","chapterTitle":"Pitched roofs","part":"Roofs","question":"On site, a trussed rafter needs to be modified to suit a service run. Under what circumstances can a trussed rafter be cut, modified or repaired?","options":["Only if approved verbally by the site manager","Only where the work is witnessed by an NHBC inspector","Only if the truss supplier is notified after the work is done","Only in accordance with written or drawn instructions issued and approved by the trussed rafter designer"],"correct":3,"explanation":"Clause 7.2.4 states trussed rafters should not be cut, modified or repaired, except in accordance with written or drawn instructions issued and approved by the trussed rafter designer.","ref":"7.2.4","why":"Every timber and joint in a truss carries a calculated share of the load, so an uncontrolled cut can remove a load path and trigger local sagging or a sudden structural failure.","source":"NHBC Standards 2026","sourceShort":"NHBC","refLabel":"Clause"},{"id":"7.2-08","chapter":"7.2","chapterTitle":"Pitched roofs","part":"Roofs","question":"Where tiling battens are preservative treated, what desired service life applies under the durability requirements?","options":["15 years","30 years","40 years","60 years"],"correct":3,"explanation":"Table 4 in Clause 7.2.5 requires tiling battens to be preservative treated to Use Class 2 with a desired service life of 60 years, or to be of a naturally durable species.","ref":"7.2.5","why":"Battens are the only thing holding every tile or slate on, yet they're hidden under the covering for the roof's life, so if they rot the fixings pull through and the whole covering can slip or blow off.","source":"NHBC Standards 2026","sourceShort":"NHBC","refLabel":"Clause"},{"id":"7.2-09","chapter":"7.2","chapterTitle":"Pitched roofs","part":"Roofs","question":"What is the minimum length requirement for a wall plate?","options":["A minimum of 2m, or extending over at least two trusses","A minimum of 3m, or extending over at least three joists, rafters or trusses","A minimum of 4m, or extending over at least four joists, rafters or trusses","A minimum of 6m, or extending over at least five trusses"],"correct":1,"explanation":"Clause 7.2.6 states wall plates should be a minimum of 3m or extend over at least three joists, rafters or trusses, and be joined using half-lapped joints, including at corners.","ref":"7.2.6","why":"A short wall plate can't tie enough rafters or joists together, so loads and any outward thrust concentrate on fewer bearings instead of being spread evenly along the wall.","source":"NHBC Standards 2026","sourceShort":"NHBC","refLabel":"Clause"},{"id":"7.2-10","chapter":"7.2","chapterTitle":"Pitched roofs","part":"Roofs","question":"How far should plain tiles and slates project beyond the gable wall or bargeboard at a verge?","options":["25-38mm","30-60mm","38-50mm","50-75mm"],"correct":2,"explanation":"Clause 7.2.19.2 states plain tiles and slates at the verge should project 38-50mm beyond the gable wall or bargeboard (interlocking tiles project 30-60mm).","ref":"7.2.19.2","why":"The overhang lets rainwater running off the tiles drip clear of the gable wall rather than washing down its face, which would cause staining and damp penetration into the masonry.","source":"NHBC Standards 2026","sourceShort":"NHBC","refLabel":"Clause"},{"id":"7.2-11","chapter":"7.2","chapterTitle":"Pitched roofs","part":"Roofs","question":"Where a roof needs to resist uplift, what is the maximum spacing for holding-down straps fixed to the wall plate?","options":["1m centres","1.2m centres","1.5m centres","2m centres"],"correct":3,"explanation":"Clause 7.2.6 states holding-down straps should be a minimum of 1m long with a cross section of 30mm x 2.5mm and spaced at a maximum of 2m centres.","ref":"7.2.6","why":"In high winds a lightweight roof can be sucked upward off the walls; straps at this spacing tie the structure down so uplift forces are shared across enough fixing points to hold the roof in place.","source":"NHBC Standards 2026","sourceShort":"NHBC","refLabel":"Clause"},{"id":"7.2-12","chapter":"7.2","chapterTitle":"Pitched roofs","part":"Roofs","question":"What is the purpose of angle ties at the corners of a hipped roof?","options":["To stop the hip rafter deflecting under load","To prevent the wall plates from spreading","To provide a fixing point for the jack rafters","To tie the roof together at purlin level"],"correct":1,"explanation":"Clause 7.2.7 states angle ties should be used at the corners of hipped roofs to prevent the wall plates from spreading; dragon ties are used to prevent heavily loaded hip rafters spreading.","ref":"7.2.7","why":"Hip rafters push outward on the wall plates at the corners, and without angle ties this thrust can spread the plates apart, distorting the roof shape and easing the walls out of plumb.","source":"NHBC Standards 2026","sourceShort":"NHBC","refLabel":"Clause"},{"id":"7.2-13","chapter":"7.2","chapterTitle":"Pitched roofs","part":"Roofs","question":"In aggressive environments such as coastal locations, which fixings are recommended for solar roof panels?","options":["Hot dip galvanized steel fixings","Grade 304 stainless steel fixings","Grade 316 stainless steel fixings","Zinc-plated steel fixings"],"correct":2,"explanation":"Clause 7.2.26.4 recommends grade 316 stainless steel fixings in aggressive environments such as coastal locations.","ref":"7.2.26.4","why":"Grade 316 resists chloride attack from salt-laden sea air far better than standard fixings, which would otherwise corrode quickly and let panels work loose or detach from the roof.","source":"NHBC Standards 2026","sourceShort":"NHBC","refLabel":"Clause"},{"id":"7.2-14","chapter":"7.2","chapterTitle":"Pitched roofs","part":"Roofs","question":"For homes up to and including three storeys (two storeys in Scotland), what is the maximum spacing of lateral restraint straps?","options":["1.25m","1.5m","2m","2.5m"],"correct":2,"explanation":"Clause 7.2.8 states lateral restraint straps should be at a maximum spacing of 2m for homes up to and including three storeys (two storeys in Scot
