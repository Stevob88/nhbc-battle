what distance of the general coastline of the United Kingdom?","options":["100m","250m","500m","1,000m"],"correct":2,"explanation":"The definitions for solar PV in Chapter 8.2.1 state a coastal location is a site within a distance of 500m from the general coastline of the United Kingdom.","ref":"8.2.1"},{"id":"8.2-02","chapter":"8.2","chapterTitle":"Electrical generating technologies","part":"Internal services and low or zero carbon technologies (LZC)","question":"There is a power cut on the local network. What should a mains-connected solar PV system do?","options":["Switch to island mode and keep supplying the local network","Continue generating and exporting to the grid","Reduce its output to 50% until the mains returns","Automatically disconnect from the mains"],"correct":3,"explanation":"Clause 8.2.1.7 states LZC technologies connected to the mains should automatically disconnect when there is a mains power failure, to prevent 'islanding' — feeding the network during a loss of mains supply.","ref":"8.2.1.7"},{"id":"8.2-03","chapter":"8.2","chapterTitle":"Electrical generating technologies","part":"Internal services and low or zero carbon technologies (LZC)","question":"On site, an installer wants to join MC4 type connectors (male and female) from two different manufacturers on a solar PV system. What does the standard say?","options":["Mixing is not acceptable unless specifically allowed by the manufacturer","Mixing is acceptable provided both connectors are MCS certified","Mixing is acceptable if the joint is taped and supported","Mixing is acceptable on the DC side but not the AC side"],"correct":0,"explanation":"Clause 8.2.1.3.2 states that mixing of electrical MC4 type connections (male and female) is not acceptable unless specifically allowed by the manufacturer.","ref":"8.2.1.3.2"},{"id":"8.2-04","chapter":"8.2","chapterTitle":"Electrical generating technologies","part":"Internal services and low or zero carbon technologies (LZC)","question":"Which grade of stainless steel should be used for solar PV fixings and bracketry in coastal locations, where appropriate?","options":["Grade 304","Grade 316","Grade 410","Grade 430"],"correct":1,"explanation":"Clause 8.2.1.3.1 states that when installed in a coastal location, fixings and bracketry should be appropriate for the area and stainless steel grade 316 should be used where appropriate.","ref":"8.2.1.3.1"},{"id":"8.2-05","chapter":"8.2","chapterTitle":"Electrical generating technologies","part":"Internal services and low or zero carbon technologies (LZC)","question":"Rolled lead sheet used for flashings around a solar PV installation should be to what minimum specification?","options":["2.65mm thick (Code 6)","2.24mm thick (Code 5)","1.8mm thick (Code 4)","1.32mm thick (Code 3)"],"correct":2,"explanation":"Table 1 in Clause 8.2.1.4 requires rolled lead sheet flashings to be a minimum thickness of 1.8mm, code blue (Code 4), to BS EN 12588.","ref":"8.2.1.4"},{"id":"8.2-06","chapter":"8.2","chapterTitle":"Electrical generating technologies","part":"Internal services and low or zero carbon technologies (LZC)","question":"Where battery storage is provided with a solar PV system, how should the battery location be chosen in relation to fire safety?","options":["Within 1m of the consumer unit for ease of isolation","In the garage, regardless of enclosure type","Adjacent to the main entrance door for fire service access","So that escape routes are not impeded and a battery fire cannot compromise protected escape routes"],"correct":3,"explanation":"Clause 8.2.1.3.6 requires that batteries/storage are not placed so that escape routes are impeded, and that any fire in the battery does not compromise protected escape routes.","ref":"8.2.1.3.6"},{"id":"8.2-07","chapter":"8.2","chapterTitle":"Electrical generating technologies","part":"Internal services and low or zero carbon technologies (LZC)","question":"You notice a roofer has weatherproofed the interface between a PV mounting bracket and the roof using sealant alone. What does the standard require?","options":["The envelope should be weatherproofed using appropriate flashings and fixings — details relying solely on sealant are not acceptable","The sealant is acceptable if it is a low-modulus silicone applied in dry conditions","The sealant is acceptable provided it is inspected annually","A second bead of sealant should be applied over the first to give redundancy"],"correct":0,"explanation":"Clause 8.2.1.4 states the envelope should be weatherproofed using appropriate flashings and fixings, and that weatherproofing details that rely solely on sealant are not acceptable.","ref":"8.2.1.4"},{"id":"8.2-08","chapter":"8.2","chapterTitle":"Electrical generating technologies","part":"Internal services and low or zero carbon technologies (LZC)","question":"Who should design the foundations and anchor points for a stand-alone wind turbine?","options":["The MCS-certified installer using the standard details","The turbine manufacturer's delivery team","An engineer in accordance with Technical Requirement R5","The groundworks subcontractor based on previous plots"],"correct":2,"explanation":"Clause 8.2.2.4 requires foundations and anchor points for stand-alone LZC technologies to be designed by an engineer in accordance with Technical Requirement R5 to withstand the structural forces acting upon them.","ref":"8.2.2.4"},{"id":"8.2-09","chapter":"8.2","chapterTitle":"Electrical generating technologies","part":"Internal services and low or zero carbon technologies (LZC)","question":"Where parallel electrical generation occurs on a standard solar PV installation, what should the inverter have?","options":["An ER G59/3-2 compliance certificate","A G98 witness test report from the DNO","A BS EN 61215 design qualification certificate","A relevant Engineering Recommendation G83/2 type test certificate"],"correct":3,"explanation":"Clause 8.2.1.7 states that where parallel electrical generation occurs, inverters should have a relevant Engineering Recommendation G83/2 type test certificate for standard installations; larger installations should comply with ER G59/3-2.","ref":"8.2.1.7"},{"id":"8.3-01","chapter":"8.3","chapterTitle":"Space heating systems","part":"Internal services and low or zero carbon technologies (LZC)","question":"What is the design room temperature for a bathroom in a new build home insulated to current standards?","options":["18°C","20°C","21°C","22°C"],"correct":3,"explanation":"Table 2 in Clause 8.3.1.1.2 gives design room temperatures of 22°C for bathrooms and shower rooms, and 21°C for most other rooms.","ref":"8.3.1.1.2"},{"id":"8.3-02","chapter":"8.3","chapterTitle":"Space heating systems","part":"Internal services and low or zero carbon technologies (LZC)","question":"What outdoor design temperature should be used for heat loss calculations in Scotland and the Isles?","options":["-5.0°C","-4.0°C","-3.0°C","-2.0°C"],"correct":0,"explanation":"Table 3 in Clause 8.3.1.1.2 gives an outdoor design temperature of -5.0°C for Scotland and the Isles (latitude 56-60°N).","ref":"8.3.1.1.2"},{"id":"8.3-03","chapter":"8.3","chapterTitle":"Space heating systems","part":"Internal services and low or zero carbon technologies (LZC)","question":"How should design temperatures for a space heating system be verified?","options":["By performance tests on the completed system","By calculations","By spot temperature measurements at commissioning","By thermal imaging of the finished rooms"],"correct":1,"explanation":"Clause 8.3.1.1.2 states that design temperatures should be verified by calculations and not by performance tests.","ref":"8.3.1.1.2"},{"id":"8.3-04","chapter":"8.3","chapterTitle":"Space heating systems","part":"Internal services and low or zero carbon technologies (LZC)","question":"Operatives installing gas heating appliances must be members of a class of persons approved by the HSE. What does this mean in practice?","options":["They must be MCS certified","They must be HETAS qualified","They must be Gas Safe registered","They must be OFTEC registered"],"correct":2,"explanation":"Clause 8.3.2.1.3 requires gas heating appliances to be installed by competent operatives who are members of a class of persons approved by the HSE, ie Gas Safe registered.","ref":"8.3.2.1.3"},{"id":"8.3-05","chapter":"8.3","chapterTitle":"Space heating systems","part":"Internal services and low or zero carbon technologies (LZC)","question":"For isolating the electrical supply to a gas heating appliance, a double pole fused spur will generally be acceptable with what minimum contact separation?","options":["2.5mm","3.0mm","3.5mm","4.0mm"],"correct":2,"explanation":"Clause 8.3.2.7 states that an unswitched shuttered socket or double pole fused spur with 3.5mm separation will generally be acceptable for isolating the installation for maintenance or testing.","ref":"8.3.2.7"},{"id":"8.3-06","chapter":"8.3","chapterTitle":"Space heating systems","part":"Internal services and low or zero carbon technologies (LZC)","question":"How much of the calculated design space heating power requirement should the selected heat pump provide at the winter design condition?","options":["Not less than 90%, with electric heating making up the balance","Not less than 100%, including any energy required for defrost cycles","Not less than 110%, to allow a safety margin","Not less than 120%, to allow for future extensions"],"correct":1,"explanation":"Clause 8.3.3.3.2 requires the heat pump to provide not less than 100% of the calculated design space heating power requirement at the winter design condition, including any energy required for defrost cycles; supplementary electric heating should only operate when conditions are outside of the standards.","ref":"8.3.3.3.2"},{"id":"8.3-07","chapter":"8.3","chapterTitle":"Space heating systems","part":"Internal services and low or zero carbon technologies (LZC)","question":"Heat emitters and pipework for a heat pump system must be sized to the design mean water temperature (MWT). What design MWT does the standard state?","options":["35°C","42.5°C","50°C","55°C"],"correct":1,"explanation":"Clause 8.3.3.3.2 gives a design mean water temperature (MWT) of 42.5°C (the design can use a lower MWT), with heat emitters and system pipework or underfloor heating sized to the design MWT.","ref":"8.3.3.3.2"},{"id":"8.3-08","chapter":"8.3","chapterTitle":"Space heating systems","part":"Internal services and low or zero carbon technologies (LZC)","question":"An open loop ground source heat pump system is proposed, extracting water from an underground source. What does the standard require before proceeding?","options":["Approval from the water supplier for the extraction rate","A soil survey by a geotechnical engineer under Technical Requirement R5","Written confirmation from the local planning authority only","Consultation with the appropriate environment agency, which may require licences or a discharge consent"],"correct":3,"explanation":"Clause 8.3.3.5 states that where open loop systems are proposed, consultation with the appropriate environment agency should be made, which may require a licence to investigate groundwater, an abstraction licence or a discharge consent.","ref":"8.3.3.5"},{"id":"8.3-09","chapter":"8.3","chapterTitle":"Space heating systems","part":"Internal services and low or zero carbon technologies (LZC)","question":"A biomass boiler installer is not MCS accredited. Which qualification should they hold instead?","options":["HETAS qualified, as well as being electrically qualified","Gas Safe registered, as well as being electrically qualified","OFTEC registered, as well as being F Gas registered","BPEC trained, as well as being registered for unvented cylinders"],"correct":0,"explanation":"Clause 8.3.4.1.3 states that where biomass installers are not MCS accredited, they should still hold the relevant qualifications: HETAS qualified and electrically qualified.","ref":"8.3.4.1.3"},{"id":"8.4-01","chapter":"8.4","chapterTitle":"Ventilation","part":"Internal services and low or zero carbon technologies (LZC)","question":"On a low velocity MVHR system, what is the minimum distance (on plan) that an extract air valve should be positioned from a hob in a kitchen?","options":["300mm","450mm","600mm","750mm"],"correct":2,"explanation":"Clause 8.4.1.3.5 states that air valves on low velocity systems should be a minimum of 600mm (on plan) from hobs in kitchens.","ref":"8.4.1.3.5"},{"id":"8.4-02","chapter":"8.4","chapterTitle":"Ventilation","part":"Internal services and low or zero carbon technologies (LZC)","question":"To prevent cross contamination, what is the general minimum separation (measured on plan) between an MVHR intake terminal and the exhaust terminal or other potential sources of pollution?","options":["0.5m","1m","2m","3m"],"correct":1,"explanation":"Clause 8.4.1.3.5 requires intake terminals to be separated from exhaust terminals and other potential pollution sources by a minimum of 1m measured on plan, with increased distances possibly needed near soil and vent pipes, boiler flues and biomass or solid fuel chimneys.","ref":"8.4.1.3.5"},{"id":"8.4-03","chapter":"8.4","chapterTitle":"Ventilation","part":"Internal services and low or zero carbon technologies (LZC)","question":"MVHR ductwork passing through a cold roof void must be insulated to prevent condensation. What minimum thermal resistance should the insulation achieve?","options":["Equivalent to 15mm of insulating material with a thermal conductivity of 0.04W/mK","Equivalent to 25mm of insulating material with a thermal conductivity of 0.04W/mK","Equivalent to 50mm of insulating material with a thermal conductivity of 0.04W/mK","Equivalent to 100mm of insulating material with a thermal conductivity of 0.04W/mK"],"correct":1,"explanation":"Clause 8.4.1.3.6 states ductwork insulation should provide a thermal resistance equivalent to a minimum of 25mm of insulating material with a thermal conductivity of 0.04W/mK, using pre-insulated ductwork or a proprietary insulation system.","ref":"8.4.1.3.6"},{"id":"8.4-04","chapter":"8.4","chapterTitle":"Ventilation","part":"Internal services and low or zero carbon technologies (LZC)","question":"How should the condensate drain from an MVHR fan unit be connected to the soil and waste system?","options":["Via a dry trap","Directly, with no trap fitted","Via a wet trap with a 75mm seal","Via an external gully only"],"correct":0,"explanation":"Clause 8.4.1.3.6 states that fan units should be located to enable connection of the condensate drain to the soil and waste system via a dry trap.","ref":"8.4.1.3.6"},{"id":"8.4-05","chapter":"8.4","chapterTitle":"Ventilation","part":"Internal services and low or zero carbon technologies (LZC)","question":"Horizontal sections of MVHR service ductwork run outside the insulated parts of the home (e.g. above the loft insulation) should be insulated to protect them from the cold. What minimum thermal resistance is required?","options":["Equivalent to 25mm of insulating material with a thermal conductivity of 0.04W/mK","Equivalent to 50mm of insulating material with a thermal conductivity of 0.04W/mK","Equivalent to 100mm of insulating material with a thermal conductivity of 0.04W/mK","Equivalent to 150mm of insulating material with a thermal conductivity of 0.04W/mK"],"correct":3,"explanation":"Clause 8.4.1.3.7 states horizontal sections of service ductwork outside the insulated parts of the home should achieve a thermal resistance equivalent to at least 150mm of insulating material with a thermal conductivity of 0.04W/mK, which may be achieved by installing the ductwork between the layers of horizontal insulation.","ref":"8.4.1.3.7"},{"id":"8.4-06","chapter":"8.4","chapterTitle":"Ventilation","part":"Internal services and low or zero carbon technologies (LZC)","question":"Where flexible ducting is used on an MVHR system, what is its maximum permitted length?","options":["150mm","300mm","500mm","750mm"],"correct":1,"explanation":"Clause 8.4.1.6 states flexible ducting should not be more than 300mm in length, should only be located adjacent to fan units or air valves, and should not be used to form bends.","ref":"8.4.1.6"},{"id":"8.4-07","chapter":"8.4","chapterTitle":"Ventilation","part":"Internal services and low or zero carbon technologies (LZC)","question":"Unless the manufacturer recommends otherwise, what is the maximum spacing of the evenly spaced clips holding ventilation ductwork securely in position?","options":["400mm","600mm","750mm","900mm"],"correct":2,"explanation":"Clause 8.4.1.7.1 requires ductwork to be securely held in position by evenly spaced clips no more than 750mm apart, or in accordance with the ductwork manufacturer's recommendations.","ref":"8.4.1.7.1"},{"id":"8.4-08","chapter":"8.4","chapterTitle":"Ventilation","part":"Internal services and low or zero carbon technologies (LZC)","question":"An intermittent extract fan is designed for an extract rate of 45 L/s. Where flexible duct is used to form bends on this run, how many such bends are permitted?","options":["One","Two","Three","None permitted at any extract rate"],"correct":0,"explanation":"Clause 8.4.2.6.1 restricts flexible duct bends on intermittent extract systems to a maximum of two for systems up to 30 L/s and one for extract rates higher than 30 L/s.","ref":"8.4.2.6.1"},{"id":"8.4-09","chapter":"8.4","chapterTitle":"Ventilation","part":"Internal services and low or zero carbon technologies (LZC)","question":"At commissioning, the MVHR system cannot be balanced using the air valves and system controls. What does the standard require?","options":["Increase the fan speed above the designed output until airflow rates are met","Lock the air valves fully open and record the shortfall","Fit higher-capacity air valves from another manufacturer","Check the complete system to ensure it complies with the design"],"correct":3,"explanation":"Clause 8.4.1.11 states that where the system cannot be balanced using the air valves and system controls, the complete system should be checked to ensure it complies with the design; adjusting the fan speed above the designed output may cause noise disturbance and should be avoided.","ref":"8.4.1.11"},{"id":"8.5-01","chapter":"8.5","chapterTitle":"LZC hot water systems","part":"Internal services and low or zero carbon technologies (LZC)","question":"For solar thermal hot water systems, how does the standard define a coastal location?","options":["A site within 100m of the general coastline of the UK","A site within 250m of the general coastline of the UK","A site within 400m of the general coastline of the UK","A site within 500m of the general coastline of the UK"],"correct":3,"explanation":"The definitions in Chapter 8.5.1 state a coastal location is a site within a distance of 500m from the general coastline of the United Kingdom.","ref":"8.5.1"},{"id":"8.5-02","chapter":"8.5","chapterTitle":"LZC hot water systems","part":"Internal services and low or zero carbon technologies (LZC)","question":"You are fitting a solar thermal collector on a plot 300m from the sea. Which material does the standard recommend for the fixings and bracketry to resist corrosion?","options":["Galvanised mild steel","Grade 304 stainless steel","Grade 316 stainless steel","Anodised aluminium alloy"],"correct":2,"explanation":"Clause 8.5.1.5 states fixings, supports, bracketry and mounting frames should have adequate protection against corrosion, with grade 316 stainless steel recommended for coastal locations (sites within 500m of the coastline).","ref":"8.5.1.5"},{"id":"8.5-03","chapter":"8.5","chapterTitle":"LZC hot water systems","part":"Internal services and low or zero carbon technologies (LZC)","question":"How should the building envelope be weatherproofed at the interfaces with a roof-mounted solar thermal system?","options":["Using appropriate flashings and fixings","Using a continuous bead of silicone sealant","Using self-adhesive flashing tape alone","Using mortar fillets at all edges"],"correct":0,"explanation":"Clause 8.5.1.5 requires the envelope to be weatherproofed using appropriate flashings and fixings, and states that weatherproofing details that rely solely on sealant are not acceptable.","ref":"8.5.1.5"},{"id":"8.5-04","chapter":"8.5","chapterTitle":"LZC hot water systems","part":"Internal services and low or zero carbon technologies (LZC)","question":"When installing solar thermal systems, which material should aluminium and aluminium alloy components not come into contact with?","options":["Roofing felt","Cementitious material","Insulation boards","Plastic pipework"],"correct":1,"explanation":"Clause 8.5.1.5 states that aluminium and aluminium alloys should not come into contact with cementitious material; this is repeated in Clause 8.5.1.6, which requires the isolation of aluminium from cementitious material.","ref":"8.5.1.5"},{"id":"8.5-05","chapter":"8.5","chapterTitle":"LZC hot water systems","part":"Internal services and low or zero carbon technologies (LZC)","question":"Who should design the foundations and anchor points for a stand-alone solar thermal installation?","options":["The solar panel manufacturer's sales team","The site manager, using the fixing schedule","An engineer, in accordance with Technical Requirement R5","The plumbing subcontractor installing the system"],"correct":2,"explanation":"Clause 8.5.1.5 requires foundations and anchor points for stand-alone solar thermal technologies to be designed by an engineer in accordance with Technical Requirement R5 to withstand the structural forces acting upon them.","ref":"8.5.1.5"},{"id":"8.5-06","chapter":"8.5","chapterTitle":"LZC hot water systems","part":"Internal services and low or zero carbon technologies (LZC)","question":"Solar thermal products certified through which scheme will generally be acceptable to NHBC?","options":["The Benchmark scheme","The Microgeneration Certification Scheme (MCS)","The BPEC certification scheme","The TrustMark scheme"],"correct":1,"explanation":"Clause 8.5.1.1.2 states that solar thermal products certified through the Microgeneration Certification Scheme (MCS) will generally be acceptable to NHBC, with certification and test documentation available on request.","ref":"8.5.1.1.2"},{"id":"8.6-01","chapter":"8.6","chapterTitle":"Installation and commissioning","part":"Internal services and low or zero carbon technologies (LZC)","question":"Where a horizontal chase for services is cut into a single leaf of blockwork, what is its maximum permitted depth?","options":["1/8 of the leaf thickness","1/6 of the leaf thickness","1/4 of the leaf thickness","1/3 of the leaf thickness"],"correct":1,"explanation":"Clause 8.6.2.2 limits chase depths to 1/6 of the thickness of the single leaf for horizontal chases and 1/3 of the thickness for vertical chases; hollow blocks should not be chased unless specifically permitted by the manufacturer.","ref":"8.6.2.2"},{"id":"8.6-02","chapter":"8.6","chapterTitle":"Installation and commissioning","part":"Internal services and low or zero carbon technologies (LZC)","question":"Where pipes are permitted in a floor screed, what is the minimum screed cover required over the pipes and their insulating material?","options":["15mm","20mm","25mm","40mm"],"correct":2,"explanation":"Clause 8.6.2.2 requires screed cover to be a minimum of 25mm over pipes and insulating material; where pipes cross, it may be necessary to form a duct to achieve adequate cover.","ref":"8.6.2.2"},{"id":"8.6-03","chapter":"8.6","chapterTitle":"Installation and commissioning","part":"Internal services and low or zero carbon technologies (LZC)","question":"When notching the top edge of a solid timber joist up to 250mm deep to accommodate a pipe, what is the maximum permitted notch depth?","options":["0.05 x depth of joist","0.1 x depth of joist","0.125 x depth of joist","0.15 x depth of joist"],"correct":3,"explanation":"Table 1 in Clause 8.6.2.7 limits notches in joists up to 250mm deep to a maximum of 0.15 x the depth of the joist, located on the top edge within a zone 0.1-0.2 x span from the end.","ref":"8.6.2.7"},{"id":"8.6-04","chapter":"8.6","chapterTitle":"Installation and commissioning","part":"Internal services and low or zero carbon technologies (LZC)","question":"Plastic pipework is being concealed behind a wall surface where a metal detector would not otherwise find it. What should be placed behind the pipework?","options":["Metallic tape","Brightly coloured warning tape","A timber batten","Foil-faced insulation"],"correct":0,"explanation":"Clause 8.6.2.4 requires metallic tape to be placed behind plastic pipework where it is concealed behind wall surfaces and would otherwise not be located by a metal detector or similar equipment.","ref":"8.6.2.4"},{"id":"8.6-05","chapter":"8.6","chapterTitle":"Installation and commissioning","part":"Internal services and low or zero carbon technologies (LZC)","question":"Using high performance insulation with a thermal conductivity of 0.025W/mK at 40°C, what minimum insulation thickness is required on a 15mm diameter hot water pipe?","options":["9mm","12mm","15mm","20mm"],"correct":0,"explanation":"Table 2 in Clause 8.6.4.1 gives a minimum insulation thickness of 9mm for a 15mm outside diameter pipe using insulation with a thermal conductivity of 0.025W/mK, so that the permissible heat losses in BS 5422 for hot water services at 60°C are not exceeded.","ref":"8.6.4.1"},{"id":"8.6-06","chapter":"8.6","chapterTitle":"Installation and commissioning","part":"Internal services and low or zero carbon technologies (LZC)","question":"During commissioning of an LZC system, the commissioning engineer finds a small leak on the pipework. By when must leaks and other defects be made good?","options":["Within the first year, under the defects period","Before the system is next switched on","Before NHBC's final inspection only","Before finishes are applied and the home is handed over"],"correct":3,"explanation":"Clause 8.6.5 states the commissioning engineer should ensure leaks or other defects are made good prior to the application of finish and handover of the home.","ref":"8.6.5"},{"id":"9.1-01","chapter":"9.1","chapterTitle":"A consistent approach to finishes","part":"Finishes","question":"When assessing the tolerances and appearance of an external wall, from what minimum distance should it be viewed in daylight?","options":["2m","5m","10m","20m"],"correct":2,"explanation":"Clause 9.1.2 states tolerances and appearance of external walls should be considered in daylight and from a minimum distance of 10m.","ref":"9.1.2"},{"id":"9.1-02","chapter":"9.1","chapterTitle":"A consistent approach to finishes","part":"Finishes","question":"What is the maximum deviation from plumb for fair faced masonry in any storey up to 3m high?","options":["5mm","8mm","10mm","12mm"],"correct":1,"explanation":"Clause 9.1.2.1 requires fair faced masonry to be a maximum of 8mm from plumb in any storey up to 3m; taller walls should be a maximum of 8mm per storey and 12mm in total.","ref":"9.1.2.1"},{"id":"9.1-03","chapter":"9.1","chapterTitle":"A consistent approach to finishes","part":"Finishes","question":"For ceilings up to 6m across, what is the maximum out-of-level deviation permitted per 1m, measured at the furthest points across the full width?","options":["3mm","5mm","8mm","10mm"],"correct":0,"explanation":"Clause 9.1.3.3 states ceilings should be level within a 3mm deviation per 1m for ceilings up to 6m across, and a maximum of 20mm out of level for ceilings over 6m across.","ref":"9.1.3.3"},{"id":"9.1-04","chapter":"9.1","chapterTitle":"A consistent approach to finishes","part":"Finishes","question":"In fair faced masonry, by how much may the thickness of an individual bed joint vary from the average of the next eight successive joints?","options":["±1mm","±1.5mm","±2mm","±3mm"],"correct":1,"explanation":"Clause 9.1.2.1 states the thickness of an individual bed joint should not vary from the average of the next eight successive joints by more than ±1.5mm.","ref":"9.1.2.1"},{"id":"9.1-05","chapter":"9.1","chapterTitle":"A consistent approach to finishes","part":"Finishes","question":"What is the maximum vertical and horizontal deviation from flat permitted for render in any 5m?","options":["±2mm","±3mm","±4mm","±5mm"],"correct":2,"explanation":"Clause 9.1.2.2 requires render to be flat within a maximum ±4mm vertical and horizontal deviation in 5m.","ref":"9.1.2.2"},{"id":"9.1-06","chapter":"9.1","chapterTitle":"A consistent approach to finishes","part":"Finishes","question":"When checking glazing in daylight, fine scratches are acceptable where they are not obtrusive or bunched, provided they are no longer than what length?","options":["25mm","40mm","50mm","75mm"],"correct":0,"explanation":"Clause 9.1.6 permits fine scratches not more than 25mm long, along with bubbles, blisters, hairlines, blobs and minute particles, where they are not obtrusive or bunched.","ref":"9.1.6"},{"id":"9.1-07","chapter":"9.1","chapterTitle":"A consistent approach to finishes","part":"Finishes","question":"What is the maximum gap permitted between an internal door and the head or jamb of the frame?","options":["3mm","4mm","5mm","6mm"],"correct":1,"explanation":"Clause 9.1.4 states the gap between the door and head or jamb should be a maximum of 4mm and uniform; for double doors the gap at the meeting stiles should also be within 4mm.","ref":"9.1.4"},{"id":"9.1-08","chapter":"9.1","chapterTitle":"A consistent approach to finishes","part":"Finishes","question":"What gap should there be between the underside of an internal door and the unfinished floor?","options":["5mm to 10mm","6mm to 15mm","8mm to 20mm","10mm to 22mm"],"correct":3,"explanation":"Clause 9.1.4 requires the gap between the underside of the door and unfinished floor to be between 10mm and 22mm, taking the building's ventilation requirements into account.","ref":"9.1.4"},{"id":"9.1-09","chapter":"9.1","chapterTitle":"A consistent approach to finishes","part":"Finishes","question":"You inspect a new drive one hour after rain has stopped and find some standing water. What does the standard accept?","options":["No standing water at all anywhere on drives or paths","Standing water up to 10mm deep and up to 2m² in area","Standing water of any size provided it drains within 24 hours","Temporary standing water up to 5mm deep and up to 1m², but not adjacent to entrance doors"],"correct":3,"explanation":"Clause 9.1.15 states that one hour after rain has stopped, areas of temporary standing water should not be deeper than 5mm or exceed 1m², and standing water is not permitted adjacent to entrance doors.","ref":"9.1.15"},{"id":"9.2-01","chapter":"9.2","chapterTitle":"Wall and ceiling finishes","part":"Finishes","question":"Which of the following is a requirement for the plaster mix?","options":["It should not include Portland cement and gypsum plaster in the same mix","It should always include a bonding agent regardless of background","It should be retempered if it begins to stiffen before use","It should be mixed for as long as possible to improve workability"],"correct":0,"explanation":"Clause 9.2.3 requires the plaster mix to be of a type that does not include Portland cement and gypsum plaster in the same mix; it also warns against retempering and prolonged mixing.","ref":"9.2.3"},{"id":"9.2-02","chapter":"9.2","chapterTitle":"Wall and ceiling finishes","part":"Finishes","question":"Dry lining should not be started until structural timber components are at what maximum moisture content?","options":["15%","18%","20%","24%"],"correct":2,"explanation":"Clause 9.2.4.1 states dry lining should not be started until structural timber components are at a moisture content of 20% or less, and the building is substantially weatherproofed.","ref":"9.2.4.1"},{"id":"9.2-03","chapter":"9.2","chapterTitle":"Wall and ceiling finishes","part":"Finishes","question":"What is the maximum thickness of plaster, excluding dubbing out, that should be applied to brickwork walls?","options":["10mm","13mm","16mm","19mm"],"correct":1,"explanation":"Table 3 in Clause 9.2.3 gives a maximum plaster thickness of 13mm on brickwork walls, applied in a minimum of two coats.","ref":"9.2.3"},{"id":"9.2-04","chapter":"9.2","chapterTitle":"Wall and ceiling finishes","part":"Finishes","question":"Within the field of plasterboards, what are the typical maximum centres for screw fixings?","options":["150mm for ceilings and 230mm for walls","200mm for ceilings and 250mm for walls","300mm for ceilings and 230mm for walls","230mm for ceilings and 300mm for walls"],"correct":3,"explanation":"Clause 9.2.4.4 states screw fixings will typically be at maximum centres of 230mm for ceilings and 300mm for walls within the field of the boards, with closer centres possibly specified at edges and corners.","ref":"9.2.4.4"},{"id":"9.2-05","chapter":"9.2","chapterTitle":"Wall and ceiling finishes","part":"Finishes","question":"What is the maximum weight of ceramic wall tiles that lightweight plaster should carry?","options":["20kg/m²","25kg/m²","32kg/m²","40kg/m²"],"correct":0,"explanation":"Clause 9.2.5 states tiles should be suitable for the location, intended use and background, and their weight on lightweight plaster should not exceed 20kg/m².","ref":"9.2.5"},{"id":"9.2-06","chapter":"9.2","chapterTitle":"Wall and ceiling finishes","part":"Finishes","question":"When fixing dry lining with adhesive dabs, at what centres should the dabs be positioned, measured vertically?","options":["150mm","200mm","300mm","400mm"],"correct":2,"explanation":"Clause 9.2.4.4 requires adhesive dabs at 300mm centres measured vertically, with each dab 50mm to 75mm wide and approximately 250mm long.","ref":"9.2.4.4"},{"id":"9.2-07","chapter":"9.2","chapterTitle":"Wall and ceiling finishes","part":"Finishes","question":"The tiler is due on site to tile a bathroom wall where the dry lining was fixed with dabs of adhesive. How long should the backing have been completed before wall tiling takes place?","options":["3 days","5 days","7 days","10 days"],"correct":3,"explanation":"Clause 9.2.5 states backing surfaces should be completed at least 10 days before wall tiling takes place where dry lining is fixed with dabs of adhesive.","ref":"9.2.5"},{"id":"9.3-01","chapter":"9.3","chapterTitle":"Floor finishes","part":"Finishes","question":"What cement:sand mix is generally suitable for a non-structural floor screed?","options":["Between 1:2 and 1:3","Between 1:3 and 1:4½","Between 1:5 and 1:6","Between 1:6 and 1:8"],"correct":1,"explanation":"Clause 9.3.4.1 states non-structural screed should be of a suitable sand cement mix, generally between 1:3 and 1:4½ cement:sand; where deeper than 40mm, concrete may be used.","ref":"9.3.4.1"},{"id":"9.3-02","chapter":"9.3","chapterTitle":"Floor finishes","part":"Finishes","question":"Where services are bedded in the screed, what is the minimum cover required over the highest point of pipes and insulation?","options":["25mm","30mm","40mm","50mm"],"correct":0,"explanation":"Clause 9.3.4.1 requires a minimum 25mm of cover over the highest point of pipes and insulation where services are bedded in the screed.","ref":"9.3.4.1"},{"id":"9.3-03","chapter":"9.3","chapterTitle":"Floor finishes","part":"Finishes","question":"What is the minimum thickness at any point for a non-structural cement and sand screed installed on a separating membrane?","options":["25mm","40mm","50mm","65mm"],"correct":2,"explanation":"Table 2 in Clause 9.3.4.2 gives a minimum thickness of 50mm at any point for screed installed on a separating membrane (eg 1000g polyethylene); on resilient slabs or quilts it is 65mm.","ref":"9.3.4.2"},{"id":"9.3-04","chapter":"9.3","chapterTitle":"Floor finishes","part":"Finishes","question":"How thick should a Grade I or II mastic asphalt floor finish be, including the finish and underlay?","options":["5mm to 10mm","10mm to 15mm","12mm to 18mm","15mm to 20mm"],"correct":3,"explanation":"Clause 9.3.8 states mastic asphalt floor finishes should be either Grade I or II and 15mm-20mm thick, which applies to the floor finishes and underlay.","ref":"9.3.8"},{"id":"9.3-05","chapter":"9.3","chapterTitle":"Floor finishes","part":"Finishes","question":"A concrete base is due to receive ceramic floor tiles. Generally, how long should it be left to dry before tiling starts?","options":["3 weeks","6 weeks","2 months","6 months"],"correct":1,"explanation":"Clause 9.3.5 states the substrate should be sufficiently dry before tiling; generally six weeks for concrete bases and three weeks for screed is adequate.","ref":"9.3.5"},{"id":"9.3-06","chapter":"9.3","chapterTitle":"Floor finishes","part":"Finishes","question":"In tiled floors, at what centres should movement joints be used to separate bays?","options":["8m to 10m","10m to 12m","12m to 15m","15m to 20m"],"correct":0,"explanation":"Clause 9.3.5 states movement joints should be used to separate bays at 8-10m centres; with underfloor heating, bays should be no greater than 40m² with an edge length not greater than 8m.","ref":"9.3.5"},{"id":"9.3-07","chapter":"9.3","chapterTitle":"Floor finishes","part":"Finishes","question":"Where a concrete slab is to receive wood flooring and is not moisture tested, how long should it generally be allowed to cure?","options":["6 weeks","2 months","3 months","6 months"],"correct":3,"explanation":"Clause 9.3.6.3 states screeds or concrete to receive wood flooring should be allowed to cure for a sufficient period of time, generally two months for 50mm screed and six months for concrete slabs.","ref":"9.3.6.3"},{"id":"9.3-08","chapter":"9.3","chapterTitle":"Floor finishes","part":"Finishes","question":"Flexible sheet flooring materials should not be exposed to temperatures below what value for the 24 hours before, or during, laying?","options":["10°C","15°C","18°C","21°C"],"correct":2,"explanation":"Clause 9.3.7 states flexible sheet flooring materials should not be exposed to temperatures less than 18°C for a period of 24 hours before, or during, laying.","ref":"9.3.7"},{"id":"9.4-01","chapter":"9.4","chapterTitle":"Finishes and fitments","part":"Finishes","question":"How much circulation space should the kitchen specification allow in front of all work surfaces, cupboards and appliances?","options":["0.6m","0.75m","0.9m","1m"],"correct":3,"explanation":"Clause 9.4.3 states the kitchen specification should allow for 1m circulation space in front of all work surfaces, cupboards and appliances.","ref":"9.4.3"},{"id":"9.4-02","chapter":"9.4","chapterTitle":"Finishes and fitments","part":"Finishes","question":"Where a kitchen appliance is intended but not provided, what depth can be assumed for it?","options":["500mm","600mm","650mm","700mm"],"correct":1,"explanation":"Clause 9.4.3 states a depth of 600mm can be assumed for appliances where they are intended but not provided.","ref":"9.4.3"},{"id":"9.4-03","chapter":"9.4","chapterTitle":"Finishes and fitments","part":"Finishes","question":"In which homes is an airing cupboard required?","options":["Homes which do not have central or whole home heating","All new homes, regardless of the heating system","Homes with more than three bedrooms","Only homes where the buyer requests one in the specification"],"correct":0,"explanation":"Clause 9.4.3 states airing cupboards are required in homes which do not have central or whole home heating.","ref":"9.4.3"},{"id":"9.4-04","chapter":"9.4","chapterTitle":"Finishes and fitments","part":"Finishes","question":"What is the minimum spacing required between shelves in an airing cupboard?","options":["200mm","250mm","300mm","350mm"],"correct":2,"explanation":"Clause 9.4.6 requires airing cupboards to have a 300mm minimum spacing between shelves, a minimum 0.5m² of easily reached shelving, and no shelving higher than 1.5m.","ref":"9.4.6"},{"id":"9.4-05","chapter":"9.4","chapterTitle":"Finishes and fitments","part":"Finishes","question":"A kitchen worktop has been cut on site to fit around a unit. How should the cut edge be finished?","options":["Sealed using a metal or plastic strip glued to the edge with waterproof adhesive, or an appropriate waterproof joint","Left as cut, provided it will be concealed by the adjacent unit","Sanded smooth and coated with a clear varnish","Covered with a bead of decorative silicone only"],"correct":0,"explanation":"Clause 9.4.6 states that where worktops or unit panels are cut, edges should be sealed using a metal or plastic strip glued to the edge with waterproof adhesive, or alternatively an appropriate waterproof joint.","ref":"9.4.6"},{"id":"9.4-06","chapter":"9.4","chapterTitle":"Finishes and fitments","part":"Finishes","question":"How should skirting be formed at external and internal angles?","options":["Butt jointed square at all angles and filled","Fixed with visible brackets at each corner","Left with an expansion gap at every corner","Mitred and scribed, as appropriate"],"correct":3,"explanation":"Clause 9.4.4 states skirting should be mitred and scribed at external and internal angles as appropriate, tightly abut architraves, and run level and scribed to floors.","ref":"9.4.4"},{"id":"9.5-01","chapter":"9.5","chapterTitle":"Painting and decorating","part":"Finishes","question":"What is the maximum moisture content of timber when painting or decorating it?","options":["12%","15%","18%","20%"],"correct":2,"explanation":"Clause 9.5.5 states that when painting or decorating timber, the moisture content should be a maximum of 18%.","ref":"9.5.5"},{"id":"9.5-02","chapter":"9.5","chapterTitle":"Painting and decorating","part":"Finishes","question":"When applying undercoat and gloss to timber, within what period of the previous coat should each coat be applied?","options":["One month","Two months","Three months","Six months"],"correct":0,"explanation":"Clause 9.5.5 requires each coat to be applied within one month of the previous, with a minimum of one priming coat, one undercoat and one finishing coat unless the manufacturer recommends otherwise.","ref":"9.5.5"},{"id":"9.5-03","chapter":"9.5","chapterTitle":"Painting and decorating","part":"Finishes","question":"What is the minimum number of coats of varnish that should be applied to interior surfaces?","options":["Two","Three","Four","Five"],"correct":1,"explanation":"Clause 9.5.5 states varnish should be applied with a minimum of three coats on interior surfaces; on exterior surfaces the use of clear varnishes should be avoided due to their short service life.","ref":"9.5.5"},{"id":"9.5-04","chapter":"9.5","chapterTitle":"Painting and decorating","part":"Finishes","question":"Before a decorative finish is applied to galvanized steel, what preparation does the standard describe?","options":["Suitable preparation with a mordant wash","Blast cleaning back to bright metal","Rubbing down with wire wool and white spirit","Application of two coats of red oxide primer"],"correct":0,"explanation":"Clause 9.5.6 states decorative finishes may be applied to galvanized steel following suitable preparation with a mordant wash.","ref":"9.5.6"},{"id":"9.5-05","chapter":"9.5","chapterTitle":"Painting and decorating","part":"Finishes","question":"When decorating plaster and plasterboard surfaces, what is the minimum number of coats of paint that should be applied?","options":["One","Two","Three","Four"],"correct":1,"explanation":"Clause 9.5.7.2 states a minimum of two coats of paint should be applied to plaster and plasterboard surfaces, after joints are completed, imperfections filled and the surface stabilised.","ref":"9.5.7.2"},{"id":"9.5-06","chapter":"9.5","chapterTitle":"Painting and decorating","part":"Finishes","question":"A decorator is wallpapering a wall that has electrical switch plates. How should the wallpaper be finished around them?","options":["Cut the paper neatly to the edge of the switch plate and seal with clear adhesive","Overlap the paper onto the face of the switch plate by a few millimetres","Leave a 5mm gap around the switch plate to allow for movement","Temporarily remove the switch plate and trim the paper accurately so it tucks behind the fitting"],"correct":3,"explanation":"Clause 9.5.8 states electrical switch plates should be temporarily removed and the papering accurately trimmed so that it will tuck behind the fitting upon completion.","ref":"9.5.8"},{"id":"10.1-01","chapter":"10.1","chapterTitle":"Garages","part":"External works","question":"An unreinforced edge thickened concrete slab is being used as the foundation for a detached garage. What is the maximum dimension in any direction before movement joints must be provided?","options":["3m","4.5m","6m","9m"],"correct":2,"explanation":"Clause 10.1.3.3 states unreinforced concrete slabs should have dimensions not exceeding 6m in any direction; for dimensions greater than this, movement joints should be provided.","ref":"10.1.3.3"},{"id":"10.1-02","chapter":"10.1","chapterTitle":"Garages","part":"External works","question":"You are casting an unreinforced ground-bearing floor slab in a double garage. Above what floor area must the slab either be reinforced or divided into smaller bays with construction joints?","options":["10m2","16m2","20m2","25m2"],"correct":1,"explanation":"Clause 10.1.4.7 states that if the floor area of a garage exceeds 16m2, either the slab should be reinforced or construction joints provided which equally divide the floor into bays of less than 16m2.","ref":"10.1.4.7"},{"id":"10.1-03","chapter":"10.1","chapterTitle":"Garages","part":"External works","question":"In a single leaf garage wall over 2.5m long that requires piers, what is the maximum spacing of piers at intermediate positions?","options":["1.5m","2m","2.5m","3m"],"correct":3,"explanation":"Clause 10.1.5.1 states piers in single leaf walls should be located at intermediate centres not exceeding 3m, as well as at corners and either side of a major opening such as a garage door.","ref":"10.1.5.1"},{"id":"10.1-04","chapter":"10.1","chapterTitle":"Garages","part":"External works","question":"Where a garage flat roof needs holding-down straps to prevent uplift, what is the maximum spacing of the straps where the roof members bear on the supporting wall?","options":["1.5m","2m","2.5m","3m"],"correct":1,"explanation":"Clause 10.1.9.1 requires holding-down straps at not more than 2m centres where the roof members bear on the supporting wall, to prevent uplift.","ref":"10.1.9.1"},{"id":"10.1-05","chapter":"10.1","chapterTitle":"Garages","part":"External works","question":"A masonry garage gable is built from aerated concrete blocks. Unless the design states otherwise, what restraint strapping is required at the gable?","options":["Two straps per roof slope at maximum 2m centres plus one near the apex","Three straps per roof slope at maximum 2m centres","Two straps per roof slope at maximum 1.5m centres","Three straps per roof slope at maximum 1.5m centres"],"correct":3,"explanation":"Clause 10.1.9.3 states that for walls of perforated bricks/blocks or concrete/aerated concrete blocks, three restraint straps per roof slope at maximum 1.5m centres are required; two straps at 2m centres plus one near the apex applies to solid bricks.","ref":"10.1.9.3"},{"id":"10.1-06","chapter":"10.1","chapterTitle":"Garages","part":"External works","question":"What does the standard say about water services in a garage?","options":["A rising main should not be located within a garage","A rising main may be located in a garage provided it is insulated","A water outlet in a garage does not need provision for draining down","Pipes in an attached garage do not need insulating"],"correct":0,"explanation":"Clause 10.1.11.1 states a rising main should not be located within a garage, and that any water supply or outlet in a garage should have adequate provision for isolating and draining down, with pipes insulated to minimise the risk of freezing.","ref":"10.1.11.1"},{"id":"10.2-01","chapter":"10.2","chapterTitle":"Drives, paths and landscaping","part":"External works","question":"A gabion wall is proposed on site to provide support to a new private drive. What does the standard say about this?","options":["Flexible retaining walls such as gabions should not be used to support homes, garages, roads, drives, car parking areas or drainage systems","Gabions may support drives provided they are less than 600mm high","Gabions may support drives if backfilled with clean crushed rock","Gabions may support drives but not roads or car parking areas"],"correct":0,"explanation":"Clause 10.2.3 states flexible retaining walls such as gabion and timber structures should not be used to provide support to homes, garages, roads, drives, car parking areas or drainage systems.","ref":"10.2.3"},{"id":"10.2-02","chapter":"10.2","chapterTitle":"Drives, paths and landscaping","part":"External works","question":"Above what height must all retaining structures be designed by an engineer in accordance with Technical Requirement R5?","options":["450mm","600mm","900mm","1,200mm"],"correct":1,"explanation":"Clause 10.2.4 requires all retaining structures more than 600mm high to be designed by an engineer in accordance with Technical Requirement R5.","ref":"10.2.4"},{"id":"10.2-03","chapter":"10.2","chapterTitle":"Drives, paths and landscaping","part":"External works","question":"Where guarding is needed at a retaining structure, what is its minimum height?","options":["900mm","1,000mm","1,100mm","1,200mm"],"correct":2,"explanation":"Clause 10.2.5 states guarding should be a minimum of 1,100mm high, not be readily climbable by children and not allow a 100mm diameter sphere to pass through.","ref":"10.2.5"},{"id":"10.2-04","chapter":"10.2","chapterTitle":"Drives, paths and landscaping","part":"External works","question":"A new drive abuts the home. How far below the DPC should the drive surface be, assuming no channel or other means of collection is provided?","options":["75mm","100mm","150mm","225mm"],"correct":2,"explanation":"Clause 10.2.6.1 states that where drives, paths or paved areas abut the home they should be at least 150mm below the DPC and laid to fall away from the home, unless a channel or other suitable means of collection and disposal is provided.","ref":"10.2.6.1"},{"id":"10.2-05","chapter":"10.2","chapterTitle":"Drives, paths and landscaping","part":"External works","question":"What is the maximum gradient permitted for private roads, shared private drives and private drives?","options":["1:4","1:6","1:8","1:10"],"correct":1,"explanation":"Clause 10.2.6.1 states private roads, shared private drives and private drives should have a maximum gradient of 1:6, with suitable transition lengths where the gradient is more than 1:10 and changes.","ref":"10.2.6.1"},{"id":"10.2-06","chapter":"10.2","chapterTitle":"Drives, paths and landscaping","part":"External works","question":"In a concrete house path, what is the maximum spacing of movement joints across the full width of the path?","options":["4m","5m","6m","8m"],"correct":0,"explanation":"Clause 10.2.6.5 states movement joints, not less than 10mm wide, should be provided across the full width of the path at not more than 4m centres.","ref":"10.2.6.5"},{"id":"10.2-07","chapter":"10.2","chapterTitle":"Drives, paths and landscaping","part":"External works","question":"Where a garden is to be finished in turf or seeding, what minimum thickness of topsoil should be provided?","options":["100mm","150mm","200mm","250mm"],"correct":0,"explanation":"Clause 10.2.9.3 states that where gardens are to be finished in turf or seeding, a minimum thickness of 100mm topsoil should be provided, suitable for general landscape purposes and free of hazardous contaminants.","ref":"10.2.9.3"},{"id":"10.2-08","chapter":"10.2","chapterTitle":"Drives, paths and landscaping","part":"External works","question":"Timber decking is planned at more than 600mm above ground level. What does the standard require for its design?","options":["It only needs to be built from naturally durable timber","It must always be limited to 600mm above ground level","It may be built to the decking supplier's standard details without further checks","It should follow guidance published by the Timber Decking and Cladding Association, or be designed by an engineer to Technical Requirement R5"],"correct":3,"explanation":"Clause 10.2.10 states decking more than 600mm above ground level should be in accordance with guidance published by the Timber Decking and Cladding Association (TDCA), or designed by an engineer in accordance with Technical Requirement R5.","ref":"10.2.10"},{"id":"11.1-01","chapter":"11.1","chapterTitle":"MMC systems: general requirements","part":"Modern Methods of Construction","question":"How far in advance of works starting on site should the System Manual and supporting design information be issued to NHBC?","options":["Four weeks","Six weeks","Eight weeks","Twelve weeks"],"correct":2,"explanation":"Clause 11.1.3 states that a System Manual and supporting design information should be issued to NHBC at least eight weeks in advance of the works starting on site, in accordance with NHBC rules.","ref":"11.1.3"},{"id":"11.1-02","chapter":"11.1","chapterTitle":"MMC systems: general requirements","part":"Modern Methods of Construction","question":"An MMC system manufacturer must operate under a Quality Management System certified to which standard?","options":["ISO 14001:2015, certified by any independent auditor","ISO 9001:2015, certified by a UKAS accredited independent certification body","ISO 45001:2018, certified by a UKAS accredited independent certification body","BS EN 1090, certified by NHBC System Review"],"correct":1,"explanation":"Clause 11.1.4 requires MMC systems to be supplied by a manufacturer operating under a QMS certified by a UKAS accredited, independent certification body in accordance with ISO 9001:2015.","ref":"11.1.4"},{"id":"11.1-03","chapter":"11.1","chapterTitle":"MMC systems: general requirements","part":"Modern Methods of Construction","question":"As a minimum, what information should the Unit Identification Number (UIN) on an MMC unit indicate?","options":["The production number, unit descriptor, and date and place of manufacture","The site address, plot number and date of delivery to site","The manufacturer's name, system name and document revision number","The unit weight, lifting point positions and maximum stacking height"],"correct":0,"explanation":"Clause 11.1.4.2 states that as a minimum the UIN should indicate the production number, unit descriptor (unit type and variant), and date and place of manufacture.","ref":"11.1.4.2"},{"id":"11.1-04","chapter":"11.1","chapterTitle":"MMC systems: general requirements","part":"Modern Methods of Construction","question":"MMC units formed from steel should be manufactured and installed in accordance with the relevant parts of which standard?","options":["BS 8103","BS EN 1990","BS 6093","BS EN 1090"],"correct":3,"explanation":"Clause 11.1.4.1 states that units formed from steel should be manufactured and installed in accordance with the relevant parts of BS EN 1090.","ref":"11.1.4.1"},{"id":"11.1-05","chapter":"11.1","chapterTitle":"MMC systems: general requirements","part":"Modern Methods of Construction","question":"Where units are stacked on top of each other during storage, what should the System Manual define?","options":["The maximum wind speed at which stacking of units is permitted on site","The maximum stacking height of units and the method of temporary unit connections","The minimum clear spacing between stacks and the required crane capacity","The maximum storage duration and the sequence in which units are delivered"],"correct":1,"explanation":"Clause 11.1.5.1 states the System Manual should define the maximum stacking height of units and the method of temporary unit connections (for volumetric units) to ensure effective load transfer and resistance to sliding.","ref":"11.1.5.1"},{"id":"11.1-06","chapter":"11.1","chapterTitle":"MMC systems: general requirements","part":"Modern Methods of Construction","question":"On site you notice rainwater ponding on the tops of installed volumetric units. How does the standard require the tops of volumetric units to be designed?","options":["With adequate falls to avoid standing water, directing water away from unit joints and cavities","Perfectly level, with water removed by mopping or wet vacuum before the next lift","With a permanent central outlet discharging into the internal soil stack","With a 25mm upstand at all edges to hold water away from the joints"],"correct":0,"explanation":"Clause 11.1.5.2 states the tops of volumetric units should be designed with adequate falls to avoid the risk of standing water, with water directed away from unit joints and cavities and temporary drainage provided.","ref":"11.1.5.2"},{"id":"11.1-07","chapter":"11.1","chapterTitle":"MMC systems: general requirements","part":"Modern Methods of Construction","question":"Factory installed gypsum plasterboard linings show facing paper delamination and mould growth caused by construction moisture during storage. What does the standard require?","options":["Allow the boards to dry out fully, then treat with a fungicidal wash and redecorate","Seal the affected areas with a stain-block primer and overboard with a new layer","Remove and replace the boards in accordance with the plasterboard manufacturer's recommendations and check the supporting structure","Replace only the individual boards where mould is visible and monitor the remainder"],"correct":2,"explanation":"Clause 11.1.5.2 states that factory installed gypsum linings showing signs of facing paper delamination or mould growth due to construction moisture should be removed and replaced in accordance with plasterboard manufacturers recommendations, and the supporting structure checked.","ref":"11.1.5.2"},{"id":"11.1-08","chapter":"11.1","chapterTitle":"MMC systems: general requirements","part":"Modern Methods of Construction","question":"What minimum experience must an NHBC registered MMC certifier have as a suitably qualified civil or structural engineer?","options":["One year's experience in offsite construction generally","Three years' experience in the use of the particular MMC system or in its main components","Five years' experience in the use of any MMC system","Ten years' experience in structural engineering design"],"correct":1,"explanation":"Clause 11.1.7 states MMC certifiers should be a suitably qualified civil or structural engineer with a minimum of three years' experience in the use of a particular MMC system or in the main components of the MMC system.","ref":"11.1.7"},{"id":"11.1-09","chapter":"11.1","chapterTitle":"MMC systems: general requirements","part":"Modern Methods of Construction","question":"Who should design medium-rise MMC building structures of over three storeys high?","options":["The manufacturer's in-house design team in accordance with BS 8103","An NHBC registered MMC certifier","An engineer in accordance with Technical Requirement R5","An independent technical approvals authority"],"correct":2,"explanation":"Clause 11.1.6.1 states that medium-rise building structures of over three storeys high should be designed by an engineer in accordance with Technical Requirement R5.","ref":"11.1.6.1"},{"id":"11.1-10","chapter":"11.1","chapterTitle":"MMC systems: general requirements","part":"Modern Methods of Construction","question":"Under the NHBC system risk categories for verification, which risk category applies to volumetric apartment buildings and buildings above 4 storeys?","options":["Risk category 1","Risk category 2","Risk category 3","Risk category 4"],"correct":3,"explanation":"Clause 11.1.10 (Table 3) assigns risk category 4 to volumetric apartment buildings and buildings above 4 storeys; volumetric houses up to 4 storeys are risk category 3.","ref":"11.1.10"},{"id":"11.1-11","chapter":"11.1","chapterTitle":"MMC systems: general requirements","part":"Modern Methods of Construction","question":"Before joints between units or temporary openings are sealed, what should installers check?","options":["All cavities are dry, insulation is complete, surfaces are clean and dry, and cavity barriers and fire-stops have been installed","The external cladding is complete, scaffolding is struck, and services have been commissioned","The units have been loaded with at least one storey above to close up the joints","The sealant has been tested on site and the weather forecast is dry for 48 hours"],"correct":0,"explanation":"Clause 11.1.9.5 states that before joints between units or temporary openings are sealed, installers should ensure all cavities are dry, insulation is complete, all surfaces are clean and dry, and cavity barriers and fire-stops have been installed.","ref":"11.1.9.5"},{"id":"11.2-01","chapter":"11.2","chapterTitle":"Closed panel systems","part":"Modern Methods of Construction","question":"A timber frame wall panel arrives on site with studs, sheathing, insulation between the studs and a factory fitted non-transparent air and vapour control layer. How will NHBC categorise this system?","options":["Open panel, because the insulation is only fitted between the studs","Open panel, because no internal linings or external cladding are fitted","Closed panel, because any factory fitted insulation makes a panel closed","Closed panel, because the air and vapour control layer is non-transparent"],"correct":3,"explanation":"The definitions in Chapter 11.2 state that if a non-transparent AVCL is used the system will be considered by NHBC as closed panel; open panels may include insulation between studs and a transparent AVCL so the construction can be viewed on site.","ref":"11.2 (Introduction)"},{"id":"11.2-02","chapter":"11.2","chapterTitle":"Closed panel systems","part":"Modern Methods of Construction","question":"What minimum clear cavity width should be provided between the insulation and render on a board background cladding?","options":["15mm","25mm","50mm","75mm"],"correct":1,"explanation":"Clause 11.2.8.1 (Table 1) requires a minimum cavity width of 25mm for render on board background cladding; masonry cladding requires 50mm.","ref":"11.2.8.1"},{"id":"11.2-03","chapter":"11.2","chapterTitle":"Closed panel systems","part":"Modern Methods of Construction","question":"On a SIP wall system, how should lifting holes be treated once panels are in position?","options":["Filled and sealed using a material providing the same level of protection as the material removed","Left open to provide ventilation to the panel core","Filled with general purpose expanding polyurethane foam","Covered externally with a patch of breather membrane"],"correct":0,"explanation":"Clause 11.2.5.1 states that lifting holes in SIPs should be filled and sealed using a material providing the same level of protection as the material removed.","ref":"11.2.5.1"},{"id":"11.2-04","chapter":"11.2","chapterTitle":"Closed panel systems","part":"Modern Methods of Construction","question":"The lowest timber of a closed panel timber frame wall should normally be 150mm above finished ground level. Where the site is not subject to a high water table and the cavity will not have standing water, to what may this be reduced?","options":["50mm","60mm","75mm","100mm"],"correct":2,"explanation":"Clause 11.2.8.2 states the lowest timber should be a minimum of 150mm above finished ground level, which may be reduced to 75mm where the site is not subject to a high water table or where the cavity will not have standing water.","ref":"11.2.8.2"},{"id":"11.2-05","chapter":"11.2","chapterTitle":"Closed panel systems","part":"Modern Methods of Construction","question":"Where factory installed lightweight claddings extend to the edges of panels, what is the maximum deviation from plumb or level permitted in the overall interface joint between units?","options":["5mm","6mm","8mm","10mm"],"correct":0,"explanation":"Clause 11.2.11.4 states cladding interfaces should have a maximum of 5mm from plumb or level in the overall interface joint between units, unless specified otherwise by the design.","ref":"11.2.11.4"},{"id":"11.2-06","chapter":"11.2","chapterTitle":"Closed panel systems","part":"Modern Methods of Construction","question":"At junctions between adjoining floor cassettes, what is the maximum level difference permitted between floor decking at any position?","options":["5mm","4mm","3mm","2mm"],"correct":3,"explanation":"Clause 11.2.10 states cassette junctions should not exceed 2mm level difference between floor decking at any position, and should have a nominal 3mm gap at decking joints filled or covered.","ref":"11.2.10"},{"id":"11.2-07","chapter":"11.2","chapterTitle":"Closed panel systems","part":"Modern Methods of Construction","question":"What does the standard require for joints in air and vapour control membranes?","options":["50mm minimum laps, located wherever is most convenient","100mm minimum laps, located on studs or noggings","100mm minimum laps, located mid-way between studs","150mm minimum laps, located on the base rail only"],"correct":1,"explanation":"Clause 11.2.13 states joints in air and vapour control membranes should have 100mm minimum laps and be located on studs or noggings.","ref":"11.2.13"},{"id":"11.2-08","chapter":"11.2","chapterTitle":"Closed panel systems","part":"Modern Methods of Construction","question":"For closed panel timber frame and SIPs incorporating structural timber, what moisture content should all structural timber elements have before internal AVCLs, insulation or plasterboard linings are installed?","options":["Less than 16%","Less than 18%","Less than 20%","Less than 24%"],"correct":2,"explanation":"Clause 11.2.13 states that all structural timber elements (including the OSB of the SIP, if applicable) should have a moisture content of less than 20% before any internal AVCLs, insulation or plasterboard linings are installed.","ref":"11.2.13"},{"id":"11.2-09","chapter":"11.2","chapterTitle":"Closed panel systems","part":"Modern Methods of Construction","question":"What minimum laps should breather membranes have at horizontal and vertical joints?","options":["75mm at horizontal joints and 100mm at vertical joints","100mm at horizontal joints and 100mm at vertical joints","150mm at horizontal joints and 150mm at vertical joints","100mm at horizontal joints and 150mm at vertical joints"],"correct":3,"explanation":"Clause 11.2.14 states breather membranes should be lapped to a minimum of 100mm at horizontal joints and a minimum of 150mm at vertical joints.","ref":"11.2.14"},{"id":"11.2-10","chapter":"11.2","chapterTitle":"Closed panel systems","part":"Modern Methods of Construction","question":"What is the minimum density of wall ties required for masonry cladding to closed panel systems?","options":["3.7 ties/m2, eg spaced at a maximum of 600mm horizontally and 450mm vertically","2.5 ties/m2, eg spaced at a maximum of 900mm horizontally and 450mm vertically","4.4 ties/m2, eg spaced at a maximum of 450mm horizontally and 450mm vertically","5.0 ties/m2, eg spaced at a maximum of 450mm horizontally and 300mm vertically"],"correct":0,"explanation":"Clause 11.2.16 states wall ties should be installed at a minimum density of 3.7 ties/m2 for masonry cladding, eg spaced at a maximum of 600mm horizontally and 450mm vertically.","ref":"11.2.16"},{"id":"11.3-01","chapter":"11.3","chapterTitle":"Volumetric systems","part":"Modern Methods of Construction","question":"Who should design the connections between volumetric units?","options":["The manufacturer's factory production team","A Structural Engineer in accordance with Technical Requirement R5","An NHBC registered volumetric frame certifier","The installer, following the Installation Manual"],"correct":1,"explanation":"Clause 11.3.3.2 states connections between volumetric units should be designed by a Structural Engineer in accordance with Technical Requirement R5.","ref":"11.3.3.2"},{"id":"11.3-02","chapter":"11.3","chapterTitle":"Volumetric systems","part":"Modern Methods of Construction","question":"A design proposes bedding volumetric units directly on the supporting slab, relying on their self-weight and friction to resist sliding. What does the standard require?","options":["This is acceptable for buildings up to two storeys","This is acceptable provided the slab is level to within the System Manual tolerances","Adhesive bonding should be added between the unit base and the slab","Units should be mechanically fixed to the slab or foundations and not rely wholly on frictional resistance"],"correct":3,"explanation":"Clause 11.3.3.2 states volumetric units should be mechanically fixed to the supporting slab or foundations and should not rely wholly on frictional resistance to resist sliding.","ref":"11.3.3.2"},{"id":"11.3-03","chapter":"11.3","chapterTitle":"Volumetric systems","part":"Modern Methods of Construction","question":"How may the overall stability of a building formed from volumetric units be provided?","options":["By the fully braced volumetric units, or by connection to an independent bracing system such as a building core, shear walls or stability frames","By diaphragm action of the external cladding alone","By the frictional interlock between stacked units","By tying the units into a masonry outer leaf at each storey"],"correct":0,"explanation":"Clause 11.3.3.1 states overall stability should be provided by either the fully braced volumetric units or connection to an independent bracing system such as a building core, shear walls and/or stability frame(s).","ref":"11.3.3.1"},{"id":"11.3-04","chapter":"11.3","chapterTitle":"Volumetric systems","part":"Modern Methods of Construction","question":"At compartment walls, where should fire-stopping be provided at the base of volumetric units?","options":["Only where the cavity exceeds 25mm in width","At the mid-height of the ground floor units","To seal any gaps between the underside of units and the tops of foundations or substructure walls","Only where a timber frame backing wall is used"],"correct":2,"explanation":"Clause 11.3.5.1 states that at compartment walls fire-stopping should be provided to seal any gaps between the underside of units and the tops of foundations or substructure walls.","ref":"11.3.5.1"},{"id":"11.3-05","chapter":"11.3","chapterTitle":"Volumetric systems","part":"Modern Methods of Construction","question":"Factory installed cavity barriers and fire-stopping may be damaged or dislodged during transport and installation of volumetric units. What should manufacturers and installers allow for?","options":["Replacement of all cavity barriers with site installed barriers as standard","Suitable access to inspect and verify concealed cavity barriers and fire-stopping post-installation","A 25% overprovision of cavity barriers in the factory to compensate","Certification of the barriers by the transport company before delivery"],"correct":1,"explanation":"Clause 11.3.5.1 states that as factory installed cavity barriers or fire-stopping may be damaged or dislodged during transportation or installation, manufacturers and installers should allow for suitable access to inspect and verify them post-installation.","ref":"11.3.5.1"},{"id":"11.3-06","chapter":"11.3","chapterTitle":"Volumetric systems","part":"Modern Methods of Construction","question":"How should soil pipes running horizontally through a floor void above or below a habitable room be treated for sound insulation?","options":["Wrapped in at least 25mm of mineral wool (minimum 10kg/m3) and supported clear of the floor decking or ceiling","Wrapped in at least 15mm of mineral wool (minimum 10kg/m3) and clipped to the floor decking","Wrapped in at least 25mm of mineral wool (minimum 33kg/m3) and rested on the ceiling boards","Wrapped in at least 50mm of glass fibre quilt and fixed tight against the joists"],"correct":0,"explanation":"Clause 11.3.6 states all soil pipes running horizontally through a floor void above or below a habitable room should be wrapped in at least 25mm of mineral wool (10kg/m3 minimum) and be adequately supported to avoid contact with the floor decking or ceiling.","ref":"11.3.6"},{"id":"11.3-07","chapter":"11.3","chapterTitle":"Volumetric systems","part":"Modern Methods of Construction","question":"Sound reduction is recommended between bedrooms and rooms containing a WC. In which situation does this NOT apply?","options":["Where the room containing the WC adjoins a study","Where the internal walls are proprietary partitions","Where the WC is on a different storey to the bedroom","Where the WC is an ensuite serving that bedroom"],"correct":3,"explanation":"Clause 11.3.6 requires the recommended sound reduction between bedrooms and rooms that include a WC, except where the WC is an ensuite serving that bedroom.","ref":"11.3.6"},{"id":"11.3-08","chapter":"11.3","chapterTitle":"Volumetric systems","part":"Modern Methods of Construction","question":"For timber frame volumetric structures, how should the shrinkage and associated gap sizes needed to accommodate differential settlement be determined?","options":["By applying the standard allowances for platform timber frame in Clause 6.2.8","By using the manufacturer's rule of thumb of 6mm per storey","By specialist calculation","By measurement on site after the first heating season"],"correct":2,"explanation":"Clause 11.3.7 states that for timber frame volumetric structures the shrinkage and associated gap sizes to accommodate differential settlement should be subject to specialist calculation, as shrinkage can exceed that of traditional platform framed buildings.","ref":"11.3.7"},{"id":"11.3-09","chapter":"11.3","chapterTitle":"Volumetric systems","part":"Modern Methods of Construction","question":"For light steel frame volumetric walls, locally raised ground levels (up to the internal floor finish) to accommodate level thresholds can be accepted up to what proportion of the external perimeter of an individual building?","options":["Less than 10%","Less than 15%","Less than 20%","Less than 25%"],"correct":1,"explanation":"Clause 11.3.8.2 states locally raised ground levels to less than 15% of the external perimeter (of an individual building, measured on plan) to accommodate level thresholds can be accepted, with the cavity kept clear and draining.","ref":"11.3.8.2"},{"id":"11.3-10","chapter":"11.3","chapterTitle":"Volumetric systems","part":"Modern Methods of Construction","question":"What minimum clear cavity width should be provided between the insulation and masonry cladding on a volumetric system?","options":["25mm","40mm","50mm","75mm"],"correct":2,"explanation":"Clause 11.3.8.1 (Table 1) requires a minimum cavity width of 50mm between the cladding and insulation where masonry cladding is used.","ref":"11.3.8.1"},{"id":"11.3-11","chapter":"11.3","chapterTitle":"Volumetric systems","part":"Modern Methods of Construction","question":"Where staircases are factory installed into volumetric units, how should the top nosing of the staircase be positioned?","options":["Set 5mm below the floor decking to allow for shrinkage","Proud of the floor decking by up to 3mm to protect the decking edge","Set back from the decking edge and left loose until final fix","Level with the floor decking and fixed firmly"],"correct":3,"explanation":"Clause 11.3.13 states the top nosing of staircases should be level with the floor decking and fixed firmly.","ref":"11.3.13"},{"id":"11.3-12","chapter":"11.3","chapterTitle":"Volumetric systems","part":"Modern Methods of Construction","question":"Prefabricated wiring systems in volumetric units should be tested and installed in accordance with which standard?","options":["BS 7671","BS 8488","BS 6398","BS EN 13859"],"correct":1,"explanation":"Clause 11.3.18.1 states prefabricated wiring systems should be tested and installed in accordance with BS 8488, with the manufacturer detailing which connectors should remain accessible for inspection, testing and maintenance.","ref":"11.3.18.1"},{"id":"11.3-13","chapter":"11.3","chapterTitle":"Volumetric systems","part":"Modern Methods of Construction","question":"Where factory installed lightweight claddings extend to the edges of units, what is the maximum deviation from the nominal design width of the interface joint in any unit edge width or height up to 3m?","options":["Plus or minus 3mm","Plus or minus 5mm","Plus or minus 6mm","Plus or minus 10mm"],"correct":2,"explanation":"Clause 11.3.11.4 states cladding interfaces should be adequately straight in elevation, with a maximum plus or minus 6mm deviation from the nominal design width in any unit edge width or height up to 3m.","ref":"11.3.11.4"},{"id":"6.2-15","chapter":"6.2","chapterTitle":"External timber framed walls","part":"Superstructure (excluding roofs)","question":"Where masonry cladding is used on a timber frame, where may additional studs be required in the wall panels?","options":["At corners only, to support the cavity barriers","At openings and vertical movement joints, to fix wall ties","At floor zones, to carry the ring beam","At gable panels, to support the verge trusses"],"correct":1,"explanation":"Clause 6.2.4.1 states that where masonry cladding is used, additional studs may be required at openings and vertical movement joints to fix wall ties.","ref":"6.2.4.1"},{"id":"6.2-16","chapter":"6.2","chapterTitle":"External timber framed walls","part":"Superstructure (excluding roofs)","question":"When shotfiring the sole plate into masonry, what minimum crushing strength should the solid concrete blocks positioned to receive the fixings have?","options":["2.9N/mm²","3.6N/mm²","7.3N/mm²","10.4N/mm²"],"correct":2,"explanation":"Clause 6.2.5 states that where shotfiring into masonry, solid concrete blocks should be specified as BS EN 771 with a minimum crushing strength of 7.3N/mm² and positioned to receive the fixings.","ref":"6.2.5"},{"id":"6.2-17","chapter":"6.2","chapterTitle":"External timber framed walls","part":"Superstructure (excluding roofs)","question":"How does the standard permit a prefabricated chimney on a timber framed home to be supported?","options":["By the masonry cladding, or by the timber frame including any roof construction supported by the frame","Only by an independent steel frame taken down to the foundations","Only by a masonry stack isolated from both the frame and the cladding","By proprietary brackets fixed directly to the sheathing boards"],"correct":0,"explanation":"Clause 6.2.4.7 states prefabricated chimneys should be supported by masonry cladding, or by the timber frame, including any roof construction supported by the timber frame.","ref":"6.2.4.7"},{"id":"6.2-18","chapter":"6.2","chapterTitle":"External timber framed walls","part":"Superstructure (excluding roofs)","question":"With masonry cladding and solid timber floor joists, what differential movement gap should be provided at second floor level in the absence of project-specific calculations?","options":["15mm","20mm","25mm","35mm"],"correct":3,"explanation":"Table 1 in Clause 6.2.8 gives an opening and closing gap of 35mm at second floor level for solid timber joists with masonry cladding; 25mm is the figure for engineered I-joists at that level.","ref":"6.2.8","table":"ch62-t1"},{"id":"6.2-19","chapter":"6.2","chapterTitle":"External timber framed walls","part":"Superstructure (excluding roofs)","question":"A timber frame building with masonry cladding uses solid timber floor joists. What is required for the differential movement gap at fourth floor level?","options":["A 45mm opening and closing gap","A 53mm opening and closing gap","A 61mm opening and closing gap","Specialist calculations to be submitted to NHBC"],"corre
