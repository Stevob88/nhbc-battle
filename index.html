reas of very severe exposure in England and Wales, what residual cavity is required with partial fill insulation where the outer leaf is fair faced masonry?","options":["50mm","65mm","75mm","100mm"],"correct":2,"explanation":"Clause 6.1.7.4 states that in areas of very severe exposure in England and Wales, a residual cavity of 75mm is required where the outer leaf is fair faced masonry.","ref":"6.1.7.4","why":"Fair-faced (unrendered) brick or block lets more wind-driven rain through the joints than a clad wall, so in the wettest exposure zone a wider residual gap is needed to stop that water reaching and dampening the inner leaf.","source":"NHBC Standards 2026","sourceShort":"NHBC","refLabel":"Clause"},{"id":"6.1-13","chapter":"6.1","chapterTitle":"External masonry walls","part":"Superstructure (excluding roofs)","question":"For a fair faced masonry wall in a very severe exposure area, what is the minimum thickness of built-in full fill cavity insulation?","options":["75mm","100mm","125mm","150mm"],"correct":3,"explanation":"Table 2 in Clause 6.1.7.4 requires a minimum built-in insulation thickness of 150mm for fair faced masonry in the very severe exposure category; fair faced masonry with full cavity insulation is not permitted there in cavity widths of less than 150mm.","ref":"6.1.7.4","why":"In the harshest exposure, fair-faced masonry alone can let driving rain through, so the standard only allows full-fill insulation with a genuinely wide, well-insulated cavity - anything thinner risks moisture bridging straight to the inner leaf.","source":"NHBC Standards 2026","sourceShort":"NHBC","refLabel":"Clause"},{"id":"6.1-14","chapter":"6.1","chapterTitle":"External masonry walls","part":"Superstructure (excluding roofs)","question":"What minimum compressive strength of concrete block could be used for one- and two-storey homes?","options":["2.9N/mm²","3.6N/mm²","7.3N/mm²","10.4N/mm²"],"correct":0,"explanation":"Clause 6.1.8.1 states that for one- and two-storey homes, blocks with a minimum compressive strength of 2.9N/mm² could be used; 7.3N/mm² blocks are required for certain parts of three-storey homes or those with storey heights over 2.7m.","ref":"6.1.8.1","why":"Low-rise homes carry much less load down through the walls, so a lower-strength, often lighter and better-insulating block is perfectly adequate; specifying stronger blocks than needed just adds cost with no structural benefit.","source":"NHBC Standards 2026","sourceShort":"NHBC","refLabel":"Clause"},{"id":"6.1-15","chapter":"6.1","chapterTitle":"External masonry walls","part":"Superstructure (excluding roofs)","question":"Concrete blocks used in the outer leaf without protective cladding or render should meet which requirement?","options":["Compressive strength of at least 2.9N/mm² or density of at least 1,200kg/m³","Compressive strength greater than 3.6N/mm² or density of at least 1,350kg/m³","Compressive strength greater than 7.3N/mm² or density of at least 1,500kg/m³","Compressive strength greater than 10.4N/mm² regardless of density"],"correct":2,"explanation":"Clause 6.1.8.2 states concrete blocks used in the outer leaf without protective cladding or render should have a compressive strength greater than 7.3N/mm² or a density of at least 1,500kg/m³, be made with dense aggregate, or be aircrete blocks with suitability confirmed by the manufacturer.","ref":"6.1.8.2","why":"A block left exposed on the outer face, with no render or cladding to shield it, gets repeatedly soaked and frozen; a denser or stronger block resists that saturation and won't crack or crumble from frost attack.","source":"NHBC Standards 2026","sourceShort":"NHBC","refLabel":"Clause"},{"id":"6.1-16","chapter":"6.1","chapterTitle":"External masonry walls","part":"Superstructure (excluding roofs)","question":"What minimum compressive strength of clay brick is acceptable for a three-storey home?","options":["7.3N/mm²","9N/mm²","13N/mm²","22N/mm²"],"correct":2,"explanation":"Clause 6.1.9 states that for three-storey homes, clay bricks to BS EN 771 with a minimum compressive strength of 13N/mm² are acceptable; 9N/mm² is adequate for one- and two-storey homes.","ref":"6.1.9","why":"An extra storey pushes more load down through the brickwork below, so bricks with higher compressive strength are needed to carry it safely without crushing or long-term deformation of the lower courses.","source":"NHBC Standards 2026","sourceShort":"NHBC","refLabel":"Clause"},{"id":"6.1-17","chapter":"6.1","chapterTitle":"External masonry walls","part":"Superstructure (excluding roofs)","question":"A delivery of clay facing bricks arrives on site classified F0,S1. What does the standard say about using them?","options":["They may be used provided sulfate-resisting mortar is specified","They are not acceptable externally unless completely protected by a cladding which can satisfactorily resist the passage of water","They may be used on elevations sheltered from driving rain","They may only be used below DPC level"],"correct":1,"explanation":"Clause 6.1.9 states bricks that are not freeze-/thaw-resistant (F0,S2 or F0,S1 to BS EN 771) are not acceptable for use externally, unless completely protected by a cladding which can satisfactorily resist the passage of water.","ref":"6.1.9","why":"F0 bricks aren't freeze/thaw resistant, so left exposed to rain they will absorb water, freeze and spall or crumble over time; they're only safe externally behind cladding that keeps them dry.","source":"NHBC Standards 2026","sourceShort":"NHBC","refLabel":"Clause"},{"id":"6.1-18","chapter":"6.1","chapterTitle":"External masonry walls","part":"Superstructure (excluding roofs)","question":"Where squared or random rubble stone masonry is used, it should be brought to course at regular intervals of not more than what?","options":["300mm","450mm","600mm","900mm"],"correct":1,"explanation":"Clause 6.1.10 states that where squared or random rubble is used, the stone masonry should be brought to course at regular intervals of not more than 450mm, and bed joints of up to 25mm wide may be acceptable.","ref":"6.1.10","why":"Rubble walling is naturally uneven, so bringing it back to a level course regularly keeps the wall properly bonded and load evenly distributed, stopping it from bulging or losing structural stability as it rises.","source":"NHBC Standards 2026","sourceShort":"NHBC","refLabel":"Clause"},{"id":"6.1-19","chapter":"6.1","chapterTitle":"External masonry walls","part":"Superstructure (excluding roofs)","question":"During construction of a cavity wall, what is the maximum difference in height allowed between the two leaves, provided the ties are sufficiently flexible?","options":["Two block courses","Four block courses","Six block courses","Eight block courses"],"correct":2,"explanation":"Clause 6.1.11.3 states the difference in heights between the two leaves of a cavity wall under construction can be up to six block courses, provided the ties are sufficiently flexible to ensure coursing is achieved without breaking the bond.","ref":"6.1.11.3","why":"If one leaf gets too far ahead, the ties have to stretch or twist too much to reach the other leaf's next course, risking a broken bond, misaligned coursing or ties that can no longer restrain the wall properly.","source":"NHBC Standards 2026","sourceShort":"NHBC","refLabel":"Clause"},{"id":"6.1-20","chapter":"6.1","chapterTitle":"External masonry walls","part":"Superstructure (excluding roofs)","question":"What thickness limits apply to bed and perpend joints made with general purpose mortar, unless the manufacturer recommends otherwise?","options":["Not less than 4mm nor more than 12mm","Not less than 6mm nor more than 15mm","Not less than 8mm nor more than 18mm","Not less than 10mm nor more than 20mm"],"correct":1,"explanation":"Clause 6.1.11.3 states the thickness of bed and perpend joints made with general purpose and lightweight mortars should be not less than 6mm nor more than 15mm unless specific manufacturers recommendations are given.","ref":"6.1.11.3","why":"Joints thinner than 6mm won't fully bed the unit, weakening the wall and letting rain track through hairline gaps; joints thicker than 15mm shrink and crack more and reduce the wall's overall strength.","source":"NHBC Standards 2026","sourceShort":"NHBC","refLabel":"Clause"},{"id":"6.1-21","chapter":"6.1","chapterTitle":"External masonry walls","part":"Superstructure (excluding roofs)","question":"Where courses are corbelled outwards in ordinary masonry without reinforcement, what is the maximum extent of the corbel for a wall of thickness T?","options":["T/6","T/4","T/3","T/2"],"correct":2,"explanation":"Clause 6.1.11.5 shows the maximum corbel as T/3 for both solid and cavity walls; where reinforcing is used, corbels should be designed by an engineer in accordance with Technical Requirement R5.","ref":"6.1.11.5","why":"Beyond this limit the projecting masonry's weight shifts too far past the supporting wall below, and with no reinforcement to hold it, the corbel can become unstable and topple rather than bear safely on friction and self-weight.","source":"NHBC Standards 2026","sourceShort":"NHBC","refLabel":"Clause"},{"id":"6.1-22","chapter":"6.1","chapterTitle":"External masonry walls","part":"Superstructure (excluding roofs)","question":"Horizontal chases for services in a masonry leaf should be limited to what proportion of the depth of the leaf?","options":["1/6","1/4","1/3","1/2"],"correct":0,"explanation":"Clause 6.1.11.6 states chases should be limited to 1/6 of the depth of the leaf where horizontal and 1/3 of the depth where vertical.","ref":"6.1.11.6","why":"Cutting too deep into the wall for pipework removes load-bearing material and can crack the masonry or open a path for damp and sound transmission, so chases are kept shallow enough to leave the wall sound.","source":"NHBC Standards 2026","sourceShort":"NHBC","refLabel":"Clause"},{"id":"6.1-23","chapter":"6.1","chapterTitle":"External masonry walls","part":"Superstructure (excluding roofs)","question":"What is the minimum end bearing length for a simple lintel spanning over 1.2m?","options":["75mm","100mm","150mm","225mm"],"correct":2,"explanation":"Table 5 in Clause 6.1.12 requires a minimum bearing length of 150mm for a simple lintel with a span over 1.2m; 100mm applies only to simple lintels spanning up to 1.2m.","ref":"6.1.12","why":"Longer spans put more load and shear onto the supports, so a longer bearing spreads that force over more masonry, preventing the lintel from slipping off its seat or crushing the brickwork it rests on.","source":"NHBC Standards 2026","sourceShort":"NHBC","refLabel":"Clause"},{"id":"6.1-24","chapter":"6.1","chapterTitle":"External masonry walls","part":"Superstructure (excluding roofs)","question":"What is the maximum overhang of brickwork or masonry permitted beyond the edge of a lintel?","options":["15mm","25mm","40mm","50mm"],"correct":1,"explanation":"Clause 6.1.12.3 states lintels should not have brickwork or masonry which overhangs more than 25mm.","ref":"6.1.12.3","why":"Masonry hanging beyond the lintel edge has nothing solid underneath it and is effectively unsupported, so it can crack away or drop off over time under its own weight and thermal movement.","source":"NHBC Standards 2026","sourceShort":"NHBC","refLabel":"Clause"},{"id":"6.1-25","chapter":"6.1","chapterTitle":"External masonry walls","part":"Superstructure (excluding roofs)","question":"You are building in an area of severe exposure to driving rain. What damp proof protection is required over the lintels?","options":["Combined lintels alone provide sufficient protection in all cases","Cavity trays are only needed over openings wider than 1.2m","A separate cavity tray is only required over steel lintels","A separate cavity tray should be provided over all lintels"],"correct":3,"explanation":"Clause 6.1.12.2 states that in Scotland, Northern Ireland, the Isle of Man and areas of severe or very severe exposure to driving rain, a separate cavity tray should be provided over all lintels.","ref":"6.1.12.2","why":"In wetter areas a lintel's own profile often can't reliably shed all the water that gets into the cavity above an opening, so a dedicated tray is needed to positively direct it back out through weepholes rather than onto the window head.","source":"NHBC Standards 2026","sourceShort":"NHBC","refLabel":"Clause"},{"id":"6.1-26","chapter":"6.1","chapterTitle":"External masonry walls","part":"Superstructure (excluding roofs)","question":"For general wall areas above the DPC in exposure categories other than severe or very severe, what cement:lime:sand mortar mix is recommended for clay bricks?","options":["1:½:4½","1:1:4½","1:1:5½","1:2:9"],"correct":2,"explanation":"Table 6 in Clause 6.1.14 recommends a 1:1:5½ cement:lime:sand mix (designation iii, mortar class M4) for general wall areas above the DPC in other exposure categories; 1:½:4½ is the high durability mix for severe or very severe exposure and below DPC.","ref":"6.1.14","why":"General wall areas away from ground saturation don't need the richer sulfate-resisting mix used below DPC or in severe exposure; this weaker mix is durable enough while being less brittle and less prone to shrinkage cracking.","source":"NHBC Standards 2026","sourceShort":"NHBC","refLabel":"Clause"},{"id":"6.1-27","chapter":"6.1","chapterTitle":"External masonry walls","part":"Superstructure (excluding roofs)","question":"A gauge of site-mixed mortar was knocked up mid-morning and is still on the spot boards after lunch. How long after mixing can non-retarded mortar be used?","options":["One hour","Two hours","Three hours","Four hours"],"correct":1,"explanation":"Clause 6.1.14.3 states mortar should be the correct mix and used within two hours, unless it is retarded mortar, and mortar which has started to set should not be retempered.","ref":"6.1.14.3","why":"Mortar starts stiffening soon after mixing as it begins to set; using it past two hours (or adding water to revive it) disrupts the chemical set, weakening the eventual bond and long-term strength of the brickwork.","source":"NHBC Standards 2026","sourceShort":"NHBC","refLabel":"Clause"},{"id":"6.1-28","chapter":"6.1","chapterTitle":"External masonry walls","part":"Superstructure (excluding roofs)","question":"At the base of walls, what is the minimum height of the DPC above adjoining finished ground or paving level?","options":["100mm","150mm","225mm","300mm"],"correct":1,"explanation":"Table 8 and the horizontal DPC guidance in Clause 6.1.17.1 state a DPC should be provided a minimum of 150mm above adjoining surfaces and linked with the DPM in solid floors.","ref":"6.1.17.1","why":"This clearance stops rain splashing up off the ground or standing water bridging over the top of the DPC, which would otherwise let rising damp track up into the wall above it.","source":"NHBC Standards 2026","sourceShort":"NHBC","refLabel":"Clause"},{"id":"6.1-29","chapter":"6.1","chapterTitle":"External masonry walls","part":"Superstructure (excluding roofs)","question":"Where fair faced masonry is supported by lintels, how should weepholes be provided over openings?","options":["At least two per opening, at not more than 450mm intervals","One per opening, at not more than 600mm intervals","At least two per opening, at not more than 900mm intervals","At least three per opening, at not more than 300mm intervals"],"correct":0,"explanation":"Clause 6.1.17.1 states weepholes should be provided at a maximum of 450mm intervals and each opening should have at least two weepholes, with stop ends to cavity trays or combined lintels.","ref":"6.1.17.1","why":"Water that gets into the cavity above an opening collects on the cavity tray; without enough weepholes spaced closely it can pool, track sideways past the stop ends, and eventually penetrate to the inner leaf or stain the brickwork.","source":"NHBC Standards 2026","sourceShort":"NHBC","refLabel":"Clause"},{"id":"6.1-30","chapter":"6.1","chapterTitle":"External masonry walls","part":"Superstructure (excluding roofs)","question":"On a standard strip foundation, the concrete fill in a cavity wall should stop at least how far below the base DPC?","options":["150mm","225mm","300mm","450mm"],"correct":1,"explanation":"Clause 6.1.17.1 states the concrete fill in a cavity wall should stop at least 225mm below the base DPC, which may be reduced to 150mm where special foundations, such as rafts, are used.","ref":"6.1.17.1","why":"Cavity fill acts like a solid bridge across the cavity, so if it's built up too close to the DPC, ground moisture can climb through the concrete and bypass the damp proof course into the structure above.","source":"NHBC Standards 2026","sourceShort":"NHBC","refLabel":"Clause"},{"id":"6.1-31","chapter":"6.1","chapterTitle":"External masonry walls","part":"Superstructure (excluding roofs)","question":"What is the minimum upstand of a cavity tray, measured from the inside face of the outer leaf to the outside of the inner leaf?","options":["100mm","120mm","140mm","150mm"],"correct":2,"explanation":"Clause 6.1.17.1 states cavity trays should have a 140mm minimum upstand from the inside face of the outer leaf to the outside of the inner leaf.","ref":"6.1.17.1","why":"A shallow upstand lets water splash or track over the top edge of the tray back into the cavity or onto the inner leaf, instead of being safely contained and channelled outward through the weepholes.","source":"NHBC Standards 2026","sourceShort":"NHBC","refLabel":"Clause"},{"id":"6.1-32","chapter":"6.1","chapterTitle":"External masonry walls","part":"Superstructure (excluding roofs)","question":"What is the maximum spacing of wall ties in the general wall area of a masonry cavity wall?","options":["450mm horizontally and 225mm vertically","600mm horizontally and 450mm vertically","750mm horizontally and 300mm vertically","900mm horizontally and 450mm vertically"],"correct":3,"explanation":"Table 9 in Clause 6.1.18.1 gives a maximum wall tie spacing in the general wall area of 900mm horizontally and 450mm vertically.","ref":"6.1.18.1","why":"This spacing keeps the two leaves properly linked so they act together against wind suction and pressure; wider spacing risks the outer leaf bowing, cracking or separating from the inner leaf over time.","source":"NHBC Standards 2026","sourceShort":"NHBC","refLabel":"Clause"},{"id":"6.1-33","chapter":"6.1","chapterTitle":"External masonry walls","part":"Superstructure (excluding roofs)","question":"It is a cold morning and the forecast shows temperatures dropping. Below what air temperature should brickwork and blockwork not be built?","options":["3°C and falling","1°C and falling","0°C and falling","5°C and falling"],"correct":0,"explanation":"Clause 6.1.20.1 states brickwork and blockwork should not be built when the air temperature is below 3°C and falling; work can resume when the temperature is 1°C and rising, with the expectation it will exceed 3°C.","ref":"6.1.20.1","why":"Mortar that freezes before it has gained enough strength never fully recovers - the ice damages the setting cement matrix - so work stops before a falling temperature threatens frost damage to fresh, still-green mortar overnight.","source":"NHBC Standards 2026","sourceShort":"NHBC","refLabel":"Clause"},{"id":"6.2-01","chapter":"6.2","chapterTitle":"External timber framed walls","part":"Superstructure (excluding roofs)","question":"Who is required to check the design of a timber frame superstructure and sign the certificate for a home?","options":["An architect experienced in panelised construction, appointed by the builder","The timber frame designer, provided they hold professional indemnity insurance","Any structural engineer from the same practice as the timber frame designer","An NHBC-listed certifier who is a suitably qualified civil or structural engineer with at least three years' timber frame experience, and not the designer"],"correct":3,"explanation":"Clause 6.2.3 requires the timber frame certifier to be on NHBC's list, be a suitably qualified civil or structural engineer with a minimum of three years' experience in timber frame construction, and not be the designer of the frame nor from the same practice.","ref":"6.2.3","why":"Structural mistakes in a timber frame are safety-critical and easily hidden once clad, so an independent qualified engineer who didn't design it is far more likely to catch load-path or bracing errors before they're built in.","source":"NHBC Standards 2026","sourceShort":"NHBC","refLabel":"Clause"},{"id":"6.2-02","chapter":"6.2","chapterTitle":"External timber framed walls","part":"Superstructure (excluding roofs)","question":"What is the minimum width of individual timber studs in a load-bearing timber framed wall?","options":["38mm","44mm","47mm","50mm"],"correct":0,"explanation":"Clause 6.2.4.1 states individual timber studs should have a minimum width of 38mm and a maximum spacing of 600mm, unless other adequate support is provided for wall boards and fixings.","ref":"6.2.4.1","why":"Studs narrower than 38mm don't give enough bearing for fixings or racking capacity, so panels can rack under wind load and wall boards can pull loose from inadequate purchase.","source":"NHBC Standards 2026","sourceShort":"NHBC","refLabel":"Clause"},{"id":"6.2-03","chapter":"6.2","chapterTitle":"External timber framed walls","part":"Superstructure (excluding roofs)","question":"What is the maximum permitted overhang of the sole plate over the supporting structure for standard stud widths?","options":["12mm","15mm","20mm","25mm"],"correct":0,"explanation":"Clause 6.2.4.3 (Figure 2) shows a maximum 12mm overhang of the frame over the supporting structure, increased to 20mm for 140mm wide studs.","ref":"6.2.4.3","why":"An overhang beyond 12mm leaves the sole plate bearing on air rather than the substructure, creating a weak, unsupported edge that can deflect or crack under the wall's load.","source":"NHBC Standards 2026","sourceShort":"NHBC","refLabel":"Clause"},{"id":"6.2-04","chapter":"6.2","chapterTitle":"External timber framed walls","part":"Superstructure (excluding roofs)","question":"On site, the sole plate needs packing to get it level. Packing exceeding what thickness must be agreed between the timber frame manufacturer's engineer and NHBC?","options":["20mm","25mm","30mm","35mm"],"correct":0,"explanation":"Clause 6.2.4.4 states packing exceeding 20mm should be agreed between the timber frame manufacturer's engineer and NHBC; the methods listed are generally acceptable for packing up to 20mm.","ref":"6.2.4.4","why":"Thick packing compresses unevenly under load in ways standard details don't cover, so anything over 20mm needs engineering sign-off to avoid unpredictable settlement or loss of level bearing.","source":"NHBC Standards 2026","sourceShort":"NHBC","refLabel":"Clause"},{"id":"6.2-05","chapter":"6.2","chapterTitle":"External timber framed walls","part":"Superstructure (excluding roofs)","question":"Where holding-down devices are manufactured from galvanized mild steel, what minimum zinc coating is required on each side?","options":["Z275","460g/m²","710g/m²","940g/m²"],"correct":3,"explanation":"Clause 6.2.5 requires holding-down devices to be austenitic stainless steel minimum grade 1.4301, or galvanized mild steel with a zinc coating to BS EN ISO 1461 of minimum 940g/m² on each side; Z275 applies only to sole plate anchors within the internal envelope.","ref":"6.2.5","why":"Holding-down straps resist wind uplift and racking; if the coating is too thin it corrodes over time and the strap loses strength exactly where it can't be inspected or replaced later.","source":"NHBC Standards 2026","sourceShort":"NHBC","refLabel":"Clause"},{"id":"6.2-06","chapter":"6.2","chapterTitle":"External timber framed walls","part":"Superstructure (excluding roofs)","question":"Which grades of oriented strand board are acceptable as sheathing to a timber frame wall panel?","options":["OSB/1 only","OSB/2 only","OSB/2 or OSB/3","OSB/3 or OSB/4"],"correct":3,"explanation":"Clause 6.2.7 lists oriented strand board to BS EN 300 type OSB/3 or OSB/4 as acceptable sheathing materials.","ref":"6.2.7","why":"OSB/3 and OSB/4 are the moisture-resistant grades, needed because sheathing sits inside a wall cavity where damp can reach it; a lower grade would swell or delaminate and lose its racking strength.","source":"NHBC Standards 2026","sourceShort":"NHBC","refLabel":"Clause"},{"id":"6.2-07","chapter":"6.2","chapterTitle":"External timber framed walls","part":"Superstructure (excluding roofs)","question":"With masonry cladding and solid timber floor joists, what differential movement gap should be provided at first floor level in the absence of project-specific calculations?","options":["15mm","20mm","25mm","35mm"],"correct":1,"explanation":"Table 1 in Clause 6.2.8 gives a 20mm opening and closing gap at first floor level for solid timber joists with masonry cladding; 15mm applies to engineered I-joists at that level.","ref":"6.2.8","table":"ch62-t1","why":"As the frame dries it shrinks while the brick skin above expands, so too small a gap lets the brickwork crush down onto the shrinking frame or crack, while too large a gap lets rain track in.","source":"NHBC Standards 2026","sourceShort":"NHBC","refLabel":"Clause"},{"id":"6.2-08","chapter":"6.2","chapterTitle":"External timber framed walls","part":"Superstructure (excluding roofs)","question":"A movement joint should be protected by a cover strip when the expected movement gap exceeds what size?","options":["20mm","25mm","30mm","35mm"],"correct":3,"explanation":"Clause 6.2.8 states joints should be protected by a cover strip where the movement gap/joint is expected to be more than 35mm.","ref":"6.2.8","why":"A wide open movement gap lets wind-driven rain and pests into the wall, so beyond 35mm a cover strip closes the weather line while still sliding freely as the frame keeps shrinking.","source":"NHBC Standards 2026","sourceShort":"NHBC","refLabel":"Clause"},{"id":"6.2-09","chapter":"6.2","chapterTitle":"External timber framed walls","part":"Superstructure (excluding roofs)","question":"What is the minimum cavity width, measured between the cladding and the sheathing, where masonry cladding is used on a timber frame?","options":["15mm","25mm","35mm","50mm nominal"],"correct":3,"explanation":"Table 2 in Clause 6.2.10.1 gives a minimum cavity width of 50mm nominal for masonry cladding; 25mm nominal applies to render on backed lathing and 15mm to other cladding.","ref":"6.2.10.1","why":"A full 50mm cavity behind brickwork stops rain and mortar snots that get past the outer leaf from bridging across to the timber sheathing, where trapped damp causes fungal decay.","source":"NHBC Standards 2026","sourceShort":"NHBC","refLabel":"Clause"},{"id":"6.2-10","chapter":"6.2","chapterTitle":"External timber framed walls","part":"Superstructure (excluding roofs)","question":"Cavity vents between masonry cladding and a timber frame wall should be equivalent to open brick perpend joints at what spacing?","options":["Every 1.2m","Every 1.5m","Every 1.8m","Every 2.4m"],"correct":0,"explanation":"Clause 6.2.10.2 states cavity vents should be equivalent to open brick perpend joints every 1.2m, located to prevent the ingress of rain and to drain moisture from the cavity.","ref":"6.2.10.2","why":"Perpend-sized vents every 1.2m let any moisture that enters the cavity evaporate and drain away; a poorly vented cavity traps damp against the sheathing and starts rot unseen behind the cladding.","source":"NHBC Standards 2026","sourceShort":"NHBC","refLabel":"Clause"},{"id":"6.2-11","chapter":"6.2","chapterTitle":"External timber framed walls","part":"Superstructure (excluding roofs)","question":"On a site not subject to a high water table, how high above finished ground level should sole plates normally be positioned?","options":["At least 150mm, which may be reduced to 75mm where specific conditions are met","At least 75mm in all circumstances","At least 100mm, which may be reduced to 50mm where specific conditions are met","At least 225mm in all circumstances"],"correct":0,"explanation":"Clause 6.2.10.3 states sole plates should be positioned at least 150mm above finished ground level, which may be reduced to 75mm where the site is not subject to a high water table, the cavity will not have standing water, and any radon/gas membrane is not compromised.","ref":"6.2.10.3","why":"Keeping the lowest timber 150mm above ground level puts it clear of rain splash-back and surface water, since timber wetted at that low, hard-to-inspect junction is where decay typically starts.","source":"NHBC Standards 2026","sourceShort":"NHBC","refLabel":"Clause"},{"id":"6.2-12","chapter":"6.2","chapterTitle":"External timber framed walls","part":"Superstructure (excluding roofs)","question":"Where a polyethylene sheet is used as the air and vapour control layer, what is the minimum gauge required?","options":["250 gauge (62.5 micron)","300 gauge (75 micron)","400 gauge (100 micron)","500 gauge (125 micron)"],"correct":3,"explanation":"Clause 6.2.12 requires the air and vapour control layer to be a minimum 500 gauge (125 micron) polyethylene sheet, vapour control plasterboard or a product assessed in accordance with Technical Requirement R3.","ref":"6.2.12","why":"A weak or gappy air and vapour control layer lets warm, moist household air push into the cold cavity where it condenses on the sheathing, causing hidden interstitial condensation and frame decay.","source":"NHBC Standards 2026","sourceShort":"NHBC","refLabel":"Clause"},{"id":"6.2-13","chapter":"6.2","chapterTitle":"External timber framed walls","part":"Superstructure (excluding roofs)","question":"What minimum laps are required at joints in a breather membrane?","options":["50mm on horizontal joints and 100mm on vertical joints","75mm on horizontal joints and 100mm on vertical joints","100mm on horizontal joints and 150mm on vertical joints","150mm on horizontal joints and 225mm on vertical joints"],"correct":2,"explanation":"Clause 6.2.13 requires breather membranes to be lapped with a minimum 100mm overlap on horizontal joints and 150mm on vertical joints, with upper layers over lower layers so rain runs away from the sheathing.","ref":"6.2.13","why":"Correct laps make water that gets past the cladding run down and out over each joint rather than in; an under-lapped breather membrane gives rain a direct route onto the sheathing and frame.","source":"NHBC Standards 2026","sourceShort":"NHBC","refLabel":"Clause"},{"id":"6.2-14","chapter":"6.2","chapterTitle":"External timber framed walls","part":"Superstructure (excluding roofs)","question":"What is the maximum spacing of wall ties connecting masonry cladding to a timber frame wall?","options":["900mm horizontally and 450mm vertically","600mm horizontally and 600mm vertically","450mm horizontally and 300mm vertically","600mm horizontally and 450mm vertically"],"correct":3,"explanation":"Clause 6.2.14 states wall ties should be spaced at a maximum of 600mm horizontally and 450mm vertically, be of austenitic stainless steel, and be fixed to the studs and not the sheathing.","ref":"6.2.14","why":"Wall ties carry wind suction and lateral load from the heavy masonry skin back to the frame; spacing them too far apart lets the brickwork bow or pull away from the frame under wind pressure.","source":"NHBC Standards 2026","sourceShort":"NHBC","refLabel":"Clause"},{"id":"6.3-01","chapter":"6.3","chapterTitle":"Internal walls","part":"Superstructure (excluding roofs)","question":"Where an internal masonry wall is tied rather than bonded to another wall, what is the maximum vertical spacing for expanded metal strips or wall ties?","options":["225mm","300mm","450mm","600mm"],"correct":1,"explanation":"Clause 6.3.4.4 states internal masonry walls should be fully bonded or tied, either with a tooth at alternate courses, or an expanded metal strip or wall tie at a maximum vertical spacing of 300mm.","ref":"6.3.4.4","why":"Ties transfer lateral load between intersecting internal walls so they act together for stability. Space them too far apart and the walls can separate or crack under normal building movement, losing mutual support.","source":"NHBC Standards 2026","sourceShort":"NHBC","refLabel":"Clause"},{"id":"6.3-02","chapter":"6.3","chapterTitle":"Internal walls","part":"Superstructure (excluding roofs)","question":"A lintel in an internal masonry wall spans an opening of 1.5m. What is the minimum length of bearing at each end?","options":["75mm","100mm","150mm","225mm"],"correct":2,"explanation":"Table 2 of Clause 6.3.4.7 requires a minimum bearing of 150mm for spans over 1.2m; 100mm applies only to spans up to 1.2m.","ref":"6.3.4.7","why":"A longer span puts more load on to each end of the lintel, so more bearing area is needed to spread that reaction and stop the masonry below crushing or the lintel slipping off its seating.","source":"NHBC Standards 2026","sourceShort":"NHBC","refLabel":"Clause"},{"id":"6.3-03","chapter":"6.3","chapterTitle":"Internal walls","part":"Superstructure (excluding roofs)","question":"What is the minimum size for individual studs, rails and head binders in an internal load-bearing timber wall?","options":["38mm x 75mm","38mm x 63mm","43mm x 38mm","38mm x 89mm"],"correct":0,"explanation":"Clause 6.3.5.1 states individual studs, rails and head binders should be 38mm x 75mm minimum, although larger sizes may be required to achieve adequate fire resistance.","ref":"6.3.5.1","why":"Undersized studs can bow or fail under the loads from floors and roofs above, and in a fire the outer section chars away, so a bigger minimum ensures enough sound timber remains to keep carrying load.","source":"NHBC Standards 2026","sourceShort":"NHBC","refLabel":"Clause"},{"id":"6.3-04","chapter":"6.3","chapterTitle":"Internal walls","part":"Superstructure (excluding roofs)","question":"What is the maximum moisture content for timber in internal walls at the time of dry lining, to minimise shrinkage?","options":["12%","15%","18%","20%"],"correct":3,"explanation":"Clause 6.3.5.3 states timber should have a maximum moisture content of 20% at the time of dry lining to minimise shrinkage.","ref":"6.3.5.3","why":"Timber boarded over while still wet will keep drying and shrinking behind the plasterboard, opening nail pops, cracked joints and gaps at skirtings once the wall is decorated and hard to fix again.","source":"NHBC Standards 2026","sourceShort":"NHBC","refLabel":"Clause"},{"id":"6.3-05","chapter":"6.3","chapterTitle":"Internal walls","part":"Superstructure (excluding roofs)","question":"At the junction with the roof, how far below the top of the adjacent roof framing should a compartment or separating wall stop?","options":["Approximately 25mm","Approximately 10mm","Approximately 50mm","Approximately 75mm"],"correct":0,"explanation":"Clause 6.3.6.2 states compartment or separating walls should stop approximately 25mm below the top of adjacent roof framing, with soft fire-stopping installed to allow for movement in roof timbers and prevent 'hogging' of the tiles.","ref":"6.3.6.2","why":"Roof timbers move seasonally with moisture and load; a wall built tight up to the rafters can jack them up as they swell, causing tiles to hog and crack, so a gap with soft fire-stopping lets the roof move freely while still sealing against fire spread.","source":"NHBC Standards 2026","sourceShort":"NHBC","refLabel":"Clause"},{"id":"6.3-06","chapter":"6.3","chapterTitle":"Internal walls","part":"Superstructure (excluding roofs)","question":"On site, an electrician wants to cut a vertical chase into one leaf of a masonry separating wall. What is the maximum depth allowed?","options":["1/6 of the thickness of the single leaf","1/4 of the thickness of the single leaf","1/3 of the thickness of the single leaf","1/2 of the thickness of the single leaf"],"correct":2,"explanation":"Clause 6.3.7.1 states vertical chases should not exceed 1/3 of the thickness of the single leaf, while horizontal chases should not exceed 1/6.","ref":"6.3.7.1","why":"Cutting too deep into a leaf removes structural cross-section and can breach the fire and sound separation the wall relies on, weakening it locally and risking cracking or a fire/sound path through the wall.","source":"NHBC Standards 2026","sourceShort":"NHBC","refLabel":"Clause"},{"id":"6.3-07","chapter":"6.3","chapterTitle":"Internal walls","part":"Superstructure (excluding roofs)","question":"A 75mm timber stud partition separates a WC from a bedroom. Using a single layer of 12.5mm plasterboard (10kg/m2 minimum) each side, what else is needed to achieve the required sound reduction?","options":["A 50mm clear air gap between the linings","25mm unfaced mineral wool (10kg/m3 minimum) between the studs","A resilient bar fixed to one side of the studs","9.5mm plasterboard as a second layer on one side"],"correct":1,"explanation":"Clause 6.3.7.2 permits one layer of 12.5mm plasterboard (each sheet 10kg/m2 minimum) on each side with 25mm unfaced mineral wool (10kg/m3 minimum) between the studs, with all joints well sealed; the alternative is two layers of 12.5mm plasterboard each side.","ref":"6.3.7.2","why":"A bare stud partition won't stop enough noise from WC flushing and pipework reaching bedrooms or living rooms; the mineral wool absorbs sound within the cavity so the wall actually meets the acoustic performance occupants need.","source":"NHBC Standards 2026","sourceShort":"NHBC","refLabel":"Clause"},{"id":"6.3-08","chapter":"6.3","chapterTitle":"Internal walls","part":"Superstructure (excluding roofs)","question":"Unless designed otherwise, what is the minimum stud size and maximum spacing for a timber partition wall?","options":["38mm x 75mm studs at 400mm centres","43mm x 38mm studs at 450mm centres","63mm x 50mm studs at 400mm centres","63mm x 38mm studs at 600mm centres"],"correct":3,"explanation":"Table 3 of Clause 6.3.9.2 gives the minimum specification for partition studs as 63mm x 38mm at maximum 600mm centres.","ref":"6.3.9.2","why":"Undersized or widely spaced studs let partitions flex under everyday knocks and door slams, cracking plasterboard joints and skirting lines; this minimum keeps the partition rigid enough for a durable, crack-free finish.","source":"NHBC Standards 2026","sourceShort":"NHBC","refLabel":"Clause"},{"id":"6.3-09","chapter":"6.3","chapterTitle":"Internal walls","part":"Superstructure (excluding roofs)","question":"Where a DPC beneath an internal partition is not continuous, what is the minimum lap required?","options":["50mm","100mm","150mm","225mm"],"correct":1,"explanation":"Clause 6.3.13 states DPCs should be continuous or lapped by a minimum of 100mm, be at least the width of the wall or partition and be linked with any adjoining DPM.","ref":"6.3.13","why":"A short lap leaves a weak point where moisture can bridge the joint and track upward into a timber or steel partition base, risking rot or corrosion that a fully lapped, continuous DPC prevents.","source":"NHBC Standards 2026","sourceShort":"NHBC","refLabel":"Clause"},{"id":"6.4-01","chapter":"6.4","chapterTitle":"Timber and concrete upper floors","part":"Superstructure (excluding roofs)","question":"What imposed load does BS EN 1991-1-1 recommend for the design of upper floors in self-contained homes?","options":["1.0kN/m2","1.25kN/m2","1.5kN/m2","2.0kN/m2"],"correct":2,"explanation":"Clause 6.4.3.1 states imposed loads should be calculated in accordance with BS EN 1991-1-1, which recommends 1.5kN/m2 for self-contained homes.","ref":"6.4.3.1","why":"This figure reflects realistic loading from people, furniture and everyday domestic use; designing to it, rather than a lower notional figure, ensures the floor won't overstress, sag or feel unsafe under normal household activity.","source":"NHBC Standards 2026","sourceShort":"NHBC","refLabel":"Clause"},{"id":"6.4-02","chapter":"6.4","chapterTitle":"Timber and concrete upper floors","part":"Superstructure (excluding roofs)","question":"A lightweight non load-bearing partition runs parallel to I-joists and is supported on noggings fixed to the joists either side. Unless designed otherwise, what should the noggings be?","options":["38mm x 90mm minimum at 600mm centres, fixed with metal clips","38mm x 63mm minimum at 400mm centres, skew nailed","50mm x 100mm minimum at 450mm centres, fixed with metal clips","35mm x 97mm minimum at 600mm centres, nailed twice to each joist"],"correct":0,"explanation":"Clause 6.4.3.1 states that, unless designed otherwise, noggings should be a minimum 38mm x 90mm at 600mm centres and fixed with metal clips, with the sole plate of the partition fixed to the noggings.","ref":"6.4.3.1","why":"I-joists have slender webs not meant to take point loads directly; noggings spread the partition's weight onto the stronger flanges, preventing local crushing of the web or a dip in the floor under the partition line.","source":"NHBC Standards 2026","sourceShort":"NHBC","refLabel":"Clause"},{"id":"6.4-03","chapter":"6.4","chapterTitle":"Timber and concrete upper floors","part":"Superstructure (excluding roofs)","question":"For a composite profiled metal decking floor designed using the detailed approach with shrinkage effects taken into account, what should the total deflection be limited to?","options":["16mm or span/375, whichever is the lesser","24mm or span/250, whichever is the lesser","14mm or span/333, whichever is the lesser","20mm or span/300, whichever is the lesser"],"correct":1,"explanation":"Clause 6.4.3.4 states that when shrinkage effects are taken into account, total deflection should be limited to 24mm or span/250, whichever is the lesser; if shrinkage is ignored, the limit is 16mm or span/375.","ref":"6.4.3.4","why":"Concrete shrinkage on long-span composite floors can add up to 30% extra deflection beyond what standard code checks assume, so ignoring it risks a floor sagging more than expected, cracking finishes or feeling springy underfoot.","source":"NHBC Standards 2026","sourceShort":"NHBC","refLabel":"Clause"},{"id":"6.4-04","chapter":"6.4","chapterTitle":"Timber and concrete upper floors","part":"Superstructure (excluding roofs)","question":"What is the minimum bearing for precast concrete beam and block floor units on masonry?","options":["50mm","60mm","75mm","90mm"],"correct":3,"explanation":"Clause 6.4.7 states bearings for precast concrete floors should be solid and level, a minimum of 90mm on masonry (with open frogs in brickwork filled) and 75mm minimum on steelwork.","ref":"6.4.7","why":"A concrete floor is heavy, so a shallow bearing risks the units slipping off their seating or crushing the masonry locally; 90mm gives a reliable, solid transfer of that weight into the wall.","source":"NHBC Standards 2026","sourceShort":"NHBC","refLabel":"Clause"},{"id":"6.4-05","chapter":"6.4","chapterTitle":"Timber and concrete upper floors","part":"Superstructure (excluding roofs)","question":"What is the maximum instantaneous deflection of floor joists under combined bending and shear where strutting is provided?","options":["10mm","12mm","14mm","16mm"],"correct":2,"explanation":"Clause 6.4.9 states instantaneous deflection should be no more than 0.003 x the span, with a maximum of 14mm where strutting is provided, or 12mm where strutting is not provided.","ref":"6.4.9","why":"Excess deflection makes floors feel bouncy underfoot and cracks ceiling plasterboard below and decking joints above; this limit keeps the floor stiff enough for a durable, comfortable finish.","source":"NHBC Standards 2026","sourceShort":"NHBC","refLabel":"Clause"},{"id":"6.4-06","chapter":"6.4","chapterTitle":"Timber and concrete upper floors","part":"Superstructure (excluding roofs)","question":"What clearance should be left between the first joist and the wall face to aid installation of services and fixing of floor decking?","options":["10mm-25mm","25mm-75mm","50mm-100mm","75mm-150mm"],"correct":1,"explanation":"Clause 6.4.10.2 states there should be a clearance of 25mm-75mm between the first joist and the wall face to aid the installation of services and the fixing of floor decking.","ref":"6.4.10.2","why":"Without this gap, electricians and plumbers can't run services along the wall line, and fixing the deck neatly at the perimeter becomes difficult, often forcing damaging cuts into the joists or wall later.","source":"NHBC Standards 2026","sourceShort":"NHBC","refLabel":"Clause"},{"id":"6.4-07","chapter":"6.4","chapterTitle":"Timber and concrete upper floors","part":"Superstructure (excluding roofs)","question":"What is the minimum end bearing for a solid timber joist supported on a timber wall plate?","options":["75mm","45mm","90mm","100mm"],"correct":0,"explanation":"Table 3 of Clause 6.4.10.3 gives a minimum bearing of 75mm for solid joists on a timber wall plate; on masonry walls the minimum is 90mm (75mm where the joist is not providing restraint).","ref":"6.4.10.3","why":"Too little bearing risks the joist end crushing into the softer wall plate timber or slipping sideways off its support, so this minimum ensures the load is safely and squarely transferred.","source":"NHBC Standards 2026","sourceShort":"NHBC","refLabel":"Clause"},{"id":"6.4-08","chapter":"6.4","chapterTitle":"Timber and concrete upper floors","part":"Superstructure (excluding roofs)","question":"Solid timber joists overlap on an intermediate load-bearing wall. What is the maximum the joists should project beyond the bearing?","options":["50mm","75mm","100mm","150mm"],"correct":2,"explanation":"Clause 6.4.11 states solid timber joists bearing onto intermediate load-bearing walls should be nailed together where they overlap and should not project more than 100mm.","ref":"6.4.11","why":"Nailing overlapping joists together ties the floor into one continuous diaphragm over the intermediate wall, while limiting the overhang stops an unsupported cantilever that could sag or crack the ceiling below.","source":"NHBC Standards 2026","sourceShort":"NHBC","refLabel":"Clause"},{"id":"6.4-09","chapter":"6.4","chapterTitle":"Timber and concrete upper floors","part":"Superstructure (excluding roofs)","question":"Solid timber joists are being notched into a steel beam. What projections should be provided to allow for timber shrinkage?","options":["6mm top and 3mm bottom","10mm top and 5mm bottom","15mm top and 5mm bottom","12mm top and 2mm bottom"],"correct":3,"explanation":"Clause 6.4.12 states solid timber joists connected to steel beams should have 12mm top and 2mm bottom projections to allow for timber shrinkage, and be provided with strutting to prevent rotation.","ref":"6.4.12","why":"Solid timber keeps drying and shrinking in depth after fixing; without these projections a joist could shrink below the top of the steel and lose its bearing, or create a hump or dip in the finished floor.","source":"NHBC Standards 2026","sourceShort":"NHBC","refLabel":"Clause"},{"id":"6.4-10","chapter":"6.4","chapterTitle":"Timber and concrete upper floors","part":"Superstructure (excluding roofs)","question":"What is the minimum bearing of a joist hanger on masonry?","options":["50mm","75mm","90mm","100mm"],"correct":1,"explanation":"Clause 6.4.13 states joist hangers should have a 75mm minimum bearing on masonry, bear on level beds, be tight to the wall and not be cut into the walling.","ref":"6.4.13","why":"A hanger with too little bearing can rotate or pull away from the wall under the joist's reaction load, and can locally crush weaker masonry, so this minimum keeps the connection secure.","source":"NHBC Standards 2026","sourceShort":"NHBC","refLabel":"Clause"},{"id":"6.4-11","chapter":"6.4","chapterTitle":"Timber and concrete upper floors","part":"Superstructure (excluding roofs)","question":"Unless in accordance with Technical Requirement R3, what cross-section should galvanized steel restraint straps to upper floors have?","options":["30mm x 5mm","25mm x 3mm","40mm x 3mm","50mm x 6mm"],"correct":0,"explanation":"Clause 6.4.14 states restraint straps should be galvanized steel with a 30mm x 5mm cross-section or be in accordance with Technical Requirement R3, and be spaced at a maximum of 2m centres.","ref":"6.4.14","why":"Restraint straps tie the floor diaphragm back to the walls to resist wind and lateral loads; an undersized strap could stretch or snap, letting an external wall bow outward over time.","source":"NHBC Standards 2026","sourceShort":"NHBC","refLabel":"Clause"},{"id":"6.4-12","chapter":"6.4","chapterTitle":"Timber and concrete upper floors","part":"Superstructure (excluding roofs)","question":"Solid timber floor joists span 4.8m. How many rows of strutting are needed?","options":["None","One row at mid span","One row at each third point plus blocking at supports only","Two rows at equal spacing"],"correct":3,"explanation":"Table 4 of Clause 6.4.15 requires two rows of strutting at equal spacing for solid timber and I-joist spans over 4.5m; one row at the centre of span applies to spans of 2.5m-4.5m.","ref":"6.4.15","why":"Long joists can twist sideways under load; a single central strut can't control rotation over the full length, so a second row is needed on longer spans to stop bouncy, uneven or cracking floors.","source":"NHBC Standards 2026","sourceShort":"NHBC","refLabel":"Clause"},{"id":"6.4-13","chapter":"6.4","chapterTitle":"Timber and concrete upper floors","part":"Superstructure (excluding roofs)","question":"Where fire compartment walls are built off trimmers and trimming joists, what maximum instantaneous deflection should be observed for those joists under total dead and imposed loads?","options":["10mm","12mm","14mm","16mm"],"correct":0,"explanation":"Clause 6.4.16 states a maximum limit of 10mm instantaneous deflection under total dead and imposed loads should be observed for trimmers and trimming joists supporting fire compartment walls, to avoid residual gaps at wall heads or distorted walls.","ref":"6.4.16","why":"A fire compartment wall relies on a tight, unbroken seal at its head; if the joists it sits on sag more than this, gaps open up at the top of the wall, breaching fire separation between homes.","source":"NHBC Standards 2026","sourceShort":"NHBC","refLabel":"Clause"},{"id":"6.4-14","chapter":"6.4","chapterTitle":"Timber and concrete upper floors","part":"Superstructure (excluding roofs)","question":"A plumber needs to drill a solid timber joist (up to 250mm deep). What is the maximum hole size, and where should holes be located?","options":["0.15 x joist depth, on the top edge 0.1-0.2 x span from the end","0.2 x joist depth, anywhere in the middle third of the span","0.25 x joist depth, on the centre line 0.25-0.4 x span from the end","0.3 x joist depth, on the centre line at mid span only"],"correct":2,"explanation":"Table 6 of Clause 6.4.18 permits drilling of joists up to 250mm depth on the centre line in a zone 0.25-0.4 x span, with a maximum hole size of 0.25 x the depth of the joist, and a minimum 100mm horizontal separation between notches and holes.","ref":"6.4.18","why":"Joists carry the highest bending stress near mid-span top and bottom fibres and shear near the supports; cutting outside the permitted zones removes structural timber where it's most needed, risking sagging or sudden failure.","source":"NHBC Standards 2026","sourceShort":"NHBC","refLabel":"Clause"},{"id":"6.4-15","chapter":"6.4","chapterTitle":"Timber and concrete upper floors","part":"Superstructure (excluding roofs)","question":"What is the minimum thickness of moisture-resistant chipboard floor decking for joists at 600mm centres under normal domestic loads?","options":["15mm","18mm","19mm","22mm"],"correct":3,"explanation":"Table 7 of Clause 6.4.19.1 requires 22mm moisture-resistant chipboard (BS EN 312 type P5) at 600mm joist centres; 18mm is only acceptable at 400mm or 450mm centres.","ref":"6.4.19.1","why":"Wider joist spacing means a longer unsupported span of decking between supports, so a thicker board is needed to resist bending and bounce under foot traffic without the joints working loose or cracking.","source":"NHBC Standards 2026","sourceShort":"NHBC","refLabel":"Clause"},{"id":"6.5-01","chapter":"6.5","chapterTitle":"Steelwork","part":"Superstructure (excluding roofs)","question":"The steel beam tables in this chapter are based on which steel grade?","options":["S235","S275","S355","S460"],"correct":1,"explanation":"Clause 6.5.1 states the information provided in the chapter is in accordance with BS EN 1993-1-1 using grade S275 steel, although more economical or smaller beams may be designed by an engineer.","ref":"6.5.1","why":"The chapter's span and size tables are only valid for the steel strength they were calculated against; using a different, weaker grade on site while relying on these tables would under-size the beam.","source":"NHBC Standards 2026","sourceShort":"NHBC","refLabel":"Clause"},{"id":"6.5-02","chapter":"6.5","chapterTitle":"Steelwork","part":"Superstructure (excluding roofs)","question":"When using the chapter tables to size a steel beam supporting a masonry partition, which condition must be met?","options":["The partition may be up to 3.5m high","The beam may also carry timber floor loads","The span of the steel beam is less than 4m","The partition can be offset to one edge of the beam flange"],"correct":2,"explanation":"Clause 6.5.2.1 requires the span of the steel beam to be less than 4m, the partition to be built centrally on the beam and less than 2.7m high, and the beam to support only the partition weight and self-weight; otherwise design to Technical Requirement R5 is needed.","ref":"6.5.2.1","why":"The simplified tables were only calculated and proven for beams under this span; beyond it, deflection and bending become harder to predict from a simple table, so an engineer must check the beam specifically.","source":"NHBC Standards 2026","sourceShort":"NHBC","refLabel":"Clause"},{"id":"6.5-03","chapter":"6.5","chapterTitle":"Steelwork","part":"Superstructure (excluding roofs)","question":"When calculating the effective floor area supported by a steel trimmer beam, a void in the floor contains a staircase. What adjustment should be made?","options":["Deduct the staircase void area from the effective area","No adjustment - voids are always ignored","Add 1m2 to the effective area of every beam in the floor","Add 2m2 to the effective area supported by any beam which fully or partially supports that staircase"],"correct":3,"explanation":"Clause 6.5.2.2 states that where any area shown as void contains a staircase, 2m2 should be added to the effective area supported by any beam which fully or partially supports that staircase.","ref":"6.5.2.2","why":"A staircase within a void adds real weight (treads, stringers, landing) beyond what the surrounding floor area formula assumes, so this allowance stops the supporting beam being under-designed for that extra load.","source":"NHBC Standards 2026","sourceShort":"NHBC","refLabel":"Clause"},{"id":"6.5-04","chapter":"6.5","chapterTitle":"Steelwork","part":"Superstructure (excluding roofs)","question":"For corrosion purposes, what counts as a coastal location, requiring an additional zinc corrosion rate of 1.5 micrometres per annum to be added?","options":["A site within 500m of the general coastline of the United Kingdom","A site within 1km of the general coastline of the United Kingdom","A site within 2km of any tidal water","A site within 5km of the general coastline of the United Kingdom"],"correct":0,"explanation":"Note 2 to Table 4 in Clause 6.5.3 defines a coastal location as a site within 500m of the general coastline of the UK; an additional corrosion rate for zinc of 1.5 micrometres per annum should be added, and if the cumulative rate exceeds 3.0 micrometres per annum an engineered corrosion protection design is required.","ref":"6.5.3","why":"Salt-laden coastal air speeds up corrosion of galvanized coatings well beyond inland rates; without this added allowance, a standard coating could fail early, exposing the structural steel to rust and lost strength.","source":"NHBC Standards 2026","sourceShort":"NHBC","refLabel":"Clause"},{"id":"6.5-05","chapter":"6.5","chapterTitle":"Steelwork","part":"Superstructure (excluding roofs)","question":"Unless corrosion protection is to an engineered design, how should steelwork below ground or within the splash zone be encased?","options":["In at least 50mm of Grade ST1 concrete","In two coats of ordinary gloss paint over primer","In at least 75mm of minimum Grade ST2 concrete including a wrapping mesh","In at least 100mm of Grade ST4 concrete with no mesh required"],"correct":2,"explanation":"Clause 6.5.3 states that unless encased by at least 75mm of minimum Grade ST2 concrete including a wrapping mesh (D49 or similar), corrosion protection for steelwork below ground and/or within the splash zone (up to 150mm above ground level) should be to an engineered design based on in-situ testing.","ref":"6.5.3","why":"Steel below ground or in the splash zone sits in constantly damp, sometimes chloride-laden conditions that rapidly corrode paint or thin coatings; a solid concrete encasement gives a physical and alkaline barrier that protects the steel far more reliably.","source":"NHBC Standards 2026","sourceShort":"NHBC","refLabel":"Clause"},{"id":"6.5-06","chapter":"6.5","chapterTitle":"Steelwork","part":"Superstructure (excluding roofs)","question":"What is the minimum bearing for steelwork supported on masonry?","options":["75mm","100mm","150mm","200mm"],"correct":1,"explanation":"Clause 6.5.4.2 states bearings for steelwork supported on masonry should be a minimum of 100mm, and clean, dry and level; beam supports should not occur above window or door openings.","ref":"6.5.4.2","why":"A beam's reaction load is concentrated at its ends; too shallow a bearing on masonry risks crushing the wall locally or leaving the beam insecurely seated.","source":"NHBC Standards 2026","sourceShort":"NHBC","refLabel":"Clause"},{"id":"6.5-07","chapter":"6.5","chapterTitle":"Steelwork","part":"Superstructure (excluding roofs)","question":"What is the minimum compressive strength for a padstone supporting a steel beam?","options":["2.8N/mm2","5N/mm2","7.3N/mm2","10N/mm2"],"correct":3,"explanation":"Clause 6.5.5 states padstones should be formed in one unit with a minimum compressive strength of 10N/mm2, from in-situ concrete, precast concrete, concrete blocks, clay bricks or engineering bricks.","ref":"6.5.5","why":"A padstone concentrates the beam's heavy point load into a small area of wall; if it's too weak it can crush under that load, letting the beam drop or damaging the surrounding masonry.","source":"NHBC Standards 2026","sourceShort":"NHBC","refLabel":"Clause"},{"id":"6.5-08","chapter":"6.5","chapterTitle":"Steelwork","part":"Superstructure (excluding roofs)","question":"A steel beam runs in line with the wall supporting it, acting as a lintel over an opening. What is the minimum length of padstone?","options":["200mm","150mm","100mm","300mm"],"correct":0,"explanation":"The notes to Tables 7 and 8 in Clause 6.5.5 state that when steelwork acts as a lintel in line with the supporting wall, the minimum length of padstone should be 200mm, the padstone depth should match adjacent coursing and the web of the beam should be over the centre of the wall.","ref":"6.5.5","why":"When a beam sits in line with the wall as a lintel, its narrow web bears on the masonry over a shorter length, so a longer padstone is needed to spread that end reaction and stop local crushing beneath the opening.","source":"NHBC Standards 2026","sourceShort":"NHBC","refLabel":"Clause"},{"id":"6.5-09","chapter":"6.5","chapterTitle":"Steelwork","part":"Superstructure (excluding roofs)","question":"Two steel beams supporting a timber floor are to be joined using the bolted cleat connections detailed in this chapter. What is the maximum difference in depth allowed between the beams?","options":["10mm","25mm","40mm","60mm"],"correct":2,"explanation":"Clause 6.5.6 states this connection method may only be used where both beams have been chosen from Table 3, they only support timber floors, and the beams do not differ in depth by more than 40mm; otherwise the connection should be designed by an engineer.","ref":"6.5.6","why":"The bolted cleat detail assumes both beams are of similar depth so the cleats engage both webs squarely; too great a mismatch means the connection can't transfer shear properly, risking a weak or unstable joint.","source":"NHBC Standards 2026","sourceShort":"NHBC","refLabel":"Clause"},{"id":"6.6-01","chapter":"6.6","chapterTitle":"Staircases","part":"Superstructure (excluding roofs)","question":"How should artificial lighting to staircases and landings within homes and common areas be controlled?","options":["By a single switch at the head of the stairs","By pull cords at each landing","By a timer switch set for hours of darkness","By two-way switching, or automatic light-sensitive controls"],"correct":3,"explanation":"Clause 6.6.4 states artificial light sources should be provided to all staircases and landings and be controlled by two-way switching; alternatively, automatic light-sensitive controls may be used.","ref":"6.6.4","why":"Stairs are one of the most common places for falls in a home, especially at night. Two-way switching lets someone light the stairs before stepping onto them from either end, rather than fumbling in the dark.","source":"NHBC Standards 2026","sourceShort":"NHBC","refLabel":"Clause"},{"id":"6.6-02","chapter":"6.6","chapterTitle":"Staircases","part":"Superstructure (excluding roofs)","question":"By how much may a floor finish such as a screed reduce the bottom rise of a flight of stairs and still be acceptable?","options":["A maximum of 12mm","A maximum of 5mm","A maximum of 18mm","A maximum of 25mm"],"correct":0,"explanation":"Clause 6.6.8.2 states account should be taken of the thickness of screeds, and floor finishes that reduce the bottom rise by a maximum of 12mm are acceptable.","ref":"6.6.8.2","why":"If the thickness of the finished floor build-up isn't allowed for, the bottom step ends up a different height to the rest. Uneven risers are a classic trip hazard because the foot doesn't expect the change in step height.","source":"NHBC Standards 2026","sourceShort":"NHBC","refLabel":"Clause"},{"id":"6.6-03","chapter":"6.6","chapterTitle":"Staircases","part":"Superstructure (excluding roofs)","question":"What is the minimum clearance between a handrail and any surface, throughout its full length?","options":["15mm","25mm","40mm","50mm"],"correct":1,"explanation":"Clause 6.6.11 states the handrail should have a 25mm minimum clearance from any surface throughout its full length, ensure a firm handhold and be unobstructed.","ref":"6.6.11","why":"Too tight a gap and fingers can't get a proper grip or could be trapped against the wall. A consistent 25mm clearance lets someone grab the rail firmly and quickly if they stumble, which is what actually stops a fall becoming a serious injury.","source":"NHBC Standards 2026","sourceShort":"NHBC","refLabel":"Clause"},{"id":"6.6-04","chapter":"6.6","chapterTitle":"Staircases","part":"Superstructure (excluding roofs)","question":"How should the top nosing of a timber staircase be fixed?","options":["Proud of the floor decking and nailed to the trimmer","Glued to the landing edge with no mechanical fixing","Level with the floor decking and screwed into the joist","Set 12mm below the floor decking and dowelled to the string"],"correct":2,"explanation":"Clause 6.6.12 states the top nosing should be level with the floor decking and screwed into the joist, with the wall string cut to sit over the floor joist to land evenly on the floor or landing.","ref":"6.6.12","why":"If the top nosing isn't flush with the decking and firmly screwed down, the top step feels different underfoot and can work loose, creating a trip point right where a fall is most dangerous - at the top of a flight.","source":"NHBC Standards 2026","sourceShort":"NHBC","refLabel":"Clause"},{"id":"6.6-05","chapter":"6.6","chapterTitle":"Staircases","part":"Superstructure (excluding roofs)","question":"The joiner wants to install the timber staircase but the roof coverings and windows are not yet complete. What does the standard say?","options":["Installation may go ahead if the stairs are covered with building paper","Installation may go ahead provided the stairs were factory primed","Only the bottom flight may be fixed before the building is weathertight","Timber staircases should be fixed in place only when the building is weathertight"],"correct":3,"explanation":"Clause 6.6.16 states timber staircases should be fixed in place only when the building is weathertight, and should be protected to prevent damage and unsightly marking during construction.","ref":"6.6.16","why":"Timber left exposed to rain before the building is closed in soaks up moisture, swells and distorts, then shrinks and cracks as it dries out later. Fitting the stair only once weathertight avoids warped strings, loose joints and squeaks in the finished home.","source":"NHBC Standards 2026","sourceShort":"NHBC","refLabel":"Clause"},{"id":"6.6-06","chapter":"6.6","chapterTitle":"Staircases","part":"Superstructure (excluding roofs)","question":"Which type of wall is generally unable to have stairs secured to it?","options":["Metal stud walls","Timber stud walls with additional noggings","Block walls","Brick walls"],"correct":0,"explanation":"Clause 6.6.6 notes that stairs generally are unable to be secured to metal stud walls; timber stud walls may require additional noggings and block walls should be sufficiently robust to receive appropriate fixings.","ref":"6.6.6","why":"Metal studs aren't substantial enough to hold the heavy point loads a staircase string or newel puts into a wall. Fixing to them risks the stair pulling away from the wall in use, which is a structural and fall-safety failure, not just cosmetic.","source":"NHBC Standards 2026","sourceShort":"NHBC","refLabel":"Clause"},{"id":"6.7-01","chapter":"6.7","chapterTitle":"Doors, windows and glazing","part":"Superstructure (excluding roofs)","question":"How far should a window sill project beyond the wall face to help shed water clear of the wall?","options":["At least 15mm","At least 25mm","At least 40mm","At least 50mm"],"correct":1,"explanation":"Clause 6.7.3.1 states that sills should project at least 25mm beyond the wall face, with the head of frames set back from the edge of the lintel/cavity tray.","ref":"6.7.3.1","why":"Without enough sill projection, water running down the glass tracks back underneath and runs down the wall face instead of dripping clear. Over time that causes staining, saturates the wall and can lead to penetrating damp inside.","source":"NHBC Standards 2026","sourceShort":"NHBC","refLabel":"Clause"},{"id":"6.7-02","chapter":"6.7","chapterTitle":"Doors, windows and glazing","part":"Superstructure (excluding roofs)","question":"In which locations should checked rebates be used at door and window openings?","options":["England and Wales only","All coastal sites within 10km of the sea","Scotland, Northern Ireland, the Isle of Man and areas of very severe exposure to driving rain","Any building of three storeys or more"],"correct":2,"explanation":"Clause 6.7.3.1 requires checked rebates in Scotland, Northern Ireland, the Isle of Man and areas where exposure to driving rain is very severe (severe/very severe when building in timber frame), unless proprietary cavity closers with a satisfactory assessment are used.","ref":"6.7.3.1","why":"In areas of very severe driving rain, a simple butt joint between frame and masonry can be forced open by wind-driven water. The checked rebate creates a physical overlap that water can't easily track through, stopping it reaching the cavity or inner leaf.","source":"NHBC Standards 2026","sourceShort":"NHBC","refLabel":"Clause"},{"id":"6.7-03","chapter":"6.7","chapterTitle":"Doors, windows and glazing","part":"Superstructure (excluding roofs)","question":"What gap is recommended between a non-white PVC-U frame and a structural opening that is between 3.0m and 4.5m wide?","options":["22mm","15mm","12mm","10mm"],"correct":0,"explanation":"Table 1 of Clause 6.7.3.3 recommends a 22mm gap for non-white PVC-U frames in structural openings from 3.0m to 4.5m, as darker frames experience greater thermal movement.","ref":"6.7.3.3","why":"Darker, non-white PVC-U absorbs far more solar heat than white frames, so it expands and contracts more. A gap that's too tight for this movement lets the frame bow, jam, or push the sealant off, opening a path for water and draughts.","source":"NHBC Standards 2026","sourceShort":"NHBC","refLabel":"Clause"},{"id":"6.7-04","chapter":"6.7","chapterTitle":"Doors, windows and glazing","part":"Superstructure (excluding roofs)","question":"For coupled door and window frame assemblies, what minimum amount of on-site watertightness testing of critical coupling joints is required?","options":["1% by length of all critical coupling joints","2% by length of all critical coupling joints","10% by length of all critical coupling joints","5% by length of all critical coupling joints"],"correct":3,"explanation":"Clause 6.7.4.6 requires a minimum of 5% by length of all critical coupling joints to be tested using the CWCT hose test method, with a minimum of two installations tested where the same type is used across a development.","ref":"6.7.4.6","why":"Coupled assemblies rely on site workmanship at every joint, and a poorly formed coupling joint won't show a leak until wind-driven rain hits it. On-site hose testing catches installation defects early, before hidden water ingress damages structure across a whole development.","source":"NHBC Standards 2026","sourceShort":"NHBC","refLabel":"Clause"},{"id":"6.7-05","chapter":"6.7","chapterTitle":"Doors, windows and glazing","part":"Superstructure (excluding roofs)","question":"In a drained and vented glazing system, what minimum edge clearance should normally be provided between the glass edge and the frame?","options":["3mm","5mm","10mm","12mm"],"correct":1,"explanation":"Clause 6.7.5.4 requires a minimum 5mm edge clearance between the glass edge and frame to prevent contact, ensure drainage and allow for differential thermal expansion; it may only reduce to 3mm at side and top rebates of very well-drained frames with glass up to 2m long.","ref":"6.7.5.4","why":"Without clearance, thermal movement can push the glass hard against the frame and crack it, and there's no path for any water that gets past the seals to drain away - it just sits against the unit's edge seal, causing the sealed unit to mist up and fail early.","source":"NHBC Standards 2026","sourceShort":"NHBC","refLabel":"Clause"},{"id":"6.7-06","chapter":"6.7","chapterTitle":"Doors, windows and glazing","part":"Superstructure (excluding roofs)","question":"A supplier proposes fully bedded glazing for insulating glass units. When is a fully bedded system acceptable?","options":["Factory glazing only, where the insulated unit is less than 1m2","Site glazing only, where the unit is less than 2m2","Any glazing where the frame is timber","Any glazing provided a drained cavity is formed behind the unit"],"correct":0,"explanation":"Clause 6.7.5.4 states fully bedded systems are acceptable for factory glazing only where the insulated unit is less than 1m2, with no gaps around the perimeter of the unit; drained and vented systems are needed for site-fixed IGUs and units over 1m2.","ref":"6.7.5.4","why":"Larger or site-fixed units need to accommodate more movement and can't rely on perfect factory bonding, so they need a drained path for stray moisture. A fully bedded unit has nowhere for that moisture to escape, so it sits against the edge seal and causes premature unit failure.","source":"NHBC Standards 2026","sourceShort":"NHBC","refLabel":"Clause"},{"id":"6.7-07","chapter":"6.7","chapterTitle":"Doors, windows and glazing","part":"Superstructure (excluding roofs)","question":"What is the minimum thickness for an external timber door?","options":["35mm minimum","40mm minimum","42.5mm minimum (44mm nominal)","54mm minimum (56mm nominal)"],"correct":2,"explanation":"Clause 6.7.7.2 states external doors should be 42.5mm minimum (44mm nominal) in thickness.","ref":"6.7.7.2","why":"A thinner door twists and warps more readily under weather and daily use, breaking the weather seal over time and reducing its resistance to knocks and forced entry - both durability and security depend on enough timber section.","source":"NHBC Standards 2026","sourceShort":"NHBC","refLabel":"Clause"},{"id":"6.7-08","chapter":"6.7","chapterTitle":"Doors, windows and glazing","part":"Superstructure (excluding roofs)","question":"What is the maximum moisture content for windows and frames when fixed?","options":["9%","12%","15%","17%"],"correct":3,"explanation":"Table 4 of Clause 6.7.7.3 gives a maximum moisture content of 17% for windows and frames when fixed; lower limits apply to internal joinery depending on heating.","ref":"6.7.7.3","why":"Timber fixed too wet keeps drying out once the building is heated and enclosed, shrinking after installation. That opens up joints, cracks paint finishes, and lets in draughts and water where there were none at handover.","source":"NHBC Standards 2026","sourceShort":"NHBC","refLabel":"Clause"},{"id":"6.7-09","chapter":"6.7","chapterTitle":"Doors, windows and glazing","part":"Superstructure (excluding roofs)","question":"To reduce twisting, what hinges should an external door be hung on?","options":["1 pair of 75mm hinges","1 1/2 pairs of 100mm hinges","1 pair of 100mm hinges","1 1/2 pairs of 75mm hinges"],"correct":1,"explanation":"Table 8 of Clause 6.7.11.5 requires external doors to be hung on 1 1/2 pairs of 100mm hinges; internal doors need 1 pair of 75mm hinges.","ref":"6.7.11.5","why":"External doors are heavier and take more wind loading and daily use than internal doors, so extra and longer hinges stop the door sagging or twisting - a twisted door loses its weather seal and starts to bind or drag on the frame.","source":"NHBC Standards 2026","sourceShort":"NHBC","refLabel":"Clause"},{"id":"6.8-01","chapter":"6.8","chapterTitle":"Fireplaces, chimneys and flues","part":"Superstructure (excluding roofs)","question":"For how long should a newly built chimney be allowed to dry naturally before use?","options":["A minimum of 14 days","A minimum of 7 days","A minimum of 21 days","A minimum of 28 days"],"correct":0,"explanation":"Clause 6.8.23.4 states a chimney should be allowed to dry naturally for a minimum period of 14 days before use.","ref":"6.8.23.4","why":"New masonry and mortar hold constructional moisture; lighting a fire before it dries can flash that moisture off as steam inside the flue, cracking joints and mortar and shortening the chimney's life before it's even been used properly.","source":"NHBC Standards 2026","sourceShort":"NHBC","refLabel":"Clause"},{"id":"6.8-02","chapter":"6.8","chapterTitle":"Fireplaces, chimneys and flues","part":"Superstructure (excluding roofs)","question":"Materials used for chimneys serving solid fuel appliances should be capable of resisting fluctuating temperatures up to what level?","options":["500°C","750°C","900°C","1,100°C"],"correct":3,"explanation":"Clause 6.8.6.1 states that materials used for chimneys should be capable of resisting fluctuating temperatures up to 1,100°C.","ref":"6.8.6.1","why":"A chimney fire in a solid fuel flue (burning soot deposits) can reach extreme temperatures well above normal operating heat. Materials that can't take this could crack or fail, letting fire or hot gases escape into the surrounding structure.","source":"NHBC Standards 2026","sourceShort":"NHBC","refLabel":"Clause"},{"id":"6.8-03","chapter":"6.8","chapterTitle":"Fireplaces, chimneys and flues","part":"Superstructure (excluding roofs)","question":"A clay brick chimney above roof level has no capping with an adequate overhang and drip. What bricks should be used?","options":["F1,S1 or F1,S2 bricks to BS EN 771","F2,S1 or F2,S2 bricks to BS EN 771","F0,S2 bricks to BS EN 771","Any clay bricks laid in sulfate-resisting mortar"],"correct":1,"explanation":"Clause 6.8.6.3 requires unprotected clay brick chimneys above roof level to be constructed using F2,S1 or F2,S2 bricks to BS EN 771, bedded in 1:1/2:4 to 4 1/2 cement:lime:sand or 1:3 or 4 cement:sand with plasticiser.","ref":"6.8.6.3","why":"The section of chimney above the roofline is fully exposed to saturation and repeated freeze-thaw cycling. Ordinary bricks would let water in, freeze, expand and spall the brick face apart, so frost-resistant bricks are needed wherever there's no capping to keep the masonry dry.","source":"NHBC Standards 2026","sourceShort":"NHBC","refLabel":"Clause"},{"id":"6.8-04","chapter":"6.8","chapterTitle":"Fireplaces, chimneys and flues","part":"Superstructure (excluding roofs)","question":"On a steeply pitched roof, two DPCs should be used in the chimney where the difference in level between the lower and higher intersection of the chimney with the roof is more than what?","options":["300mm","375mm","450mm","600mm"],"correct":2,"explanation":"Clause 6.8.6.4 requires two DPCs at suitable levels where the difference in level between the lower and higher intersection of the chimney with the roof will be more than 450mm.","ref":"6.8.6.4","why":"On a steep roof the chimney has a long exposed face on the low side. A single DPC can be overwhelmed by water tracking down that height, so a second DPC at the right level stops water bypassing the first and getting into the roof structure below.","source":"NHBC Standards 2026","sourceShort":"NHBC","refLabel":"Clause"},{"id":"6.8-05","chapter":"6.8","chapterTitle":"Fireplaces, chimneys and flues","part":"Superstructure (excluding roofs)","question":"How far should a flue terminal be built into the top of the chimney masonry?","options":["A minimum of 125mm, or 0.25x the length of the terminal, whichever is greater","A minimum of 100mm, or 0.5x the length of the terminal, whichever is greater","A minimum of 150mm in all cases","A minimum of 75mm, or 0.25x the length of the terminal, whichever is less"],"correct":0,"explanation":"Clause 6.8.7.2 requires terminals to be built into the top of the masonry to a minimum of 125mm or 0.25x the length of the terminal, whichever is the greater, and sealed to the flue liner.","ref":"6.8.7.2","why":"A terminal that isn't set deep enough into the masonry can work loose or let its seal crack, allowing flue gases or rain to bypass the joint - risking both leakage of combustion gases and the terminal being dislodged by wind.","source":"NHBC Standards 2026","sourceShort":"NHBC","refLabel":"Clause"},{"id":"6.8-06","chapter":"6.8","chapterTitle":"Fireplaces, chimneys and flues","part":"Superstructure (excluding roofs)","question":"What is the minimum distance a chimney capping drip should project from the chimney face to shed water clear of the masonry?","options":["20mm","25mm","30mm","40mm"],"correct":2,"explanation":"Clause 6.8.7.3 requires chimney cappings to have a drip at least 30mm from the chimney face to shed water clear of the masonry.","ref":"6.8.7.3","why":"Without a proper drip, rainwater running off the capping clings to its underside and tracks back down the chimney face, keeping the brickwork wet and driving frost damage lower down the stack.","source":"NHBC Standards 2026","sourceShort":"NHBC","refLabel":"Clause"},{"id":"6.8-07","chapter":"6.8","chapterTitle":"Fireplaces, chimneys and flues","part":"Superstructure (excluding roofs)","question":"Where a long gas flue pipe needs support, how should the supports be a
