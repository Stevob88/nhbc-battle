ing a timber frame home in an area of very severe exposure to wind-driven rain. What should the wall construction include?","options":["A cavity increased to 75mm with a standard breather membrane","A fully filled cavity to stop water crossing to the frame","A 50mm cavity between sheathing and cladding, plus a high performance breather membrane or masonry cladding rendered or clad with an impervious material","A 25mm cavity provided the masonry is pointed with sulfate-resisting mortar"],"correct":2,"explanation":"Clause 6.2.10.1 states that in areas of very severe exposure the wall should include a 50mm cavity between the sheathing and the cladding and either a high performance breather membrane or masonry cladding which is rendered or clad with an impervious material.","ref":"6.2.10.1","why":"In very severe wind-driven rain, a standard cavity and membrane can be overwhelmed by the sheer volume of water forced through cladding joints, so extra cavity depth and a higher-performance barrier are needed to keep the frame dry.","source":"NHBC Standards 2026","sourceShort":"NHBC","refLabel":"Clause"},{"id":"6.2-31","chapter":"6.2","chapterTitle":"External timber framed walls","part":"Superstructure (excluding roofs)","question":"An electrician wants to run cables through the external wall cavity between the brickwork and the timber frame. What does the standard permit?","options":["Any electricity cables provided they are run in conduit","No electricity cables other than meter tails","No cables of any kind, including meter tails","Lighting circuits only, clipped to the sheathing"],"correct":1,"explanation":"Clause 6.2.10.1 states external wall cavities should not contain electricity cables other than meter tails.","ref":"6.2.10.1","why":"Cables run through the cavity sit in a damp, unventilated void that can't be inspected once clad, so a fault there is both hard to find and a fire risk next to combustible insulation and timber.","source":"NHBC Standards 2026","sourceShort":"NHBC","refLabel":"Clause"},{"id":"6.2-32","chapter":"6.2","chapterTitle":"External timber framed walls","part":"Superstructure (excluding roofs)","question":"A continuous cavity tray is installed at sole plate level behind the brick cladding. Where should the perpend ventilators be installed?","options":["Below the tray only, at the base of the cavity","Above the tray only, so the sole plate is ventilated","They can be omitted where a continuous tray is fitted","Both above and below the tray, to provide drainage and ventilation to all areas of the frame"],"correct":3,"explanation":"Clause 6.2.10.2 states that if continuous cavity trays are installed at sole plate level, perpend ventilators should be installed above and below the tray to provide drainage and ventilation to all areas of the timber frame.","ref":"6.2.10.2","why":"A continuous cavity tray blocks drainage and airflow across it, so without vents on both sides one zone is left with no way to shed or dry out moisture, leading to trapped damp and decay.","source":"NHBC Standards 2026","sourceShort":"NHBC","refLabel":"Clause"},{"id":"6.2-33","chapter":"6.2","chapterTitle":"External timber framed walls","part":"Superstructure (excluding roofs)","question":"Below which sole plates should a DPC be installed to separate the timber from the concrete or masonry?","options":["The sole plates of ground floor external walls and internal partitions","The sole plates of external walls only","External wall sole plates in areas of severe exposure only","None, provided the sole plate is bedded on a continuous bed of mortar"],"correct":0,"explanation":"Clause 6.2.10.3 states DPCs should be installed below the sole plates of ground floor walls and internal partitions, to provide effective separation between the timber and concrete/masonry.","ref":"6.2.10.3","why":"Concrete and masonry substructures hold ground moisture that would otherwise wick by capillary action straight into the timber sole plate, rotting the frame at its most vulnerable, hardest-to-inspect point.","source":"NHBC Standards 2026","sourceShort":"NHBC","refLabel":"Clause"},{"id":"6.2-34","chapter":"6.2","chapterTitle":"External timber framed walls","part":"Superstructure (excluding roofs)","question":"Horizontal timber cavity barriers behind masonry cladding should be protected by a DPC lapped behind the breather membrane. Where may this DPC be omitted?","options":["At first floor level, where the floor zone protects the barrier","Behind rendered masonry cladding","For horizontal timber cavity barriers under the eaves","It may never be omitted for horizontal barriers"],"correct":2,"explanation":"Clause 6.2.10.3 states a DPC should be installed above horizontal timber cavity barriers, lapped behind the breather membrane by 100mm to shed water away from the sheathing, but the DPC may be omitted for horizontal timber cavity barriers under the eaves.","ref":"6.2.10.3","why":"The roof overhang at the eaves already shelters that cavity barrier from direct rain, so the extra protection a DPC gives elsewhere isn't needed there.","source":"NHBC Standards 2026","sourceShort":"NHBC","refLabel":"Clause"},{"id":"6.2-35","chapter":"6.2","chapterTitle":"External timber framed walls","part":"Superstructure (excluding roofs)","question":"How should a DPC protect a vertical timber cavity barrier behind masonry cladding?","options":["It should be installed over the face against the sheathing","It should be installed over the face in contact with the masonry cladding","The barrier should be fully wrapped in DPC on all four faces","Vertical barriers do not require DPC protection"],"correct":1,"explanation":"Clause 6.2.10.3 states that at vertical timber cavity barriers the DPC should be installed over the face in contact with the masonry cladding; the same applies at the jamb and sill of windows and doors.","ref":"6.2.10.3","why":"Water constantly runs down the inner face of a masonry leaf, so the DPC on that face stops it reaching the timber cavity barrier and tracking through to the frame behind.","source":"NHBC Standards 2026","sourceShort":"NHBC","refLabel":"Clause"},{"id":"6.2-36","chapter":"6.2","chapterTitle":"External timber framed walls","part":"Superstructure (excluding roofs)","question":"Where a horizontal polythene-sleeved mineral wool cavity barrier behind masonry cladding is protected by its own sleeve, what minimum upstand should the sleeve provide?","options":["50mm","75mm","100mm","150mm"],"correct":2,"explanation":"Clause 6.2.10.3 states horizontal polythene-sleeved mineral wool cavity barriers may be protected by their polythene sleeve with a minimum 100mm upstand, or by a separate DPC arranged to shed moisture away from the sheathing.","ref":"6.2.10.3","why":"A 100mm upstand throws water running down the cavity face clear of the barrier so it can't wick underneath or behind it into the mineral wool and timber frame.","source":"NHBC Standards 2026","sourceShort":"NHBC","refLabel":"Clause"},{"id":"6.2-37","chapter":"6.2","chapterTitle":"External timber framed walls","part":"Superstructure (excluding roofs)","question":"Where a checked rebate is formed at a window reveal in an area of severe exposure, what is the minimum overlap of the masonry to the window or door frame?","options":["12mm","20mm","25mm","40mm"],"correct":0,"explanation":"Clause 6.2.10.3 shows a 25mm checked rebate at the reveal with a minimum 12mm overlap of masonry to the window/door frame, required in Northern Ireland, Scotland, the Isle of Man and areas of severe or very severe exposure to driving rain.","ref":"6.2.10.3","why":"A straight-through joint at a window reveal gives wind-driven rain a direct path to the frame; the checked rebate breaks that path, which matters most in the wetter, more exposed parts of the UK.","source":"NHBC Standards 2026","sourceShort":"NHBC","refLabel":"Clause"},{"id":"6.2-38","chapter":"6.2","chapterTitle":"External timber framed walls","part":"Superstructure (excluding roofs)","question":"By how much should a cavity tray in the masonry cladding be lapped behind the breather membrane?","options":["75mm minimum","100mm minimum","150mm minimum","225mm minimum"],"correct":1,"explanation":"Clause 6.2.10.3 states cavity trays should be lapped behind the breather membrane by at least 100mm to deflect moisture away from the sheathing, and should have weepholes over openings or perpend ventilators where trays are continuous.","ref":"6.2.10.3","why":"Lapping the tray 100mm behind the membrane ensures rain intercepted over an opening is thrown clear of the sheathing rather than seeping in behind the membrane where it can't be seen.","source":"NHBC Standards 2026","sourceShort":"NHBC","refLabel":"Clause"},{"id":"6.2-39","chapter":"6.2","chapterTitle":"External timber framed walls","part":"Superstructure (excluding roofs)","question":"What spacing is required for wall ties at the jambs of openings and at movement joints in the masonry cladding?","options":["Maximum 450mm vertically and within 300mm of the reveal or joint","Maximum 225mm vertically and within 150mm of the reveal or joint","Maximum 600mm vertically and within 225mm of the reveal or joint","Maximum 300mm vertically and within 225mm of the masonry reveal or movement joint"],"correct":3,"explanation":"Clause 6.2.14 states wall ties should be spaced at jambs of openings and at movement joints at a maximum of 300mm vertically and within 225mm of the masonry reveal or movement joint, with additional studs provided where needed; ties should also be within 225mm of the top of the wall, including at gables.","ref":"6.2.14","why":"Masonry is most likely to crack or bow at openings and movement joints under wind load or differential movement, so closer tie spacing there gives extra restraint exactly where the wall is weakest.","source":"NHBC Standards 2026","sourceShort":"NHBC","refLabel":"Clause"}];

function weightedSample(pool, boost, n){
  const items = pool.map(q=>({q, w: boost[q.chapter]||1}));
  const out = [];
  while(out.length<n && items.length){
    let total = items.reduce((s,it)=>s+it.w,0), r = Math.random()*total, i=0;
    for(; i<items.length; i++){ r -= items[i].w; if(r<=0) break; }
    i = Math.min(i, items.length-1);
    out.push(items[i].q); items.splice(i,1);
  }
  return out;
}

function isoWeek(d){
  d = d || new Date();
  const t = new Date(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()));
  const day = (t.getUTCDay()+6)%7;
  t.setUTCDate(t.getUTCDate()-day+3);
  const firstThu = new Date(Date.UTC(t.getUTCFullYear(),0,4));
  const fd = (firstThu.getUTCDay()+6)%7;
  firstThu.setUTCDate(firstThu.getUTCDate()-fd+3);
  const wk = 1 + Math.round((t-firstThu)/(7*864e5));
  return t.getUTCFullYear()+'-W'+String(wk).padStart(2,'0');
}
function hashSeed(str){
  let h = 1779033703 ^ str.length;
  for(let i=0;i<str.length;i++){ h = Math.imul(h ^ str.charCodeAt(i), 3432918353); h = (h<<13)|(h>>>19); }
  return function(){ h = Math.imul(h ^ (h>>>16), 2246822507); h = Math.imul(h ^ (h>>>13), 3266489909); return (h ^= h>>>16) >>> 0; };
}
function seededShuffle(arr, seedStr){
  const seed = hashSeed(seedStr), rand = ()=>seed()/4294967296;
  const a = arr.slice();
  for(let i=a.length-1;i>0;i--){ const j=Math.floor(rand()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; }
  return a;
}

}

function leagueRows(entries){

/* Save a score to the shared board. Returns: shared | readonly | local | pending */
async function postScore(entry, isRetry){
  if(FIREBASE_URL){
    try{
      const a = await ensureFreshToken();
      if(!a) return 'local';
      const r = await fetch(FIREBASE_URL+'/scores.json?auth='+encodeURIComponent(a.idToken), {method:'POST', body: JSON.stringify(entry)});
      if(r.ok){ LB.entries = mergeEntries(LB.entries.concat([entry])); setPending(null); return 'shared'; }
      if(!isRetry){ await new Promise(rs=>setTimeout(rs, 1200+Math.random()*1200)); return postScore(entry, true); }
      return 'local';
    }catch(e){
      if(!isRetry){ await new Promise(rs=>setTimeout(rs, 1200+Math.random()*1200)); return postScore(entry, true); }
      return 'local';
    }
  }
  const art = await artifactNS();
  if(!art) return 'local';
  const remote = await fetchLB();
  const all = mergeEntries(remote.concat(LB.entries, [entry]));
  const json = JSON.stringify({v:1, entries:all});
  try{
    await art.publish({'data/leaderboard.json': {content: json, contentType:'application/json'}});
    LB.entries = all; setPending(null);
    return 'shared';
  }catch(e){
    const code = e && e.code;
    if(code==='not_writer' || code==='not_granted' || code==='consent_required') return 'readonly';
    if(code==='capability_disabled' || code==='capability_removed'){
      return await postScoreHtml(entry, all, json);
    }
    if(code==='conflict'){ setPending(entry); return 'pending'; }
    if((code==='rate_limited' || code==='upstream_error') && !isRetry){
      await new Promise(r=>setTimeout(r, 1500+Math.random()*1500));
      return postScore(entry, true);
    }
    return 'local';
  }
}
/* Fallback: rewrite the page itself with the board embedded (reloads all views) */
async function postScoreHtml(entry, all, json){
  const art = await artifactNS();
  if(!art) return 'local';
  try{
    const r = await fetch(location.pathname, {cache:'no-store'});
    if(!r.ok) return 'local';
    const src = await r.text();
    const marked = src.replace(/\/\*LBJSON\*\/[\s\S]*?\/\*LBJSON\*\//, '/*LBJSON*/'+json+'/*LBJSON*/');
    if(marked === src) return 'local';
    setPending(entry);
    await art.publish(marked);   /* success reloads this view; pending cleared on reload */
    return 'shared';
  }catch(e){
    const code = e && e.code;
    if(code==='not_writer' || code==='not_granted') { setPending(null); return 'readonly'; }
    if(code==='conflict') return 'pending';
    setPending(null);
    return 'local';
  }
}

(async function retryPending(){

  if(!p) return;
  await refreshLB();

  const res = await postScore(p, true);
  if(res==='shared' || res==='readonly') setPending(null);
})();

function confettiBurst(){
  if(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const c = document.createElement('canvas'); c.id='confetti';
  document.body.appendChild(c);
  const ctx = c.getContext('2d'); c.width=innerWidth; c.height=innerHeight;
  const cols=['#2E86C1','#2E9E5B','#D64545','#E8B93B','#7E57C2'];
  const ps=Array.from({length:120},()=>({x:Math.random()*c.width,y:-20-Math.random()*c.height*.3,
    vy:2+Math.random()*3.5,vx:-1.5+Math.random()*3,r:3+Math.random()*4,cl:cols[Math.floor(Math.random()*5)],a:Math.random()*6.28,va:-.2+Math.random()*.4}));
  let t=0;
  (function tick(){
    ctx.clearRect(0,0,c.width,c.height); t++;
    ps.forEach(p=>{ p.x+=p.vx; p.y+=p.vy; p.a+=p.va;
      ctx.save(); ctx.translate(p.x,p.y); ctx.rotate(p.a); ctx.fillStyle=p.cl;
      ctx.fillRect(-p.r,-p.r/2,p.r*2,p.r); ctx.restore(); });
    if(t<160) requestAnimationFrame(tick); else c.remove();
  })();
}

      <input id="au" maxlength="20" placeholder="Username" autocomplete="username">
      <input id="ap" type="password" placeholder="Password (6+ characters)" autocomplete="${mode==='login'?'current-password':'new-password'}" style="margin-top:10px">
      <div id="aerr" class="savenote warn" style="display:none;margin-top:10px"></div>
      <button class="btn btn-primary" id="ago" style="margin-top:14px">${mode==='login' ? 'Log in' : 'Create account'}</button>
      <button class="btn" id="aswitch" style="margin-top:8px">${mode==='login' ? "New here? Create an account" : "Already have an account? Log in"}</button>
    </div>`;
    const u = document.getElementById('au'), p = document.getElementById('ap'), err = document.getElementById('aerr'), go = document.getElementById('ago');
    u.focus();
    const showErr = msg => { err.textContent = msg; err.style.display = 'block'; };
    const submit = async ()=>{
      const uname = u.value.trim(), pass = p.value;
      err.style.display = 'none';
      if(!validUsername(uname)){ showErr('Username should be 3-20 letters, numbers, . _ or -'); return; }
      if(pass.length < 6){ showErr('Password needs to be at least 6 characters'); return; }
      go.disabled = true; go.textContent = 'Please wait…';
      try{
        if(mode==='login') await doSignIn(uname, pass); else await doSignUp(uname, pass);
        home();
      }catch(e){
        const m = (e.message||'').includes('EMAIL_EXISTS') ? 'That username is already taken' :
          (e.message||'').includes('EMAIL_NOT_FOUND') || (e.message||'').includes('INVALID_PASSWORD') || (e.message||'').includes('INVALID_LOGIN_CREDENTIALS') ? 'Wrong username or password' :
          (e.message||'').includes('WEAK_PASSWORD') ? 'Password needs to be at least 6 characters' :
          (e.message||'').includes('TOO_MANY_ATTEMPTS') ? 'Too many attempts — wait a bit and try again' :
          !FIREBASE_API_KEY ? 'Login isn\'t set up yet — ask the site owner to finish setup' :
          'Something went wrong — check your details and try again';
        showErr(m);
        go.disabled = false; go.textContent = mode==='login' ? 'Log in' : 'Create account';
      }
    };
    go.onclick = submit;
    p.addEventListener('keydown', e=>{ if(e.key==='Enter') submit(); });
    document.getElementById('aswitch').onclick = ()=>{ mode = mode==='login' ? 'signup' : 'login'; draw(); };
  };
  draw();
}

      <span>${esc(p)}</span><span class="n mono">${byPart[p].length}</span></button>`).join('')}
  </div>
  <div class="setup-actions"><button class="btn btn-primary" id="go" disabled>Select a topic</button></div>`;
  document.getElementById('back').onclick = home;
  const go = document.getElementById('go');
  document.querySelectorAll('.topic').forEach(t=>{
    t.onclick = ()=>{
      const i = +t.dataset.i;
      sel.has(i) ? sel.delete(i) : sel.add(i);
      t.classList.toggle('on');
      const pool = [...sel].reduce((n,ix)=>n+byPart[PART_ORDER[ix]].length,0);
      go.disabled = !sel.size;
      go.textContent = sel.size ? `Start — ${Math.min(TEST_SIZE,pool)} questions` : 'Select a topic';
    };
  });
  go.onclick = ()=>{
    const parts = [...sel].map(i=>PART_ORDER[i]);
    const pool = QUESTIONS.filter(q=>parts.includes(q.part));
    const label = parts.length===1 ? parts[0] : `${parts.length} topics`;
    startQuiz('practice', pool, `Practice — ${label}`);
  };
}

function startQuiz(mode, pool, label, buildKey){
  const qs = buildKey ? weightedSample(pool, BUILDS[buildKey].boost, TEST_SIZE)
                      : shuffle(pool).slice(0, TEST_SIZE);
  S = { mode, label, buildKey: buildKey||null, qs, i:0, answers:{}, revealed:{} };
  renderQ();
}

function renderQ(){
  const q = S.qs[S.i], n = S.qs.length;
  const picked = S.answers[S.i], shown = S.revealed[S.i];
  app.innerHTML = `
  <div class="rail">
    <div class="rail-top">
      <span class="count">${S.i+1}/${n}</span>
      <span class="mode-tag">${S.mode==='battle'?'Battle':S.mode==='test'?'Mock test':'Practice'}</span>
      ${S.mode==='battle' ? `<span class="ptsline">${S.pts.toLocaleString()} pts</span>` : ''}
      ${S.mode==='battle' && S.streak>=3 ? `<span class="streak">&#128293; ${S.streak}</span>` : ''}
      <button class="quit" id="quit">End session</button>
    </div>
    <div class="track"><div class="fill" style="width:${(S.i)/n*100}%"></div></div>
  </div>
  <div class="qmeta">
    <span class="part">${esc(q.part)}</span>
    <span class="clause">Ch ${esc(q.chapter)} &middot; ${esc(q.chapterTitle)}</span>
  </div>
  <div class="qtext">${esc(q.question)}</div>
  <div id="opts">
    ${q.options.map((o,ix)=>{
      let cls='opt';
      if(shown){ if(ix===q.correct) cls+=' right'; else if(ix===picked) cls+=' wrong'; }
      else if(ix===picked) cls+=' sel';
      return `<button class="${cls}" data-ix="${ix}" ${shown?'disabled':''}>
        <span class="key">${'ABCD'[ix]}</span><span>${esc(o)}</span></button>`;
    }).join('')}
  </div>
  <div id="feedback">${shown ? explBlock(q, picked) : ''}</div>
  <div class="quiznav">
    ${S.i>0 && S.mode==='test' ? `<button class="btn btn-ghost" id="prev" style="flex:1">Back</button>`:''}
    <button class="btn btn-primary" id="next" style="flex:2" ${nextDisabled(picked, shown)?'disabled':''}>
      ${S.i===n-1 ? 'Finish' : 'Next question'}</button>
  </div>`;
  window.scrollTo(0,0);
  if(S.mode==='battle' && !shown) S.qStart = Date.now();

  document.getElementById('quit').onclick = ()=>{ if(confirmQuit()) home(); };
  const prev = document.getElementById('prev');
  if(prev) prev.onclick = ()=>{ S.i--; renderQ(); };
  document.querySelectorAll('.opt').forEach(b=>{
    b.onclick = ()=>{
      if(S.revealed[S.i]) return;
      const ix = +b.dataset.ix;
      S.answers[S.i] = ix;
      S.revealed[S.i] = true;
      if(S.mode==='battle'){
        const ok = ix === q.correct;
        let earned = 0;
        if(ok){
          const secs = (Date.now()-S.qStart)/1000;
          const speed = secs<=3 ? 50 : secs>=15 ? 0 : Math.round((50*(15-secs)/12)/5)*5;
          S.streak++; S.bestStreak = Math.max(S.bestStreak, S.streak);
          earned = 100 + speed + (S.streak>=3 ? 20 : 0);
        } else { S.streak = 0; }
        S.pts += earned; S.ptsEach[S.i] = earned;
        if(earned){
          const pop = document.createElement('div');
          pop.className='ptspop'; pop.textContent = '+'+earned;
          document.body.appendChild(pop);
          setTimeout(()=>pop.remove(), 950);
        }
      }
      renderQ();
    };
  });
  document.getElementById('next').onclick = ()=>{
    if(S.i === S.qs.length-1) finish(); else { S.i++; renderQ(); }
  };
}
function nextDisabled(picked, shown){
  return !shown;
}
function confirmQuit(){ return Object.keys(S.answers).length===0 || window.confirm('End this session? Progress won’t be saved.'); }

/* Reference tables, transcribed from NHBC Standards 2026, shown after answering */
const TABLES = {
  'ch62-t1': {
    label: 'Ch 6.2 Table 1 — Gap sizes with masonry cladding to accommodate differential movement',
    html: `<div class="tblwrap"><table>
      <tr><th>Gap location</th><th>Solid timber joists (mm)</th><th>Engineered I-joists (mm)</th></tr>
      <tr><td>Eaves/verge</td><td colspan="2">Add 5mm to gap dimension at level below</td></tr>
      <tr><td>Sixth floor</td><td rowspan="3">Specialist calculations to be submitted to NHBC</td><td>61</td></tr>
      <tr><td>Fifth floor</td><td>53</td></tr>
      <tr><td>Fourth floor</td><td>45</td></tr>
      <tr><td>Third floor</td><td>45</td><td>35</td></tr>
      <tr><td>Second floor</td><td>35</td><td>25</td></tr>
      <tr><td>First floor</td><td>20</td><td>15</td></tr>
      <tr><td>Ground floor</td><td>5</td><td>5</td></tr>
    </table></div>
    <div class="tnote">Assumes a concrete ground floor (timber ground floor: add 15mm for solid joists, 10mm for engineered), brick expansion no greater than 2.5mm per storey, and brickwork up to five storeys.</div>`
  },
  'ch33-t1': {
    label: 'Ch 3.3 Table 1 — Timber component groups and preservative treatment (condensed)',
    html: `<div class="tblwrap"><table>
      <tr><th>Component</th><th>Use Class</th><th>Desired Service Life</th><th>Treatment required</th></tr>
      <tr><td>Internal joinery</td><td>1</td><td>60 yrs</td><td>No</td></tr>
      <tr><td>Intermediate floor joists (not built into solid external walls)</td><td>1</td><td>60 yrs</td><td>No</td></tr>
      <tr><td>Joists built into solid external walls</td><td>2</td><td>60 yrs</td><td>Yes</td></tr>
      <tr><td>Ground floor joists</td><td>2</td><td>60 yrs</td><td>Yes</td></tr>
      <tr><td>Normal pitched roof timbers</td><td>1</td><td>60 yrs</td><td>No</td></tr>
      <tr><td>Tiling battens; flat roof / high condensation risk timbers</td><td>2</td><td>60 yrs</td><td>Yes</td></tr>
      <tr><td>Timber frame wall timbers and sole plates</td><td>2</td><td>60 yrs</td><td>Yes</td></tr>
      <tr><td>Coated external joinery/cladding</td><td>3.1</td><td>30 yrs</td><td>Yes</td></tr>
      <tr><td>Uncoated external joinery/cladding</td><td>3.2</td><td>30 yrs</td><td>Yes</td></tr>
      <tr><td>Deck boards</td><td>3.2</td><td>15 yrs</td><td>Yes</td></tr>
      <tr><td>Deck posts, deck joists and beams, external stairs</td><td>4</td><td>15 yrs</td><td>Yes</td></tr>
    </table></div>
    <div class="tnote">Condensed from the full table — see Clause 3.3.2 for the complete component groups and natural durability alternatives.</div>`
  }
};
function tableBlock(q){
  const t = q.table && TABLES[q.table];
  if(!t) return '';
  return `<details class="reft"><summary>View the table</summary>
    <div class="tname">${t.label}</div>${t.html}</details>`;
}

function explBlock(q, picked){
  const ok = picked===q.correct;
  return `<div class="expl">
    <div class="verdict ${ok?'ok':'no'}">${ok?'Correct':'Not quite'}</div>
    <div>${esc(q.explanation)}</div>
    <span class="cl">${esc(q.source || 'NHBC Standards 2026')} &middot; ${esc(q.refLabel || 'Clause')} ${esc(q.ref)}</span>
    ${q.why ? `<div class="whybox"><span class="lbl">Why it matters</span>${esc(q.why)}</div>` : ''}
    ${tableBlock(q)}
  </div>`;
}

function finish(){
  const n = S.qs.length;
  let right = 0;
  S.qs.forEach((q,i)=>{ if(S.answers[i]===q.correct) right++; });
  const pct = Math.round(right/n*100);
  const when = new Date().toLocaleDateString('en-GB',{day:'numeric',month:'short'}) + ', ' +
               new Date().toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'});
  store.add({ pct, label: S.mode==='battle' ? S.label+' — '+S.pts.toLocaleString()+' pts' : S.label, when });

  // per-part breakdown
  const parts = {};
  S.qs.forEach((q,i)=>{
    parts[q.part] = parts[q.part] || {n:0,r:0};
    parts[q.part].n++; if(S.answers[i]===q.correct) parts[q.part].r++;
  });
  const band = pct>=90 ? 'Excellent — site-ready knowledge' :
               pct>=PASS ? 'Pass — solid working knowledge' :
               pct>=60 ? 'Below the mark — review the clauses below' :
               'Needs work — go back through the flagged chapters';
  S.result = { right, n, pct };
  const isBattle = S.mode==='battle';
  const hero = isBattle ? `
  <div class="card scorehead">
    <div class="big">${S.pts.toLocaleString()}</div>
    <div class="band ${pct>=PASS?'ok':'no'}">points &middot; ${right}/${n} correct</div>
    <div class="detail">${esc(S.label)}${S.bestStreak>=3?` &middot; best streak &#128293; ${S.bestStreak}`:''}</div>
    <div class="rankline" id="rankline"></div>
    <div class="savenote warn" id="savenote">Posting your score&hellip;</div>
  </div>
  <div class="card" id="miniboard" style="margin-top:12px"></div>` : `
  <div class="card scorehead">
    <div class="big">${pct}%</div>
    <div class="band ${pct>=PASS?'ok':'no'}">${band}</div>
    <div class="detail">${right} of ${n} correct &middot; ${esc(S.label)} &middot; pass mark ${PASS}%</div>
  </div>`;
  app.innerHTML = mast() + hero + `
  <div class="card break" style="margin-top:12px">
    <h3>By part</h3>
    ${Object.entries(parts).map(([p,v])=>`
      <div class="brow"><span>${esc(p)}</span><span class="n">${v.r}/${v.n}</span>
      <span class="bar"><i style="width:${v.r/v.n*100}%"></i></span></div>`).join('')}
  </div>
  <div class="filterrow review-toggle">
    <button class="fbtn on" data-f="wrong">Review mistakes (${n-right})</button>
    <button class="fbtn" data-f="all">All ${n}</button>
  </div>
  <div id="revlist"></div>
  <div class="quiznav">
    <button class="btn btn-ghost" id="again" style="flex:1">Same again</button>
    <button class="btn btn-primary" id="homebtn" style="flex:1">Home</button>
  </div>`;
  window.scrollTo(0,0);

  const renderRev = f => {
    document.getElementById('revlist').innerHTML = S.qs.map((q,i)=>{
      const picked = S.answers[i], ok = picked===q.correct;
      if(f==='wrong' && ok) return '';
      return `<div class="card rev">
        <div class="qmeta" style="margin-top:0"><span class="part">Q${i+1} &middot; ${esc(q.part)}</span>
        <span class="clause">Ch ${esc(q.chapter)}</span></div>
        <div class="qtext">${esc(q.question)}</div>
        ${!ok ? `<div class="ans you"><span class="tag">Your answer</span><span>${picked!==undefined?esc(q.options[picked]):'Not answered'}</span></div>`:''}
        <div class="ans cor"><span class="tag">Correct</span><span>${esc(q.options[q.correct])}</span></div>
        <div class="exline">${esc(q.explanation)}<span class="cl">${esc(q.source || 'NHBC Standards 2026')} &middot; ${esc(q.refLabel || 'Clause')} ${esc(q.ref)}</span></div>
        ${q.why ? `<div class="whybox"><span class="lbl">Why it matters</span>${esc(q.why)}</div>` : ''}
        ${tableBlock(q)}
      </div>`;
    }).join('') || `<div class="card rev" style="text-align:center;color:var(--muted)">Nothing to review — full marks on this one.</div>`;
  };
  renderRev(right===n ? 'all' : 'wrong');
  if(right===n){ document.querySelector('[data-f="all"]').classList.add('on'); document.querySelector('[data-f="wrong"]').classList.remove('on'); }
  document.querySelectorAll('.fbtn').forEach(b=>{
    b.onclick = ()=>{ document.querySelectorAll('.fbtn').forEach(x=>x.classList.remove('on')); b.classList.add('on'); renderRev(b.dataset.f); };
  });
  document.getElementById('again').onclick = ()=>{
    if(S.mode==='battle') startBattle();
    else if(S.mode==='test' && S.buildKey) startQuiz('test', buildPool(BUILDS[S.buildKey]), S.label, S.buildKey);
    else startQuiz(S.mode, S.mode==='test'?QUESTIONS:S.qs.concat(), S.label);
  };
  document.getElementById('homebtn').onclick = home;

  if(isBattle){
    if(pct>=PASS) confettiBurst();
    const nm = playerName()||'Anon';
    const mySite = getSite();
    const entry = { id: nm.replace(/\W+/g,'')+'-'+Date.now()+'-'+Math.floor(Math.random()*1e6),
      name: nm, pts: S.pts, correct: right, n, week: isoWeek(),
      site: mySite ? mySite.id : null, siteName: mySite ? mySite.name : null, siteType: mySite ? mySite.type : null,
      date: new Date().toLocaleDateString('en-GB',{day:'numeric',month:'short'}), when: Date.now() };
    const note = document.getElementById('savenote');
    const renderMini = ()=>{
      if(!LB.entries.some(e=>e.id===entry.id)) LB.entries = mergeEntries(LB.entries.concat([entry]));
      const wk = isoWeek();
      const rows = LB.entries.filter(e=>e.week===wk).sort((a,b)=>b.pts-a.pts || (b.when||0)-(a.when||0));
      const rank = rows.findIndex(e=>e.id===entry.id)+1;
      const rl = document.getElementById('rankline');
      if(rl && rank){
        const lg = leagueRows(), lgPos = lg.findIndex(r=>r.name.trim().toLowerCase()===entry.name.trim().toLowerCase())+1;
        const wkTxt = rank===1 ? "Top this week! \u{1F3C6}" : `${rank}${rank===2?'nd':rank===3?'rd':'th'} of ${rows.length} this week`;
        rl.textContent = lgPos ? `${wkTxt} · ${lgPos}${lgPos===1?'st':lgPos===2?'nd':lgPos===3?'rd':'th'} in the league` : wkTxt;
      }
      const mb = document.getElementById('miniboard');
      if(mb) mb.innerHTML = `<div style="padding:12px 14px 2px"><h3 style="font-size:13px;letter-spacing:.9px;text-transform:uppercase;color:var(--muted)">This week's battle</h3></div>` +
        rows.slice(0,5).map((e,i)=>{
          const medal = i===0?'&#129351;':i===1?'&#129352;':i===2?'&#129353;':(i+1);
          return `<div class="lb-row${e.id===entry.id?' me':''}"><span class="rank">${medal}</span>
            <span class="who">${esc(e.name)}<br><span class="sub">${e.correct}/${e.n} correct</span></span>
            <span class="pts">${(e.pts||0).toLocaleString()}</span></div>`;
        }).join('');
    };
    renderMini();
    postScore(entry).then(status=>{
      if(status!=='shared') store.addLocalLB(entry);
      if(note){
        if(status==='shared'){ note.className='savenote ok'; note.textContent='Score posted to the shared leaderboard'; }
        else if(status==='readonly'){ note.className='savenote warn'; note.textContent="View-only link — your score is saved on this phone, not the shared board"; }
        else if(status==='pending'){ note.className='savenote warn'; note.textContent='Board was busy — your score will post on the next refresh'; }
        else { note.className='savenote warn'; note.textContent='Shared board not reachable here — score kept on this phone'; }
      }
      renderMini();
    });
  }
}

/* ---------- auto-update: keep everyone on the latest version without reinstalling ---------- */
let SITE_TAG = null;
async function checkForUpdate(){
  try{
    const r = await fetch(location.pathname + (location.pathname.includes('?')?'&':'?') + '_v=' + Date.now(), {cache:'no-store', method:'HEAD'});
    const tag = r.headers.get('etag') || r.headers.get('last-modified');
    if(!tag) return;
    if(SITE_TAG === null){ SITE_TAG = tag; return; }
    if(tag !== SITE_TAG && S === null){ location.reload(); }
  }catch(e){ /* offline or blocked — just skip this check */ }
}
document.addEventListener('visibilitychange', ()=>{ if(document.visibilityState==='visible') checkForUpdate(); });
setInterval(checkForUpdate, 5*60*1000);
setTimeout(checkForUpdate, 4000);

(async function boot(){
  const a = await ensureFreshToken();
  if(a && a.username){ setPlayerName(a.username); home(); }
  else { authScreen(); }
})();
</script>
