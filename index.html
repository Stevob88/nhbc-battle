<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NHBC Standards Trainer</title>
</head>
<body>
<title>NHBC Standards Trainer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@600;700&family=Barlow:wght@400;500;600&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
:root{
  --bg:#EEF4F8; --surface:#FFFFFF; --surface2:#E1EBF2; --ink:#1C2B36; --muted:#5D7285;
  --line:#D5E2EB; --accent:#2E86C1; --accent-ink:#1B5E8A; --accent-soft:#D9EAF6;
  --good:#2E9E5B; --good-soft:#E0F2E7; --bad:#D64545; --bad-soft:#FAE3E1;
  --shadow:0 1px 2px rgba(28,43,54,.06),0 4px 14px rgba(28,43,54,.05);
}
/* Deliberately light-only: the app keeps its light site-progress palette in any viewer theme */
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{
  background:var(--bg); color:var(--ink);
  font-family:'Barlow',system-ui,-apple-system,"Segoe UI",sans-serif;
  font-size:16.5px; line-height:1.5; min-height:100vh;
}
.wrap{max-width:680px;margin:0 auto;padding:20px 16px 72px}
h1,h2,h3{font-family:'Barlow Semi Condensed','Barlow',sans-serif;line-height:1.15;text-wrap:balance}
.mono{font-family:'IBM Plex Mono',ui-monospace,monospace;font-variant-numeric:tabular-nums}
button{font:inherit;color:inherit;cursor:pointer;border:none;background:none;-webkit-tap-highlight-color:transparent}
button:focus-visible,a:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:6px}

/* masthead */
.mast{display:flex;align-items:center;gap:12px;padding:6px 0 18px}
.mast .mark{width:40px;height:40px;flex:none;border-radius:8px;background:var(--ink);color:var(--bg);
  display:grid;place-items:center;font-family:'Barlow Semi Condensed';font-weight:700;font-size:15px;letter-spacing:.5px;
  position:relative;overflow:hidden}
.mast .mark::after{content:"";position:absolute;inset:auto 0 0 0;height:6px;
  background:repeating-linear-gradient(-45deg,var(--accent) 0 6px,var(--ink) 6px 12px)}
.mast h1{font-size:21px;font-weight:700;letter-spacing:.2px}
.mast .sub{font-size:13px;color:var(--muted);letter-spacing:.4px;text-transform:uppercase}

.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow)}

/* home */
.mode{display:flex;gap:14px;width:100%;text-align:left;padding:18px;align-items:center;margin-bottom:12px;
  transition:transform .08s ease}
.mode:active{transform:scale(.99)}
.mode .glyph{width:52px;height:52px;flex:none;border-radius:10px;display:grid;place-items:center;background:var(--accent-soft)}
.mode .glyph svg{width:26px;height:26px;stroke:var(--accent-ink);fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.mode h2{font-size:19px;margin-bottom:2px}
.mode p{font-size:14.5px;color:var(--muted)}
.mode .chev{margin-left:auto;color:var(--muted);flex:none}
.statline{display:flex;gap:8px;flex-wrap:wrap;margin:4px 0 18px}
.chip{font-size:12.5px;padding:4px 10px;border-radius:999px;background:var(--surface2);color:var(--muted);
  letter-spacing:.4px;text-transform:uppercase;font-weight:600}
.hist{margin-top:26px}
.hist h3{font-size:13px;letter-spacing:.9px;text-transform:uppercase;color:var(--muted);margin-bottom:10px}
.hist-row{display:flex;align-items:center;gap:10px;padding:10px 14px;border-bottom:1px solid var(--line);font-size:14.5px}
.hist-row:last-child{border-bottom:none}
.hist-row .when{color:var(--muted);margin-left:auto;font-size:13px}
.scorepill{font-family:'IBM Plex Mono',monospace;font-weight:600;font-size:13px;padding:2px 8px;border-radius:6px}
.pass{background:var(--good-soft);color:var(--good)} .fail{background:var(--bad-soft);color:var(--bad)}

/* setup */
.backlink{display:inline-flex;align-items:center;gap:6px;color:var(--muted);font-size:14px;font-weight:500;margin-bottom:14px}
.topic{display:flex;width:100%;text-align:left;gap:12px;align-items:center;padding:13px 16px;border-bottom:1px solid var(--line)}
.topic:last-child{border-bottom:none}
.topic .box{width:22px;height:22px;flex:none;border:2px solid var(--muted);border-radius:6px;display:grid;place-items:center}
.topic.on .box{background:var(--accent);border-color:var(--accent)}
.topic.on .box svg{display:block;width:14px;height:14px;stroke:#FFFFFF;stroke-width:3;fill:none;stroke-linecap:round;stroke-linejoin:round}
.topic .box svg{display:none}
.topic .n{margin-left:auto;color:var(--muted);font-size:13px}
.setup-actions{position:sticky;bottom:0;padding:14px 0;background:linear-gradient(transparent,var(--bg) 30%)}

/* buttons */
.btn{display:flex;justify-content:center;align-items:center;gap:8px;width:100%;padding:15px;border-radius:10px;
  font-family:'Barlow Semi Condensed';font-weight:700;font-size:17.5px;letter-spacing:.4px}
.btn-primary{background:var(--ink);color:var(--bg)}
.btn-primary:disabled{opacity:.4;cursor:default}
.btn-ghost{border:1.5px solid var(--line);color:var(--ink)}

/* quiz */
.rail{position:sticky;top:0;z-index:5;background:var(--bg);padding:10px 0 12px}
.rail-top{display:flex;align-items:baseline;gap:10px;margin-bottom:8px}
.rail-top .count{font-family:'IBM Plex Mono',monospace;font-size:14px;font-weight:600}
.rail-top .mode-tag{font-size:12px;letter-spacing:.8px;text-transform:uppercase;color:var(--muted);font-weight:600}
.rail-top .quit{margin-left:auto;color:var(--muted);font-size:13.5px;font-weight:500}
.track{height:6px;border-radius:3px;background:var(--surface2);overflow:hidden}
.fill{height:100%;border-radius:3px;background:var(--accent);transition:width .25s ease}
.qmeta{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:16px 0 10px}
.qmeta .part{font-size:12px;letter-spacing:.7px;text-transform:uppercase;font-weight:600;color:var(--muted)}
.qmeta .clause{font-family:'IBM Plex Mono',monospace;font-size:12px;font-weight:600;padding:3px 8px;
  border-radius:6px;background:var(--accent-soft);color:var(--accent-ink)}
.qtext{font-family:'Barlow Semi Condensed';font-weight:600;font-size:22px;line-height:1.3;margin-bottom:18px;text-wrap:balance}
.opt{display:flex;gap:12px;width:100%;text-align:left;align-items:flex-start;padding:14px 15px;margin-bottom:10px;
  border:1.5px solid var(--line);border-radius:10px;background:var(--surface);font-size:16.5px;line-height:1.4;
  transition:border-color .12s ease, background .12s ease}
.opt .key{flex:none;width:26px;height:26px;border-radius:7px;display:grid;place-items:center;margin-top:1px;
  background:var(--surface2);color:var(--muted);font-family:'Barlow Semi Condensed';font-weight:700;font-size:14px}
.opt.sel{border-color:var(--ink);background:var(--surface2)}
.opt.sel .key{background:var(--ink);color:var(--bg)}
.opt.right{border-color:var(--good);background:var(--good-soft)}
.opt.right .key{background:var(--good);color:#fff}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.opt.wrong .key{background:var(--bad);color:#fff}
.opt:disabled{cursor:default}
.expl{border-left:4px solid var(--accent);background:var(--surface);border-radius:0 10px 10px 0;
  padding:13px 15px;margin:6px 0 14px;font-size:15px;box-shadow:var(--shadow)}
.expl .verdict{font-family:'Barlow Semi Condensed';font-weight:700;font-size:15px;letter-spacing:.4px;text-transform:uppercase;margin-bottom:4px}
.expl .verdict.ok{color:var(--good)} .expl .verdict.no{color:var(--bad)}
.expl .cl{font-family:'IBM Plex Mono',monospace;font-size:12.5px;color:var(--muted);margin-top:6px;display:block}
.quiznav{display:flex;gap:10px;margin-top:16px}

/* reference tables in feedback */
.reft{margin-top:10px;border-top:1px dashed var(--line);padding-top:8px}
.reft summary{cursor:pointer;font-weight:600;font-size:14px;color:var(--accent-ink);list-style:none}
.reft summary::before{content:"▸ "}
.reft[open] summary::before{content:"▾ "}
.reft .tname{font-size:13px;color:var(--muted);margin:8px 0 6px}
.reft .tblwrap{overflow-x:auto}
.reft table{border-collapse:collapse;font-size:13px;min-width:430px;font-variant-numeric:tabular-nums}
.reft th,.reft td{border:1px solid var(--line);padding:5px 8px;text-align:left;vertical-align:top}
.reft th{background:var(--surface2);font-weight:600}
.reft .tnote{font-size:12px;color:var(--muted);margin-top:6px}

/* results */
.scorehead{text-align:center;padding:30px 20px 24px}
.scorehead .big{font-family:'IBM Plex Mono',monospace;font-weight:600;font-size:52px;line-height:1}
.scorehead .band{font-family:'Barlow Semi Condensed';font-weight:700;font-size:19px;margin-top:8px}
.scorehead .band.ok{color:var(--good)} .scorehead .band.no{color:var(--bad)}
.scorehead .detail{color:var(--muted);font-size:14.5px;margin-top:6px}
.break{padding:6px 16px 14px}
.break h3{font-size:13px;letter-spacing:.9px;text-transform:uppercase;color:var(--muted);margin:10px 0}
.brow{display:grid;grid-template-columns:1fr auto;gap:4px 10px;padding:7px 0;font-size:14.5px;border-top:1px solid var(--line)}
.brow .bar{grid-column:1/-1;height:5px;border-radius:3px;background:var(--surface2);overflow:hidden}
.brow .bar i{display:block;height:100%;background:var(--accent)}
.brow .n{font-family:'IBM Plex Mono',monospace;font-size:13px;color:var(--muted)}
.review-toggle{margin:18px 0 10px}
.rev{padding:16px;margin-bottom:12px}
.rev .qtext{font-size:17.5px;margin-bottom:10px}
.rev .ans{display:flex;gap:8px;align-items:flex-start;font-size:15px;padding:8px 10px;border-radius:8px;margin-bottom:6px}
.rev .ans .tag{flex:none;font-family:'Barlow Semi Condensed';font-weight:700;font-size:12px;letter-spacing:.5px;
  text-transform:uppercase;padding:2px 7px;border-radius:5px;margin-top:2px}
.rev .ans.you .tag{background:var(--bad-soft);color:var(--bad)}
.rev .ans.cor .tag{background:var(--good-soft);color:var(--good)}
.rev .exline{font-size:14.5px;color:var(--muted);margin-top:8px}
.rev .exline .cl{font-family:'IBM Plex Mono',monospace;font-size:12.5px;display:block;margin-top:5px}
.filterrow{display:flex;gap:8px;margin:14px 0}
.fbtn{padding:7px 14px;border-radius:999px;border:1.5px solid var(--line);font-size:14px;font-weight:500}
.fbtn.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}

/* game layer */
.namechip{display:inline-flex;align-items:center;gap:6px;font-size:13.5px;font-weight:600;color:var(--accent-ink);
  background:var(--accent-soft);border-radius:999px;padding:5px 12px;margin-bottom:14px}
.mode.battle{border-color:var(--accent);border-width:2px}
.mode.battle .glyph{background:var(--accent)}
.mode.battle .glyph svg{stroke:#fff}
.ptspop{position:fixed;left:50%;top:38%;transform:translateX(-50%);font-family:'Barlow Semi Condensed';
  font-weight:700;font-size:34px;color:var(--good);pointer-events:none;z-index:20;
  animation:pop .9s ease-out forwards}
@keyframes pop{0%{opacity:0;transform:translateX(-50%) translateY(10px) scale(.8)}
  20%{opacity:1;transform:translateX(-50%) translateY(0) scale(1.05)}
  100%{opacity:0;transform:translateX(-50%) translateY(-34px) scale(1)}}
.streak{font-size:13px;font-weight:700;color:var(--accent-ink);background:var(--accent-soft);
  border-radius:999px;padding:3px 10px}
.ptsline{font-family:'IBM Plex Mono',monospace;font-size:13px;font-weight:600;color:var(--muted)}
.namescreen input{width:100%;padding:14px;font:inherit;font-size:17px;border:1.5px solid var(--line);
  border-radius:10px;background:var(--surface);color:var(--ink);margin:10px 0 14px}
.namescreen input:focus{outline:3px solid var(--accent);border-color:var(--accent)}
.lb-row{display:flex;align-items:center;gap:10px;padding:11px 14px;border-bottom:1px solid var(--line);font-size:15px}
.lb-row:last-child{border-bottom:none}
.lb-row .rank{flex:none;width:32px;font-family:'Barlow Semi Condensed';font-weight:700;font-size:16px;color:var(--muted)}
.lb-row .who{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lb-row .sub{font-size:12.5px;color:var(--muted);font-weight:400}
.lb-row .pts{margin-left:auto;font-family:'IBM Plex Mono',monospace;font-weight:600;font-size:15px}
.lb-row.me{background:var(--accent-soft);border-radius:8px}
.lb-empty{padding:22px 16px;text-align:center;color:var(--muted);font-size:14.5px}
.savenote{font-size:13.5px;padding:10px 14px;border-radius:8px;margin-top:10px;text-align:center}
.savenote.ok{background:var(--good-soft);color:var(--good)}
.savenote.warn{background:var(--surface2);color:var(--muted)}
.invite{display:flex;justify-content:center;align-items:center;gap:8px;width:100%;padding:13px;margin-top:14px;
  border:1.5px dashed var(--accent);border-radius:10px;color:var(--accent-ink);
  font-family:'Barlow Semi Condensed';font-weight:700;font-size:16px;letter-spacing:.3px;background:var(--surface)}
.invite svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.rankline{font-family:'Barlow Semi Condensed';font-weight:700;font-size:20px;text-align:center;margin-top:4px}
#confetti{position:fixed;inset:0;pointer-events:none;z-index:30}

.footer{margin-top:40px;font-size:12.5px;color:var(--muted);line-height:1.55;text-align:center}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
@media (max-width:420px){.qtext{font-size:20px}.scorehead .big{font-size:44px}}
</style>

<div class="wrap" id="app"></div>

<script>
const QUESTIONS = [{"id":"2.1-01","chapter":"2.1","chapterTitle":"The Standards and Technical Requirements","part":"Introduction","question":"The NHBC Standards 2026 come into effect for which NHBC registered homes?","options":["Homes whose foundations are begun on or after 1 January 2026","Homes completed on or after 1 January 2026","Homes reserved or sold on or after 1 January 2026","Homes whose foundations are begun on or after 1 April 2026"],"correct":0,"explanation":"The Application of the Standards section in Chapter 2.1 states the Standards come into effect for every NHBC registered home whose foundations are begun on or after 1 January 2026, and apply throughout the UK unless otherwise stated.","ref":"2.1"},{"id":"2.1-02","chapter":"2.1","chapterTitle":"The Standards and Technical Requirements","part":"Introduction","question":"In the NHBC Standards chapters, how are the Technical Requirements — which must be met by the builder — shown?","options":["In bold black text backed with a shaded box","In blue text","In black italic text","In underlined black text"],"correct":1,"explanation":"Chapter 2.1 states the Technical Requirements are shown in blue text and must be met by the builder; performance standards are the items shown in bold black text backed with a shaded box.","ref":"2.1"},{"id":"2.1-03","chapter":"2.1","chapterTitle":"The Standards and Technical Requirements","part":"Introduction","question":"Under Technical Requirement R3, unless agreed otherwise in writing with NHBC, the structure of the home must have a life of at least how many years?","options":["25 years","40 years","50 years","60 years"],"correct":3,"explanation":"Technical Requirement R3 states that the structure of the home shall, unless specifically agreed otherwise in writing with NHBC, have a life of at least 60 years; non-integral components may have a lesser durability with planned maintenance.","ref":"R3"},{"id":"2.1-04","chapter":"2.1","chapterTitle":"The Standards and Technical Requirements","part":"Introduction","question":"Under Technical Requirement R5, the foundations and superstructure of every building over how many storeys must be designed by a Chartered Civil or Structural Engineer accepted by NHBC?","options":["Two storeys","Three storeys","Four storeys","Five storeys"],"correct":1,"explanation":"Technical Requirement R5 requires the foundations and superstructure of every building over three storeys in height to be designed by Chartered Civil or Structural Engineers whose status, including professional indemnity insurance, is accepted by NHBC.","ref":"R5"},{"id":"2.1-05","chapter":"2.1","chapterTitle":"The Standards and Technical Requirements","part":"Introduction","question":"You are running a site in Scotland where the foundations have been engineer-designed. Under Technical Requirement R5, who may undertake the structural design?","options":["The builder's own in-house engineer","The specialist subcontractor's design engineer","An engineer independent of the builder and specialist subcontractor","Any engineer employed directly by the builder"],"correct":2,"explanation":"Technical Requirement R5 states that in Scotland the engineer shall be independent of the builder and specialist subcontractor, whereas in England, Wales, Northern Ireland and the Isle of Man the builder's own engineer may design.","ref":"R5"},{"id":"2.1-06","chapter":"2.1","chapterTitle":"The Standards and Technical Requirements","part":"Introduction","question":"Where the NHBC Standards refer to British Standards, which editions of those documents apply, unless NHBC agrees otherwise in writing?","options":["The editions current when the contract was signed","The editions current when work starts on site","The editions current at the time of Building Regulation approval","The editions current when the home is completed"],"correct":2,"explanation":"The Standards and codes of practice section of Chapter 2.1 states that referenced documents shall be the editions current at the time of Building Regulation approval, unless other recommendations are agreed by NHBC in writing.","ref":"2.1"},{"id":"3.1-01","chapter":"3.1","chapterTitle":"Concrete and its reinforcement","part":"General","question":"A small quantity of concrete is being mixed by hand on site. How should the cement quantity be adjusted compared with the standard mix proportions?","options":["Add an extra 5% of cement","Add an extra 10% of cement","Add an extra 15% of cement","Add an extra 20% of cement"],"correct":1,"explanation":"Clause 3.1.4 states that where hand mixing, an extra 10% of cement should be added to the quantities shown in Tables 2 and 3; except for very small quantities, a mechanical mixer should be used.","ref":"3.1.4"},{"id":"3.1-02","chapter":"3.1","chapterTitle":"Concrete and its reinforcement","part":"General","question":"Ready-mixed concrete is acceptable to NHBC from suppliers operating under which quality control scheme?","options":["The Quality Scheme for Ready Mixed Concrete (QSRMC) or the BSI Kitemark scheme","The CARES certification scheme","The Considerate Constructors Scheme","The WRAP Quality Protocol scheme"],"correct":0,"explanation":"Clause 3.1.5 states ready-mixed concrete is acceptable from suppliers operating under a full quality control scheme such as QSRMC or the BSI Kitemark scheme; other suppliers may be suitable if they operate to an equivalent standard acceptable to NHBC.","ref":"3.1.5"},{"id":"3.1-03","chapter":"3.1","chapterTitle":"Concrete and its reinforcement","part":"General","question":"What consistence class should be used for trench fill foundation concrete?","options":["S1","S2","S3","S4"],"correct":3,"explanation":"Note 1 to Table 4 in Clause 3.1.6.1 states consistence class S3 should be used for strip foundation concrete and consistence class S4 should be used for trench fill foundation concrete.","ref":"3.1.6.1"},{"id":"3.1-04","chapter":"3.1","chapterTitle":"Concrete and its reinforcement","part":"General","question":"For concrete not designed by an engineer, what is the minimum cover to reinforcement where the concrete is in contact with the ground?","options":["40mm","50mm","75mm","100mm"],"correct":2,"explanation":"Table 8 in Clause 3.1.9.3 gives a minimum cover of 75mm for concrete in contact with the ground; external conditions require 50mm and casting against adequate blinding concrete requires 40mm.","ref":"3.1.9.3"},{"id":"3.1-05","chapter":"3.1","chapterTitle":"Concrete and its reinforcement","part":"General","question":"What is the maximum spacing for supports (spacers) under reinforcement?","options":["500mm apart","600mm apart","750mm apart","One metre apart"],"correct":3,"explanation":"Clause 3.1.10.3 states supports should be placed no more than one metre apart, or closer where necessary, and spacers for parallel bars should be staggered to avoid creating a plane of weakness.","ref":"3.1.10.3"},{"id":"3.1-06","chapter":"3.1","chapterTitle":"Concrete and its reinforcement","part":"General","question":"Within what time should site-mixed concrete be placed after mixing?","options":["15 minutes","30 minutes","45 minutes","60 minutes"],"correct":1,"explanation":"Clause 3.1.14 states site-mixed concrete should be placed within 30 minutes, while ready-mixed concrete should be placed within the time recommended by the supplier or required by the specification.","ref":"3.1.14"},{"id":"3.1-07","chapter":"3.1","chapterTitle":"Concrete and its reinforcement","part":"General","question":"What is the maximum area of reinforced concrete that should be cast in one operation without construction joints?","options":["16m²","40m²","60m²","100m²"],"correct":2,"explanation":"Clause 3.1.14 states concrete cast in one operation should be as square in shape as possible and not greater than 60m² for reinforced concrete or 16m² for unreinforced concrete.","ref":"3.1.14"},{"id":"3.1-08","chapter":"3.1","chapterTitle":"Concrete and its reinforcement","part":"General","question":"A reinforced concrete slab has just been poured. For how long should the structure normally remain unloaded while it cures?","options":["Two days","Four days","Five days","Seven days"],"correct":3,"explanation":"Clause 3.1.15 states reinforced concrete, or concrete containing cement replacements such as PFA, requires a longer curing period, normally seven days, during which the structure should not be loaded.","ref":"3.1.15"},{"id":"3.1-09","chapter":"3.1","chapterTitle":"Concrete and its reinforcement","part":"General","question":"During a cold spell, a subcontractor suggests adding an air-entraining agent to act as an anti-freeze for a fresh concrete pour. What does the standard say?","options":["It is acceptable provided the agent is dosed correctly","Air-entraining agents should not be used as an anti-freeze for fresh concrete, though they can increase frost resistance of cured concrete","It is acceptable only in unreinforced concrete mixes","It is acceptable provided NHBC is notified before the pour"],"correct":1,"explanation":"Clause 3.1.7 states air-entraining agents should not be used as an anti-freeze for fresh concrete, although they can increase the frost resistance of cured concrete and are recommended for paths, drives and pavements exposed to freezing.","ref":"3.1.7"},{"id":"3.1-10","chapter":"3.1","chapterTitle":"Concrete and its reinforcement","part":"General","question":"To limit the risk of alkali-silica reaction, the alkali content of a concrete mix should not exceed what value?","options":["3kg/m³","4.5kg/m³","6kg/m³","7.5kg/m³"],"correct":0,"explanation":"Clause 3.1.6.6 states that alkali content, calculated in accordance with BRE Digest 330 or Concrete Society Technical Report 30, should not exceed 3kg/m³.","ref":"3.1.6.6"},{"id":"3.2-01","chapter":"3.2","chapterTitle":"Cold weather working","part":"General","question":"What is the minimum temperature of ready-mixed concrete when delivered to site in cold weather?","options":["2°C","3°C","5°C","7°C"],"correct":2,"explanation":"Clause 3.2.4 states the minimum temperature of ready-mixed concrete when delivered should be 5°C, in accordance with BS EN 206.","ref":"3.2.4"},{"id":"3.2-02","chapter":"3.2","chapterTitle":"Cold weather working","part":"General","question":"The air temperature has dropped to 2°C and site-mixed concrete work is to continue with heated mixing water. What is the maximum temperature the mixing water should be heated to?","options":["30°C","40°C","50°C","60°C"],"correct":3,"explanation":"Clause 3.2.4 states that if the air temperature drops to 2°C, work should not proceed unless precautions are taken, including heating the mixing water but not above 60°C; cement should not be heated.","ref":"3.2.4"},{"id":"3.2-03","chapter":"3.2","chapterTitle":"Cold weather working","part":"General","question":"Below what air temperature condition should brickwork and blockwork not be built?","options":["3°C and falling","2°C and falling","1°C and falling","5°C and falling"],"correct":0,"explanation":"Clause 3.2.5 states brickwork and blockwork should not be built when the air temperature is below 3°C and falling; work can resume when the temperature is 1°C and rising with the expectation it will exceed 3°C.","ref":"3.2.5"},{"id":"3.2-04","chapter":"3.2","chapterTitle":"Cold weather working","part":"General","question":"Depending on the severity of the conditions, new masonry may need protection against frost for up to how long?","options":["Four days","Six days","Eight days","Ten days"],"correct":1,"explanation":"Clause 3.2.5 states protection against frost may be required for up to six days, depending on the severity of the conditions.","ref":"3.2.5"},{"id":"3.2-05","chapter":"3.2","chapterTitle":"Cold weather working","part":"General","question":"Warm air heaters have been used so plastering can go ahead in cold weather. For how long, as a minimum, should heating continue after the work is completed?","options":["12 hours","24 hours","48 hours","72 hours"],"correct":2,"explanation":"Clause 3.2.6 states heating should continue for at least 48 hours after completion of the work, but not be excessive, to avoid damage to screeds, plaster finishes and woodwork.","ref":"3.2.6"},{"id":"3.2-06","chapter":"3.2","chapterTitle":"Cold weather working","part":"General","question":"Paint should not be applied where the air temperature is below, or likely to fall below, what temperature?","options":["2°C","3°C","5°C","7°C"],"correct":0,"explanation":"Clause 3.2.8 states paint should not be applied where the air temperature is below, or likely to fall below, 2°C, or on surfaces affected by damp, frost or condensation.","ref":"3.2.8"},{"id":"3.3-01","chapter":"3.3","chapterTitle":"Timber preservation (natural solid timber)","part":"General","question":"Which situation does Use Class 4 describe for wood or wood-based products?","options":["Inside a construction, not exposed to weather or wetting","Under cover, with only occasional wetting from condensation","Above ground and exposed to the weather","In direct contact with the ground and/or fresh water"],"correct":3,"explanation":"The definitions in Chapter 3.3 (based on BS EN 335) state Use Class 4 is a situation in which the wood or wood-based product is in direct contact with ground and/or fresh water.","ref":"3.3"},{"id":"3.3-02","chapter":"3.3","chapterTitle":"Timber preservation (natural solid timber)","part":"General","question":"For timber preservation purposes, which Use Class do ground floor joists fall into?","options":["Use Class 1","Use Class 2","Use Class 3.1","Use Class 4"],"correct":1,"explanation":"Table 1 in Clause 3.3.2 places ground floor joists in Use Class 2 with a 60-year Desired Service Life, requiring preservative treatment or a minimum natural Durability Class of 2 in lieu of treatment.","ref":"3.3.2","table":"ch33-t1"},{"id":"3.3-03","chapter":"3.3","chapterTitle":"Timber preservation (natural solid timber)","part":"General","question":"The base of a timber support post to an open porch should be at least how far above the adjacent ground level?","options":["75mm","100mm","150mm","225mm"],"correct":2,"explanation":"Note 6 to Table 1 in Clause 3.3.2 states the base of support posts should be at least 150mm above adjacent ground level, supported on a free draining post base.","ref":"3.3.2","table":"ch33-t1"},{"id":"3.3-04","chapter":"3.3","chapterTitle":"Timber preservation (natural solid timber)","part":"General","question":"A joiner has cross cut lengths of preservative-treated timber on site. What does the standard require for the cut ends?","options":["Re-treat them with a suitable brush-applied preservative, normally colour tinted","No action, as pressure treatment penetrates the full timber section","Seal them with a coat of external-grade paint or stain","Return the timber to the treatment plant for re-processing"],"correct":0,"explanation":"Clause 3.3.5 states cut ends should be re-treated with a suitable brush-applied preservative in accordance with the manufacturer's recommendations, using a colour tinted preservative to confirm re-treatment unless tinting would affect the appearance of fixed timber.","ref":"3.3.5"},{"id":"3.3-05","chapter":"3.3","chapterTitle":"Timber preservation (natural solid timber)","part":"General","question":"Where likely wetting is expected, what fittings should be used in contact with timber treated with copper-containing preservatives?","options":["Galvanized fittings","Bright mild steel fittings","Aluminium fittings","Austenitic stainless steel fittings"],"correct":3,"explanation":"Clause 3.3.6 states that with copper-containing preservative treatments, galvanized fittings should be used for occasional dampness and austenitic stainless steel fittings where likely wetting is expected.","ref":"3.3.6"},{"id":"3.3-06","chapter":"3.3","chapterTitle":"Timber preservation (natural solid timber)","part":"General","question":"Before preservative treated timber comes into contact with metal fittings, it should be re-dried to what maximum moisture content?","options":["16%","18%","20%","22%"],"correct":3,"explanation":"Clause 3.3.6 states preservative treated timber should be re-dried to a moisture content of 22% or less before being in contact with metal fittings.","ref":"3.3.6"},{"id":"3.3-07","chapter":"3.3","chapterTitle":"Timber preservation (natural solid timber)","part":"General","question":"What is the Desired Service Life for standard deck posts, deck joists and beams?","options":["15 years","30 years","45 years","60 years"],"correct":0,"explanation":"Table 1 in Clause 3.3.2 gives deck posts, deck joists and beams and external stairs a Use Class of 4 and a Desired Service Life of 15 years, with preservative treatment required or minimum natural Durability Class 2.","ref":"3.3.2","table":"ch33-t1"},{"id":"4.1-01","chapter":"4.1","chapterTitle":"Land quality – managing ground conditions","part":"Foundations","question":"A site is classed as hazardous. How far in advance of work starting must NHBC be notified in writing?","options":["A minimum of 2 weeks","A minimum of 4 weeks","A minimum of 8 weeks","A minimum of 12 weeks"],"correct":2,"explanation":"Clause 4.1.1.4 states that where a site is classed as hazardous, NHBC must be notified in writing a minimum of eight weeks before work starts, otherwise registration, construction and the issuing of the warranty may be delayed.","ref":"4.1.1.4"},{"id":"4.1-02","chapter":"4.1","chapterTitle":"Land quality – managing ground conditions","part":"Foundations","question":"In a Basic Investigation, what is the general minimum depth for trial pits?","options":["1.5m","2m","2.5m","3m"],"correct":3,"explanation":"Clause 4.1.5 states trial pits should be located outside the proposed foundation area and generally be a minimum of 3m deep, with the distance from the edge of the foundation not less than the depth of the pit.","ref":"4.1.5"},{"id":"4.1-03","chapter":"4.1","chapterTitle":"Land quality – managing ground conditions","part":"Foundations","question":"Where contamination is suspected or found, which framework should be used to assess the site?","options":["Source-Pathway-Receptor","Hazard-Exposure-Outcome","Cause-Effect-Control","Risk-Route-Remedy"],"correct":0,"explanation":"Clause 4.1.1.2 states that where contamination is suspected or found, the site should be assessed using the Source-Pathway-Receptor framework (known as the pollutant linkage), with a Conceptual Model showing the possible relationships between each.","ref":"4.1.1.2"},{"id":"4.1-04","chapter":"4.1","chapterTitle":"Land quality – managing ground conditions","part":"Foundations","question":"What does NHBC require as the Initial Assessment on every site?","options":["A desk study only","A walkover survey only","A desk study and a walkover survey","A Basic Investigation with trial pits"],"correct":2,"explanation":"Clause 4.1.1.3 states NHBC requires all sites to be assessed by a desk study and a walkover survey, the results of which determine whether hazards are known or suspected.","ref":"4.1.1.3"},{"id":"4.1-05","chapter":"4.1","chapterTitle":"Land quality – managing ground conditions","part":"Foundations","question":"The Basic Investigation on your site reveals a suspected contamination hazard. What does the standard require next?","options":["Extra trial pits dug and logged by the site team","A Detailed Investigation supervised by a consultant or specialist acceptable to NHBC","Immediate remediation followed by re-testing of the soil","Notification to the local authority before continuing the groundworks"],"correct":1,"explanation":"Clause 4.1.6 requires that where hazards are identified or suspected, including from the Basic Investigation, a Detailed Investigation is conducted under the supervision of a consultant or specialist acceptable to NHBC.","ref":"4.1.6"},{"id":"4.1-06","chapter":"4.1","chapterTitle":"Land quality – managing ground conditions","part":"Foundations","question":"During foundation excavation you uncover unexpected made ground with a strong odour that was not identified in the site investigation. What should happen?","options":["Backfill the area and record it in the site diary","Remove the suspect material off site and carry on","Ask the NHBC inspector to sign the excavation off","Obtain specialist advice so the hazard is properly investigated, managed and verified"],"correct":3,"explanation":"Clause 4.1.8 states that where additional or unforeseen hazards arise during construction, specialist advice is required so that the hazard is properly investigated, managed and verified, to the satisfaction of NHBC.","ref":"4.1.8"},{"id":"4.1-07","chapter":"4.1","chapterTitle":"Land quality – managing ground conditions","part":"Foundations","question":"Capping material of unknown origin is being used for a clean cover system on a site of 25 plots. What chemical testing frequency does the standard suggest?","options":["1 test per 3 plots, with a minimum of 7 tests per material","1 test per 2 plots, with a minimum of 5 tests per material","1 test per 4 plots, with a minimum of 10 tests per material","1 test per plot, with a minimum of 3 tests per material"],"correct":0,"explanation":"Table 4 in Clause 4.1.9.1 gives a nominal sampling frequency of 1 test per 3 plots for sites of 21 to 30 plots, with a suggested minimum of 7 tests per site of each material used within the capping layer.","ref":"4.1.9.1"},{"id":"4.1-08","chapter":"4.1","chapterTitle":"Land quality – managing ground conditions","part":"Foundations","question":"Which statement about radon barriers and gas membranes is correct?","options":["Barriers made from recycled products are acceptable if independently assessed","Barriers and membranes manufactured from recycled products should not be used","A radon barrier can be assumed effective against methane and carbon dioxide","Recycled-product barriers may be used below DPC level only"],"correct":1,"explanation":"Clause 4.1.7.1 states that some radon barriers and gas membranes are manufactured from recycled products but these should not be used, and that a radon barrier should not be assumed effective against other hazardous gases without further specialist advice.","ref":"4.1.7.1"},{"id":"4.2-01","chapter":"4.2","chapterTitle":"Building near trees","part":"Foundations","question":"How does the standard classify a shrinkable soil?","options":["Over 35% fine particles and a Modified Plasticity Index of 10% or greater","Over 20% fine particles and a Modified Plasticity Index of 20% or greater","Over 50% fine particles and a Modified Plasticity Index of 10% or greater","Over 35% fine particles and a Modified Plasticity Index of 20% or greater"],"correct":0,"explanation":"Clause 4.2.4.1 defines shrinkable soils as those with over 35% fine particles and a Modified Plasticity Index of 10% or greater.","ref":"4.2.4.1"},{"id":"4.2-02","chapter":"4.2","chapterTitle":"Building near trees","part":"Foundations","question":"Different foundation types should not be used to support the same structure unless what applies?","options":["The foundation and superstructure design are undertaken by an engineer","The two foundation types are approved separately by NHBC","The foundations are separated by a continuous movement joint","The structure is a single-storey garage, porch or conservatory"],"correct":0,"explanation":"Clause 4.2.5 states different foundation types should not be used to support the same structure unless the foundation and superstructure design are undertaken by an engineer.","ref":"4.2.5"},{"id":"4.2-03","chapter":"4.2","chapterTitle":"Building near trees","part":"Foundations","question":"At what Modified Plasticity Index is a soil classed as having HIGH volume change potential?","options":["20% and greater","30% and greater","35% and greater","40% and greater"],"correct":3,"explanation":"Table 1 in Clause 4.2.4.1 classes a Modified Plasticity Index of 40% and greater as high volume change potential; 20% to less than 40% is medium and 10% to less than 20% is low.","ref":"4.2.4.1"},{"id":"4.2-04","chapter":"4.2","chapterTitle":"Building near trees","part":"Foundations","question":"If the volume change potential of the soil is unknown, what should be assumed?","options":["Low volume change potential","Medium volume change potential","High volume change potential","The average of results from adjacent sites"],"correct":2,"explanation":"Clause 4.2.4.1 states that high volume change potential should be assumed if the volume change potential is unknown.","ref":"4.2.4.1"},{"id":"4.2-05","chapter":"4.2","chapterTitle":"Building near trees","part":"Foundations","question":"A tree close to a plot cannot be identified by species. What water demand should be assumed for the foundation design?","options":["Moderate water demand","High water demand","Low water demand","None, until the species is confirmed by an arboriculturalist"],"correct":1,"explanation":"Clause 4.2.4.2 states that where the species of a tree has not been identified, high water demand should be assumed.","ref":"4.2.4.2"},{"id":"4.2-06","chapter":"4.2","chapterTitle":"Building near trees","part":"Foundations","question":"A broad-leafed tree has been identified but its species is not listed in the water demand tables. Which species groups should then be assumed to have HIGH water demand?","options":["All elms, eucalyptus, hawthorn, oaks, poplars and willows","All ash, beech, lime and sycamore","All coniferous species over 15m mature height","All fruit-bearing and orchard species"],"correct":0,"explanation":"Table 2 in Clause 4.2.4.2 states that for identified but unlisted broad-leafed trees, all elms, eucalyptus, hawthorn, oaks, poplars and willows are high water demand, and all others are moderate water demand.","ref":"4.2.4.2"},{"id":"4.2-07","chapter":"4.2","chapterTitle":"Building near trees","part":"Foundations","question":"What is the lateral zone of influence of a HIGH water demand tree?","options":["0.5 times its mature height","0.75 times its mature height","1.0 times its mature height","1.25 times its mature height"],"correct":3,"explanation":"Table 3b in Clause 4.2.4.2 gives the zone of influence as 1.25 x mature height for high water demand, 0.75 x for moderate and 0.5 x for low water demand trees.","ref":"4.2.4.2"},{"id":"4.2-08","chapter":"4.2","chapterTitle":"Building near trees","part":"Foundations","question":"What reduction in foundation depth can be made to allow for climate on sites away from London?","options":["25mm for every 50 miles north and west of London","50mm for every 50 miles north and west of London","50mm for every 100 miles north and west of London","100mm for every 50 miles north and west of London"],"correct":1,"explanation":"Clause 4.2.4.3 permits a 50mm decrease to the derived foundation depth for every 50 miles distance north and west of London; where it is unclear which zone applies, the lower reduction value should be used.","ref":"4.2.4.3"},{"id":"4.2-09","chapter":"4.2","chapterTitle":"Building near trees","part":"Foundations","question":"The assessed foundation depth within the influence of trees comes out at more than 2.5m. What does the standard require?","options":["Proceed with trench fill provided heave precautions are doubled","Proceed if a registered arboriculturalist approves the depth","The foundation should be designed by an engineer in accordance with Technical Requirement R5","Reduce the depth to 2.5m and add compressible material to both faces"],"correct":2,"explanation":"Clause 4.2.7.3 states that foundations deeper than 2.5m should be designed by an engineer in accordance with Technical Requirement R5.","ref":"4.2.7.3"},{"id":"4.2-10","chapter":"4.2","chapterTitle":"Building near trees","part":"Foundations","question":"Within what depth of the surface are the majority of tree roots found?","options":["300mm","450mm","600mm","900mm"],"correct":2,"explanation":"Clause 4.2.3.2 states that roots often extend to distances in excess of the height of the tree, the majority are within 600mm of the surface, and they project radially.","ref":"4.2.3.2"},{"id":"4.2-11","chapter":"4.2","chapterTitle":"Building near trees","part":"Foundations","question":"A single tree is to be protected during construction. What size of protective fence or barrier does the standard describe around the trunk?","options":["A circle of radius 6 times the trunk diameter, measured at ground level","A circle of radius 10 times the trunk diameter, measured 1.0m above ground level","A circle of radius equal to the mature height of the tree","A circle of radius 12 times the trunk diameter, measured 1.5m above ground level"],"correct":3,"explanation":"Clause 4.2.3.2 states the fence or barrier should extend around a single trunk equivalent to a circle of radius 12 times the trunk diameter, measured 1.5m above ground level.","ref":"4.2.3.2"},{"id":"4.2-12","chapter":"4.2","chapterTitle":"Building near trees","part":"Foundations","question":"A sapling less than 50% of its mature height is removed from within 2m of the face of the proposed foundation. What distance D should be used to derive the foundation depth?","options":["The actual measured distance from trunk to foundation face","D = 2m","D = 0m, as the tree was on the foundation line","D = half the mature height of the tree"],"correct":1,"explanation":"Clause 4.2.7.2 states D = 2m where trees removed from within 2m of the face of the proposed foundation are less than 50% of the mature height, avoiding an unnecessarily deep foundation from a D/H value of zero.","ref":"4.2.7.2"},{"id":"4.2-13","chapter":"4.2","chapterTitle":"Building near trees","part":"Foundations","question":"What is the standard's position on root barriers in shrinkable soils?","options":["They are acceptable if independently assessed","They are acceptable with prior NHBC approval","They are acceptable for low water demand trees only","They are not an acceptable alternative to the guidance given"],"correct":3,"explanation":"Clause 4.2.7.1 states plainly that root barriers are not an acceptable alternative to the guidance given.","ref":"4.2.7.1"},{"id":"4.2-14","chapter":"4.2","chapterTitle":"Building near trees","part":"Foundations","question":"In a HIGH volume change potential soil, where all planting is outside the zone of influence of trees, what is the minimum foundation depth?","options":["0.75m","0.9m","1.0m","1.5m"],"correct":2,"explanation":"Table 4b in Clause 4.2.7.4 gives a minimum foundation depth of 1.0m in high volume change potential soil where planting is outside the zone of influence of trees (column B); column A, allowing restricted new planting, requires 1.5m.","ref":"4.2.7.4"},{"id":"4.2-15","chapter":"4.2","chapterTitle":"Building near trees","part":"Foundations","question":"Pyracantha with a mature height exceeding 1.8m is to be planted near new foundations. What does the standard require?","options":["The deeper foundation depth and planting at least 1.0 x mature height from the foundation, or the standard depth and planting at least 0.5 x mature height away","The deeper foundation depth with no restriction on planting distance","The standard foundation depth and planting at least 1.5 x mature height from the foundation","The deeper foundation depth and planting at least 0.25 x mature height from the foundation"],"correct":0,"explanation":"Table 6 in Clause 4.2.7.5 (where column A is the standard foundation depth and column B the deeper one) requires pyracantha and cotoneaster over 1.8m mature height to use the column B depth and be planted at least 1.0 x mature height from the foundation, or use the column A depth planted at least 0.5 x mature height away.","ref":"4.2.7.5"},{"id":"4.2-16","chapter":"4.2","chapterTitle":"Building near trees","part":"Foundations","question":"Foundations are proposed on non-shrinkable sand overlying shrinkable clay. One condition is that the thickness of non-shrinkable soil below the foundation must be at least what?","options":["Half the width of the foundation","Equal to or more than the width of the foundation","150mm below the underside of the foundation","Equal to the full depth of the foundation"],"correct":1,"explanation":"Clause 4.2.9.1 requires the thickness T of non-shrinkable soil below the foundation to be equal to, or more than, the width of the foundation B, alongside conditions including the non-shrinkable depth exceeding three-quarters of depth X and prior NHBC approval.","ref":"4.2.9.1"},{"id":"4.2-17","chapter":"4.2","chapterTitle":"Building near trees","part":"Foundations","question":"A tree has been removed from a plot on shrinkable soil. How is the required foundation depth selected?","options":["Use the shallower of the tree-based depth and the minimum foundation depth","Always use the depth based on the mature height of the removed tree","Use the deepest of the depth based on the appropriate tree height and the standard minimum foundation depth","Use the minimum foundation depth only, as the tree no longer takes water"],"correct":2,"explanation":"Figure 6 of Clause 4.2.9.2 requires the deepest of (a) the foundation depth based on the appropriate tree height (see Table 3a) and (b) the minimum foundation depth from Table 4b column B, where trees or hedgerows are removed.","ref":"4.2.9.2"},{"id":"4.2-18","chapter":"4.2","chapterTitle":"Building near trees","part":"Foundations","question":"Where granular infill is used beneath a raft foundation on shrinkable soil, what depth rules apply to the infill?","options":["At least 25% of the trench fill foundation depth and not more than 1.0m deep","At least 50% of the trench fill foundation depth and not more than 1.25m deep","At least 75% of the trench fill foundation depth and not more than 2.5m deep","Any depth, provided it is fully compacted in layers"],"correct":1,"explanation":"Clause 4.2.9.3 requires the infill to be at least 50% of the foundation depth determined for a trench fill foundation and not more than 1.25m deep, and to extend beyond the foundation edge by its natural angle of repose plus 0.5m.","ref":"4.2.9.3"},{"id":"4.2-19","chapter":"4.2","chapterTitle":"Building near trees","part":"Foundations","question":"Where foundations are stepped to take account of the influence of trees, what is the maximum height of each step?","options":["0.3m","0.45m","0.5m","1.0m"],"correct":2,"explanation":"Clause 4.2.9.4 states that where foundations are stepped to take account of the influence of trees, hedgerows and shrubs, they should be stepped gradually with no step exceeding 0.5m.","ref":"4.2.9.4"},{"id":"4.2-20","chapter":"4.2","chapterTitle":"Building near trees","part":"Foundations","question":"In a HIGH volume change potential soil, what void dimension is required against the side of a foundation or ground beam?","options":["25mm","35mm","50mm","150mm"],"correct":1,"explanation":"Table 7 in Clause 4.2.10.2 requires a 35mm void dimension against the side of foundations and ground beams in high volume change potential soil (25mm for medium, 0mm for low).","ref":"4.2.10.2"},{"id":"4.2-21","chapter":"4.2","chapterTitle":"Building near trees","part":"Foundations","question":"Significant quantities of roots are unexpectedly encountered in the base of a foundation trench in clay. What should be done?","options":["Cut out the roots and place the concrete the same day","Deepen the trench by a standard 300mm and proceed","Line the trench bottom with polythene before concreting","Consult an engineer to determine if the excavation should be deepened"],"correct":3,"explanation":"Clause 4.2.6 states that if significant quantities of roots are unexpectedly encountered in the base of the trench, an engineer should be consulted to determine if the excavation should be deepened.","ref":"4.2.6"},{"id":"4.2-22","chapter":"4.2","chapterTitle":"Building near trees","part":"Foundations","question":"Unless NHBC is satisfied the soil is not desiccated, compressible material is required to the inside faces of external trench fill foundations deeper than what?","options":["0.75m","1.0m","1.25m","1.5m"],"correct":3,"explanation":"Table 8 in Clause 4.2.10.4 requires compressible material to the inside faces of external trench fill wall foundations deeper than 1.5m, based on the appropriate tree height, unless NHBC is satisfied the soil is not desiccated.","ref":"4.2.10.4"},{"id":"4.2-23","chapter":"4.2","chapterTitle":"Building near trees","part":"Foundations","question":"When designing new drainage in a HIGH volume change potential soil, what minimum allowance for potential ground movement should be made?","options":["100mm","150mm","200mm","250mm"],"correct":1,"explanation":"Table 9 in Clause 4.2.11 gives a minimum allowance for potential ground movement of 150mm for high, 100mm for medium and 50mm for low volume change potential soils.","ref":"4.2.11"},{"id":"4.2-24","chapter":"4.2","chapterTitle":"Building near trees","part":"Foundations","question":"For a raft foundation to be acceptable in shrinkable soil, its plan shape should generally be rectangular with a side ratio of not more than what?","options":["2:1","3:1","4:1","5:1"],"correct":0,"explanation":"Clause 4.2.8 states raft foundations in shrinkable soils are only acceptable where, among other conditions, the raft is generally rectangular in plan with a side ratio of not more than 2:1, is engineer designed, and its depth is less than 2.5m.","ref":"4.2.8"},{"id":"4.3-01","chapter":"4.3","chapterTitle":"Strip and trench fill foundations","part":"Foundations","question":"In frost susceptible soils such as chalk, what is the minimum depth to the underside of the foundation below finished ground level?","options":["300mm","350mm","400mm","450mm"],"correct":3,"explanation":"Clause 4.3.3.3 requires the depth to the underside of the foundation to be at least 450mm below finished ground level in frost susceptible soils, to avoid damage from frost action.","ref":"4.3.3.3"},{"id":"4.3-02","chapter":"4.3","chapterTitle":"Strip and trench fill foundations","part":"Foundations","question":"Which of the following situations requires the strip or trench fill foundation to be designed by an engineer in accordance with Technical Requirement R5?","options":["The building exceeds three storeys in height","The trench fill foundation is deeper than 1.5m","The building is two storeys with an attached garage","The soil has medium volume change potential"],"correct":0,"explanation":"Clause 4.3.1 requires engineer design in accordance with Technical Requirement R5 where buildings exceed three storeys, supporting/retaining walls form habitable rooms below ground, trench fill foundations are deeper than 2.5m, or foundations are deeper than those of an adjoining construction.","ref":"4.3.1"},{"id":"4.3-03","chapter":"4.3","chapterTitle":"Strip and trench fill foundations","part":"Foundations","question":"As a minimum, the width of a foundation should not be less than the wall thickness plus how much each side?","options":["25mm","50mm","75mm","100mm"],"correct":1,"explanation":"Clause 4.3.7.2 states the foundation width should not be less than the wall thickness plus at least 50mm each side, and must also suit the loads and the load-bearing capacity of the subsoil.","ref":"4.3.7.2"},{"id":"4.3-04","chapter":"4.3","chapterTitle":"Strip and trench fill foundations","part":"Foundations","question":"What is the minimum thickness for a trench fill foundation?","options":["300mm","450mm","500mm","600mm"],"correct":2,"explanation":"Clause 4.3.7.2 requires trench fill foundations to be a minimum of 500mm thick, while strip foundations should be 150mm to 500mm thick and equal to the projection or 150mm, whichever is greater.","ref":"4.3.7.2"},{"id":"4.3-05","chapter":"4.3","chapterTitle":"Strip and trench fill foundations","part":"Foundations","question":"For a stepped trench fill foundation, what is the minimum overlap at each step?","options":["Twice the step height or one metre, whichever is largest","Twice the step height or 500mm, whichever is largest","The step height or 300mm, whichever is largest","The foundation thickness or 300mm, whichever is largest"],"correct":0,"explanation":"Table 3 in Clause 4.3.8 requires the overlap for trench fill foundations to be not less than 2 x S or one metre, whichever is largest; for strip foundations it is 2 x S, T (maximum 500mm) or 300mm, whichever is largest.","ref":"4.3.8"},{"id":"4.3-06","chapter":"4.3","chapterTitle":"Strip and trench fill foundations","part":"Foundations","question":"A drain needs to cross the line of a strip foundation. How should this be dealt with?","options":["Cast the pipe rigidly into the foundation concrete","Pass the service through the masonry above the foundation, with adequate lintels provided","Core-drill an opening through the strip foundation once the concrete has cured","Sleeve the pipe directly through the strip foundation concrete"],"correct":1,"explanation":"Clause 4.3.6.2 states services should not pass through strip foundations but through the masonry above, with adequate lintels provided; sleeving or strengthened openings are the approach for trench fill foundations.","ref":"4.3.6.2"},{"id":"4.4-01","chapter":"4.4","chapterTitle":"Raft, pile, pier and beam foundations","part":"Foundations","question":"In frost susceptible ground, what is the minimum depth to the underside of a foundation below finished ground level?","options":["300mm","400mm","450mm","600mm"],"correct":2,"explanation":"Clause 4.4.3.4 states that to avoid damage from frost action, the depth to the underside of the foundation in frost susceptible ground should be at least 450mm below finished ground level.","ref":"4.4.3.4"},{"id":"4.4-02","chapter":"4.4","chapterTitle":"Raft, pile, pier and beam foundations","part":"Foundations","question":"When designing a semi-raft foundation on engineered fill, what is the maximum area permitted between downstand beams?","options":["30m²","35m²","40m²","50m²"],"correct":1,"explanation":"Clause 4.4.6 states that for semi-raft foundations on engineered fill, the area between downstand beams should not be greater than 35m², with the ratio of adjacent sides on plan not exceeding 2:1.","ref":"4.4.6"},{"id":"4.4-03","chapter":"4.4","chapterTitle":"Raft, pile, pier and beam foundations","part":"Foundations","question":"During excavation for a ground beam you uncover an existing drain crossing the trench. How should it be dealt with?","options":["Supported, protected and bridged so that it carries no load","Rigidly encased in concrete as the beam is poured","Backfilled around with well-compacted hardcore","Left as found, provided it is recorded on the drawings"],"correct":0,"explanation":"Clause 4.4.5.2 requires existing services or drains to be supported and protected, bridged to prevent any load carrying, and not rigidly encased in concrete or masonry.","ref":"4.4.5.2"},{"id":"4.4-04","chapter":"4.4","chapterTitle":"Raft, pile, pier and beam foundations","part":"Foundations","question":"A soft spot is found in the bottom of a foundation trench. What does the standard require?","options":["Fill the soft area with compacted hardcore up to trench bottom level","Cast the foundation as designed and monitor for settlement","Report it to NHBC and suspend all foundation work on site","Deepen the excavation locally to a sound bottom, or reinforce the concrete"],"correct":3,"explanation":"Table 1 in Clause 4.4.7.2 states that at soft spots, excavations should be deepened locally to a sound bottom, or the concrete should be reinforced; hard spots, by contrast, should be removed.","ref":"4.4.7.2"},{"id":"4.4-05","chapter":"4.4","chapterTitle":"Raft, pile, pier and beam foundations","part":"Foundations","question":"Piles found to be out of position by more than what distance require the engineer to reconsider the adequacy of the foundation design?","options":["50mm","65mm","75mm","100mm"],"correct":2,"explanation":"Clause 4.4.7.3 states that where piles are more than 75mm out of position, or out of alignment by more than 1:75, the engineer should reconsider the adequacy of the foundation design.","ref":"4.4.7.3"},{"id":"4.4-06","chapter":"4.4","chapterTitle":"Raft, pile, pier and beam foundations","part":"Foundations","question":"Where strip, trench fill or ground beam foundations are used, what minimum clear cavity should be provided below the DPC?","options":["100mm","150mm","175mm","225mm"],"correct":3,"explanation":"Clause 4.4.13 requires a minimum 225mm clear cavity below the DPC where strip, trench fill or ground beams are used; a minimum 150mm clear cavity applies to other foundation types, provided weepholes and other measures allow the cavity to drain freely.","ref":"4.4.13"},{"id":"4.5-01","chapter":"4.5","chapterTitle":"Vibratory ground improvement techniques","part":"Foundations","question":"Clay ground is generally unacceptable for vibratory ground improvement where its Plasticity Index is equal to or greater than what value?","options":["30%","40%","50%","60%"],"correct":1,"explanation":"Table 2 in Clause 4.5.6.1 lists ground with a Plasticity Index of 40% or greater as not generally acceptable for treatment.","ref":"4.5.6.1"},{"id":"4.5-02","chapter":"4.5","chapterTitle":"Vibratory ground improvement techniques","part":"Foundations","question":"Intermediate layers of peat within the length of a stone column make the ground generally unacceptable for vibro treatment when their thickness exceeds what?","options":["100mm","150mm","200mm","300mm"],"correct":2,"explanation":"Clause 4.5.6.1 states ground is not generally acceptable where intermediate layers of peat are thicker than 200mm, either as a single layer or as the sum of individual layers throughout the length of the stone column.","ref":"4.5.6.1"},{"id":"4.5-03","chapter":"4.5","chapterTitle":"Vibratory ground improvement techniques","part":"Foundations","question":"Where soils have a Modified Plasticity Index of what value or greater should foundations on vibro-treated ground be designed to accommodate volume changes?","options":["10%","15%","20%","25%"],"correct":0,"explanation":"Clause 4.5.6.2 states that for soils with a Modified Plasticity Index of 10% or greater, foundations should be designed to accommodate volume changes.","ref":"4.5.6.2"},{"id":"4.5-04","chapter":"4.5","chapterTitle":"Vibratory ground improvement techniques","part":"Foundations","question":"Which foundation types are suitable for homes built on ground treated with vibro stone columns?","options":["Mass concrete trench fill or pad and beam foundations","Reinforced concrete strip, or reinforced concrete raft or semi-raft foundations","Unreinforced strip foundations laid on compressible board","Any foundation type, provided the stone columns pass load testing"],"correct":1,"explanation":"Clause 4.5.7.3 states only two types of foundation are suitable: a reinforced concrete strip foundation, or a reinforced concrete raft or semi-raft foundation positioned on a uniformly compacted bed of hardcore.","ref":"4.5.7.3"},{"id":"4.5-05","chapter":"4.5","chapterTitle":"Vibratory ground improvement techniques","part":"Foundations","question":"What does the standard say about ground floors for homes where vibratory ground improvement has been carried out?","options":["Ground-bearing slabs are acceptable where columns are at a maximum of 2m centres","Ground-bearing slabs are acceptable on a compacted hardcore bed","Suspended floors are only needed where the fill depth exceeds 600mm","Suspended ground floors should be provided unless the engineer substantiates an alternative acceptable to NHBC"],"correct":3,"explanation":"Clause 4.5.7.4 requires suspended ground floors for all homes where vibratory ground improvement has been conducted, unless the engineer can substantiate an alternative solution that is acceptable to NHBC.","ref":"4.5.7.4"},{"id":"4.5-06","chapter":"4.5","chapterTitle":"Vibratory ground improvement techniques","part":"Foundations","question":"In the dry top feed method, how deep is each 'charge' of stone generally placed in the borehole before being compacted?","options":["300-500mm","500-800mm","800-1,000mm","1,000-1,500mm"],"correct":1,"explanation":"Clause 4.5.8 states that in the dry top feed method the charge of stone is generally 500-800mm deep, with successive charges added and compacted to bring the column up to working level.","ref":"4.5.8"},{"id":"4.5-07","chapter":"4.5","chapterTitle":"Vibratory ground improvement techniques","part":"Foundations","question":"Checks on site show a stone column has been installed 180mm out of alignment. What action does the standard require?","options":["No action, provided the columns are at a maximum of 2m centres","Pack additional stone around the head of the column","Replace it with a new column installed in the correct position","Reduce the design span of the foundation locally"],"correct":2,"explanation":"Clause 4.5.11.2 requires stone columns which are misaligned by more than 150mm in any direction to be replaced, with a new column installed in the correct position.","ref":"4.5.11.2"},{"id":"4.5-08","chapter":"4.5","chapterTitle":"Vibratory ground improvement techniques","part":"Foundations","question":"A variation in the quantity of backfill used in compaction points of the same length must be recorded and reported to the engineer and specialist contractor when it exceeds what?","options":["25%","30%","40%","50%"],"correct":3,"explanation":"Table 3 in Clause 4.5.11.3 requires a variation of over 50% in the quantity of backfill used in compaction points of the same length to be recorded and reported as soon as possible, and no later than the end of the working day of occurrence.","ref":"4.5.11.3"},{"id":"4.5-09","chapter":"4.5","chapterTitle":"Vibratory ground improvement techniques","part":"Foundations","question":"What is the minimum frequency for 600mm diameter plate tests on stone columns or treated ground?","options":["At least one test per day per rig","At least one test per week per rig","At least one test per ten stone columns","At least one test per home plot"],"correct":0,"explanation":"Table 4 in Clause 4.5.13.1 states 600mm diameter plate tests should be carried out on stone columns or treated ground at a frequency of at least one test per day per rig; mini zone tests are at least one per week per rig.","ref":"4.5.13.1"},{"id":"4.6-01","chapter":"4.6","chapterTitle":"Engineered fill","part":"Foundations","question":"Under the definitions used for engineered fill, cohesive fill contains more than what proportion of fines passing a 0.063mm sieve?","options":["10%","15%","20%","25%"],"correct":1,"explanation":"The definitions in Chapter 4.6 describe cohesive fill as comprising greater than 15% fines passing a 0.063mm sieve, while granular fill has less than 15% fines.","ref":"4.6"},{"id":"4.6-02","chapter":"4.6","chapterTitle":"Engineered fill","part":"Foundations","question":"How long before filling starts should the earthworks specification and accompanying information be submitted to NHBC?","options":["At least 2 weeks","At least 4 weeks","At least 6 weeks","At least 8 weeks"],"correct":3,"explanation":"Clause 4.6.2 requires the earthworks specification and accompanying information, including relevant drawings, to be submitted to NHBC at least eight weeks prior to the commencement of filling or associated works.","ref":"4.6.2"},{"id":"4.6-03","chapter":"4.6","chapterTitle":"Engineered fill","part":"Foundations","question":"Most residential earthworks are classified as Geotechnical Category 2. What document must be prepared and submitted to NHBC for a Geo Cat 2 project?","options":["A geotechnical design statement","An earthworks method statement only","A geotechnical design report","A materials classification assessment only"],"correct":2,"explanation":"Clause 4.6.7.1 states that where the scope of the earthworks is defined as Geo Cat 2 or 3, a Geotechnical design report (GDR) shall be prepared and submitted to NHBC; a Geotechnical design statement is only for Geo Cat 1.","ref":"4.6.7.1"},{"id":"4.6-04","chapter":"4.6","chapterTitle":"Engineered fill","part":"Foundations","question":"Before filling, excessively wet or soft soils should be removed from the formation level where their undrained shear strength is less than what value, unless they are treated?","options":["20kPa","30kPa","40kPa","50kPa"],"correct":2,"explanation":"Clause 4.6.5.1 lists excessively wet or soft soils, such as silty soils or clays with an undrained shear strength of less than 40kPa, as unsuitable materials to be removed where untreated.","ref":"4.6.5.1"},{"id":"4.6-05","chapter":"4.6","chapterTitle":"Engineered fill","part":"Foundations","question":"Where relic structures cannot practicably be removed from beneath engineered fill, what is the minimum depth they must be below the underside of proposed building foundations?","options":["1m","1.5m","1.8m","2m"],"correct":3,"explanation":"Clause 4.6.5.2 requires any retained relic structure or obstructions to be a minimum of 2m beneath the underside of proposed building foundations, with their locations surveyed and accurately recorded.","ref":"4.6.5.2"},{"id":"4.6-06","chapter":"4.6","chapterTitle":"Engineered fill","part":"Foundations","question":"Which statement about the use of Pulverised Fuel Ash (PFA) as engineered fill is correct?","options":["Conditioned or stockpiled PFA must not be placed below the water table or where it is at risk of saturation","Lagoon PFA is preferred because its moisture content is already high","PFA may be placed below the water table provided it is well compacted","PFA needs no geotechnical assessment because it is a processed by-product"],"correct":0,"explanation":"Clause 4.6.5.5 states that conditioned or stockpiled PFA must not be placed as fill below the water table or where it is at risk of saturation from rising water levels or inundation by surface waters; lagoon PFA is listed as unsuitable in Table 3.","ref":"4.6.5.5"},{"id":"4.6-07","chapter":"4.6","chapterTitle":"Engineered fill","part":"Foundations","question":"Which type of chalk is generally acceptable to NHBC as a source of engineered fill?","options":["Structureless chalk of grades Dm and Dc","Structured chalk of grades C5 to A1","Any chalk, provided it is placed in 250mm layers","Chalk blended with lagoon PFA to control moisture"],"correct":1,"explanation":"Table 3 in Clause 4.6.6.1 lists structured chalk of grades C5 to A1 only as a suitable source for fill, while structureless chalk (grades Dm and Dc) is listed as an unsuitable fill material.","ref":"4.6.6.1"},{"id":"4.6-08","chapter":"4.6","chapterTitle":"Engineered fill","part":"Foundations","question":"Fill containing topsoil or significant organic matter is not acceptable as engineered fill where the organic content exceeds what proportion by volume?","options":["2%","4%","6%","10%"],"correct":2,"explanation":"Table 3 in Clause 4.6.6.1 lists soils containing topsoil or significant organic matter (such as leaves or wood) greater than 6% by volume as unsuitable fill materials.","ref":"4.6.6.1"},{"id":"4.6-09","chapter":"4.6","chapterTitle":"Engineered fill","part":"Foundations","question":"When treating fill materials to adjust their moisture content, what is the typical maximum addition of lime and/or cement acceptable to NHBC?","options":["2% by weight","4% by weight","5% by weight","10% by weight"],"correct":0,"explanation":"Clause 4.6.6.2 permits the addition of lime and/or cement typically up to 2% by weight to bring the moisture content nearer the optimum; stabilisation with over 2% lime or any cement to improve strength is not acceptable.","ref":"4.6.6.2"},{"id":"4.6-10","chapter":"4.6","chapterTitle":"Engineered fill","part":"Foundations","question":"How does NHBC require a performance specification for earthworks to be used?","options":["On its own, as it already covers long-term requirements","In combination with an end product specification","In combination with a method specification","Only for landscape fill areas"],"correct":1,"explanation":"Clause 4.6.7.3 states that NHBC requires a performance specification to be used in combination with an end product specification.","ref":"4.6.7.3"},{"id":"4.6-11","chapter":"4.6","chapterTitle":"Engineered fill","part":"Foundations","question":"Using a 4.5kg rammer test, what are the minimum end product acceptance criteria for engineered fill supporting building foundations?","options":["Greater than 90% maximum dry density and less than 10% air voids","Greater than 92% maximum dry density and less than 8% air voids","Greater than 95% maximum dry density and less than 5% air voids","Greater than 98% maximum dry density and less than 3% air voids"],"correct":2,"explanation":"Table 6 in Clause 4.6.7.3 requires fill for building foundations to achieve greater than 95% maximum dry density and less than 5% air voids with a 4.5kg or vibrating rammer (greater than 98% MDD applies to the 2.5kg rammer).","ref":"4.6.7.3"},{"id":"4.6-12","chapter":"4.6","chapterTitle":"Engineered fill","part":"Foundations","question":"What is the acceptable minimum depth of engineered fill beneath building foundations?","options":["300mm","450mm","500mm","600mm"],"correct":3,"explanation":"The note to Table 7 in Clause 4.6.7.3 states the acceptable minimum depth of engineered fill beneath building foundations is 600mm.","ref":"4.6.7.3"},{"id":"4.6-13","chapter":"4.6","chapterTitle":"Engineered fill","part":"Foundations","question":"Engineered fill covered by this chapter should be capable of supporting foundation loads from buildings of up to how many storeys or equivalent weight?","options":["Two storeys","Three storeys","Four storeys","Five storeys"],"correct":1,"explanation":"Clause 4.6.8.1 states engineered fill covered within the chapter should be capable of supporting foundation loads from buildings of three storeys or equivalent weight.","ref":"4.6.8.1"},{"id":"4.6-14","chapter":"4.6","chapterTitle":"Engineered fill","part":"Foundations","question":"A groundworker suggests using an unreinforced strip foundation on engineered fill that has passed all compaction testing. What is NHBC's position?","options":["Unreinforced strips are not acceptable under any circumstances — all foundations on engineered fill must be reinforced","They are acceptable where all compaction results exceed 95% maximum dry density","They are acceptable if the fill is granular and less than 2m deep","They are acceptable subject to a plate load test at each plot"],"correct":0,"explanation":"Clause 4.6.8.2 states all foundations on engineered fills should be reinforced to provide the required stiffness, rigidity and robustness; unreinforced strip foundations would not be acceptable to NHBC under any circumstances.","ref":"4.6.8.2"},{"id":"4.6-15","chapter":"4.6","chapterTitle":"Engineered fill","part":"Foundations","question":"What is the normal maximum total settlement between any part of a building foundation and the surrounding ground over the design life of the building?","options":["15mm","20mm","25mm","40mm"],"correct":2,"explanation":"Clause 4.6.8.3 states the total settlement between any part of the building foundation and the surrounding ground or external area should not normally exceed 25mm over the 60-year design life.","ref":"4.6.8.3"},{"id":"4.6-16","chapter":"4.6","chapterTitle":"Engineered fill","part":"Foundations","question":"Above what height do retaining walls on engineered fill require geotechnical and structural designs?","options":["0.45m","0.6m","0.9m","1.2m"],"correct":1,"explanation":"Clause 4.6.8.4 states geotechnical and structural designs are required where retaining walls are in excess of 0.6m in height.","ref":"4.6.8.4"},{"id":"4.6-17","chapter":"4.6","chapterTitle":"Engineered fill","part":"Foundations","question":"Which of the following is classed as a non-standard compaction technique requiring details to be submitted to NHBC in writing before site works begin?","options":["Towed vibratory rollers used in accordance with SHW Table 6/4","Vibrating plate compactors working in thin layers","Smooth-wheeled deadweight rollers on granular fill","Dynamic compaction using heavy weights dropped from a crane"],"correct":3,"explanation":"Clause 4.6.9.2 lists dynamic compaction using heavy drop weights dropped from a crane, along with rapid impact compaction and high energy impact compaction, as non-standard techniques whose details should be submitted to NHBC in writing at least eight weeks before site works begin.","ref":"4.6.9.2"},{"id":"4.6-18","chapter":"4.6","chapterTitle":"Engineered fill","part":"Foundations","question":"In-situ testing shows a layer of placed fill does not meet the compaction criteria in the earthworks specification. What should happen first?","options":["Appropriate action should be agreed with NHBC as soon as possible","The layer should always be excavated and replaced in full","The next layer should be placed and the failed area retested through it","The result should simply be noted in the site diary"],"correct":0,"explanation":"Clause 4.6.10.5 requires appropriate action to be agreed as soon as possible with NHBC where testing indicates non-compliant fill; options include drying, excavation and replacement, additional compaction and retesting, or performance testing.","ref":"4.6.10.5"},{"id":"4.6-19","chapter":"4.6","chapterTitle":"Engineered fill","part":"Foundations","question":"For end product compaction, what maximum uncompacted layer thickness would generally be acceptable, subject to site-specific requirements?","options":["150mm","200mm","250mm","300mm"],"correct":2,"explanation":"Clause 4.6.10.3 states that for end product compaction an uncompacted layer thickness of up to 250mm would be acceptable, with the maximum particle size no greater than one third of the compacted layer thickness or 75mm, whichever is lower.","ref":"4.6.10.3"},{"id":"4.6-20","chapter":"4.6","chapterTitle":"Engineered fill","part":"Foundations","question":"Cohesive engineered fill compacted too dry of the optimum moisture content risks which problem?","options":["Being too weak to provide support without excessive settlement","Collapse settlement or heave when it becomes wetted","Excessive shrinkage cracking during hot weather","Frost heave during the first winter after placement"],"correct":1,"explanation":"Clause 4.6.10.3 states fill compacted too dry of the OMC risks being vulnerable to collapse settlement or heave when wetted; fill compacted too wet risks being too weak to provide adequate support.","ref":"4.6.10.3"},{"id":"4.6-21","chapter":"4.6","chapterTitle":"Engineered fill","part":"Foundations","question":"What is the minimum horizontal clearance permitted between an excavation and a foundation on engineered fill?","options":["The depth of the excavation minus the depth of the structural foundation","The depth of the excavation plus the depth of the structural foundation","Twice the depth of the excavation","A fixed clearance of 1m in all cases"],"correct":0,"explanation":"Clause 4.6.11 states the minimum horizontal clearance between excavations and foundations must not be less than the depth of excavation minus the depth of the structural foundation, with particular attention needed below the water table.","ref":"4.6.11"},{"id":"4.6-22","chapter":"4.6","chapterTitle":"Engineered fill","part":"Foundations","question":"As a minimum, how many performance tests of each type are recommended so that a trend can be observed from the results (excluding preloading by surcharge)?","options":["One","Two","Three","Five"],"correct":2,"explanation":"Clause 4.6.12.3 recommends a minimum of three tests of each type are undertaken so that a trend can be observed from the results, with the exception of preloading by surcharge.","ref":"4.6.12.3"},{"id":"4.6-23","chapter":"4.6","chapterTitle":"Engineered fill","part":"Foundations","question":"For a fill volume of less than 10,000 cubic metres, what is the minimum end product compliance testing frequency for placed engineered fill?","options":["5 tests per 1,000m³","3 tests per 1,000m³","2 tests per 1,000m³","1 test per 1,000m³"],"correct":0,"explanation":"Table 10 in Clause 4.6.12.5 requires a minimum of 5 tests per 1,000m³ for fill volumes under 10,000m³; the frequency reduces to 3 per 1,000m³ for 10,000-100,000m³ and 2 per 1,000m³ above 100,000m³.","ref":"4.6.12.5"},{"id":"4.6-24","chapter":"4.6","chapterTitle":"Engineered fill","part":"Foundations","question":"Where reinforced strip foundations are proposed on engineered fill, who should produce the earthworks verification report?","options":["A third-party organisation separate from those undertaking the works","The earthworks contractor who placed the fill","The site manager, countersigned by the builder","The groundworker, with NHBC countersignature"],"correct":0,"explanation":"Clause 4.6.13 states that where reinforced strip foundations are proposed, the report should be produced by a third-party organisation separate from those undertaking the works; for beam grillage or semi-raft foundations it may be produced by a suitably experienced earthworks contractor.","ref":"4.6.13"},{"id":"5.1-01","chapter":"5.1","chapterTitle":"Substructure and ground-bearing floors","part":"Substructure, ground floors, drainage and basements","question":"What is the maximum depth of infill permitted beneath a ground-bearing floor slab?","options":["450mm","600mm","750mm","900mm"],"correct":1,"explanation":"Clause 5.1.8 states that infill beneath ground-bearing floors shall be a maximum of 600mm deep; ground-bearing slabs are not acceptable where infill exceeds this depth.","ref":"5.1.8"},{"id":"5.1-02","chapter":"5.1","chapterTitle":"Substructure and ground-bearing floors","part":"Substructure, ground floors, drainage and basements","question":"How are shrinkable soils classified in relation to substruc
