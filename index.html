land); for four storeys or over the maximum is 1.25m.","ref":"7.2.8","why":"These straps tie the roof structure back to the gable or party wall, resisting wind suction on the wall face; too wide a spacing leaves stretches of wall unrestrained and prone to buckling outward.","source":"NHBC Standards 2026","sourceShort":"NHBC","refLabel":"Clause"},{"id":"7.2-15","chapter":"7.2","chapterTitle":"Pitched roofs","part":"Roofs","question":"What is the minimum anchorage downturn for a lateral restraint strap?","options":["100mm","120mm","150mm","200mm"],"correct":0,"explanation":"Clause 7.2.8 states lateral restraint straps should be a minimum size of 30mm x 5mm and have a minimum anchorage downturn of 100mm, with the downturn fixed on a substantial piece of blockwork.","ref":"7.2.8","why":"The downturn needs enough embedment into solid blockwork to grip and transfer the lateral wind force into the wall without the strap simply pulling out under load.","source":"NHBC Standards 2026","sourceShort":"NHBC","refLabel":"Clause"},{"id":"7.2-16","chapter":"7.2","chapterTitle":"Pitched roofs","part":"Roofs","question":"What is the minimum timber size for roof bracing to trussed rafter roofs?","options":["75mm x 25mm","89mm x 38mm","97mm x 22mm","100mm x 25mm"],"correct":3,"explanation":"Clause 7.2.9.1 states roof bracing should be provided using a minimum timber size of 100mm x 25mm (3mm tolerance).","ref":"7.2.9.1","why":"Bracing carries the lateral (racking) forces from wind that try to rack the roof out of square, so undersized timber can buckle and let trusses lean or twist out of vertical.","source":"NHBC Standards 2026","sourceShort":"NHBC","refLabel":"Clause"},{"id":"7.2-17","chapter":"7.2","chapterTitle":"Pitched roofs","part":"Roofs","question":"How should roof bracing be fixed to the rafters it crosses?","options":["Nailed once to each rafter using 2.65mm x 50mm nails","Nailed twice to each rafter using 3.35mm x 65mm galvanized round wire nails","Screwed once to alternate rafters using 4mm x 50mm screws","Nailed twice to alternate rafters using 3.35mm x 50mm nails"],"correct":1,"explanation":"Clause 7.2.9.1 states bracing should be nailed twice to each rafter it crosses, using 3.35mm x 65mm (10 gauge) galvanized round wire nails or minimum 3.1mm x 75mm mechanically driven gun nails.","ref":"7.2.9.1","why":"The nail size and count give the bracing connection enough strength to actually transfer wind-induced racking loads into the rafters, rather than the brace working loose and becoming ineffective.","source":"NHBC Standards 2026","sourceShort":"NHBC","refLabel":"Clause"},{"id":"7.2-18","chapter":"7.2","chapterTitle":"Pitched roofs","part":"Roofs","question":"On site you are building a large house with trussed rafters spanning 13m. What does the standard require for the roof bracing?","options":["The bracing should be designed by an engineer in accordance with Technical Requirement R5","Standard trussed rafter bracing in accordance with Table 6 of the chapter may be used","Chevron bracing at approximately 45 degrees nailed to three trusses is sufficient","Diagonal bracing may simply be doubled up at each gable end"],"correct":0,"explanation":"Clause 7.2.9 states that for large houses with truss spans of over 12m, homes with complex roofs or roofs near exposed sites, the bracing should be designed by an engineer in accordance with Technical Requirement R5.","ref":"7.2.9","why":"The prescriptive bracing tables in this chapter are only validated up to 12m truss spans, so beyond that the wind and stability forces fall outside what's been proven safe without specific engineering.","source":"NHBC Standards 2026","sourceShort":"NHBC","refLabel":"Clause"},{"id":"7.2-19","chapter":"7.2","chapterTitle":"Pitched roofs","part":"Roofs","question":"On a duo pitched trussed rafter roof, chevron bracing between the webs should be provided where the span exceeds what dimension?","options":["6m","8m","10m","12m"],"correct":1,"explanation":"Clause 7.2.9.2 states chevron bracing should be provided where the span exceeds 8m, at approximately 45 degrees, nailed to at least three trusses; over 11m span it should be engineer designed.","ref":"7.2.9.2","why":"Long truss webs are prone to buckling under the compressive load they carry, so chevron bracing over 8m restrains them and stops the webs bowing and distorting the whole truss.","source":"NHBC Standards 2026","sourceShort":"NHBC","refLabel":"Clause"},{"id":"7.2-20","chapter":"7.2","chapterTitle":"Pitched roofs","part":"Roofs","question":"On a mono pitched trussed rafter roof, chevron bracing between the webs should be provided where the span exceeds what dimension?","options":["4m","5m","8m","11m"],"correct":1,"explanation":"Clause 7.2.9.3 states chevron bracing to mono pitched roofs should be provided where the span exceeds 5m; for mono pitched roofs over 8m span, chevron bracing should be designed by an engineer.","ref":"7.2.9.3","why":"Mono pitched trusses are less symmetrical and their webs take more uneven load, so they need chevron restraint at a shorter span than duo pitch to prevent web buckling.","source":"NHBC Standards 2026","sourceShort":"NHBC","refLabel":"Clause"},{"id":"7.2-21","chapter":"7.2","chapterTitle":"Pitched roofs","part":"Roofs","question":"Where continuous plywood or OSB sheathing is used as diaphragm bracing to the underside of attic truss rafters, what is the minimum width of the sheathing?","options":["600mm","750mm","900mm","1200mm"],"correct":2,"explanation":"Clause 7.2.9.4 states continuous internal 9mm plywood or OSB sheathing should be a minimum of 900mm wide, face fixed to the underside of the rafters for the full length of the roof.","ref":"7.2.9.4","why":"This sheathing substitutes for diagonal bracing that's been omitted for room space, so it needs enough width to actually stiffen the roof against racking and take the nailing needed to do that job.","source":"NHBC Standards 2026","sourceShort":"NHBC","refLabel":"Clause"},{"id":"7.2-22","chapter":"7.2","chapterTitle":"Pitched roofs","part":"Roofs","question":"The floor of a site formed attic truss spans 3.5m between node points. What strutting is required?","options":["None is required for this span","One row of strutting at the centre of the span","Two rows of strutting at equal spacing","Three rows of strutting at quarter points"],"correct":1,"explanation":"Table 7 in Clause 7.2.10 requires one row of strutting at the centre of the span for floor spans of 2.5m to 4.5m; over 4.5m needs two rows at equal spacing.","ref":"7.2.10","why":"Strutting stops floor joists twisting and acting independently under load, which would otherwise let the floor bounce, crack finishes, or deflect unevenly under foot traffic and stored loads.","source":"NHBC Standards 2026","sourceShort":"NHBC","refLabel":"Clause"},{"id":"7.2-23","chapter":"7.2","chapterTitle":"Pitched roofs","part":"Roofs","question":"What is the minimum opening width for a roof void access hatch?","options":["520mm in each direction","550mm in each direction","600mm in each direction","650mm in each direction"],"correct":0,"explanation":"Clause 7.2.12.1 states access hatches should have a minimum opening width of 520mm in each direction, and should not be located directly over stairs or in other hazardous locations.","ref":"7.2.12.1","why":"This is the minimum practical size for a person to physically climb through to inspect the roof structure, so anything smaller would prevent the periodic checks needed to catch truss damage or leaks early.","source":"NHBC Standards 2026","sourceShort":"NHBC","refLabel":"Clause"},{"id":"7.2-24","chapter":"7.2","chapterTitle":"Pitched roofs","part":"Roofs","question":"Where a loft hatch has a push-up cover, what is the minimum weight of the cover needed to ensure adequate compression of the seals (unless clamps are fitted)?","options":["5.5kg","6.5kg","7.5kg","8.5kg"],"correct":0,"explanation":"Clause 7.2.12.1 states hatches should have a push-up cover with a minimum weight of 5.5kg, or be fitted with clamps, to ensure adequate compression of the seals.","ref":"7.2.12.1","why":"Enough weight is needed to compress the seal fully against the frame, since a loose-fitting hatch is a major air leakage path that lets warm moist air into the cold roof void and causes condensation.","source":"NHBC Standards 2026","sourceShort":"NHBC","refLabel":"Clause"},{"id":"7.2-25","chapter":"7.2","chapterTitle":"Pitched roofs","part":"Roofs","question":"In a site formed dormer, what should support the dormer cheek studs?","options":["A double rafter or a double floor joist","A single rafter with solid noggings","The lintel over the window opening","A trimmer bearing onto the wall plate"],"correct":0,"explanation":"Clause 7.2.13.1 states cheek studs should be supported by either a double rafter or a double floor joist.","ref":"7.2.13.1","why":"A single rafter or joist lacks the capacity to carry the extra point load from the dormer framing and cladding, so doubling it up prevents excessive deflection or local failure under that concentrated load.","source":"NHBC Standards 2026","sourceShort":"NHBC","refLabel":"Clause"},{"id":"7.2-26","chapter":"7.2","chapterTitle":"Pitched roofs","part":"Roofs","question":"What is the minimum thickness of lead used to clad dormer cheeks in a sheltered to moderate exposure zone?","options":["2.65mm code black (Code 6)","2.24mm code red (Code 5)","1.32mm code green (Code 3)","1.80mm code blue (Code 4)"],"correct":3,"explanation":"Clause 7.2.13.1 states lead used to clad dormer cheeks should be a minimum thickness of 1.80mm code blue (Code 4) or 2.24mm code red (Code 5) in a sheltered to moderate exposure zone.","ref":"7.2.13.1","why":"Dormer cheeks are near-vertical and take the full force of wind-driven rain, so the lead needs enough thickness to stay durable and resist splitting or fatigue cracking from wind flutter over time.","source":"NHBC Standards 2026","sourceShort":"NHBC","refLabel":"Clause"},{"id":"7.2-27","chapter":"7.2","chapterTitle":"Pitched roofs","part":"Roofs","question":"What is the minimum horizontal lap for an unsupported underlay on a roof pitched at less than 15 degrees?","options":["75mm","100mm","150mm","225mm"],"correct":3,"explanation":"Table 10 in Clause 7.2.14 requires a minimum 225mm horizontal lap for unsupported underlay below 15 degrees pitch; at 15 degrees and above the minimum is 150mm.","ref":"7.2.14","why":"Shallow pitches slow water run-off and let wind-driven rain track sideways more easily, so a longer lap is needed to stop water reaching the joint and penetrating before it drains away.","source":"NHBC Standards 2026","sourceShort":"NHBC","refLabel":"Clause"},{"id":"7.2-28","chapter":"7.2","chapterTitle":"Pitched roofs","part":"Roofs","question":"At abutments, what is the minimum height the roofing underlay should be supported and turned up?","options":["50mm","75mm","100mm","150mm"],"correct":2,"explanation":"Clause 7.2.14 states that at abutments the underlay should be supported and turned up by a minimum of 100mm.","ref":"7.2.14","why":"Turning the underlay up captures water running down the roof plane and off the wall face, channelling it back onto the roof instead of letting it track behind the flashing into the structure.","source":"NHBC Standards 2026","sourceShort":"NHBC","refLabel":"Clause"},{"id":"7.2-29","chapter":"7.2","chapterTitle":"Pitched roofs","part":"Roofs","question":"For a cold roof with a Type HR underlay and an air permeable covering, pitched between 10 and 15 degrees, what minimum eaves ventilation is required?","options":["3,000mm2/m","7,000mm2/m","10,000mm2/m","25,000mm2/m"],"correct":3,"explanation":"Table 11 in Clause 7.2.15.1 requires 25,000mm2/m minimum eaves/low-level ventilation for cold roofs with Type HR underlay pitched at 10 to 15 degrees; over 15 degrees the minimum is 10,000mm2/m.","ref":"7.2.15.1","why":"Shallow pitches give a shorter, more restricted airflow path through the roof void, so more eaves ventilation area is needed to properly dilute moist air and stop it condensing on cold surfaces.","source":"NHBC Standards 2026","sourceShort":"NHBC","refLabel":"Clause"},{"id":"7.2-30","chapter":"7.2","chapterTitle":"Pitched roofs","part":"Roofs","question":"A cold roof with a Type HR underlay and air permeable tiles is pitched at 40 degrees. As well as 10,000mm2/m eaves ventilation, what else is required?","options":["Eaves ventilation increased to 25,000mm2/m","An additional 5,000mm2/m of ridge or high-level ventilation beneath the underlay","No additional ventilation is required at this pitch","Counterbattens to create 25mm batten space ventilation"],"correct":1,"explanation":"Table 11 in Clause 7.2.15.1 requires an additional 5,000mm2/m ridge or high-level ventilation where the roof pitch exceeds 35 degrees, the span exceeds 10m, or the roof is a lean-to or mono pitched.","ref":"7.2.15.1","why":"On steep or long roofs the natural airflow struggles to reach right up to the ridge, so extra high-level venting stops moist air stagnating near the apex and causing condensation and timber decay there.","source":"NHBC Standards 2026","sourceShort":"NHBC","refLabel":"Clause"},{"id":"7.2-31","chapter":"7.2","chapterTitle":"Pitched roofs","part":"Roofs","question":"What is the minimum lap at joints in an AVCL, and where should the joints be located?","options":["50mm laps, located mid-way between rafters","75mm laps, located anywhere convenient","100mm laps, located on rafters","150mm laps, located on battens"],"correct":2,"explanation":"Clause 7.2.15.2 states joints in AVCLs should have 100mm minimum laps and should be located on rafters; taped joints for enhanced airtightness should still occur over rafters.","ref":"7.2.15.2","why":"Locating and lapping joints on a solid rafter lets them be properly sealed and fixed, keeping the AVCL airtight so warm moist household air can't leak into the cold roof space and condense on the timbers.","source":"NHBC Standards 2026","sourceShort":"NHBC","refLabel":"Clause"},{"id":"7.2-32","chapter":"7.2","chapterTitle":"Pitched roofs","part":"Roofs","question":"To allow for movement in roof timbers and prevent 'hogging' of the tiles, how far below the top of the adjacent roof framing should a compartment wall stop?","options":["Approximately 25mm, with a soft fire-stopping material used","Approximately 35mm, with a rigid fire-stopping board used","Approximately 50mm, with mortar packing used","It should finish level with the framing, with no gap"],"correct":0,"explanation":"Clause 7.2.16 states compartment walls should stop approximately 25mm below the top of adjacent roof framing, with a soft fire-stopping material used to allow for movement in roof timbers and prevent hogging of the tiles.","ref":"7.2.16","why":"Roof timbers naturally creep and deflect under load, and a rigid wall built tight against the roof would restrict that movement and lift the tiles at the wall line, cracking the covering (hogging).","source":"NHBC Standards 2026","sourceShort":"NHBC","refLabel":"Clause"},{"id":"7.2-33","chapter":"7.2","chapterTitle":"Pitched roofs","part":"Roofs","question":"What is the minimum length of a tiling batten, and how many rafters should it span?","options":["1.8m, spanning a minimum of four rafters","1.5m, spanning a minimum of three rafters","0.9m, spanning a minimum of two rafters","1.2m, spanning a minimum of three rafters"],"correct":3,"explanation":"Clause 7.2.17 states battens should be a minimum of 1.2m long and span a minimum of three rafters.","ref":"7.2.17","why":"A batten too short or spanning too few rafters flexes more under foot traffic or wind suction, risking it breaking or the tile fixings working loose along its length.","source":"NHBC Standards 2026","sourceShort":"NHBC","refLabel":"Clause"},{"id":"7.2-34","chapter":"7.2","chapterTitle":"Pitched roofs","part":"Roofs","question":"On a roof with a batten spacing of more than 200mm, how many battens in any group of four may be joined over any one truss or rafter?","options":["No more than one","No more than two","No more than three","All four, provided joints are skew nailed"],"correct":0,"explanation":"Clause 7.2.17 states that where batten spacing is more than 200mm, no more than one batten in any group of four should be joined over any one truss or rafter.","ref":"7.2.17","why":"Clustering too many batten joints over one rafter creates a weak line across the roof; spreading the joints keeps the fixing continuous and strong enough to resist wind uplift on the tiles.","source":"NHBC Standards 2026","sourceShort":"NHBC","refLabel":"Clause"},{"id":"7.2-35","chapter":"7.2","chapterTitle":"Pitched roofs","part":"Roofs","question":"What are the minimum length and batten penetration requirements for tile and slate fixings?","options":["A minimum of 30mm long, penetrating 10mm into battens","A minimum of 38mm long, penetrating 15mm into battens","A minimum of 45mm long, penetrating 20mm into battens","A minimum of 50mm long, penetrating 25mm into battens"],"correct":1,"explanation":"Clause 7.2.19 states fixings should be a minimum of 38mm long and penetrate a minimum of 15mm into battens.","ref":"7.2.19","why":"The fixing needs enough grip in the batten to develop sufficient pull-out resistance, otherwise wind suction on the tiles can work the nail loose and the covering can lift or slide.","source":"NHBC Standards 2026","sourceShort":"NHBC","refLabel":"Clause"},{"id":"7.2-36","chapter":"7.2","chapterTitle":"Pitched roofs","part":"Roofs","question":"What mortar mix should be used when bedding tiles or slates?","options":["1:3 cement:sand with plasticiser","1:4 cement:sand with plasticiser","1:5 cement:sand with plasticiser","1:1:6 cement:lime:sand"],"correct":0,"explanation":"Clause 7.2.19.3 states the mortar should be 1:3 cement:sand with plasticiser, based on sharp sand with soft sand added for workability, the sharp sand being not less than one third of the total sand content.","ref":"7.2.19.3","why":"This mix gives the mortar enough strength and adhesion to hold ridge and verge tiles securely, while the plasticiser keeps it workable and slightly flexible so it doesn't crack and let water in with minor thermal movement.","source":"NHBC Standards 2026","sourceShort":"NHBC","refLabel":"Clause"},{"id":"7.2-37","chapter":"7.2","chapterTitle":"Pitched roofs","part":"Roofs","question":"At abutments, what are the minimum upstand and lap for lead flashings?","options":["50mm upstand and 75mm lap","65mm upstand and 100mm lap","75mm upstand and 100mm lap","100mm upstand and 150mm lap"],"correct":2,"explanation":"Clause 7.2.20.1 states lead flashings should have a minimum upstand of 75mm and a minimum lap of 100mm, tucked 25mm into a bed joint and wedged at not more than 450mm centres.","ref":"7.2.20.1","why":"The upstand keeps the flashing clear of typical water splashback at the roof-to-wall junction while the lap keeps the joint continuous, so rainwater sheds down the slope instead of tracking sideways behind the flashing into the wall.","source":"NHBC Standards 2026","sourceShort":"NHBC","refLabel":"Clause"},{"id":"7.2-38","chapter":"7.2","chapterTitle":"Pitched roofs","part":"Roofs","question":"In a lead-lined valley, what is the maximum length of each strip of lead?","options":["1.0m","1.5m","2.0m","3.0m"],"correct":1,"explanation":"Clause 7.2.21 states lead in valleys should be laid in strips no longer than 1.5m, lapped by a minimum of 150mm where pitches are above 30 degrees.","ref":"7.2.21","why":"Lead expands and contracts noticeably with temperature, so keeping strips short limits the thermal movement in any one piece, avoiding splits or fatigue cracks that would let water into the valley.","source":"NHBC Standards 2026","sourceShort":"NHBC","refLabel":"Clause"},{"id":"7.2-39","chapter":"7.2","chapterTitle":"Pitched roofs","part":"Roofs","question":"Above what roof area should rainwater drainage be provided?","options":["Roofs greater than 10m2","Roofs greater than 8m2","Roofs greater than 4m2","Roofs greater than 6m2"],"correct":3,"explanation":"Clause 7.2.22 states drainage should be provided where roofs are greater than 6m2, with consideration given to providing drainage to smaller roofs such as dormer and porch roofs and balconies.","ref":"7.2.22","why":"A larger roof area concentrates a lot more rainwater at the eaves, and without guttering that volume causes splashback, ground erosion and water penetrating the wall base.","source":"NHBC Standards 2026","sourceShort":"NHBC","refLabel":"Clause"},{"id":"8.1-01","chapter":"8.1","chapterTitle":"Internal services","part":"Internal services and low or zero carbon technologies (LZC)","question":"What is the minimum depth below ground surface for water service pipes?","options":["450mm","600mm","750mm","900mm"],"correct":2,"explanation":"Clause 8.1.3.2 requires service pipes to be a minimum of 750mm below the ground surface; where this is not possible, adequate precautions should be taken against frost and mechanical damage.","ref":"8.1.3.2","why":"Shallower pipes are exposed to frost, which can freeze and burst them, and to damage from digging, vehicles or garden works — burying them deeper keeps them below the frost line and out of harm's way.","source":"NHBC Standards 2026","sourceShort":"NHBC","refLabel":"Clause"},{"id":"8.1-02","chapter":"8.1","chapterTitle":"Internal services","part":"Internal services and low or zero carbon technologies (LZC)","question":"The design of the water supply should be based on what minimum dynamic pressure at the stop valve inside the home?","options":["1.0 bar","1.5 bar","2.0 bar","2.5 bar"],"correct":1,"explanation":"Clause 8.1.3.2 states the design should be based on a minimum 1.5 bar dynamic pressure at the stop valve inside the home.","ref":"8.1.3.2","why":"Without a reliable minimum pressure, taps and showers on upper floors can trickle rather than flow properly, and pressure-dependent fittings like combi boilers or showers may not perform or fire up correctly.","source":"NHBC Standards 2026","sourceShort":"NHBC","refLabel":"Clause"},{"id":"8.1-03","chapter":"8.1","chapterTitle":"Internal services","part":"Internal services and low or zero carbon technologies (LZC)","question":"What minimum flow rate should be available at the stop valve inside the home?","options":["20 litres per minute","25 litres per minute","30 litres per minute","35 litres per minute"],"correct":0,"explanation":"Clause 8.1.3.2 requires a minimum of 20L/min flow rate to be available at the stop valve inside the home.","ref":"8.1.3.2","why":"A guaranteed minimum flow means baths and appliances fill in a reasonable time and multiple outlets can be used together without one starving another — poor flow leads to complaints and appliances that won't work properly.","source":"NHBC Standards 2026","sourceShort":"NHBC","refLabel":"Clause"},{"id":"8.1-04","chapter":"8.1","chapterTitle":"Internal services","part":"Internal services and low or zero carbon technologies (LZC)","question":"You are insulating a cold water tank located in an unheated loft. Where does the standard say insulation should be omitted?","options":["On the sides of the tank","Over the tank cover","Around the pipework connected to the tank","Beneath the tank"],"correct":3,"explanation":"Clause 8.1.3.4 states insulation should be provided as specified in the design, but not beneath a cold water tank, and on each side of raised tanks in unheated roof spaces.","ref":"8.1.3.4","why":"Warmth rising from the room below helps keep the tank from freezing, so insulating underneath would cut off that heat source and actually increase the risk of the tank freezing and cracking in cold weather.","source":"NHBC Standards 2026","sourceShort":"NHBC","refLabel":"Clause"},{"id":"8.1-05","chapter":"8.1","chapterTitle":"Internal services","part":"Internal services and low or zero carbon technologies (LZC)","question":"How far above the shut-off water level in a cold water cistern should the warning/overflow pipe be situated?","options":["25mm","32mm","40mm","50mm"],"correct":0,"explanation":"Clause 8.1.4.4 requires warning and overflow pipes to be situated 25mm above the shut-off water level in the cistern, and to be a minimum of 19mm internal diameter.","ref":"8.1.4.4","why":"Setting the pipe just above the normal water level means a failed float valve shows up as a visible external trickle before water reaches the rim and floods the loft or ceiling below, giving an early warning of the fault.","source":"NHBC Standards 2026","sourceShort":"NHBC","refLabel":"Clause"},{"id":"8.1-06","chapter":"8.1","chapterTitle":"Internal services","part":"Internal services and low or zero carbon technologies (LZC)","question":"What is the maximum depth of a vertical chase for gas pipework set into a plastered masonry wall of thickness T?","options":["T/8","T/6","T/3","T/2"],"correct":2,"explanation":"Clause 8.1.5.1 (Figure 5 guidance) gives the maximum depth of chase as T/6 for horizontal chases and T/3 for vertical chases.","ref":"8.1.5.1","why":"Cutting a chase too deep removes too much material from the wall, weakening its structural strength and load-bearing capacity — vertical chases can go deeper than horizontal ones because they run with, not across, the wall's strength.","source":"NHBC Standards 2026","sourceShort":"NHBC","refLabel":"Clause"},{"id":"8.1-07","chapter":"8.1","chapterTitle":"Internal services","part":"Internal services and low or zero carbon technologies (LZC)","question":"A plot has a gas supply to the home and the kitchen is fitted with an electric hob. What does the standard say about providing a gas point at the cooker space?","options":["A gas point must still be provided at the cooker space","A gas point is not required because an electric hob is provided","A capped gas point must be provided within 300mm of the hob","A gas point is only required if the buyer requests one"],"correct":1,"explanation":"Clause 8.1.5.1 states that where there is a gas supply to the home, a gas point at the cooker space is provided, but this is not required where an electric hob is provided.","ref":"8.1.5.1","why":"With no gas appliance needing it, running a live gas point to the cooker space is an unnecessary leak risk and cost — capping it off eliminates a potential source of gas escape for no benefit.","source":"NHBC Standards 2026","sourceShort":"NHBC","refLabel":"Clause"},{"id":"8.1-08","chapter":"8.1","chapterTitle":"Internal services","part":"Internal services and low or zero carbon technologies (LZC)","question":"What is the minimum number of 13A outlets that should be provided in the main bedroom?","options":["Two","Four","Six","Eight"],"correct":2,"explanation":"Table 3 in Clause 8.1.6.2 requires a minimum of six outlets for the main bedroom and a minimum of four outlets for other bedrooms.","ref":"8.1.6.2","why":"Modern bedrooms need sockets for lamps, phone chargers, TVs and laptops on both sides of the bed; too few outlets pushes occupants towards overloaded extension leads and adaptors, a common cause of house fires.","source":"NHBC Standards 2026","sourceShort":"NHBC","refLabel":"Clause"},{"id":"8.1-09","chapter":"8.1","chapterTitle":"Internal services","part":"Internal services and low or zero carbon technologies (LZC)","question":"A cable without special protection is run outside the safe zones in a wall. What minimum depth from the wall surface is acceptable?","options":["50mm","75mm","100mm","150mm"],"correct":0,"explanation":"Clause 8.1.6.3 states cables without special protection should be run vertically or horizontally to the outlet, within the safe zone, or a minimum of 50mm from the surface of a wall or from the top or bottom of a timber joist or batten.","ref":"8.1.6.3","why":"Keeping cables clear of these zones or buried deep enough means a nail or screw driven into the wall later (e.g. hanging a picture) is far less likely to pierce a live cable and cause a shock or fire.","source":"NHBC Standards 2026","sourceShort":"NHBC","refLabel":"Clause"},{"id":"8.1-10","chapter":"8.1","chapterTitle":"Internal services","part":"Internal services and low or zero carbon technologies (LZC)","question":"In a kitchen (not a bathroom), what is the minimum horizontal separation between an electrical accessory and the edge of any bowl of a sink or wash basin?","options":["150mm","200mm","250mm","300mm"],"correct":3,"explanation":"Clause 8.1.6.4 requires a minimum separation of 300mm measured horizontally to the edge of any bowl of a sink or wash basin opening, to avoid splashing.","ref":"8.1.6.4","why":"Keeping accessories clear of the sink stops water splashing onto sockets or switches, which could cause a short circuit, corrosion of the contacts, or an electric shock to someone using wet hands nearby.","source":"NHBC Standards 2026","sourceShort":"NHBC","refLabel":"Clause"},{"id":"8.1-11","chapter":"8.1","chapterTitle":"Internal services","part":"Internal services and low or zero carbon technologies (LZC)","question":"What minimum electrical supply should be provided to a cooking space?","options":["A 20A supply, suitably switched and terminated","A 30A supply, suitably switched and terminated","A 40A supply, suitably switched and terminated","A 45A supply, suitably switched and terminated"],"correct":1,"explanation":"Clause 8.1.6.7 requires cooking spaces to have a minimum 30A supply which is suitably switched and terminated, plus a 13A socket outlet where there is a gas supply.","ref":"8.1.6.7","why":"Ovens and cookers draw a high sustained current; an undersized supply can overheat cabling and connections, risking a fire, whereas a proper 30A circuit is sized to carry that load safely.","source":"NHBC Standards 2026","sourceShort":"NHBC","refLabel":"Clause"},{"id":"8.1-12","chapter":"8.1","chapterTitle":"Internal services","part":"Internal services and low or zero carbon technologies (LZC)","question":"An unvented cylinder discharge pipe terminates at low level onto a garden path. What is the maximum height of the discharge above ground level?","options":["25mm","50mm","75mm","100mm"],"correct":3,"explanation":"Clause 8.1.9.3 states that where low-level discharge is onto the ground, the pipe should discharge downwards a maximum of 100mm above ground level, protected from being touched, normally by a cage over the pipe.","ref":"8.1.9.3","why":"Unvented cylinder discharge water can be scalding, close to boiling, during a fault; keeping the outlet low and caged stops anyone — especially children or pets — from being able to touch it as it discharges.","source":"NHBC Standards 2026","sourceShort":"NHBC","refLabel":"Clause"},{"id":"8.1-13","chapter":"8.1","chapterTitle":"Internal services","part":"Internal services and low or zero carbon technologies (LZC)","question":"An unvented system discharge pipe terminates at high level onto a pitched roof. How far away from plastic guttering must the termination be?","options":["2m","3m","4m","5m"],"correct":1,"explanation":"Clause 8.1.9.4 states high-level discharge is only acceptable when it terminates onto a roof capable of withstanding water at high temperature and the termination is 3m away from plastic guttering.","ref":"8.1.9.4","why":"Near-boiling discharge water can soften or deform plastic guttering, so keeping the termination well clear stops the gutter failing and creating a leak or drainage problem on the roof.","source":"NHBC Standards 2026","sourceShort":"NHBC","refLabel":"Clause"},{"id":"8.1-14","chapter":"8.1","chapterTitle":"Internal services","part":"Internal services and low or zero carbon technologies (LZC)","question":"What minimum thickness of unfaced mineral wool should be used to wrap a soil pipe passing through the home for sound insulation?","options":["25mm","40mm","50mm","60mm"],"correct":0,"explanation":"Clause 8.1.10.3 requires soil pipes to be wrapped with a minimum 25mm of unfaced mineral wool of at least 10kg/m³ density, continued through the thickness of each sound-insulating floor.","ref":"8.1.10.3","why":"Waste flowing through a soil pipe is noisy, especially when a WC flushes; wrapping the pipe in mineral wool absorbs that structure-borne and airborne noise so it isn't heard disturbing occupants in rooms nearby, particularly at night.","source":"NHBC Standards 2026","sourceShort":"NHBC","refLabel":"Clause"},{"id":"8.2-01","chapter":"8.2","chapterTitle":"Electrical generating technologies","part":"Internal services and low or zero carbon technologies (LZC)","question":"For solar PV installations, a site is defined as a coastal location when it is within what distance of the general coastline of the United Kingdom?","options":["100m","250m","500m","1,000m"],"correct":2,"explanation":"The definitions for solar PV in Chapter 8.2.1 state a coastal location is a site within a distance of 500m from the general coastline of the United Kingdom.","ref":"8.2.1","why":"Salt-laden sea air accelerates corrosion of metal fixings and brackets, so identifying a site as coastal flags the need for tougher, corrosion-resistant materials to stop roof fixings failing prematurely.","source":"NHBC Standards 2026","sourceShort":"NHBC","refLabel":"Clause"},{"id":"8.2-02","chapter":"8.2","chapterTitle":"Electrical generating technologies","part":"Internal services and low or zero carbon technologies (LZC)","question":"There is a power cut on the local network. What should a mains-connected solar PV system do?","options":["Switch to island mode and keep supplying the local network","Continue generating and exporting to the grid","Reduce its output to 50% until the mains returns","Automatically disconnect from the mains"],"correct":3,"explanation":"Clause 8.2.1.7 states LZC technologies connected to the mains should automatically disconnect when there is a mains power failure, to prevent 'islanding' — feeding the network during a loss of mains supply.","ref":"8.2.1.7","why":"If the system kept exporting power during a network outage ('islanding'), it could energise lines that engineers believe are dead, putting repair crews at serious risk of electrocution, and the supply may be unstable without the grid's reference.","source":"NHBC Standards 2026","sourceShort":"NHBC","refLabel":"Clause"},{"id":"8.2-03","chapter":"8.2","chapterTitle":"Electrical generating technologies","part":"Internal services and low or zero carbon technologies (LZC)","question":"On site, an installer wants to join MC4 type connectors (male and female) from two different manufacturers on a solar PV system. What does the standard say?","options":["Mixing is not acceptable unless specifically allowed by the manufacturer","Mixing is acceptable provided both connectors are MCS certified","Mixing is acceptable if the joint is taped and supported","Mixing is acceptable on the DC side but not the AC side"],"correct":0,"explanation":"Clause 8.2.1.3.2 states that mixing of electrical MC4 type connections (male and female) is not acceptable unless specifically allowed by the manufacturer.","ref":"8.2.1.3.2","why":"Connectors from different manufacturers can look alike but not mate reliably, giving a loose or poor electrical joint that overheats, arcs and can start a fire in the DC cabling of the array.","source":"NHBC Standards 2026","sourceShort":"NHBC","refLabel":"Clause"},{"id":"8.2-04","chapter":"8.2","chapterTitle":"Electrical generating technologies","part":"Internal services and low or zero carbon technologies (LZC)","question":"Which grade of stainless steel should be used for solar PV fixings and bracketry in coastal locations, where appropriate?","options":["Grade 304","Grade 316","Grade 410","Grade 430"],"correct":1,"explanation":"Clause 8.2.1.3.1 states that when installed in a coastal location, fixings and bracketry should be appropriate for the area and stainless steel grade 316 should be used where appropriate.","ref":"8.2.1.3.1","why":"Grade 316 stainless resists salt-air corrosion far better than standard grades, preventing fixings and bracketry from corroding, weakening and letting panels work loose or fall from the roof.","source":"NHBC Standards 2026","sourceShort":"NHBC","refLabel":"Clause"},{"id":"8.2-05","chapter":"8.2","chapterTitle":"Electrical generating technologies","part":"Internal services and low or zero carbon technologies (LZC)","question":"Rolled lead sheet used for flashings around a solar PV installation should be to what minimum specification?","options":["2.65mm thick (Code 6)","2.24mm thick (Code 5)","1.8mm thick (Code 4)","1.32mm thick (Code 3)"],"correct":2,"explanation":"Table 1 in Clause 8.2.1.4 requires rolled lead sheet flashings to be a minimum thickness of 1.8mm, code blue (Code 4), to BS EN 12588.","ref":"8.2.1.4","why":"A thinner or lower-grade lead flashing is more prone to splitting or cracking with age and movement, letting water track in at the panel penetration and cause hidden leaks and timber decay below.","source":"NHBC Standards 2026","sourceShort":"NHBC","refLabel":"Clause"},{"id":"8.2-06","chapter":"8.2","chapterTitle":"Electrical generating technologies","part":"Internal services and low or zero carbon technologies (LZC)","question":"Where battery storage is provided with a solar PV system, how should the battery location be chosen in relation to fire safety?","options":["Within 1m of the consumer unit for ease of isolation","In the garage, regardless of enclosure type","Adjacent to the main entrance door for fire service access","So that escape routes are not impeded and a battery fire cannot compromise protected escape routes"],"correct":3,"explanation":"Clause 8.2.1.3.6 requires that batteries/storage are not placed so that escape routes are impeded, and that any fire in the battery does not compromise protected escape routes.","ref":"8.2.1.3.6","why":"Batteries can suffer thermal runaway and catch fire, so their location must not block an escape route or let a battery fire spread into a protected route occupants rely on to get out safely.","source":"NHBC Standards 2026","sourceShort":"NHBC","refLabel":"Clause"},{"id":"8.2-07","chapter":"8.2","chapterTitle":"Electrical generating technologies","part":"Internal services and low or zero carbon technologies (LZC)","question":"You notice a roofer has weatherproofed the interface between a PV mounting bracket and the roof using sealant alone. What does the standard require?","options":["The envelope should be weatherproofed using appropriate flashings and fixings — details relying solely on sealant are not acceptable","The sealant is acceptable if it is a low-modulus silicone applied in dry conditions","The sealant is acceptable provided it is inspected annually","A second bead of sealant should be applied over the first to give redundancy"],"correct":0,"explanation":"Clause 8.2.1.4 states the envelope should be weatherproofed using appropriate flashings and fixings, and that weatherproofing details that rely solely on sealant are not acceptable.","ref":"8.2.1.4","why":"Sealant alone shrinks, cracks and degrades with UV and weathering over time, unlike a proper flashing detail, so relying on it risks water tracking in at the roof penetration once it fails a few years down the line.","source":"NHBC Standards 2026","sourceShort":"NHBC","refLabel":"Clause"},{"id":"8.2-08","chapter":"8.2","chapterTitle":"Electrical generating technologies","part":"Internal services and low or zero carbon technologies (LZC)","question":"Who should design the foundations and anchor points for a stand-alone wind turbine?","options":["The MCS-certified installer using the standard details","The turbine manufacturer's delivery team","An engineer in accordance with Technical Requirement R5","The groundworks subcontractor based on previous plots"],"correct":2,"explanation":"Clause 8.2.2.4 requires foundations and anchor points for stand-alone LZC technologies to be designed by an engineer in accordance with Technical Requirement R5 to withstand the structural forces acting upon them.","ref":"8.2.2.4","why":"Turbines are subject to large, fluctuating wind and vibration loads; an engineered foundation stops the structure failing or the turbine toppling, which could injure people or damage property.","source":"NHBC Standards 2026","sourceShort":"NHBC","refLabel":"Clause"},{"id":"8.2-09","chapter":"8.2","chapterTitle":"Electrical generating technologies","part":"Internal services and low or zero carbon technologies (LZC)","question":"Where parallel electrical generation occurs on a standard solar PV installation, what should the inverter have?","options":["An ER G59/3-2 compliance certificate","A G98 witness test report from the DNO","A BS EN 61215 design qualification certificate","A relevant Engineering Recommendation G83/2 type test certificate"],"correct":3,"explanation":"Clause 8.2.1.7 states that where parallel electrical generation occurs, inverters should have a relevant Engineering Recommendation G83/2 type test certificate for standard installations; larger installations should comply with ER G59/3-2.","ref":"8.2.1.7","why":"The certificate proves the inverter has protections such as anti-islanding, correct voltage and frequency behaviour before it's allowed to feed into the public network, protecting network stability and the safety of engineers working on it.","source":"NHBC Standards 2026","sourceShort":"NHBC","refLabel":"Clause"},{"id":"8.3-01","chapter":"8.3","chapterTitle":"Space heating systems","part":"Internal services and low or zero carbon technologies (LZC)","question":"What is the design room temperature for a bathroom in a new build home insulated to current standards?","options":["18°C","20°C","21°C","22°C"],"correct":3,"explanation":"Table 2 in Clause 8.3.1.1.2 gives design room temperatures of 22°C for bathrooms and shower rooms, and 21°C for most other rooms.","ref":"8.3.1.1.2","why":"Bathrooms are used with wet or bare skin, so occupants feel cold more readily; a higher design temperature keeps them comfortable and helps warm surfaces stay above dew point, cutting condensation and mould risk after bathing.","source":"NHBC Standards 2026","sourceShort":"NHBC","refLabel":"Clause"},{"id":"8.3-02","chapter":"8.3","chapterTitle":"Space heating systems","part":"Internal services and low or zero carbon technologies (LZC)","question":"What outdoor design temperature should be used for heat loss calculations in Scotland and the Isles?","options":["-5.0°C","-4.0°C","-3.0°C","-2.0°C"],"correct":0,"explanation":"Table 3 in Clause 8.3.1.1.2 gives an outdoor design temperature of -5.0°C for Scotland and the Isles (latitude 56-60°N).","ref":"8.3.1.1.2","why":"Sizing the heating system to the coldest temperature a region actually experiences (not a milder average) ensures the home can still hold comfort conditions during a genuine cold snap, rather than falling short exactly when it's needed most.","source":"NHBC Standards 2026","sourceShort":"NHBC","refLabel":"Clause"},{"id":"8.3-03","chapter":"8.3","chapterTitle":"Space heating systems","part":"Internal services and low or zero carbon technologies (LZC)","question":"How should design temperatures for a space heating system be verified?","options":["By performance tests on the completed system","By calculations","By spot temperature measurements at commissioning","By thermal imaging of the finished rooms"],"correct":1,"explanation":"Clause 8.3.1.1.2 states that design temperatures should be verified by calculations and not by performance tests.","ref":"8.3.1.1.2","why":"On-site performance tests are at the mercy of whatever weather occurs on the day, so they can't prove a system copes with the worst-case winter condition; calculation lets sizing be checked against the design temperatures before the home is ever occupied.","source":"NHBC Standards 2026","sourceShort":"NHBC","refLabel":"Clause"},{"id":"8.3-04","chapter":"8.3","chapterTitle":"Space heating systems","part":"Internal services and low or zero carbon technologies (LZC)","question":"Operatives installing gas heating appliances must be members of a class of persons approved by the HSE. What does this mean in practice?","options":["They must be MCS certified","They must be HETAS qualified","They must be Gas Safe registered","They must be OFTEC registered"],"correct":2,"explanation":"Clause 8.3.2.1.3 requires gas heating appliances to be installed by competent operatives who are members of a class of persons approved by the HSE, ie Gas Safe registered.","ref":"8.3.2.1.3","why":"Faulty gas work can cause explosions, fires or carbon monoxide poisoning, which is often fatal because CO is invisible and odourless; Gas Safe registration is the legal safeguard that competent, checked operatives are doing this work.","source":"NHBC Standards 2026","sourceShort":"NHBC","refLabel":"Clause"},{"id":"8.3-05","chapter":"8.3","chapterTitle":"Space heating systems","part":"Internal services and low or zero carbon technologies (LZC)","question":"For isolating the electrical supply to a gas heating appliance, a double pole fused spur will generally be acceptable with what minimum contact separation?","options":["2.5mm","3.0mm","3.5mm","4.0mm"],"correct":2,"explanation":"Clause 8.3.2.7 states that an unswitched shuttered socket or double pole fused spur with 3.5mm separation will generally be acceptable for isolating the installation for maintenance or testing.","ref":"8.3.2.7","why":"A proper physical break with adequate contact separation stops the supply arcing across or re-energising while an engineer is working on the appliance, preventing electric shock during maintenance or fault-finding.","source":"NHBC Standards 2026","sourceShort":"NHBC","refLabel":"Clause"},{"id":"8.3-06","chapter":"8.3","chapterTitle":"Space heating systems","part":"Internal services and low or zero carbon technologies (LZC)","question":"How much of the calculated design space heating power requirement should the selected heat pump provide at the winter design condition?","options":["Not less than 90%, with electric heating making up the balance","Not less than 100%, including any energy required for defrost cycles","Not less than 110%, to allow a safety margin","Not less than 120%, to allow for future extensions"],"correct":1,"explanation":"Clause 8.3.3.3.2 requires the heat pump to provide not less than 100% of the calculated design space heating power requirement at the winter design condition, including any energy required for defrost cycles; supplementary electric heating should only operate when conditions are outside of the standards.","ref":"8.3.3.3.2","why":"Heat pump output drops as it gets colder outside and dips further during defrost cycles, so undersizing leaves the home unable to reach temperature on the coldest days and forces costly reliance on backup electric heating.","source":"NHBC Standards 2026","sourceShort":"NHBC","refLabel":"Clause"},{"id":"8.3-07","chapter":"8.3","chapterTitle":"Space heating systems","part":"Internal services and low or zero carbon technologies (LZC)","question":"Heat emitters and pipework for a heat pump system must be sized to the design mean water temperature (MWT). What design MWT does the standard state?","options":["35°C","42.5°C","50°C","55°C"],"correct":1,"explanation":"Clause 8.3.3.3.2 gives a design mean water temperature (MWT) of 42.5°C (the design can use a lower MWT), with heat emitters and system pipework or underfloor heating sized to the design MWT.","ref":"8.3.3.3.2","why":"Heat pumps run most efficiently at lower water temperatures than a gas boiler, so emitters and pipework must be sized bigger to deliver the same heat output at 42.5°C; undersized emitters would leave rooms cold or force the heat pump to work harder, wasting energy.","source":"NHBC Standards 2026","sourceShort":"NHBC","refLabel":"Clause"},{"id":"8.3-08","chapter":"8.3","chapterTitle":"Space heating systems","part":"Internal services and low or zero carbon technologies (LZC)","question":"An open loop ground source heat pump system is proposed, extracting water from an underground source. What does the standard require before proceeding?","options":["Approval from the water supplier for the extraction rate","A soil survey by a geotechnical engineer under Technical Requirement R5","Written confirmation from the local planning authority only","Consultation with the appropriate environment agency, which may require licences or a discharge consent"],"correct":3,"explanation":"Clause 8.3.3.5 states that where open loop systems are proposed, consultation with the appropriate environment agency should be made, which may require a licence to investigate groundwater, an abstraction licence or a discharge consent.","ref":"8.3.3.5","why":"Pumping groundwater out and returning it can affect aquifers, other abstraction users and local ecology, so a licence or discharge consent is needed to avoid unlawful abstraction or pollution and disputes over a shared water resource.","source":"NHBC Standards 2026","sourceShort":"NHBC","refLabel":"Clause"},{"id":"8.3-09","chapter":"8.3","chapterTitle":"Space heating systems","part":"Internal services and low or zero carbon technologies (LZC)","question":"A biomass boiler installer is not MCS accredited. Which qualification should they hold instead?","options":["HETAS qualified, as well as being electrically qualified","Gas Safe registered, as well as being electrically qualified","OFTEC registered, as well as being F Gas registered","BPEC trained, as well as being registered for unvented cylinders"],"correct":0,"explanation":"Clause 8.3.4.1.3 states that where biomass installers are not MCS accredited, they should still hold the relevant qualifications: HETAS qualified and electrically qualified.","ref":"8.3.4.1.3","why":"Solid fuel combustion carries fire, chimney fire and carbon monoxide risks that differ from gas or electric systems, so HETAS competence plus electrical qualification are needed to ensure the boiler, flue and controls are all installed safely.","source":"NHBC Standards 2026","sourceShort":"NHBC","refLabel":"Clause"},{"id":"8.4-01","chapter":"8.4","chapterTitle":"Ventilation","part":"Internal services and low or zero carbon technologies (LZC)","question":"On a low velocity MVHR system, what is the minimum distance (on plan) that an extract air valve should be positioned from a hob in a kitchen?","options":["300mm","450mm","600mm","750mm"],"correct":2,"explanation":"Clause 8.4.1.3.5 states that air valves on low velocity systems should be a minimum of 600mm (on plan) from hobs in kitchens.","ref":"8.4.1.3.5","why":"Keeping the extract valve well clear of the hob stops grease-laden cooking fumes being pulled straight into it, which would otherwise clog the filter and ductwork and build up a fire risk inside the system.","source":"NHBC Standards 2026","sourceShort":"NHBC","refLabel":"Clause"},{"id":"8.4-02","chapter":"8.4","chapterTitle":"Ventilation","part":"Internal services and low or zero carbon technologies (LZC)","question":"To prevent cross contamination, what is the general minimum separation (measured on plan) between an MVHR intake terminal and the exhaust terminal or other potential sources of pollution?","options":["0.5m","1m","2m","3m"],"correct":1,"explanation":"Clause 8.4.1.3.5 requires intake terminals to be separated from exhaust terminals and other potential pollution sources by a minimum of 1m measured on plan, with increased distances possibly needed near soil and vent pipes, boiler flues and biomass or solid fuel chimneys.","ref":"8.4.1.3.5","why":"Putting the intake too close to the exhaust (or a flue or vent) lets stale, moist or contaminated air get drawn straight back in, defeating the point of fresh air ventilation and potentially pulling combustion gases or odours into the home.","source":"NHBC Standards 2026","sourceShort":"NHBC","refLabel":"Clause"},{"id":"8.4-03","chapter":"8.4","chapterTitle":"Ventilation","part":"Internal services and low or zero carbon technologies (LZC)","question":"MVHR ductwork passing through a cold roof void must be insulated to prevent condensation. What minimum thermal resistance should the insulation achieve?","options":["Equivalent to 15mm of insulating material with a thermal conductivity of 0.04W/mK","Equivalent to 25mm of insulating material with a thermal conductivity of 0.04W/mK","Equivalent to 50mm of insulating material with a thermal conductivity of 0.04W/mK","Equivalent to 100mm of insulating material with a thermal conductivity of 0.04W/mK"],"correct":1,"explanation":"Clause 8.4.1.3.6 states ductwork insulation should provide a thermal resistance equivalent to a minimum of 25mm of insulating material with a thermal conductivity of 0.04W/mK, using pre-insulated ductwork or a proprietary insulation system.","ref":"8.4.1.3.6","why":"Warm, humid air passing through an uninsulated duct in a cold loft cools below its dew point and condenses inside the duct, which can drip, cause damp staining on ceilings below, or promote mould in the roof void.","source":"NHBC Standards 2026","sourceShort":"NHBC","refLabel":"Clause"},{"id":"8.4-04","chapter":"8.4","chapterTitle":"Ventilation","part":"Internal services and low or zero carbon technologies (LZC)","question":"How should the condensate drain from an MVHR fan unit be connected to the soil and waste system?","options":["Via a dry trap","Directly, with no trap fitted","Via a wet trap with a 75mm seal","Via an external gully only"],"correct":0,"explanation":"Clause 8.4.1.3.6 states that fan units should be located to enable connection of the condensate drain to the soil and waste system via a dry trap.","ref":"8.4.1.3.6","why":"A dry (mechanical) trap keeps foul air and drain smells from the waste system being drawn back up into the ductwork and then the home, which a conventional water trap could fail to do if it dried out from the low, intermittent condensate flow.","source":"NHBC Standards 2026","sourceShort":"NHBC","refLabel":"Clause"},{"id":"8.4-05","chapter":"8.4","chapterTitle":"Ventilation","part":"Internal services and low or zero carbon technologies (LZC)","question":"Horizontal sections of MVHR service ductwork run outside the insulated parts of the home (e.g. above the loft insulation) should be insulated to protect them from the cold. What minimum thermal resistance is required?","options":["Equivalent to 25mm of insulating material with a thermal conductivity of 0.04W/mK","Equivalent to 50mm of insulating material with a thermal conductivity of 0.04W/mK","Equivalent to 100mm of insulating material with a thermal conductivity of 0.04W/mK","Equivalent to 150mm of insulating material with a thermal conductivity of 0.04W/mK"],"correct":3,"explanation":"Clause 8.4.1.3.7 states horizontal sections of service ductwork outside the insulated parts of the home should achieve a thermal resistance equivalent to at least 150mm of insulating material with a thermal conductivity of 0.04W/mK, which may be achieved by installing the ductwork between the layers of horizontal insulation.","ref":"8.4.1.3.7","why":"Ducts running above the loft insulation are exposed to full outdoor cold, so extra insulation is needed to stop the supply air chilling in transit (undermining the heat recovery) and to prevent condensation or freezing in that exposed section.","source":"NHBC Standards 2026","sourceShort":"NHBC","refLabel":"Clause"},{"id":"8.4-06","chapter":"8.4","chapterTitle":"Ventilation","part":"Internal services and low or zero carbon technologies (LZC)","question":"Where flexible ducting is used on an MVHR system, what is its maximum permitted length?","options":["150mm","300mm","500mm","750mm"],"correct":1,"explanation":"Clause 8.4.1.6 states flexible ducting should not be more than 300mm in length, should only be located adjacent to fan units or air valves, and should not be used to form bends.","ref":"8.4.1.6","why":"Flexible duct's ribbed bore creates far more resistance to airflow than rigid duct, so long lengths would choke the ventilation rate and force the fan to work harder and noisier just to compensate.","source":"NHBC Standards 2026","sourceShort":"NHBC","refLabel":"Clause"},{"id":"8.4-07","chapter":"8.4","chapterTitle":"Ventilation","part":"Internal services and low or zero carbon technologies (LZC)","question":"Unless the manufacturer recommends otherwise, what is the maximum spacing of the evenly spaced clips holding ventilation ductwork securely in position?","options":["400mm","600mm","750mm","900mm"],"correct":2,"explanation":"Clause 8.4.1.7.1 requires ductwork to be securely held in position by evenly spaced clips no more than 750mm apart, or in accordance with the ductwork manufacturer's recommendations.","ref":"8.4.1.7.1","why":"Widely spaced clips let ductwork sag, creating dips where condensate pools and can cause blockages, gurgling noise or leaks, while unsupported duct can also rattle and transmit noise into rooms below.","source":"NHBC Standards 2026","sourceShort":"NHBC","refLabel":"Clause"},{"id":"8.4-08","chapter":"8.4","chapterTitle":"Ventilation","part":"Internal services and low or zero carbon technologies (LZC)","question":"An intermittent extract fan is designed for an extract rate of 45 L/s. Where flexible duct is used to form bends on this run, how many such bends are permitted?","options":["One","Two","Three","None permitted at any extract rate"],"correct":0,"explanation":"Clause 8.4.2.6.1 restricts flexible duct bends on intermittent extract systems to a maximum of two for systems up to 30 L/s and one for extract rates higher than 30 L/s.","ref":"8.4.2.6.1","why":"Every bend in flexible duct adds airflow resistance on top of its already restrictive bore, so at higher extract rates even one extra bend can choke the airflow enough to miss the design rate, leaving moisture and odours from a busy kitchen or bathroom under-extracted.","source":"NHBC Standards 2026","sourceShort":"NHBC","refLabel":"Clause"},{"id":"8.4-09","chapter":"8.4","chapterTitle":"Ventilation","part":"Internal services and low or zero carbon technologies (LZC)","question":"At commissioning, the MVHR system cannot be balanced using the air valves and system controls. What does the standard require?","options":["Increase the fan speed above the designed output until airflow rates are met","Lock the air valves fully open and record the shortfall","Fit higher-capacity air valves from another manufacturer","Check the complete system to ensure it complies with the design"],"correct":3,"explanation":"Clause 8.4.1.11 states that where the system cannot be balanced using the air valves and system controls, the complete system should be checked to ensure it complies with the design; adjusting the fan speed above the designed output may cause noise disturbance and should be avoided.","ref":"8.4.1.11","why":"If the valves and controls can't bring the system into balance, that usually points to a real fault such as a blocked duct, wrong component or excess resistance; pushing the fan speed up as a workaround just adds noise nuisance instead of fixing the ventilation shortfall.","source":"NHBC Standards 2026","sourceShort":"NHBC","refLabel":"Clause"},{"id":"8.5-01","chapter":"8.5","chapterTitle":"LZC hot water systems","part":"Internal services and low or zero carbon technologies (LZC)","question":"For solar thermal hot water systems, how does the standard define a coastal location?","options":["A site within 100m of the general coastline of the UK","A site within 250m of the general coastline of the UK","A site within 400m of the general coastline of the UK","A site within 500m of the general coastline of the UK"],"correct":3,"explanation":"The definitions in Chapter 8.5.1 state a coastal location is a site within a distance of 500m from the general coastline of the United Kingdom.","ref":"8.5.1","why":"Sites within 500m of the sea suffer heavy salt-laden air that accelerates corrosion of metal fixings and frames, so the standard triggers tougher, corrosion-resistant specifications specifically in this zone.","source":"NHBC Standards 2026","sourceShort":"NHBC","refLabel":"Clause"},{"id":"8.5-02","chapter":"8.5","chapterTitle":"LZC hot water systems","part":"Internal services and low or zero carbon technologies (LZC)","question":"You are fitting a solar thermal collector on a plot 300m from the sea. Which material does the standard recommend for the fixings and bracketry to resist corrosion?","options":["Galvanised mild steel","Grade 304 stainless steel","Grade 316 stainless steel","Anodised aluminium alloy"],"correct":2,"explanation":"Clause 8.5.1.5 states fixings, supports, bracketry and mounting frames should have adequate protection against corrosion, with grade 316 stainless steel recommended for coastal locations (sites within 500m of the coastline).","ref":"8.5.1.5","why":"Ordinary steel fixings pit and corrode quickly in salty coastal air; if brackets fail, a heavy roof-mounted panel can work loose or fall, so grade 316 stainless resists that corrosion and keeps the panel securely fixed.","source":"NHBC Standards 2026","sourceShort":"NHBC","refLabel":"Clause"},{"id":"8.5-03","chapter":"8.5","chapterTitle":"LZC hot water systems","part":"Internal services and low or zero carbon technologies (LZC)","question":"How should the building envelope be weatherproofed at the interfaces with a roof-mounted solar thermal system?","options":["Using appropriate flashings and fixings","Using a continuous bead of silicone sealant","Using self-adhesive flashing tape alone","Using mortar fillets at all edges"],"correct":0,"explanation":"Clause 8.5.1.5 requires the envelope to be weatherproofed using appropriate flashings and fixings, and states that weatherproofing details that rely solely on sealant are not acceptable.","ref":"8.5.1.5","why":"Sealant alone hardens, shrinks and cracks with UV and thermal movement over a few years, so relying on it at a roof penetration eventually lets water track into the roof structure causing rot and hidden damp.","source":"NHBC Standards 2026","sourceShort":"NHBC","refLabel":"Clause"},{"id":"8.5-04","chapter":"8.5","chapterTitle":"LZC hot water systems","part":"Internal services and low or zero carbon technologies (LZC)","question":"When installing solar thermal systems, which material should aluminium and aluminium alloy components not come into contact with?","options":["Roofing felt","Cementitious material","Insulation boards","Plastic pipework"],"correct":1,"explanation":"Clause 8.5.1.5 states that aluminium and aluminium alloys should not come into contact with cementitious material; this is repeated in Clause 8.5.1.6, which requires the isolation of aluminium from cementitious material.","ref":"8.5.1.5","why":"Wet cement and mortar are highly alkaline and chemically attack aluminium, causing pitting corrosion that can weaken fixings or frames over time, so the two materials must be kept apart or isolated.","source":"NHBC Standards 2026","sourceShort":"NHBC","refLabel":"Clause"},{"id":"8.5-05","chapter":"8.5","chapterTitle":"LZC hot water systems","part":"Internal services and low or zero carbon technologies (LZC)","question":"Who should design the foundations and anchor points for a stand-alone solar thermal installation?","options":["The solar panel manufacturer's sales team","The site manager, using the fixing schedule","An engineer, in accordance with Technical Requirement R5","The plumbing subcontractor installing the system"],"correct":2,"explanation":"Clause 8.5.1.5 requires foundations and anchor points for stand-alone solar thermal technologies to be designed by an engineer in accordance with Technical Requirement R5 to withstand the structural forces acting upon them.","ref":"8.5.1.5","why":"A free-standing panel array catches significant wind load; foundations that aren't properly engineered could shift or overturn in high winds, so an engineer must size them to resist the real structural forces involved.","source":"NHBC Standards 2026","sourceShort":"NHBC","refLabel":"Clause"},{"id":"8.5-06","chapter":"8.5","chapterTitle":"LZC hot water systems","part":"Internal services and low or zero carbon technologies (LZC)","question":"Solar thermal products certified through which scheme will generally be acceptable to NHBC?","options":["The Benchmark scheme","The Microgeneration Certification Scheme (MCS)","The BPEC certification scheme","The TrustMark scheme"],"correct":1,"explanation":"Clause 8.5.1.1.2 states that solar thermal products certified through the Microgeneration Certification Scheme (MCS) will generally be acceptable to NHBC, with certification and test documentation available on request.","ref":"8.5.1.1.2","why":"MCS certification independently verifies the collector has been tested for performance and safety, so site staff aren't relying on unverified manufacturer claims for a system that carries pressurised fluid and sits exposed on the roof.","source":"NHBC Standards 2026","sourceShort":"NHBC","refLabel":"Clause"},{"id":"8.6-01","chapter":"8.6","chapterTitle":"Installation and commissioning","part":"Internal services and low or zero carbon technologies (LZC)","question":"Where a horizontal chase for services is cut into a single leaf of blockwork, what is its maximum permitted depth?","options":["1/8 of the leaf thickness","1/6 of the leaf thickness","1/4 of the leaf thickness","1/3 of the leaf thickness"],"correct":1,"explanation":"Clause 8.6.2.2 limits chase depths to 1/6 of the thickness of the single leaf for horizontal chases and 1/3 of the thickness for vertical chases; hollow blocks should not be chased unless specifically permitted by the manufacturer.","ref":"8.6.2.2","why":"Cutting a chase too deep removes too much of the block's cross-section, weakening the wall's structural capacity and increasing the risk of cracking or a soft spot that later telegraphs through the plaster.","source":"NHBC Standards 2026","sourceShort":"NHBC","refLabel":"Clause"},{"id":"8.6-02","chapter":"8.6","chapterTitle":"Installation and commissioning","part":"Internal services and low or zero carbon technologies (LZC)","question":"Where pipes are permitted in a floor screed, what is the minimum screed cover required over the pipes and their insulating material?","options":["15mm","20mm","25mm","40mm"],"correct":2,"explanation":"Clause 8.6.2.2 requires screed cover to be a minimum of 25mm over pipes and insulating material; where pipes cross, it may be necessary to form a duct to achieve adequate cover.","ref":"8.6.2.2","why":"Thin screed over a pipe cracks easily under foot traffic or furniture loads and gives the pipe no thermal buffer, so 25mm cover protects both the pipe from damage and the screed from fracturing along its line.","source":"NHBC Standards 2026","sourceShort":"NHBC","refLabel":"Clause"},{"id":"8.6-03","chapter":"8.6","chapterTitle":"Installation and commissioning","part":"Internal services and low or zero carbon technologies (LZC)","question":"When notching the top edge of a solid timber joist up to 250mm deep to accommodate a pipe, what is the maximum permitted notch depth?","options":["0.05 x depth of joist","0.1 x depth of joist","0.125 x depth of joist","0.15 x depth of joist"],"correct":3,"explanation":"Table 1 in Clause 8.6.2.7 limits notches in joists up to 250mm deep to a maximum of 0.15 x the depth of the joist, located on the top edge within a zone 0.1-0.2 x span from the end.","ref":"8.6.2.7","why":"Cutting a notch deeper than 0.15 x depth removes too much timber from the joist's tension zone, sharply cutting its bending strength and risking excessive floor deflection, bounce or even a cracked joist.","source":"NHBC Standards 2026","sourceShort":"NHBC","refLabel":"Clause"},{"id":"8.6-04","chapter":"8.6","chapterTitle":"Installation and commissioning","part":"Internal services and low or zero carbon technologies (LZC)","question":"Plastic pipework is being concealed behind a wall surface where a metal detector would not otherwise find it. What should be placed behind the pipework?","options":["Metallic tape","Brightly coloured warning tape","A timber batten","Foil-faced insulation"],"correct":0,"explanation":"Clause 8.6.2.4 requires metallic tape to be placed behind plastic pipework where it is concealed behind wall surfaces and would otherwise not be located by a metal detector or similar equipment.","ref":"8.6.2.4","why":"Plastic pipe is invisible to a metal detector, so without tape behind it a later trade drilling for a shelf or cabinet could puncture the pipe unseen, causing a hidden leak inside a finished wall.","source":"NHBC Standards 2026","sourceShort":"NHBC","refLabel":"Clause"},{"id":"8.6-05","chapter":"8.6","chapterTitle":"Installation and commissioning","part":"Internal services and low or zero carbon technologies (LZC)","question":"Using high performance insulation with a thermal conductivity of 0.025W/mK at 40°C, what minimum insulation thickness is required on a 15mm diameter hot water pipe?","options":["9mm","12mm","15mm","20mm"],"correct":0,"explanation":"Table 2 in Clause 8.6.4.1 gives a minimum insulation thickness of 9mm for a 15mm outside diameter pipe using insulation with a thermal conductivity of 0.025W/mK, so that the permissible heat losses in BS 5422 for hot water services at 60°C are not exceeded.","ref":"8.6.4.1","why":"Under-insulated pipework loses heat faster than BS 5422 allows, meaning water cools in the pipe run, taps deliver lukewarm water and the system wastes energy keeping the cylinder topped up, raising the homeowner's running costs.","source":"NHBC Standards 2026","sourceShort":"NHBC","refLabel":"Clause"},{"id":"8.6-06","chapter":"8.6","chapterTitle":"Installation and commissioning","part":"Internal services and low or zero carbon technologies (LZC)","question":"During commissioning of an LZC system, the commissioning engineer finds a small leak on the pipework. By when must leaks and other defects be made good?","options":["Within the first year, under the defects period","Before the system is next switched on","Before NHBC's final inspection only","Before finishes are applied and the home is handed over"],"correct":3,"explanation":"Clause 8.6.5 states the commissioning engineer should ensure leaks or other defects are made good prior to the application of finish and handover of the home.","ref":"8.6.5","why":"A leak sealed behind finishes goes unseen and keeps wetting plaster, insulation or timber, encouraging mould and rot; fixing it before handover avoids a hidden defect surfacing as a costly callback after the family moves in.","source":"NHBC Standards 2026","sourceShort":"NHBC","refLabel":"Clause"},{"id":"9.1-01","chapter":"9.1","chapterTitle":"A consistent approach to finishes","part":"Finishes","question":"When assessing the tolerances and appearance of an external wall, from what minimum distance should it be viewed in daylight?","options":["2m","5m","10m","20m"],"correct":2,"explanation":"Clause 9.1.2 states tolerances and appearance of external walls should be considered in daylight and from a minimum distance of 10m.","ref":"9.1.2","why":"Close-up, individual bricks, mortar smears and minor blemishes are always visible, but they're not how anyone actually experiences a finished house, so judging appearance from a normal viewing distance stops trivial marks being treated as defects.","source":"NHBC Standards 2026","sourceShort":"NHBC","refLabel":"Clause"},{"id":"9.1-02","chapter":"9.1","chapterTitle":"A consistent approach to finishes","part":"Finishes","question":"What is the maximum deviation from plumb for fair faced masonry in any storey up to 3m high?","options":["5mm","8mm","10mm","12mm"],"correct":1,"explanation":"Clause 9.1.2.1 requires fair faced masonry to be a maximum of 8mm from plumb in any storey up to 3m; taller walls should be a maximum of 8mm per storey and 12mm in total.","ref":"9.1.2.1","why":"A wall leaning noticeably out of plumb can point to a build or masonry problem and visibly throws off adjoining lines, reveals and copings, so the tolerance catches real workmanship issues while allowing for minor unavoidable variation.","source":"NHBC Standards 2026","sourceShort":"NHBC","refLabel":"Clause"},{"id":"9.1-03","chapter":"9.1","chapterTitle":"A consistent approach to finishes","part":"Finishes","question":"For ceilings up to 6m across, what is the maximum out-of-level deviation permitted per 1m, measured at the furthest points across the full width?","options":["3mm","5mm","8mm","10mm"],"correct":0,"explanation":"Clause 9.1.3.3 states ceilings should be level within a 3mm deviation per 1m for ceilings up to 6m across, and a maximum of 20mm out of level for ceilings over 6m across.","ref":"9.1.3.3","why":"An out-of-level ceiling is one of the first things occupants notice, showing up as uneven shadow lines, gaps at cornices, or light fittings that visibly hang askew, undermining confidence in the whole build's quality.","source":"NHBC Standards 2026","sourceShort":"NHBC","refLabel":"Clause"},{"id":"9.1-04","chapter":"9.1","chapterTitle":"A consistent approach to finishes","part":"Finishes","question":"In fair faced masonry, by how much may the thickness of an individual bed joint vary from the average of the next eight successive joints?","options":["±1mm","±1.5mm","±2mm","±3mm"],"correct":1,"explanation":"Clause 9.1.2.1 states the thickness of an individual bed joint should not vary from the average of the next eight successive joints by more than ±1.5mm.","ref":"9.1.2.1","why":"If individual bed joint thickness drifts too far from neighbouring joints, coursing starts to wedge or step unevenly up the wall, becoming visually obvious and throwing out the alignment of features like openings and string courses.","source":"NHBC Standards 2026","sourceShort":"NHBC","refLabel":"Clause"},{"id":"9.1-05","chapter":"9.1","chapterTitle":"A consistent approach to finishes","part":"Finishes","question":"What is the maximum vertical and horizontal deviation from flat permitted for render in any 5m?","options":["±2mm","±3mm","±4mm","±5mm"],"correct":2,"explanation":"Clause 9.1.2.2 requires render to be flat within a maximum ±4mm vertical and horizontal deviation in 5m.","ref":"9.1.2.2","why":"Render that isn't flat shows up as shadowing and waviness in raking sunlight, and uneven thickness applied to compensate is more prone to cracking or debonding from the background over time.","source":"NHBC Standards 2026","sourceShort":"NHBC","refLabel":"Clause"},{"id":"9.1-06","chapter":"9.1","chapterTitle":"A consistent approach to finishes","part":"Finishes","question":"When checking glazing in daylight, fine scratches are acceptable where they are not obtrusive or bunched, provided they are no longer than what length?","options":["25mm","40mm","50mm","75mm"],"correct":0,"explanation":"Clause 9.1.6 permits fine scratches not more than 25mm long, along with bubbles, blisters, hairlines, blobs and minute particles, where they are not obtrusive or bunched.","ref":"9.1.6","why":"Minute scratches and blemishes are an unavoidable by-product of manufacturing and handling glass; capping the acceptable length at 25mm filters out trivial marks from genuinely obtrusive damage that would justify replacing the pane.","source":"NHBC Standards 2026","sourceShort":"NHBC","refLabel":"Clause"},{"id":"9.1-07","chapter":"9.1","chapterTitle":"A consistent approach to finishes","part":"Finishes","question":"What is the maximum gap permitted between an internal door and the head or jamb of the frame?","options":["3mm","4mm","5mm","6mm"],"correct":1,"explanation":"Clause 9.1.4 states the gap between the door and head or jamb should be a maximum of 4mm and uniform; for double doors the gap at the meeting stiles should also be within 4mm.","ref":"9.1.4","why":"A gap wider than 4mm around a door lets draughts and noise pass between rooms, undermining thermal comfort and any acoustic separation the door is meant to provide, as well as looking poorly fitted.","source":"NHBC Standards 2026","sourceShort":"NHBC","refLabel":"Clause"},{"id":"9.1-08","chapter":"9.1","chapterTitle":"A consistent approach to finishes","part":"Finishes","question":"What gap should there be between the underside of an internal door and the unfinished floor?","options":["5mm to 10mm","6mm to 15mm","8mm to 20mm","10mm to 22mm"],"correct":3,"explanation":"Clause 9.1.4 requires the gap between the underside of the door and unfinished floor to be between 10mm and 22mm, taking the building's ventilation requirements into account.","ref":"9.1.4","why":"Too tight a gap and the door binds or scuffs the floor once a covering is laid; too large a gap undermines draught exclusion and the ventilation some rooms rely on, so the range balances both.","source":"NHBC Standards 2026","sourceShort":"NHBC","refLabel":"Clause"},{"id":"9.1-09","chapter":"9.1","chapterTitle":"A consistent approach to finishes","part":"Finishes","question":"You inspect a new drive one hour after rain has stopped and find some standing water. What does the standard accept?","options":["No standing water at all anywhere on drives or paths","Standing water up to 10mm deep and up to 2m² in area","Standing water of any size provided it drains within 24 hours","Temporary standing water up to 5mm deep and up to 1m², but not adjacent to entrance doors"],"correct":3,"explanation":"Clause 9.1.15 states that one hour after rain has stopped, areas of temporary standing water should not be deeper than 5mm or exceed 1m², and standing water is not permitted adjacent to entrance doors.","ref":"9.1.15","why":"Standing water pooling against an entrance door can seep under the threshold into the home and is a slip and trip hazard right where people enter, so ponding there is not tolerated even though minor puddling elsewhere is.","source":"NHBC Standards 2026","sourceShort":"NHBC","refLabel":"Clause"},{"id":"9.2-01","chapter":"9.2","chapterTitle":"Wall and ceiling finishes","part":"Finishes","question":"Which of the following is a requirement for the plaster mix?","options":["It should not include Portland cement and gypsum plaster in the same mix","It should always include a bonding agent regardless of background","It should be retempered if it begins to stiffen before use","It should be mixed for as long as possible to improve workability"],"correct":0,"explanation":"Clause 9.2.3 requires the plaster mix to be of a type that does not include Portland cement and gypsum plaster in the same mix; it also warns against retempering and prolonged mixing.","ref":"9.2.3","why":"Mixing Portland cement with gypsum plaster triggers a chemical reaction that causes long-term expansion and disruption, so plaster can crack, blow or delaminate off the wall months after it looked fine.","source":"NHBC Standards 2026","sourceShort":"NHBC","refLabel":"Clause"},{"id":"9.2-02","chapter":"9.2","chapterTitle":"Wall and ceiling finishes","part":"Finishes","question":"Dry lining should not be started until structural timber components are at what maximum moisture content?","options":["15%","18%","20%","24%"],"correct":2,"explanation":"Clause 9.2.4.1 states dry lining should not be started until structural timber components are at a moisture content of 20% or less, and the building is substantially weatherproofed.","ref":"9.2.4.1","why":"Boarding over wet timber traps moisture; as the frame later dries out it shrinks and moves, cracking joints and skim coat and risking mould behind the lining.","source":"NHBC Standards 2026","sourceShort":"NHBC","refLabel":"Clause"},{"id":"9.2-03","chapter":"9.2","chapterTitle":"Wall and ceiling finishes","part":"Finishes","question":"What is the maximum thickness of plaster, excluding dubbing out, that should be applied to brickwork walls?","options":["10mm","13mm","16mm","19mm"],"correct":1,"explanation":"Table 3 in Clause 9.2.3 gives a maximum plaster thickness of 13mm on brickwork walls, applied in a minimum of two coats.","ref":"9.
